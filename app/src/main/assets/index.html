    ${G.ans!=null?`<div class="why">${esc(q.w)}</div><div style="margin-top:12px"><button class="btn" id="nx">${G.i===4?'See score':'Next'}</button></div>`:''}`;
  P.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{G.ans=+b.dataset.o; if(G.ans===q.a) G.score++; gQuiz();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{G.i++; G.ans=null; if(G.i>=5) finishGame(k,G.score); gQuiz();};
}

/* ================= built-in content: Ride, Pager and Teach with no network ================= */
const CONTENT=JSON.parse(document.getElementById('content').textContent);
UI.live={}; UI.s={};
const COMPANIES=['ChaiCart','RickshawGo','TiffinBox','PaisaPay','KiranaKart','CricScore Live','BazaarBolt','MetroMeals'];
function hashStr(s){let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h;}
function sState(mode,t){const k=mode+':'+t.key; return UI.s[k]||(UI.s[k]={});}
function isLive(mode,t){return !!(SAMPLE&&UI.live[mode+':'+t.key]);}
function liveBtn(mode){return SAMPLE?`<div style="margin-top:16px;padding-top:12px;border-top:1px dashed var(--rule)"><button class="btn alt" data-live="${mode}">Generate a fresh version with Claude</button></div>`:'';}
function bindLive(t){document.querySelectorAll('[data-live]').forEach(b=>b.onclick=()=>{UI.live[b.dataset.live+':'+t.key]=true; renderStop(t);});}
function noContent(P,title){P.innerHTML=`<h3>${title}</h3><p class="muted" style="margin:0">This stop has no built-in content yet.</p>`;}

function sRide(t){
  const P=$('#panel'), c=CONTENT[t.key]; if(!c) return noContent(P,'Ride');
  const st=sState('ride',t); if(!st.order) st.order=shuffle([0,1,2,3]);
  const q=c.q, right=st.order.indexOf(0), a=st.pick;
  P.innerHTML=`<h3>Ride</h3>
    <div class="tagline">${esc(c.t)}</div>
    <div class="prose">${c.e.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
    <div class="facts"><div class="fact"><b>Interview trap</b>${esc(c.p)}</div></div>
    <div class="pocket"><b>Pocket card</b><p>${esc(c.k)}</p></div>
    <div class="q"><div class="qq">Quick check. ${esc(q[0])}</div>
      <div class="opts">${st.order.map((src,oi)=>{let cls=''; if(a!=null){ if(oi===right) cls='right'; else if(oi===a) cls='wrong'; }
        return `<button class="opt ${cls}" data-o="${oi}" ${a!=null?'disabled':''}>${esc(q[1+src])}</button>`;}).join('')}</div>
      ${a!=null?`<div class="why">${a===right?'Correct.':'Not quite.'} ${esc(q[5])}</div>${a===right?'':'<div style="margin-top:10px"><button class="btn alt" id="rtry">Try again</button></div>'}`:''}
    </div>${liveBtn('ride')}`;
  P.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    st.pick=+b.dataset.o;
    if(st.pick===right){ S.notes[t.key]=c.k; award(t.key,'e',20,'Ride complete'); }
    else toast('Not quite. Read the why, then try again.');
    renderStop(t);
  });
  const r=$('#rtry'); if(r) r.onclick=()=>{st.order=shuffle([0,1,2,3]); st.pick=null; sRide(t);};
  bindLive(t);
}

function sPager(t){
  const P=$('#panel'), c=CONTENT[t.key]; if(!c) return noContent(P,'Pager');
  const st=sState('pager',t); if(!st.order) st.order=shuffle([0,1,2]);
  const I=c.i, quals=['strong','wrong','partial'];
  const ch=st.order.map(i=>{const parts=I[2+i].split(' => '); return {text:parts[0], cons:parts[1]||'The dashboards settle and the page clears.', q:quals[i]};});
  const co=COMPANIES[hashStr(t.key)%COMPANIES.length], a=st.pick;
  let html=`<div class="row" style="justify-content:space-between"><h3>Pager</h3><span class="note mono">${esc(co)}</span></div>
    <div class="pager"><div class="top"><span>prod · you are on call</span><span>02:47 IST</span></div><div class="al">${esc(I[0])}</div></div>
    <div class="ctx">${esc(I[1])}</div>`;
  if(a==null){
    html+=`<div class="note" style="margin-bottom:6px">Pick your move. One fixes it, one makes it worse, one only helps a little.</div>
      <div class="opts">${ch.map((x,i)=>`<button class="opt" data-c="${i}">${esc(x.text)}</button>`).join('')}</div>`;
  } else {
    const x=ch[a];
    html+=`<div class="opts"><button class="opt" disabled style="border-color:var(--ink)">You: ${esc(x.text)}</button></div>
      <div class="outcome ${x.q}"><b>${x.q}</b><div>${esc(x.cons)}</div><div class="why"><b style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:inherit;color:inherit">Lesson:</b> ${esc(I[5])}</div></div>`;
    if(x.q==='strong') html+=`<div class="pocket win"><b>Incident resolved</b><p>You can go back to sleep.</p></div>`;
    else html+=`<div class="fact" style="--c:var(--good)"><b>The better move</b>${esc(I[2])}</div><div style="margin-top:12px"><button class="btn alt" id="replay">Replay the incident</button></div>`;
  }
  P.innerHTML=html+liveBtn('pager');
  P.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{
    st.pick=+b.dataset.c;
    if(ch[st.pick].q==='strong') award(t.key,'i',40,'Incident resolved'); else toast('Postmortem time. Replay to earn the pip.');
    renderStop(t);
  });
  const r=$('#replay'); if(r) r.onclick=()=>{st.order=shuffle([0,1,2]); st.pick=null; sPager(t);};
  bindLive(t);
}

function sTeach(t){
  const P=$('#panel'), c=CONTENT[t.key]; if(!c) return noContent(P,'Teach');
  const st=sState('teach',t), A=c.a; st.ticks=st.ticks||[false,false,false];
  let html=`<h3>Teach</h3><div class="bubble"><div class="who">Ravi · joined 6 months ago</div>${esc(A[0])}</div>`;
  if(!st.shown){
    html+=`<label for="ans" class="note">Explain it in your own words. Type it, or say it out loud, before you look at the key points.</label>
      <textarea id="ans" placeholder="Your explanation">${esc(st.draft||'')}</textarea>
      <div style="margin-top:10px"><button class="btn" id="cmp">Compare with the key points</button></div>`;
  } else {
    if((st.draft||'').trim()) html+=`<div class="bubble" style="border-radius:12px 12px 0 12px;margin-left:auto;background:var(--card);border-color:var(--rule)"><div class="who">You</div>${esc(st.draft)}</div>`;
    html+=`<div class="note" style="margin-top:12px">Tick only what your explanation actually covered.</div>
      ${[1,2,3].map(i=>`<label class="kp" for="kp-${i}"><input type="checkbox" id="kp-${i}" ${st.ticks[i-1]?'checked':''} ${st.score!=null?'disabled':''}><span>${esc(A[i])}</span></label>`).join('')}
      <details ${st.score!=null?'open':''}><summary>Model answer</summary><div class="prose" style="margin-top:8px">${c.e.map(p=>`<p>${esc(p)}</p>`).join('')}</div></details>`;
    if(st.score==null) html+=`<div style="margin-top:12px"><button class="btn" id="score">Score my explanation</button></div>`;
    else html+=`<div class="row" style="margin-top:12px"><b>Score</b><span class="score">${[0,1,2].map(i=>`<i class="${i<st.score?'on':''}"></i>`).join('')}</span><span class="mono">${st.score}/3</span></div>
      <div class="bubble"><div class="who">Ravi</div>${st.score===3?'That makes complete sense now. Thanks!':st.score===2?'Got it, mostly. I will read up on the part you skipped.':'Hmm, I am still a bit lost. Can we go over it again?'}</div>
      <div style="margin-top:8px"><button class="btn alt" id="again">Explain it again</button></div>`;
  }
  P.innerHTML=html+liveBtn('teach');
  const ta=$('#ans'); if(ta) ta.oninput=()=>{st.draft=ta.value;};
  const cmp=$('#cmp'); if(cmp) cmp.onclick=()=>{st.shown=true; sTeach(t);};
  [1,2,3].forEach(i=>{const cb=$('#kp-'+i); if(cb) cb.onchange=()=>{st.ticks[i-1]=cb.checked;};});
  const sc=$('#score'); if(sc) sc.onclick=()=>{
    st.score=st.ticks.filter(Boolean).length;
    if(st.score>=2) award(t.key,'t',60,'Ravi gets it'); else toast('Cover at least 2 of 3 to earn the pip.');
    renderStop(t);
  };
  const ag=$('#again'); if(ag) ag.onclick=()=>{UI.s['teach:'+t.key]={}; sTeach(t);};
  bindLive(t);
}

/* ================= Claude through the native bridge ================= */
const CB={}; let cbSeq=0;
window.__sdmCb=function(id,ok,text){
  const c=CB[id]; if(!c) return; delete CB[id];
  if(ok) c.res(text);
  else { let e={code:'unknown',message:String(text)}; try{e=JSON.parse(text);}catch(x){} c.rej(e); }
};
function refreshAI(){
  const key=lsGet(KK,'');
  if(NATIVE&&NATIVE.ask&&key){
    SAMPLE=function(input,o){
      return new Promise((res,rej)=>{
        const id='c'+(++cbSeq); CB[id]={res:t=>res({text:t}),rej};
        try{ NATIVE.ask(id,String(input),MODELS[(o&&o.modelTier)==='quick'?'quick':'default'],key); }
        catch(e){ delete CB[id]; rej({code:'unknown',message:'Could not reach the app bridge.'}); }
      });
    };
  } else SAMPLE=null;
  setAI(SAMPLE?'on':'off');
}

/* ================= AUTH ================= */
const AUTH={tab:Object.keys(ACC).length?'in':'up',err:'',name:'',email:'',busy:false};
function enter(email){
  ME=ACC[email]; lsSet(SK,email);
  LS='sdm.v1.'+ME.id; loadState();
  UI.mode={}; UI.ride={}; UI.pager={}; UI.teach={}; UI.live={}; UI.s={}; UI.game=null; G=null;
  refreshAI();
}
function signOut(){ ME=null; lsDel(SK); S=blank(); AUTH.tab='in'; AUTH.err=''; AUTH.email=''; setAI('off'); location.hash='#map'; route(); window.scrollTo(0,0); }
function renderAuth(){
  const up=AUTH.tab==='up', n=Object.keys(ACC).length;
  $('#view').innerHTML=`
    <div class="authHero"><div class="mono note">${SECS.length} LINES · ${TOTAL_STOPS} STOPS · 1 TERMINUS</div>
      <h1>System Design <span>Metro</span></h1>
      <p>Ride every concept on the roadmap, fix the 2:47 AM incident, and teach it back. Works fully offline.</p></div>
    <section class="panel">
      <div class="chips" role="group" aria-label="Sign in or create account" style="margin-top:0">
        <button class="chip" type="button" aria-pressed="${!up}" data-tab="in">Sign in</button>
        <button class="chip" type="button" aria-pressed="${up}" data-tab="up">Create account</button>
      </div>
      <form id="authForm" novalidate>
        ${up?`<div class="field"><label for="au-name">Name</label><input type="text" id="au-name" autocomplete="name" value="${esc(AUTH.name)}"></div>`:''}
        <div class="field"><label for="au-email">Email</label><input type="email" id="au-email" autocomplete="email" inputmode="email" value="${esc(AUTH.email)}"></div>
        <div class="field"><label for="au-pass">Password</label><input type="password" id="au-pass" autocomplete="${up?'new-password':'current-password'}"></div>
        ${up?`<div class="field"><label for="au-pass2">Confirm password</label><input type="password" id="au-pass2" autocomplete="new-password"></div>`:''}
        ${AUTH.err?`<div class="err" style="margin:0 0 12px">${esc(AUTH.err)}</div>`:''}
        <button class="btn" type="submit" ${AUTH.busy?'disabled':''}>${up?'Create account':'Sign in'}</button>
      </form>
      <p class="note" style="margin:14px 0 0">Accounts and progress are stored on this phone only${n?` (${n} profile${n>1?'s':''} here)`:''}. Nothing is sent to a server, so a forgotten password cannot be recovered.</p>
    </section>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{keep(); AUTH.tab=b.dataset.tab; AUTH.err=''; renderAuth();});
  function keep(){const e=$('#au-email'), nm=$('#au-name'); if(e) AUTH.email=e.value; if(nm) AUTH.name=nm.value;}
  $('#authForm').onsubmit=async ev=>{
    ev.preventDefault(); if(AUTH.busy) return; keep();
    const email=AUTH.email.trim().toLowerCase(), pw=$('#au-pass').value, name=AUTH.name.trim();
    const fail=m=>{AUTH.err=m; AUTH.busy=false; renderAuth();};
    if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
    if(up){
      if(!name) return fail('Enter your name.');
      if(pw.length<6) return fail('Use a password of at least 6 characters.');
      if(pw!==$('#au-pass2').value) return fail('The two passwords do not match.');
      if(ACC[email]) return fail('An account with this email already exists on this phone. Sign in instead.');
    } else {
      if(!ACC[email]) return fail('No account with this email on this phone. Create one first.');
    }
    AUTH.busy=true; AUTH.err='';
    try{
      if(up){
        const salt=randHex(16), hash=await hashPw(pw,salt);
        ACC[email]={id:randHex(6),name,email,salt,hash,created:Date.now()};
        if(!lsSet(AK,ACC)){ delete ACC[email]; return fail('This phone would not save the account. Free up some storage and try again.'); }
      } else {
        const h=await hashPw(pw,ACC[email].salt);
        if(h!==ACC[email].hash) return fail('Wrong password.');
      }
    }catch(e){ return fail('Could not check the password on this device. Try again.'); }
    AUTH.busy=false; AUTH.name=''; AUTH.email='';
    enter(email); location.hash='#map'; route(); window.scrollTo(0,0);
    toast('Welcome aboard, '+ME.name.split(' ')[0]);
  };
}

/* ================= PROFILE ================= */
let delArmed=false;
function renderProfile(){
  const key=lsGet(KK,''); const n=Object.keys(ACC).length;
  $('#view').innerHTML=`
    <header class="mast"><div><h1>Profile</h1><div class="sub">${esc(ME.email)}</div></div></header>
    ${ticketHTML()}
    <div class="sect"><h2>Account</h2></div>
    <div class="card">
      <div class="kv"><span>Name</span><span>${esc(ME.name)}</span><span>Email</span><span>${esc(ME.email)}</span><span>Joined</span><span>${new Date(ME.created).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span><span>Storage</span><span>On this phone only · ${n} profile${n>1?'s':''}</span></div>
      <button class="btn alt" id="so">Sign out</button>
    </div>
    <div class="sect"><h2>Claude key · optional</h2><span class="mono note ${key?'ok':''}">${key?'CONNECTED':'NOT SET'}</span></div>
    <div class="card">
      <p class="note" style="margin:0 0 4px">Every stop already has built-in Ride, Pager and Teach content, so no key is needed. If you add your own Anthropic API key, each mode also offers a freshly generated version. Usage is billed to your Anthropic account; the key stays on this phone and is sent only to api.anthropic.com.</p>
      <div class="field"><label for="apikey">Anthropic API key</label><input type="password" id="apikey" placeholder="${key?'Saved: ••••'+esc(key.slice(-4)):'sk-ant-…'}" autocomplete="off"></div>
      <div class="row"><button class="btn" id="ks">Save key</button>${key?'<button class="btn alt" id="kr">Remove key</button>':''}</div>
    </div>
    <div class="sect"><h2>Danger zone</h2></div>
    <div class="card"><p class="note" style="margin:0 0 10px">Deletes this account and all its progress from this phone. This cannot be undone.</p>
      <button class="btn alt danger" id="del">${delArmed?'Tap again to delete forever':'Delete this account'}</button></div>`;
  $('#so').onclick=signOut;
  $('#ks').onclick=()=>{const v=$('#apikey').value.trim(); if(v.length<20){toast('That does not look like an API key'); return;} lsSet(KK,v); refreshAI(); toast('Key saved'); renderProfile();};
  const kr=$('#kr'); if(kr) kr.onclick=()=>{lsDel(KK); refreshAI(); toast('Key removed'); renderProfile();};
  $('#del').onclick=()=>{
    if(!delArmed){delArmed=true; renderProfile(); setTimeout(()=>{if(delArmed){delArmed=false; if(location.hash==='#profile'&&ME) renderProfile();}},4000); return;}
    delArmed=false; lsDel('sdm.v1.'+ME.id); delete ACC[ME.email]; lsSet(AK,ACC); signOut(); toast('Account deleted');
  };
}

/* ================= boot ================= */
(function(){
  const em=lsGet(SK,null);
  if(em&&ACC[em]) enter(em); else setAI('off');
  route();
})();
})();
</script>
