ict whatever has not been used for the longest time.","p":"Not knowing the implementation: hash map for lookup, linked list for order.","k":"Hash map plus doubly linked list; evict from the tail.","q":["Which structures give O(1) get and put for an LRU cache?","Hash map and doubly linked list","Array and stack","Binary heap alone","Two queues","The map finds nodes; the list keeps recency order."],"i":["Hit rate collapses every night at 2 AM","A nightly batch job reads every record once, filling the LRU cache with cold data.","Have the batch job bypass the cache or use a frequency-aware policy","Make the cache bigger => The scan still pollutes it","Run the job at noon => Hurts peak users instead","LRU is vulnerable to one-off scans."],"a":["How would you implement an LRU cache?","Hash map for O(1) lookup","Doubly linked list for recency","Move to head on access, evict tail"]},"lfu":{"e":["Least Frequently Used keeps a count per item and removes the lowest. It protects consistently popular items from one-off bursts and scans. Its weakness is that formerly popular items linger with high counts, so real implementations decay counts over time, and new items need protection from immediate eviction."],"t":"Evict whatever is used least often.","p":"Forgetting ageing. Without decay, yesterday's viral item sits in the cache forever.","k":"Frequency wins, but counts must decay.","q":["When does LFU beat LRU?","A stable set of popular items with occasional one-off scans","Access patterns that shift every minute","When memory is unlimited","When all items are equally popular","Frequency resists pollution by rare accesses."],"i":["Cache is full of last month's trending items","Items with huge historical counts are never evicted though nobody reads them now.","Use LFU with count decay or a windowed variant","Clear the cache manually each week => Crude and cold after each flush","Raise memory => Stale items still occupy space","Popularity changes; frequency counts must age."],"a":["LRU versus LFU: what's the difference?","Recency versus frequency","LFU resists scans but needs decay","LRU adapts faster to change"]},"fifo":{"e":["First In First Out keeps a queue and removes the oldest entry. It is trivial and cheap, with no bookkeeping on reads. It ignores popularity, so a hot item is evicted simply for being old. It fits when items naturally lose value with age."],"t":"Evict in the order items arrived, regardless of use.","p":"Using FIFO where hot items exist. It evicts your most valuable entries on schedule.","k":"Simple and blind to popularity.","q":["Main weakness of FIFO eviction?","It can evict a heavily used item just because it is old","It is slow","It uses too much memory","It never evicts","Age is not usefulness."],"i":["Homepage data keeps getting evicted and reloaded","The cache uses FIFO; the most-read entry is also one of the oldest.","Switch to LRU or LFU","Insert the entry twice => Wastes space, still evicted","Increase the size slightly => It still ages out","Eviction should follow access, not arrival."],"a":["When is FIFO acceptable?","Items lose value with age","Simplicity matters more than hit rate","Not for skewed, hot-key workloads"]},"cache stampede":{"e":["When a popular entry expires, many concurrent requests miss and all run the same expensive query, which can overload the database. Fixes: let only one request rebuild while others wait or serve stale (locking or request coalescing), refresh before expiry, and add jitter to TTLs."],"t":"A hot key expires and everyone rebuilds it at once.","p":"Fixing it by caching longer. That only delays the same stampede.","k":"One request rebuilds; the rest wait or get stale.","q":["Best protection when a hot key expires?","Let one request recompute while others wait or use the stale value","Remove the TTL","Add more app servers","Disable the cache","Coalescing turns a thousand queries into one."],"i":["Database CPU hits 100% for 20 seconds every 10 minutes","The homepage feed key expires every 10 minutes and 3,000 requests recompute it together.","Add a rebuild lock with stale-while-revalidate","Raise the TTL to an hour => Same spike, hourly","Add database replicas => All get hit together","Coalesce rebuilds of hot keys."],"a":["What's a cache stampede and how do you stop it?","Many misses on one hot key at once","Single-flight or lock for rebuild","Early refresh and TTL jitter"]},"distributed caching":{"e":["Keys are partitioned across nodes, usually with consistent hashing, so capacity grows by adding nodes and one failure loses only part of the cache. Replicas add availability. Concerns include hot keys that overload one node, rebalancing when nodes change, and keeping clients' view of the cluster consistent."],"t":"One logical cache spread across many nodes.","p":"Using modulo hashing. Adding one node remaps almost every key and empties the cache.","k":"Consistent hashing, replicas, and a plan for hot keys.","q":["Why consistent hashing instead of hash(key) mod N for cache nodes?","Adding or removing a node moves only a small share of keys","It is faster to compute","It encrypts keys","It avoids replication","Minimal remapping preserves the hit rate."],"i":["Hit rate drops to near zero after adding a cache node","Clients use key mod N; changing N remapped almost all keys.","Switch to consistent hashing with virtual nodes","Remove the new node => Capacity problem returns","Warm every key by script => Repeats on the next change","Cluster changes should move keys in proportion to the change."],"a":["How do you scale a cache beyond one machine?","Partition keys with consistent hashing","Replicate for availability","Handle hot keys and rebalancing"]},"what is load balancing":{"e":["A load balancer sits in front of a pool of servers, forwards each request to a healthy one and removes failed ones. This gives horizontal scale, hides failures and allows rolling deploys. The balancer itself must be redundant, or it becomes the single point of failure."],"t":"Spreading requests across servers so none is overwhelmed.","p":"Drawing one load balancer and calling the system highly available. The balancer needs redundancy too.","k":"One address in front, many healthy servers behind.","q":["Besides spreading load, what does a load balancer provide?","Failure hiding through health checks","Database backups","Data encryption at rest","Schema migrations","Unhealthy servers stop receiving traffic."],"i":["One of four servers died; a quarter of requests fail","Clients connect to servers directly using a hard-coded list.","Put a load balancer with health checks in front","Remove the dead server from every client by hand => Slow and repeats next failure","Add retries only => Still hits the dead server first","Load balancers route around failed instances automatically."],"a":["What does a load balancer do for you?","Distributes traffic","Detects and removes unhealthy servers","Enables scaling and zero-downtime deploys"]},"layer 4 vs layer 7 load balancing":{"e":["A Layer 4 balancer forwards TCP or UDP without reading the payload: very fast, protocol-agnostic, but blind to URLs. A Layer 7 balancer terminates HTTP, so it can route by path, host, header or cookie, terminate TLS, retry and rewrite, at a higher processing cost."],"t":"L4 routes connections by IP and port; L7 routes requests by content.","p":"Saying L7 is always better. L4 is the right tool for raw throughput and non-HTTP protocols.","k":"L4 is fast and blind; L7 is smart and costlier.","q":["You must send /video to one fleet and /api to another. You need:","Layer 7","Layer 4","Layer 2","DNS only","Path-based routing needs HTTP awareness."],"i":["gRPC traffic lands on one backend only","An L4 balancer spreads connections; each client holds one long-lived HTTP/2 connection carrying all its requests.","Balance per request with an L7 proxy or client-side balancing","Add more backends => New ones get no traffic","Restart clients periodically => Crude and disruptive","Long-lived multiplexed connections need request-level balancing."],"a":["L4 or L7 load balancer: how do you choose?","What must be inspected for routing","L4 for speed and any protocol","L7 for path routing, TLS and retries"]},"reverse proxy":{"e":["Clients talk to the reverse proxy, which forwards to internal servers. It hides backend addresses and gives one place for TLS termination, compression, caching, rate limiting, authentication and routing. Nginx, HAProxy and Envoy are common. Load balancers and API gateways are specialised reverse proxies."],"t":"A server-side middleman that fronts your backends.","p":"Mixing it up with a forward proxy. Reverse proxies represent servers; forward proxies represent clients.","k":"Reverse proxy stands in front of servers.","q":["Which is a typical reverse proxy job?","Terminating TLS for a group of backend servers","Hiding an employee's browsing from websites","Assigning IP addresses","Storing table rows","Offloading shared concerns from backends."],"i":["Each of 30 services implements its own TLS and rate limits","Certificates expire at different times and limits are inconsistent.","Terminate TLS and apply limits once at a reverse proxy","Write a shared library => 30 upgrades each time","Add a wiki page => Drift continues","Cross-cutting concerns belong at the edge."],"a":["Why put a reverse proxy in front of services?","Single entry point and hidden backends","TLS, caching, compression in one place","Routing and protection"]},"forward proxy":{"e":["Clients send requests to the forward proxy, which contacts the internet for them. Companies use it to filter and log outbound traffic, cache downloads and hide internal addresses. Servers see the proxy's address, not the client's. VPNs and egress gateways are variations."],"t":"A client-side middleman that makes requests on users' behalf.","p":"Describing it as protecting servers. That is the reverse proxy's role.","k":"Forward proxy stands in front of clients.","q":["A company wants to block and log employee access to certain sites. It deploys:","A forward proxy","A reverse proxy","A CDN","A message queue","It mediates outbound requests from clients."],"i":["Partner API blocks you after a deploy","The partner allow-lists your outbound IP; new pods get random egress addresses.","Route outbound calls through a fixed egress proxy or NAT","Ask the partner to allow all IPs => They refuse, rightly","Redeploy until an old IP comes back => Luck is not a plan","A controlled egress point gives a stable identity to the outside world."],"a":["Forward proxy versus reverse proxy?","Forward represents clients","Reverse represents servers","Forward for egress control and filtering"]},"nginx":{"e":["Nginx uses a small number of worker processes with non-blocking event loops, so it handles tens of thousands of connections with little memory. It serves static files, terminates TLS, proxies and balances to upstreams, caches responses and limits rates. Configuration reloads without dropping connections."],"t":"An event-driven web server, reverse proxy and load balancer.","p":"Forgetting upstream keep-alive, so Nginx opens a new backend connection per request.","k":"Event loop in front; enable keep-alive to upstreams.","q":["Why can Nginx hold so many idle connections cheaply?","Event-driven, non-blocking workers rather than a thread per connection","It ignores idle clients","It runs in the browser","It stores connections on disk","Events cost little per connection."],"i":["Proxy tier burns CPU and ephemeral ports under load","Nginx opens and closes a backend connection for every request.","Enable upstream keep-alive with a connection pool","Add more Nginx workers => More short-lived connections","Raise backend timeouts => Unrelated","Reusing upstream connections removes handshake overhead."],"a":["What is Nginx used for in a typical stack?","Static files and TLS termination","Reverse proxy and load balancing","Caching and rate limiting"]},"haproxy":{"e":["HAProxy specialises in proxying and balancing at Layers 4 and 7, with rich health checks, many algorithms, connection queuing, stick tables for rate limiting and detailed statistics. It is known for stability and throughput and is widely used at the edge and in front of databases."],"t":"A high-performance TCP and HTTP load balancer.","p":"Running a single HAProxy instance. Pair it with a standby and a floating IP or put it behind anycast.","k":"Purpose-built balancer; never run just one.","q":["What would you add to avoid HAProxy being a single point of failure?","A second instance with a virtual IP that fails over","A bigger server","More backends","A longer timeout","Redundant balancers share an address."],"i":["All traffic stops when the balancer's host reboots","One HAProxy instance fronts the whole site.","Run an active-standby pair with a floating IP or use a managed balancer","Reboot only at night => Unplanned failures still happen","Add more app servers => Unreachable anyway","The balancer tier needs the same redundancy as what it protects."],"a":["HAProxy versus Nginx for load balancing?","HAProxy: balancing specialist with deep health checks and stats","Nginx: also web server and cache","Both need redundancy"]},"cloud load balancers":{"e":["Providers offer application (L7) and network (L4) balancers that span availability zones, scale automatically, integrate with autoscaling groups and certificates, and expose a DNS name. You pay per hour and per traffic. Know their limits: idle timeouts, warm-up before huge spikes, and connection draining settings."],"t":"Managed balancers that scale and fail over for you.","p":"Ignoring connection draining, so in-flight requests are cut during deploys.","k":"Managed, multi-zone, but mind timeouts and draining.","q":["Why enable connection draining on a cloud load balancer?","In-flight requests finish before an instance is removed","It speeds DNS","It compresses responses","It encrypts disks","Graceful removal avoids dropped requests."],"i":["Each deploy causes a burst of 502 errors","Instances are terminated immediately while still serving requests.","Enable draining and handle the termination signal gracefully","Deploy faster => Same dropped requests","Retry on the client forever => Hides errors and risks duplicates","Graceful shutdown needs both the balancer and the app."],"a":["What do you get from a managed load balancer?","No balancer servers to run","Multi-zone redundancy and autoscaling","Integration with certificates and target groups"]},"round robin":{"e":["The balancer cycles through servers in order, optionally weighted so bigger servers get more. It is simple and fair when requests cost about the same and servers are alike. It ignores current load, so slow or long requests can pile up on one unlucky server."],"t":"Hand each new request to the next server in turn.","p":"Using plain round robin with very uneven request durations.","k":"Fair by count, blind to load.","q":["When does round robin distribute poorly?","When request durations vary widely","When servers are identical and requests uniform","When there is one server","Never","Equal counts can mean unequal load."],"i":["One server overloaded while others idle","A few requests are long exports; round robin keeps sending new ones to the busy server.","Switch to least connections","Add servers => Uneven pile-ups continue","Shorten timeouts => Exports fail","Load-aware algorithms handle uneven work."],"a":["How does round robin work and when is it enough?","Rotates through servers","Good for uniform requests","Weighted variant for mixed capacity"]},"least connections":{"e":["The balancer tracks open connections per server and picks the least busy, optionally weighted. It adapts to slow requests and uneven servers, which suits long-lived connections such as WebSockets and variable workloads. A newly added server briefly attracts a flood until it catches up."],"t":"Send the next request to the server with the fewest active ones.","p":"Forgetting slow start: a fresh server with zero connections is hit with everything at once.","k":"Fewest active connections wins; ramp new servers gently.","q":["Best algorithm for WebSocket servers with long-lived connections?","Least connections","Round robin","Random","First available","It balances by what servers are actually holding."],"i":["A freshly started instance crashes within seconds","Least connections sent it every new request while its caches were cold.","Enable slow start so new instances ramp up gradually","Start instances one hour earlier => Still cold when traffic arrives","Switch off health checks => Hides the problem","New capacity should be warmed, not flooded."],"a":["Why choose least connections over round robin?","Accounts for current load","Handles long or uneven requests","Needs slow start for new servers"]},"ip hash":{"e":["Hashing the client address maps each client to the same server every time, which gives session affinity without cookies. Distribution depends on how varied the IPs are: many users behind one NAT address all land on one server. Adding or removing servers reshuffles most clients unless consistent hashing is used."],"t":"The client's IP decides which server it goes to.","p":"Ignoring NAT. An office or mobile carrier can put thousands of users behind one IP.","k":"Same IP, same server; beware many users behind one address.","q":["A whole university behind one public IP uses your IP-hash balanced site. Result?","All of them hit the same backend server","Even spread","They are blocked","They bypass the balancer","One address hashes to one server."],"i":["One backend runs hot every weekday morning","A large corporate customer's traffic all comes from one NAT IP and hashes to that server.","Balance by a cookie or least connections instead","Add servers => The hash still picks one","Block the customer's IP => Lose the customer","Affinity keyed on IP inherits the skew of IP distribution."],"a":["What are the downsides of IP hash?","NAT concentrates users","Server changes remap clients","Use cookies or consistent hashing instead"]},"consistent hashing":{"e":["Nodes and keys are hashed onto a ring; a key belongs to the next node clockwise. When a node joins or leaves, only the keys in its arc move, about 1/N of the total, instead of nearly all as with modulo hashing. Virtual nodes (many ring positions per server) even out the distribution."],"t":"A hash ring where adding a node moves only a few keys.","p":"Forgetting virtual nodes. With one position per server the load is uneven.","k":"Add a node, move 1/N of the keys.","q":["With hash mod N across 10 cache nodes, adding an 11th remaps roughly:","Almost all keys","1 in 11 keys","No keys","Exactly half","Modulo changes for nearly every key."],"i":["Removing one cache node caused a database overload","Keys are placed with hash mod N; the change remapped nearly every key and emptied the cache.","Use consistent hashing with virtual nodes","Never remove nodes => Not realistic","Warm the cache by hand each time => Slow and fragile","Topology changes should disturb only a proportional share of keys."],"a":["How does consistent hashing work?","Keys and nodes on a ring","Key goes to next node clockwise","Virtual nodes balance; only 1/N of keys move"]},"health checks":{"e":["Balancers and orchestrators call an endpoint or open a port on a schedule; after several failures the instance is removed, and it returns after several passes. Liveness asks \"is the process stuck and in need of a restart?\" Readiness asks \"can it serve right now?\" Keep checks cheap and avoid depending on shared downstreams."],"t":"Regular probes that decide whether an instance should get traffic.","p":"Making the health check call the database. A database blip then marks every instance unhealthy at once.","k":"Liveness restarts, readiness routes; keep both shallow.","q":["Health checks query the shared database. The database slows down. What happens?","All instances fail checks and are removed together","Nothing","Only one instance is removed","Traffic speeds up","A shared dependency in the check causes total removal."],"i":["Brief database slowness caused a full outage","Every instance's health check runs a database query; all were marked unhealthy and removed.","Make checks shallow and handle dependency failures inside the app","Raise the check timeout to 60 s => Dead instances linger for a minute","Disable health checks => No failure detection","Health checks should test the instance, not its shared dependencies."],"a":["What makes a good health check?","Fast and cheap","Separate liveness and readiness","Does not cascade on shared dependency failures"]},"sticky sessions":{"e":["The balancer sets a cookie or hashes the client so later requests return to the same instance, which lets servers keep session state in memory. It causes uneven load, loses sessions when that server dies or is redeployed, and complicates autoscaling. Storing state externally is the sturdier answer."],"t":"Pinning a user to the same server for the whole session.","p":"Proposing sticky sessions as the scaling solution instead of making servers stateless.","k":"Stickiness is a patch; shared session storage is the fix.","q":["What happens to users pinned to a server that crashes?","Their in-memory session is lost","Nothing","They move with their session","The server restores them","State lived only on that instance."],"i":["Scale-in event logged out thousands of users","Autoscaling removed servers holding in-memory sessions for pinned users.","Move sessions to a shared store and drop stickiness","Disable scale-in => Pay for idle servers","Extend the session cookie lifetime => Session data is still gone","Disposable servers require external state."],"a":["Are sticky sessions a good idea?","Simple affinity through cookie or hash","Uneven load and lost sessions on failure","Prefer stateless servers with a shared store"]},"horizontal scaling":{"e":["Scaling out puts more identical instances behind a load balancer. Capacity grows almost without limit, failures cost only a fraction, and you can use cheap hardware. It requires stateless services and partitioned or replicated data, and brings distributed-system complexity."],"t":"Adding more machines instead of a bigger one.","p":"Scaling out a tier that still depends on one shared stateful bottleneck.","k":"Scale out stateless; partition the stateful.","q":["What must be true for an app tier to scale horizontally with ease?","Instances keep no local session state","Each instance has a unique codebase","There is only one instance","It uses the biggest hardware","Any instance must be able to serve any request."],"i":["Third app server added, uploads now fail at random","Uploaded files are saved to each server's local disk; other servers cannot find them.","Store uploads in shared object storage","Pin users to one server => Files lost when it dies","Sync disks with a cron job => Laggy and fragile","Local disk is state; scaling out needs shared storage."],"a":["Horizontal versus vertical scaling?","Out: more machines, near-unlimited, fault tolerant","Up: bigger machine, simple, capped","Out needs statelessness and partitioning"]},"vertical scaling":{"e":["Scaling up needs no code changes and keeps everything on one node, so it is the quickest fix and suits databases that are hard to distribute. It hits a hardware ceiling, cost rises faster than capacity, resizing may need downtime, and the machine remains a single point of failure."],"t":"Giving one machine more CPU, memory or disk.","p":"Dismissing it. A bigger database box is often the right first step before sharding.","k":"Scale up first when it is cheap; know its ceiling.","q":["Main limitation of vertical scaling?","A hard hardware ceiling and a single point of failure","It needs many machines","It requires rewriting code","It cannot add memory","One box can only get so big."],"i":["Team plans a 3-month sharding project at 60% database CPU","The database runs on a mid-size instance; larger ones exist.","Scale up now and add replicas, deferring sharding","Start sharding immediately => Months of risk with headroom unused","Do nothing => Runs out at the next peak","Use the cheap option until it stops working."],"a":["When is scaling up the right call?","Fast, no code changes","Good for stateful systems such as databases","Limited by ceiling, cost and single failure point"]},"auto scaling":{"e":["A policy watches a metric such as CPU, request rate or queue length and adjusts instance count between a minimum and maximum. It saves money off-peak and absorbs growth. Instances take time to boot, so sudden spikes need headroom, pre-warming or scheduled scaling; cooldowns prevent flapping."],"t":"Adding and removing instances automatically as load changes.","p":"Assuming it reacts instantly. New instances take minutes, so spikes need buffer capacity.","k":"Autoscaling follows load with a lag; keep headroom.","q":["Traffic doubles in 10 seconds at a flash sale start. Autoscaling alone will:","Lag, because instances take minutes to launch","Handle it instantly","Reduce capacity","Fix the database","Scale ahead of known events."],"i":["Site slow for the first 5 minutes of every sale","Scaling triggers at 80% CPU and new instances need 4 minutes to boot.","Pre-scale on a schedule and lower the trigger threshold","Raise the threshold to 90% => Reacts even later","Remove the maximum limit => Does not speed up booting","Known spikes should be scheduled, not chased."],"a":["How does autoscaling work and where does it fall short?","Metric-driven add and remove","Boot time creates lag","Use headroom, schedules and cooldowns"]},"distributed system challenges":{"e":["Messages can be lost, delayed, duplicated or reordered. Nodes fail independently and you cannot tell slow from dead. Clocks drift, so timestamps cannot order events reliably. Concurrency across machines causes conflicts. The classic \"fallacies of distributed computing\" list what people wrongly assume: reliable network, zero latency, infinite bandwidth."],"t":"Partial failure, unreliable networks, and no shared clock.","p":"Designing as if a remote call were a local function call.","k":"The network lies, clocks drift, and parts fail alone.","q":["Why can't you order events across servers by wall-clock timestamp?","Server clocks drift and are not perfectly synchronised","Timestamps are too long","Servers have no clocks","Time zones differ","Clock skew can exceed the gap between events."],"i":["Newer edit overwritten by an older one","Two servers stamp writes with local time; one clock is 3 seconds behind and last-write-wins picks the wrong one.","Order with version numbers or logical clocks rather than wall time","Sync clocks more often => Reduces but never removes skew","Reject concurrent edits => Blocks users","Wall clocks are not a safe ordering mechanism."],"a":["What goes wrong in distributed systems that doesn't on one machine?","Partial failures and unknown outcomes","Unreliable, delayed messaging","No global clock or ordering"]},"cap theorem":{"e":["A distributed store wants Consistency (every read sees the latest write), Availability (every request gets a response) and Partition tolerance. Partitions will happen, so the real choice during one is: refuse some requests to stay consistent (CP), or answer with possibly stale data (AP). Without a partition you can have both."],"t":"During a network partition, choose consistency or availability.","p":"Saying \"pick two of three\". Partition tolerance is not optional; the choice is C or A when a partition occurs.","k":"When the network splits: correct or available, not both.","q":["During a partition, a CP system will:","Reject some requests rather than return stale data","Return stale data","Ignore the partition","Delete data","It sacrifices availability to stay consistent."],"i":["Two regions lose contact; both keep selling the last seat","The inventory store keeps accepting writes on both sides of the partition.","For inventory, require a quorum and reject writes on the minority side","Let both sides sell and apologise later => Oversold seats","Shut down both regions => Total outage","Choose CP where a wrong answer is worse than no answer."],"a":["Explain CAP with an example.","Partition forces a choice","CP rejects to stay correct","AP answers and reconciles later"]},"pacelc theorem":{"e":["If there is a Partition, choose Availability or Consistency; Else, choose Latency or Consistency. Even with a healthy network, strongly consistent reads and writes must wait for replicas, which adds latency. Dynamo-style stores lean PA/EL; systems such as Spanner lean PC/EC."],"t":"CAP plus the everyday trade-off: latency versus consistency.","p":"Stopping at CAP. Most of the time there is no partition, and the latency cost of consistency is what you actually feel.","k":"No partition? You still pay latency for consistency.","q":["A database waits for all replicas to confirm each write even when healthy. In PACELC terms it favours:","Consistency over latency","Latency over consistency","Availability","Nothing","The Else branch choice is C."],"i":["Write latency tripled after adding a replica on another continent","Replication is synchronous to all replicas, including the remote one.","Make the distant replica asynchronous or use quorum writes","Buy faster disks => The delay is network distance","Remove all replicas => Lose durability","Synchronous consistency costs a round trip to the slowest replica."],"a":["What does PACELC add to CAP?","Trade-off also exists without partitions","Latency versus consistency","Classifies systems as PA/EL, PC/EC and so on"]},"consistency models":{"e":["From strongest to weakest: linearizable or strong (reads always see the latest write), sequential, causal (cause is seen before effect), read-your-writes (you see your own changes), monotonic reads (you never go back in time), and eventual (replicas converge if writes stop). Weaker models are faster and more available."],"t":"Promises about what a read may return after writes.","p":"Using \"eventual consistency\" without saying what anomalies users might see.","k":"Pick the weakest model the feature can tolerate.","q":["A user never sees data older than what they have already seen. This guarantee is:","Monotonic reads","Linearizability","Eventual consistency only","Durability","Reads do not go backwards."],"i":["Notification count jumps 5, then 3, then 5 on refresh","Each refresh hits a different replica with different lag.","Pin a user's reads to one replica or track a minimum version","Add more replicas => More variety of lag","Hide the counter => Removes the feature","Session guarantees stop a user seeing time move backwards."],"a":["What consistency models exist between strong and eventual?","Causal","Read-your-writes","Monotonic reads"]},"strong consistency":{"e":["The system behaves like a single copy: once a write is acknowledged, all later reads everywhere see it. This needs coordination through a leader, synchronous replication or consensus, which adds latency and reduces availability during partitions. Use it for balances, inventory, locks and unique constraints."],"t":"Every read returns the most recent acknowledged write.","p":"Demanding it for everything. Coordination costs latency on every operation.","k":"Acts like one copy, costs coordination.","q":["Which needs strong consistency?","Checking a username is unique at signup","Showing a like count","Listing recommended videos","Displaying last-seen time","Two users must not both get the same name."],"i":["Two users registered the same username","The uniqueness check read from a lagging replica.","Enforce uniqueness with a constraint on the primary","Check twice => Both still read stale data","Check in the browser => No authority","Invariants must be enforced where the data is strongly consistent."],"a":["What does strong consistency guarantee and cost?","Reads see latest write everywhere","Requires coordination or consensus","Higher latency, lower availability under partition"]},"eventual consistency":{"e":["Writes are accepted locally and propagated in the background, so reads may return stale data for a short time. If writes stop, all replicas end up the same. It gives low latency and high availability. Conflicting concurrent writes need a resolution rule such as last-write-wins, version vectors or CRDTs."],"t":"Replicas may disagree briefly but converge.","p":"Ignoring conflict resolution. \"They converge\" needs a rule for which write wins.","k":"Fast and available now, consistent a moment later.","q":["Which feature suits eventual consistency?","A post's view counter","Seat booking","Money transfer","Unique username check","Brief staleness is harmless."],"i":["Item reappears in a cart after being removed","Two devices edited the cart concurrently; last-write-wins restored the older list.","Merge carts with a conflict-aware structure rather than last-write-wins","Sync clocks => The conflict remains","Lock the cart globally => Slow and unavailable","Eventual consistency needs a deliberate merge rule."],"a":["What are you signing up for with eventual consistency?","Temporary stale reads","Convergence without new writes","Explicit conflict resolution"]},"causal consistency":{"e":["Operations that are causally related (a reply after its comment) are observed in the same order by all nodes, while unrelated concurrent operations may appear in any order. It is the strongest model that stays available under partitions. Implementations track dependencies with version vectors or similar metadata."],"t":"If one event caused another, everyone sees them in that order.","p":"Confusing it with total ordering. Only related events are ordered.","k":"Cause before effect; unrelated events can vary.","q":["Users sometimes see a reply before the comment it answers. Which model prevents this?","Causal consistency","Eventual consistency","No model can","FIFO eviction","The reply depends on the comment."],"i":["Replies appear above the question in a thread","Replicas apply the reply before the original post arrives.","Track dependencies and deliver a write only after what it depends on","Sort by timestamp => Clock skew breaks it","Refresh automatically => Still wrong for a moment","Causal ordering needs dependency metadata, not wall clocks."],"a":["What is causal consistency?","Preserves cause-and-effect order","Concurrent events may differ","Available under partition, tracked with version vectors"]},"read your writes consistency":{"e":["Other users may briefly see the old value, but the writer never does. Achieve it by reading from the primary for a short time after a write, routing a user's session to a replica known to be caught up, or carrying a version token the read must satisfy."],"t":"After you change something, you always see your change.","p":"Sending every read to replicas right after a write, so users think their save failed.","k":"Your own writes must be visible to you at once.","q":["A user saves a setting, the page reloads and shows the old value. What is missing?","Read-your-writes consistency","Durability","Encryption","Compression","The reload read from a lagging replica."],"i":["Support tickets: \"my changes don't save\"","Saves succeed, but the confirmation page reads from a replica 1 second behind.","Read from the primary for a few seconds after that user's write","Add replicas => Same lag","Show a \"please wait\" banner => Poor experience","Route the writer's reads to data that includes their write."],"a":["How do you give users read-your-writes with lagging replicas?","Read from primary after a write","Session pinning to a caught-up replica","Version tokens"]},"replication":{"e":["Replication provides availability if a node dies, read scaling, and lower latency by placing copies near users. Synchronous replication waits for replicas (safe, slower); asynchronous does not (fast, may lose recent writes on failover). Topologies are single-leader, multi-leader and leaderless."],"t":"Keeping copies of data on several machines.","p":"Forgetting replication lag. Asynchronous replicas are always a little behind.","k":"Copies buy availability and reads; lag is the price.","q":["With asynchronous replication, the leader dies right after acknowledging a write. That write:","May be lost if it had not reached a replica","Is always safe","Is duplicated","Is encrypted","Acknowledgement came before replication."],"i":["Recent orders vanished after a failover","Replication was asynchronous; the promoted replica was 4 seconds behind.","Use synchronous or quorum replication for critical writes","Fail back to the old leader blindly => Risks divergence","Ignore it as rare => Recurs on the next failover","The replication mode sets how much you can lose."],"a":["Why replicate, and what's sync versus async?","Availability, read scale, locality","Sync: no loss, slower","Async: fast, may lose recent writes"]},"leader follower replication":{"e":["All writes go to the leader, which streams its log to followers. Reads can use followers, scaling read capacity. If the leader fails, a follower is promoted. It is simple and avoids write conflicts. Limits: write throughput is one node's, followers lag, and failover must avoid two leaders."],"t":"One node takes writes; followers copy them and serve reads.","p":"Promoting a follower without fencing the old leader, giving two leaders.","k":"One writer, many readers, careful failover.","q":["What does leader-follower replication not improve?","Write throughput","Read throughput","Availability","Data redundancy","All writes still go through one node."],"i":["After failover the old leader came back and accepted writes","Two nodes believed they were leader; data diverged.","Fence the old leader before promoting a new one","Merge the data manually every time => Slow and error-prone","Disable failover => Long outages","Failover needs a way to guarantee the old leader has stopped."],"a":["How does leader-follower replication work?","Writes to leader, log to followers","Reads from followers with lag","Failover promotes a follower safely"]},"multi leader replication":{"e":["Each region has its own leader, so users write locally with low latency and a region can keep working alone. Leaders replicate to each other asynchronously, so concurrent writes to the same data conflict and need a resolution strategy: last-write-wins, merging or application logic."],"t":"Several nodes accept writes and sync with each other.","p":"Choosing it without a conflict resolution plan.","k":"Local writes everywhere; conflicts are your problem.","q":["Biggest challenge with multi-leader replication?","Resolving conflicting concurrent writes","Slow reads","No redundancy","Lack of indexes","Two leaders can change the same record."],"i":["Same calendar slot booked by two people in two regions","Both regional leaders accepted the booking before syncing.","Route writes for a given resource to one home region","Use last-write-wins => One booking silently disappears","Sync faster => Narrows but never closes the window","Avoid conflicts by giving each record a single writer."],"a":["When would you use multi-leader replication?","Multi-region low-latency writes","Offline-capable clients","Requires conflict detection and resolution"]},"leaderless replication":{"e":["Clients send writes to several replicas and succeed when W acknowledge; reads query R replicas and take the newest version. With R + W greater than N, a read overlaps a recent write. Read repair and anti-entropy fix stale replicas. There is no failover, so availability is high. Used by Dynamo-style systems such as Cassandra."],"t":"Any replica accepts writes; quorums keep reads correct.","p":"Setting R and W so that R + W is not greater than N and still expecting fresh reads.","k":"R + W > N gives overlap.","q":["N = 3 replicas. Which setting guarantees a read sees the latest write?","W = 2, R = 2","W = 1, R = 1","W = 1, R = 2","W = 2, R = 1","2 + 2 > 3, so the sets overlap."],"i":["Reads return stale data after a node outage","The cluster uses W = 1 and R = 1 with N = 3 for speed.","Raise to quorum reads and writes for data needing freshness","Add more nodes => Overlap is still not guaranteed","Retry reads => May hit the same stale replica","Quorum overlap is what makes leaderless reads current."],"a":["How does a leaderless database stay consistent?","Write to W, read from R replicas","R + W > N overlap","Read repair and anti-entropy"]},"sharding partitioning":{"e":["Each row is assigned to a shard by a key. Hash partitioning spreads load evenly but breaks range queries; range partitioning keeps ranges together but risks hot spots. Sharding scales writes and storage, at the cost of cross-shard queries, transactions and rebalancing. Choosing the shard key is the critical decision."],"t":"Splitting data across nodes so each holds a piece.","p":"Picking a shard key that creates hot shards or forces most queries to hit every shard.","k":"The shard key is the decision; choose it from your queries.","q":["A chat app shards messages by user ID, but the main query is \"messages in a conversation\". Problem?","The query must hit many shards","Messages cannot be stored","Users lose passwords","Nothing","The key does not match the access pattern."],"i":["One shard is at 95% while others are at 20%","The shard key is country; one country has most of the users.","Re-shard on a high-cardinality key such as user ID","Add more shards with the same key => Skew remains","Buy a bigger server for the hot shard => Temporary and costly","Skewed keys produce skewed shards."],"a":["How do you choose a shard key?","High cardinality and even distribution","Matches the main query patterns","Avoids cross-shard operations"]},"distributed transactions":{"e":["Atomicity across nodes is hard because each can fail independently. Two-phase commit coordinates a prepare and commit round but blocks on coordinator failure. Many systems avoid it with sagas (local transactions plus compensations), the outbox pattern, or by keeping related data in one database."],"t":"One logical change spanning multiple databases or services.","p":"Proposing a distributed transaction casually. First ask whether the data can live together.","k":"Avoid them by design; otherwise saga or 2PC.","q":["Order and payment are in separate services. A common way to keep them consistent without 2PC?","A saga with compensating actions","A global lock","A shared cache","Ignoring failures","Each step commits locally; failures trigger compensation."],"i":["Inventory reserved but payment never taken","Two services were updated by separate calls and the second failed.","Run a saga that releases the reservation when payment fails","Add a retry loop without limit => Stuck reservations pile up","Merge the services tonight => Risky rewrite","Multi-service changes need compensation for partial failure."],"a":["How do you handle a transaction that spans services?","Avoid by co-locating data","Saga with compensations","2PC when atomicity is required and blocking is acceptable"]},"two phase commit 2pc":{"e":["A coordinator sends \"prepare\"; each participant locks resources and votes yes or no. If all vote yes, the coordinator sends \"commit\", otherwise \"abort\". It gives atomicity across nodes. If the coordinator crashes after prepare, participants are stuck holding locks until it recovers, and latency is high."],"t":"Ask everyone to prepare, then tell everyone to commit.","p":"Not mentioning the blocking problem when the coordinator fails.","k":"Prepare, then commit; a dead coordinator blocks everyone.","q":["What is the main weakness of 2PC?","Participants block holding locks if the coordinator fails after prepare","It cannot abort","It only works with one node","It loses data by design","In-doubt transactions wait for the coordinator."],"i":["Rows locked for 40 minutes across two databases","The coordinator crashed after participants prepared; they wait for its decision.","Recover the coordinator from its log to resolve in-doubt transactions","Kill the locked sessions => Risks one side committing and the other not","Restart the databases => Prepared transactions survive restarts","2PC participants cannot decide alone once they have voted yes."],"a":["How does two-phase commit work?","Prepare phase with votes","Commit or abort phase","Blocking on coordinator failure"]},"consensus algorithms":{"e":["Consensus lets a cluster agree on an ordered log, a leader or a configuration even if some nodes crash. It requires a majority, so a cluster of 2f + 1 nodes tolerates f failures. Paxos and Raft are the main algorithms; etcd, ZooKeeper and Consul use them to provide coordination for other systems."],"t":"How a group of nodes agrees on one value despite failures.","p":"Running an even number of nodes. Four nodes tolerate no more failures than three.","k":"Majority rules: 2f + 1 nodes survive f failures.","q":["How many node failures can a 5-node consensus cluster tolerate?","2","1","3","4","A majority of 3 must remain."],"i":["Coordination cluster stops accepting writes","It has 4 nodes across 2 zones; one zone failed, leaving 2 of 4.","Use an odd number spread over three zones","Force the 2 nodes to accept writes => Risks split brain","Add a fifth node in the same zone => Still loses majority together","Majorities must survive the loss of any one failure domain."],"a":["Why do we need consensus and where is it used?","Agreement despite crashes","Majority quorum, odd cluster sizes","Leader election, config and metadata stores"]},"paxos":{"e":["A proposer sends a numbered proposal; acceptors promise not to accept lower numbers; once a majority accepts a value, it is chosen. It is proven safe with crashes and message loss. It is notoriously hard to understand and implement, and Multi-Paxos is needed to agree on a sequence of values efficiently."],"t":"The original majority-based consensus protocol.","p":"Trying to explain every message. State what it guarantees and that Raft is the understandable equivalent.","k":"Majority acceptance of a numbered proposal; safe but subtle.","q":["What does Paxos guarantee?","Only one value is chosen, even with crashes and lost messages","Zero latency","No need for a majority","Protection from malicious nodes","Safety holds under crash faults."],"i":["A home-grown replication protocol produced two different \"committed\" values","It accepted a value after hearing from any two of five nodes.","Replace it with a proven consensus implementation","Add a timestamp tiebreaker => Clock skew breaks it","Lower the node count => Still not a majority rule","Consensus is easy to get wrong; reuse proven algorithms."],"a":["What is Paxos, at a high level?","Proposers and acceptors with numbered proposals","Majority acceptance decides","Safe under crashes; hard to implement"]},"raft":{"e":["Nodes are followers, candidates or leader. A follower that hears no heartbeat starts an election; a majority vote makes it leader for a term. The leader appends entries to its log and replicates them; an entry is committed once on a majority. Randomised election timeouts avoid split votes. Used by etcd and Consul."],"t":"Consensus designed to be understandable: elect a leader, replicate a log.","p":"Forgetting terms. A stale leader is rejected because its term number is old.","k":"Leader per term, log replicated, committed on majority.","q":["When is a Raft log entry considered committed?","When it is stored on a majority of nodes","When the leader receives it","When all nodes have it","After one hour","Majority replication makes it durable across failover."],"i":["Cluster keeps electing new leaders every few seconds","Election timeouts are shorter than the network latency between zones.","Raise election timeouts above realistic heartbeat delays","Add more nodes => More votes over the same slow links","Restart nodes in a loop => More elections","Timeouts must reflect real network behaviour."],"a":["How does Raft elect a leader and replicate data?","Heartbeats and randomised election timeouts","Majority vote per term","Log entries committed on majority"]},"split brain problem":{"e":["A network partition can leave two groups that cannot see each other. If both elect a leader and accept writes, data diverges and must be reconciled or lost. Prevention: require a majority quorum to act, and fence the old leader (revoke its access or power it off) before another takes over."],"t":"Two halves of a cluster each think they are in charge.","p":"Using two-node clusters. Neither side has a majority, so either both act or neither does.","k":"No majority, no writes.","q":["How does requiring a majority prevent split brain?","Only one side of a partition can have more than half the nodes","Majorities are faster","It encrypts traffic","It removes the network","At most one group can form a majority."],"i":["Two primaries accepted orders for 12 minutes","A two-node database pair lost its link; each promoted itself.","Add a third voter and require a quorum, with fencing","Pick the winner by latest timestamp => Loses the other side's orders","Restart both => Divergence remains","Majority quorum plus fencing guarantees a single leader."],"a":["What is split brain and how do you prevent it?","Partition yields two leaders","Quorum so only one side acts","Fencing the old leader"]},"quorum":{"e":["A majority quorum (more than half) ensures any two quorums overlap in at least one node, so decisions cannot conflict. In replication, choose W and R with W + R > N so reads see the latest write. Larger quorums give stronger consistency and lower availability and speed."],"t":"The minimum number of nodes that must agree.","p":"Not being able to say why majorities work: any two of them must share a node.","k":"Any two majorities overlap.","q":["With N = 5, what is the smallest majority quorum?","3","2","4","5","More than half of five."],"i":["Writes fail whenever any single node is down","The store is configured with W = N (all replicas must acknowledge).","Lower W to a majority and keep R + W > N","Add retries => Still needs the dead node","Remove replicas => Less redundancy","Quorums below N let the system tolerate failures."],"a":["Why does a quorum guarantee correctness?","Overlap between any two quorums","W + R > N for fresh reads","Trade consistency against availability and latency"]},"distributed locking":{"e":["A lock service (Redis, ZooKeeper, etcd) grants a lock with an expiry so a crashed holder does not block forever. The danger: a paused process may resume after its lock expired and still act. Protect the resource with a fencing token, an increasing number the resource checks, rejecting stale holders."],"t":"Making sure only one process does a thing at a time across machines.","p":"Trusting a lock with a timeout alone. A slow holder can overlap with the next one.","k":"Lock with expiry plus fencing token.","q":["What does a fencing token protect against?","A process acting after its lock has expired","Network encryption failures","Disk filling up","Slow queries","The resource rejects tokens older than the latest seen."],"i":["Two workers processed the same payout","Worker A paused for a long GC; its lock expired, B took it, then A resumed and finished.","Use fencing tokens checked by the payout store","Lengthen the lock timeout => Longer stalls when a holder dies","Add a second lock => Same flaw twice","Leases expire; the resource must reject stale holders."],"a":["How do you implement a safe distributed lock?","Lease with expiry in a coordination service","Fencing token validated by the resource","Prefer idempotent operations where possible"]},"clock synchronization":{"e":["NTP keeps clocks within milliseconds on a good day, but drift, jumps and leap adjustments happen. So wall-clock time cannot safely order events across machines. Use monotonic clocks for measuring durations, logical clocks (Lamport, vector) for ordering, and bounded-uncertainty clocks such as TrueTime where global ordering is essential."],"t":"Keeping machine clocks close, and knowing they are never equal.","p":"Using timestamps from different servers to decide which write was \"last\".","k":"Wall clocks for humans; logical clocks for ordering.","q":["Which clock should you use to measure how long an operation took?","A monotonic clock","The wall clock","A random number","The user's clock","Monotonic clocks never jump backwards."],"i":["Sessions expired instantly on one server","Its clock was 10 minutes ahead after NTP stopped; tokens looked expired.","Restore time sync and alert on clock offset","Lengthen token lifetime => Hides skew until it grows","Remove expiry checks => Security hole","Time-based logic depends on monitored clock sync."],"a":["Why are timestamps dangerous in distributed systems?","Clocks drift and jump","Cannot reliably order cross-machine events","Use logical or monotonic clocks"]},"idempotency":{"e":["Networks force retries, so operations must be safe to repeat. Naturally idempotent: set a value, delete by ID. Not idempotent: increment, charge, send. Make them safe with an idempotency key: the client sends a unique ID, the server stores the result and returns it for repeats instead of acting again."],"t":"Doing it twice has the same effect as doing it once.","p":"Adding retries without making the operation idempotent.","k":"Retry freely only if repeating is harmless.","q":["Which operation is naturally idempotent?","Set balance to 500","Add 50 to balance","Send an SMS","Append a row","Setting the same value again changes nothing."],"i":["Customers received three copies of the same SMS","A queue redelivered the message and the sender has no duplicate check.","Record processed message IDs and skip repeats","Disable retries => Messages get lost","Add a delay between retries => Still sends duplicates","Consumers of at-least-once delivery must deduplicate."],"a":["How do you make a payment API safe to retry?","Client-generated idempotency key","Server stores result per key","Repeats return the stored result"]},"message queue fundamentals":{"e":["Producers put messages on a queue; consumers take them off and process at their own pace. The queue decouples the two, absorbs bursts, survives consumer downtime and lets you add consumers to scale. Consumers acknowledge a message when done; unacknowledged messages are redelivered."],"t":"A buffer between senders and receivers of work.","p":"Treating a queue as infinite. If consumers are slower than producers, the backlog grows without limit.","k":"Queues smooth bursts; they do not create capacity.","q":["What happens if a consumer crashes before acknowledging a message?","The message is redelivered","It is lost forever","The producer is notified to resend","The queue deletes it","Acknowledgement marks completion."],"i":["Queue depth has grown for six hours","Producers send 1,000 messages a second; consumers process 600.","Add consumers or speed up processing, and alert on queue lag","Increase the queue size => Delay grows, not throughput","Purge the queue => Lost work","A growing backlog means consumption is below production."],"a":["Why put a queue between two services?","Decoupling and independent scaling","Buffering bursts","Reliability through acks and redelivery"]},"producer consumer":{"e":["Producers and consumers run independently and at different speeds. Several consumers reading one queue (competing consumers) share the work, so throughput scales with their number. Backpressure is needed when producers outpace consumers: bounded queues, rate limits or shedding."],"t":"Producers create work; consumers process it; a queue sits between.","p":"Forgetting that competing consumers break strict ordering.","k":"Add consumers to go faster; give up global order.","q":["How do you double the processing rate of a queue?","Add more competing consumers","Add more producers","Make the queue longer","Slow the producers","Work is shared among consumers."],"i":["Email sending falls 3 hours behind after a campaign","One consumer handles the whole queue.","Run multiple consumers in parallel on the queue","Make the single consumer retry faster => No more capacity","Ask marketing to send fewer emails => Not a technical fix","Competing consumers scale throughput horizontally."],"a":["How does the producer-consumer pattern scale?","Decoupled rates through a queue","Competing consumers share work","Backpressure when producers outpace consumers"]},"rabbitmq":{"e":["Producers publish to exchanges, which route to queues by rules (direct, topic, fanout). Consumers receive pushed messages and acknowledge each one; messages are removed once consumed. It offers priorities, delays, dead-letter exchanges and prefetch limits. It suits task queues and complex routing rather than long retention or replay."],"t":"A message broker with flexible routing and per-message acknowledgement.","p":"Proposing RabbitMQ when the requirement is replaying history. Consumed messages are gone.","k":"Smart broker, flexible routing, messages deleted on ack.","q":["Which requirement fits RabbitMQ better than Kafka?","Routing tasks to different worker queues with per-message acks","Replaying a year of events","Millions of events per second retained for weeks","Stream joins","It is a task and routing broker."],"i":["Consumer memory explodes and it crashes","The broker pushes thousands of unacknowledged messages to one slow consumer.","Set a prefetch limit so each consumer holds only a few messages","Give the consumer more RAM => Still flooded","Auto-acknowledge on delivery => Messages lost on crash","Prefetch limits provide backpressure per consumer."],"a":["When would you choose RabbitMQ?","Task queues and work distribution","Complex routing through exchanges","Per-message ack; no long-term replay"]},"apache kafka":{"e":["Producers append records to topic partitions; each partition is an ordered, immutable log replicated across brokers. Consumers pull and track their own offset, so they can replay, and messages are kept for a retention period regardless of consumption. Throughput is very high thanks to sequential disk writes and batching. Ordering holds only within a partition."],"t":"A distributed, replayable commit log for event streams.","p":"Claiming Kafka gives global ordering. It is per partition only.","k":"Append-only log, consumers own their offsets, order per partition.","q":["Why can a new Kafka consumer read last week's events?","Kafka retains messages for a configured period, independent of consumption","Producers resend them","Consumers store them","It cannot","Retention plus offsets enables replay."],"i":["Events for the same order processed out of sequence","Records for one order are spread across partitions with no key.","Produce with the order ID as the key so they share a partition","Use one partition for everything => Throughput collapses","Sort by timestamp in the consumer => Fragile and slow","Keyed partitioning gives per-entity ordering."],"a":["What makes Kafka different from a traditional queue?","Durable, replayable log","Consumer-managed offsets and groups","Partitioned for scale with per-partition order"]},"redis streams":{"e":["A stream holds entries with auto-generated IDs. Consumer groups let several workers share a stream, each entry going to one worker, with a pending list tracking unacknowledged entries so they can be claimed by another worker. It is lightweight and fast, limited by memory, and suits modest event pipelines where Redis is already present."],"t":"An append-only log inside Redis with consumer groups.","p":"Using it as a Kafka replacement at massive scale or long retention; it lives in RAM.","k":"A small, fast log when you already run Redis.","q":["When is Redis Streams a reasonable choice?","A moderate-volume job pipeline in a system already using Redis","Petabyte event retention","Cross-region log replication at huge scale","Complex SQL analytics","It is simple and memory-bound."],"i":["Redis runs out of memory","A stream is appended to forever and never trimmed.","Cap the stream length with trimming","Add RAM every month => Grows without end","Delete the stream daily => Loses unprocessed entries","In-memory logs need a retention bound."],"a":["How does Redis Streams compare with Kafka?","In-memory log with consumer groups","Simple to run, memory-limited","Pending entries list for recovery"]},"amazon sqs":{"e":["Standard queues offer near-unlimited throughput with at-least-once delivery and best-effort ordering. FIFO queues give ordering and deduplication at lower throughput. A received message becomes invisible for a visibility timeout; if not deleted in time it reappears. Dead-letter queues catch repeated failures."],"t":"A fully managed queue: send, receive, delete.","p":"Setting the visibility timeout shorter than processing time, causing duplicate processing.","k":"Visibility timeout must exceed processing time.","q":["A job takes 2 minutes but the visibility timeout is 30 seconds. What happens?","The message reappears and another worker processes it too","The message is deleted","The queue stops","Nothing","The timeout expired before deletion."],"i":["Reports generated two or three times each","Workers take 5 minutes; the visibility timeout is 1 minute.","Raise the visibility timeout or extend it while working","Add more workers => More duplicates","Delete the message before processing => Lost on crash","Invisible time must cover the work."],"a":["How does SQS make sure messages aren't lost?","Message stays until explicitly deleted","Visibility timeout and redelivery","DLQ after repeated failures"]},"publish subscribe":{"e":["Publishers send to a topic without knowing the receivers; each subscriber (or subscriber group) gets its own copy. This fans out events to independent consumers such as email, analytics and search indexing, and new subscribers can be added without touching the publisher. It differs from a queue, where each message goes to one consumer."],"t":"One message, delivered to every interested subscriber.","p":"Confusing pub/sub fan-out with a work queue's competing consumers.","k":"Queue: one consumer gets it. Pub/sub: every subscriber gets it.","q":["OrderPlaced must reach billing, shipping and analytics independently. Use:","A topic with three subscriptions","One queue shared by all three","Three synchronous calls","A cron job","Each subscriber needs its own copy."],"i":["Shipping misses half the orders","Billing and shipping read the same queue, so each message goes to only one of them.","Give each service its own subscription to the topic","Have billing forward messages to shipping => Couples the services","Publish every message twice => Duplicates and drift","Independent consumers need independent subscriptions."],"a":["Pub/sub versus a queue?","Fan-out to all subscribers","Publisher unaware of consumers","Queue distributes each message to one worker"]},"topics partitions":{"e":["A topic is split into partitions, each an ordered log on some broker. The message key decides the partition, so the same key always lands in the same lane and stays in order. More partitions mean more parallelism. Skewed keys create hot partitions, and changing the partition count changes key placement."],"t":"A topic is a named stream; partitions are its parallel, ordered lanes.","p":"Creating too few partitions, then being unable to add consumers; or changing the count and breaking key ordering.","k":"Key picks the lane; lanes set the parallelism.","q":["What determines the maximum useful number of consumers in one group for a topic?","The number of partitions","The number of producers","Message size","Broker disk size","One partition is read by one consumer in a group."],"i":["Adding consumers no longer increases throughput","The topic has 4 partitions and the group already has 4 consumers.","Increase partitions, planning for key remapping","Add 10 more consumers => They sit idle","Speed up producers => More backlog","Partition count caps consumer parallelism."],"a":["What are partitions for?","Parallelism and scale","Ordering within a partition by key","Count limits consumers; hot keys cause skew"]},"consumer groups":{"e":["Within a group, each partition is assigned to exactly one consumer, so the group processes each message once and scales by adding members. Different groups each receive the whole stream, giving pub/sub. When members join or leave, partitions are rebalanced, which briefly pauses consumption. Offsets are stored per group."],"t":"Consumers sharing a group split the partitions between them.","p":"Thinking two consumers in the same group both get every message.","k":"Same group shares the work; different groups each get everything.","q":["Analytics and billing must both see every event. They should:","Use different consumer groups","Join the same group","Share one consumer","Use the same offset","Each group gets its own full copy."],"i":["Processing pauses for a minute every few minutes","Consumers exceed the poll interval, get kicked out, and trigger constant rebalances.","Reduce batch size or raise the poll interval so consumers stay in the group","Add more consumers => More rebalancing","Restart the brokers => Unrelated","Slow consumers cause rebalance storms."],"a":["How do consumer groups scale consumption?","One consumer per partition within a group","Add members up to partition count","Separate groups for independent readers"]},"message ordering":{"e":["Global ordering needs a single lane, which kills throughput. Most systems guarantee order within a partition or a message group, so related messages are keyed together. Retries, parallel consumers and multiple producers can reorder. Where order matters, use sequence numbers and make handlers tolerate or detect out-of-order arrival."],"t":"Whether messages are processed in the order they were sent.","p":"Requiring total order across everything when only per-entity order is needed.","k":"Order per key, not across the world.","q":["Account updates must apply in order per account, at high throughput. Best approach?","Partition by account ID","One global partition","Random partitioning","No ordering","Per-key ordering keeps parallelism."],"i":["\"Order shipped\" processed before \"order paid\"","Two consumers on a standard queue handled the messages concurrently.","Use a message group or partition key per order","Add a sleep before shipping events => Fragile guess","Use a single consumer for everything => Throughput collapses","Order is preserved only within a keyed lane."],"a":["How do you guarantee ordering in a messaging system?","Key related messages to one partition","Sequence numbers to detect gaps","Avoid needing global order"]},"delivery guarantees":{"e":["At-most-once: no retries, may lose messages. At-least-once: retried until acknowledged, may duplicate. Exactly-once: the effect happens once, achieved by at-least-once delivery plus idempotent or transactional processing. Stronger guarantees cost throughput and complexity. Most systems choose at-least-once with idempotent consumers."],"t":"How many times a message may be delivered: maybe, at least, or effectively once.","p":"Promising exactly-once delivery over a network. What you can achieve is exactly-once effect.","k":"At-least-once plus idempotency is the practical answer.","q":["What is the usual way to get exactly-once effects?","At-least-once delivery with idempotent consumers","Send each message once and hope","Disable acknowledgements","Use UDP","Duplicates are tolerated by deduplication."],"i":["Finance finds both missing and duplicated ledger entries","Some paths ack before processing, others after, with no dedup.","Ack after processing everywhere and make handlers idempotent","Ack before processing everywhere => Losses on crash","Turn off retries => More losses","Pick at-least-once consistently and deduplicate."],"a":["What delivery guarantees exist and which do you pick?","At-most, at-least, exactly-once effect","Trade loss against duplicates","At-least-once with idempotent handlers"]},"at most once":{"e":["The message is acknowledged or dropped before processing completes, so a crash loses it, but nothing is ever duplicated. It is the cheapest and fastest mode and fits data where an occasional loss is harmless, such as metrics samples or live telemetry."],"t":"Send once, never retry; some messages may be lost.","p":"Using it for anything that must not be lost.","k":"Fast and lossy: fine for metrics, never for money.","q":["Which data suits at-most-once delivery?","High-frequency sensor readings","Payment instructions","Order confirmations","Password resets","The next reading replaces a lost one."],"i":["Occasional orders never reach the warehouse","The consumer auto-acknowledges on receipt and sometimes crashes mid-processing.","Acknowledge only after successful processing","Restart the consumer faster => Lost messages stay lost","Add logging => You now know what you lost","Acking before the work is done means at-most-once."],"a":["When is losing messages acceptable?","Data is replaceable or sampled","Speed matters more than completeness","Never for business-critical events"]},"at least once":{"e":["The broker redelivers a message until the consumer confirms it. If the consumer processes it and crashes before acknowledging, it gets the message again. Nothing is lost, but handlers must be idempotent or deduplicate by message ID. This is the default in most messaging systems."],"t":"Retry until acknowledged; duplicates are possible.","p":"Forgetting the duplicate case when designing consumers.","k":"Never lost, sometimes repeated: deduplicate.","q":["A consumer processes a message, then crashes before acking. With at-least-once:","The message is delivered again","It is lost","The broker shuts down","The producer resends manually","No ack means redelivery."],"i":["Loyalty points credited twice","The handler adds points, then acks; a timeout between the two caused redelivery.","Record the message ID with the update so repeats are ignored","Ack first, then add points => Points lost on crash","Lengthen timeouts => Fewer duplicates, not none","At-least-once requires idempotent handlers."],"a":["What do consumers need to handle under at-least-once delivery?","Duplicate messages","Idempotent processing or dedup store","Ack only after success"]},"exactly once semantics":{"e":["True single delivery is impossible over unreliable networks, so systems combine at-least-once delivery with deduplication or transactions. Kafka provides idempotent producers and transactions that atomically write outputs and commit offsets. Outside the broker, such as calling an external API, you still need idempotency keys."],"t":"Each message's effect is applied one time, despite retries.","p":"Believing a broker setting makes external side effects exactly-once.","k":"Exactly-once is an effect, built from retries plus dedup.","q":["Kafka's exactly-once covers:","Reads and writes within Kafka topics, atomically","Emails sent by your consumer","Charges on an external gateway","Any HTTP call","Outside systems need their own idempotency."],"i":["Duplicate charges despite \"exactly-once enabled\"","The consumer calls a payment API; a retry after timeout charged again.","Send an idempotency key to the payment API","Enable the setting on more topics => Does not reach external calls","Slow the consumer down => Duplicates still possible","Side effects outside the log need their own dedup."],"a":["Is exactly-once delivery really possible?","Not delivery, but effect","At-least-once plus idempotency or transactions","External side effects need idempotency keys"]},"dead letter queues":{"e":["After a set number of failed attempts, a message is moved to a dead letter queue instead of blocking the main queue or retrying forever. Engineers inspect, fix and replay from it. A DLQ needs an alert: messages there represent work that did not happen."],"t":"A parking place for messages that keep failing.","p":"Creating a DLQ and never monitoring it.","k":"Park the poison, alert on it, replay after the fix.","q":["What problem does a DLQ solve?","One unprocessable message blocking or endlessly retrying","Slow producers","Lack of disk space","Duplicate keys","Poison messages are set aside."],"i":["Queue consumer stuck on the same message for hours","A malformed message crashes the handler; it is redelivered forever, blocking everything behind it.","Configure a maximum retry count and move failures to a DLQ","Restart the consumer => It picks up the same message","Purge the queue => Loses good messages","Poison messages must be isolated from healthy flow."],"a":["What is a dead letter queue for?","Isolates repeatedly failing messages","Keeps main flow moving","Must be monitored and replayable"]},"event replay":{"e":["When events are retained in a log, a consumer can reset its offset and process history again. Uses: recovering from a bug by reprocessing with fixed code, building a new read model or search index, and backfilling a new service. Handlers must be idempotent, and replay must not re-trigger side effects such as emails."],"t":"Re-reading past events to rebuild state or feed a new consumer.","p":"Replaying into handlers that send emails or charge cards again.","k":"Replay rebuilds state; switch off side effects first.","q":["A new analytics service needs last month's data. With a retained event log you:","Start a new consumer from an earlier offset","Ask every service to resend","Restore a database backup","Cannot do it","The log is the history."],"i":["Customers received thousands of old order emails","A replay to rebuild a database also ran the notification handler.","Separate state-building from side-effect handlers and disable the latter during replay","Replay more slowly => Same emails, slower","Delete the email service => Breaks live notifications","Replays must be free of external side effects."],"a":["What is event replay useful for?","Rebuild read models or caches","Recover after fixing a bug","Bootstrap new consumers; needs idempotency"]},"event sourcing":{"e":["Instead of overwriting a row, append immutable events (Deposited 100, Withdrew 30). Current state is the result of replaying them, sped up with snapshots. You gain a full audit trail, time travel and the ability to build new views later. Costs: more complex queries (usually paired with CQRS), event schema evolution and eventual consistency."],"t":"Store every change as an event; derive current state from them.","p":"Adopting it everywhere. It pays off in audit-heavy domains, not simple CRUD.","k":"The log is the truth; state is a projection.","q":["Main benefit of event sourcing for a banking ledger?","A complete, immutable history of every change","Fewer writes","No need for backups","Simpler queries","Every state can be reconstructed and audited."],"i":["Loading an account takes 20 seconds","State is rebuilt by replaying 2 million events on every read.","Add periodic snapshots and replay only events after the latest","Delete old events => Destroys the history","Cache forever => Stale state","Snapshots bound replay time."],"a":["What is event sourcing and when is it worth it?","Append-only events as source of truth","State by replay with snapshots","Audit and rebuild benefits; complexity cost"]},"database scaling":{"e":["Work through the ladder: tune queries and indexes, scale up the machine, add caching, add read replicas for read load, partition large tables, and finally shard for write and storage scale. Each step adds complexity, so take the cheapest step that removes the current bottleneck."],"t":"Growing a database's capacity for reads, writes and storage.","p":"Jumping to sharding first. It is the most expensive step and often unnecessary.","k":"Tune, scale up, cache, replicate, then shard.","q":["Reads are overwhelming the primary; writes are light. Next step after query tuning and caching?","Add read replicas","Shard the database","Rewrite in another language","Remove indexes","Replicas offload read traffic."],"i":["Database CPU at 90%, mostly SELECTs","A few unindexed queries and a read-heavy dashboard run on the primary.","Fix the queries, then move dashboard reads to a replica","Shard into 16 databases => Months of work for a tuning problem","Double the app servers => More queries, same database","Remove waste before adding machinery."],"a":["What's your order of steps for scaling a database?","Optimise queries and indexes","Vertical scale, cache, read replicas","Partition and shard last"]},"read replicas":{"e":["The primary streams its changes to replicas, which answer SELECTs, so read capacity grows with each replica and a replica can be promoted if the primary fails. Replication is usually asynchronous, so replicas lag by milliseconds to seconds. Send reads that must be fresh to the primary."],"t":"Copies of the primary that serve read queries.","p":"Routing every read to replicas and ignoring lag.","k":"Replicas scale reads, never writes, and always lag a little.","q":["What do read replicas not help with?","Write throughput","Read throughput","Reporting queries","Failover","All writes still hit the primary."],"i":["Checkout shows \"order not found\" right after placing it","The confirmation page reads from a lagging replica.","Read from the primary immediately after a write","Add more replicas => Same lag","Retry the read 10 times => Slow and still racy","Fresh reads after writes belong on the primary."],"a":["How do read replicas work and what's the catch?","Async copy of primary serves reads","Scales reads, not writes","Replication lag causes stale reads"]},"partitioning strategies":{"e":["Range partitioning groups by value ranges (dates, alphabet), good for range scans but prone to hot recent ranges. Hash partitioning spreads evenly but scatters ranges. List partitioning assigns explicit values such as region. Composite schemes combine them, for example hash by user then range by time."],"t":"The rule that decides which partition a row lives in.","p":"Range partitioning on a monotonically increasing key, so all writes hit the last partition.","k":"Range for scans, hash for spread, composite for both.","q":["Time-series data partitioned by day is queried by date range. Which strategy is in use?","Range partitioning","Hash partitioning","Random partitioning","No partitioning","Rows are grouped by a value range."],"i":["All inserts hit one partition; it is the bottleneck","Data is range-partitioned by auto-increment ID.","Hash-partition by a well-spread key, or prefix the key with a hash bucket","Add more range partitions => New writes still go to the last one","Scale the hot node => Hot spot moves with it","Sequential keys concentrate writes under range partitioning."],"a":["Range versus hash partitioning?","Range: ordered, good scans, hot spots","Hash: even spread, no range scans","Composite keys combine them"]},"cdn edge computing":{"e":["A CDN caches static and cacheable content at hundreds of edge locations, cutting latency and origin load and absorbing attacks. Edge computing goes further and runs small functions there: authentication checks, redirects, A/B routing, image resizing. Cache keys, TTLs and purging control freshness."],"t":"Serving content, and running code, close to the user.","p":"Thinking CDNs are only for images. They also cache API responses, terminate TLS and block attacks.","k":"Move bytes and simple logic to the edge.","q":["Which task suits edge compute?","Redirecting users by country before reaching the origin","A multi-table transaction","Training a model","Running the primary database","Light, latency-sensitive logic fits the edge."],"i":["Origin overwhelmed during a product launch","Every image and script request goes to t
