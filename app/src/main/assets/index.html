eads use the same object.","p":"Assuming counter++ or check-then-insert is atomic.","k":"Share nothing, or make it immutable, or guard it.","q":["Two threads run count++ on a shared integer 1,000 times each. The result is:","Possibly less than 2,000","Always 2,000","Always 1,000","Negative","Read-modify-write interleavings lose updates."],"i":["Seat booked by two users at once","The code checks \"is free\" and then marks it booked, with no synchronisation.","Make check-and-book atomic with a lock or conditional update","Add a short sleep => Race remains","Test more on a single thread => Cannot reproduce","Check-then-act must be atomic."],"a":["How do you make a class thread-safe?","Avoid shared mutable state or use immutability","Locks, atomics, concurrent collections","Small critical sections and consistent lock order"]},"common lld problems":{"e":["Parking lot, lift, library, expense sharing, ticket booking, chess and food delivery each test the same routine: clarify requirements, list entities, assign responsibilities, define relationships, model state, handle concurrency and leave extension points. Interviewers look for clean, extensible structure rather than complete code."],"t":"Classic exercises for practising class design.","p":"Coding immediately without stating requirements and entities.","k":"Requirements, entities, relationships, states, then code.","q":["First step in a low-level design interview?","Clarify requirements and scope","Write the main method","Pick a database","Draw the UI","Scope defines the entities."],"i":["Candidate wrote 200 lines and then discovered multi-floor parking was required","No questions were asked at the start.","Clarify requirements and sketch entities before coding","Type faster next time => Same mistake","Assume the hardest case always => Wasted effort","Early clarification avoids rework."],"a":["How do you tackle any LLD problem?","Clarify use cases","Identify entities, relationships and states","Design for extension and concurrency"]},"parking lot":{"e":["Entities: ParkingLot, Floor, Slot (by size or type), Vehicle, Ticket, Gate, Payment. Entry assigns a suitable free slot and issues a ticket; exit computes the fee from duration and frees the slot. Use a strategy for slot assignment and for pricing, and make slot allocation atomic when several gates operate."],"t":"Slots, vehicles, tickets and fees.","p":"Hard-coding vehicle types and pricing in conditionals.","k":"Assign a slot, issue a ticket, charge on exit, free the slot.","q":["Which pattern fits swappable pricing (hourly, flat, weekend)?","Strategy","Singleton","Adapter","Observer","Pricing is an interchangeable algorithm."],"i":["Two cars assigned the same slot at different gates","Each gate reads the free list and assigns without coordination.","Make slot allocation atomic","Add a retry at the gate => Both already hold tickets","Use one gate => Capacity cut","Shared resources need atomic allocation."],"a":["Design a parking lot.","Entities: lot, floor, slot, vehicle, ticket","Slot assignment and pricing strategies","Concurrency on allocation"]},"library management system":{"e":["Separate Book (title metadata) from BookCopy (a physical item with a barcode). Members borrow copies, creating Loan records with due dates; returns close loans and compute fines. Reservations queue members for unavailable titles. Rules: borrow limits, loan periods, fine policy. Search by title, author or ISBN."],"t":"Books, copies, members and loans.","p":"Treating a book title and a physical copy as the same entity.","k":"A title has many copies; loans attach to copies.","q":["Why separate Book from BookCopy?","One title has several physical copies with different availability","To save memory","To avoid search","It is not needed","Loans track individual copies."],"i":["System shows a book as unavailable though three copies sit on the shelf","Availability is a single flag on the title.","Track status per copy","Buy more books => Same flag","Reset the flag nightly => Wrong all day","Model the physical item separately from its description."],"a":["Design a library system.","Book versus copy, member, loan, reservation","Borrow and return flows with fines","Limits and search"]},"elevator system":{"e":["Entities: ElevatorCar (floor, direction, state), hall and car Requests, Controller or Dispatcher, Door. Each car is a state machine: idle, moving up, moving down, doors open. The dispatcher assigns hall calls using a strategy such as nearest car moving in the same direction (SCAN-like), avoiding starvation."],"t":"Cars, requests and a scheduler that assigns them.","p":"Serving requests strictly first come first served, sending cars back and forth.","k":"Each car is a state machine; a dispatcher strategy assigns calls.","q":["A car going up from floor 3 has calls at 5, 2 and 8. Efficient order?","5, 8, then 2","2, 5, 8","8, 2, 5","5, 2, 8","Continue in the current direction first."],"i":["Passengers on low floors wait many minutes during the morning rush","The scheduler always serves the nearest request, starving distant ones.","Use a direction-based algorithm with fairness","Add more buttons => No change","Make the lift faster => Starvation remains","Scheduling policy decides waiting time."],"a":["Design a lift system.","Car state machine","Request types and dispatcher","Scheduling strategy and fairness"]},"splitwise":{"e":["Entities: User, Group, Expense (payer, amount, split type), Split, Balance. Split strategies: equal, exact amounts, percentage. Each expense updates pairwise balances. Debt simplification nets balances so the fewest payments settle the group. Store money as integer minor units and handle rounding remainders explicitly."],"t":"Shared expenses, balances and settling up.","p":"Using floating point for money.","k":"Splits update balances; simplify by netting.","q":["A owes B 100 and B owes C 100. Simplified:","A pays C 100","A pays B and B pays C","Nobody pays","C pays A","Netting removes the intermediate hop."],"i":["Group totals are off by a few paise","Amounts are stored as floats and splits are rounded independently.","Use integer minor units and assign the remainder deterministically","Round everything up => Totals exceed the bill","Ignore it => Balances never reach zero","Money needs exact arithmetic."],"a":["Design an expense-sharing app.","Expense and split strategy","Balance tracking per pair","Debt simplification and exact money maths"]},"bookmyshow":{"e":["Entities: Movie, Theatre, Screen, Show (a movie on a screen at a time), Seat, ShowSeat (seat status for one show), Booking, Payment. Selecting seats places a temporary hold with an expiry; payment confirms; expiry releases. Seat status transitions must be atomic so two users cannot hold the same seat."],"t":"Shows, seats and bookings that must not double-sell.","p":"Marking a seat booked only after payment, with no hold, so two users pay for the same seat.","k":"Hold with a timeout, confirm on payment, release on expiry.","q":["Why is a temporary seat hold needed?","To stop another user taking the seat during payment","To make payment faster","To store the movie","It is not needed","The seat is reserved for a short window."],"i":["Two customers arrive with tickets for the same seat","Both read the seat as free and both bookings were saved.","Use an atomic conditional update or lock when holding seats","Refund one of them each time => Recurring harm","Sell fewer seats => Lost revenue","Seat allocation needs an atomic status change."],"a":["Design the classes for movie ticket booking.","Show and ShowSeat separate from Seat","Hold, confirm, release states","Atomic seat locking"]},"chess":{"e":["Entities: Game, Board, Cell, Piece (abstract) with subclasses King, Queen, Rook, Bishop, Knight, Pawn, plus Player and Move. Each piece implements its own move validation (polymorphism). Game enforces turns, check and checkmate, and special moves. A move history supports undo and replay."],"t":"Board, pieces and rules of movement.","p":"One huge function with a switch on piece type.","k":"Each piece knows its moves; the game knows the rules.","q":["How should move rules for different pieces be organised?","Each piece subclass implements its own validation","One switch in the Board class","In the UI","In the database","Polymorphism keeps rules local."],"i":["Adding a custom piece requires editing eight methods","Movement rules live in type switches across the code.","Move rules into piece classes behind a common interface","Add another case to each switch => Next piece repeats it","Ban custom pieces => Requirement unmet","Polymorphism localises per-type behaviour."],"a":["Design a chess game.","Board, cells, piece hierarchy","Move validation per piece","Game state: turns, check, history"]},"food delivery system":{"e":["Entities: Customer, Restaurant, Menu and MenuItem, Cart, Order, DeliveryPartner, Payment. The order is a state machine: placed, accepted, preparing, picked up, delivered, or cancelled. Partner assignment and fee calculation are strategies. Observers notify customer, restaurant and partner on each transition."],"t":"Restaurants, orders, delivery partners and an order lifecycle.","p":"Scattering order status updates with no defined transitions.","k":"The order is a state machine; assignment and pricing are strategies.","q":["Which pattern suits notifying customer, restaurant and partner on each status change?","Observer","Singleton","Adapter","Factory","Subscribers react to state changes."],"i":["Orders jump from \"placed\" to \"delivered\" and skip steps","Any service can set any status value.","Enforce allowed transitions in one order state machine","Train staff => Not a system control","Add more status values => More invalid paths","Central state transitions keep the lifecycle valid."],"a":["Design the classes for a food delivery app.","Entities: restaurant, menu, order, partner","Order state machine","Strategies for assignment and pricing"]},"requirement gathering":{"e":["Clarify who the users are, the core features, and what is out of scope. Then pin down scale (users, QPS, data size), latency and availability targets, consistency needs, read/write ratio and constraints. Write the answers down. Five minutes here saves the whole discussion from solving the wrong problem."],"t":"Asking the questions that shape the design before drawing anything.","p":"Assuming requirements silently and designing for something the interviewer did not ask.","k":"Ask first: who, what, how many, how fast, how correct.","q":["Which question best narrows a \"design a chat app\" prompt?","One-to-one only or groups too, and how many concurrent users?","Which colour scheme?","What language is the team's favourite?","Who is the CEO?","Features and scale drive architecture."],"i":["After 30 minutes the interviewer says \"I wanted group chat with 100k members\"","The candidate designed one-to-one messaging without asking.","Confirm scope and scale at the start and restate them","Speed through the redesign => Shallow answer","Argue the original scope => Lost time","Explicit requirements prevent wasted design."],"a":["What do you ask before designing?","Core features and exclusions","Scale and performance targets","Consistency, availability and constraints"]},"api design":{"e":["List the operations from the functional requirements and define each: path and method, inputs, outputs and errors. Use resource-oriented names, pagination on lists, idempotency keys on unsafe writes, versioning, authentication and rate limits. Keep responses minimal and consistent. The API reveals the data model and the main flows."],"t":"The contract between clients and the system.","p":"Returning unbounded lists, or leaving out idempotency for writes that clients will retry.","k":"Clear nouns, paginated lists, idempotent writes, versioned.","q":["What should a \"list messages\" endpoint always include?","Pagination with a cursor","Every message in one response","The database password","A random delay","Unbounded responses do not scale."],"i":["Mobile app times out loading a busy channel","The endpoint returns the channel's entire history in one response.","Paginate with cursors and return recent messages first","Raise the timeout => Still huge payloads","Compress only => Still unbounded","Every list needs a bound."],"a":["How do you design an API in an interview?","Endpoints from core use cases","Request, response and error shapes","Pagination, idempotency, auth and versioning"]},"architecture diagrams":{"e":["Start with clients, entry point (CDN, load balancer, gateway), services, data stores, caches, queues and external systems. Label arrows with protocol and direction, and mark synchronous versus asynchronous paths. Keep one level of detail per diagram; the C4 model (context, containers, components) is a useful ladder."],"t":"A picture of components, their connections and the data flow.","p":"Unlabelled boxes and arrows, or mixing levels of detail.","k":"Boxes with roles, arrows with labels, one level per diagram.","q":["What makes an architecture diagram useful?","Labelled components and data flows at a consistent level","As many boxes as possible","No arrows","Vendor logos only","Readers must follow a request through it."],"i":["New engineers cannot understand the system from the diagram","It has 90 boxes, unlabelled arrows and mixes servers with classes.","Split it into levels and label every flow","Add a legend to the same diagram => Still cluttered","Make it larger => Same confusion","Diagrams communicate when scoped and labelled."],"a":["How do you draw a high-level design?","Client to entry point to services to data","Label protocols and direction","Separate levels of detail"]},"architecture documentation":{"e":["Useful documents: a short design doc (context, goals, non-goals, options considered, decision, risks), architecture decision records (one decision each, with context and consequences), diagrams and runbooks. Keep them near the code and update them when decisions change. The value is the reasoning future engineers cannot reconstruct."],"t":"Recording what was built and, more importantly, why.","p":"Documenting only the final design, with no alternatives or reasons.","k":"Write down the decision, the alternatives and the why.","q":["What is the main value of an architecture decision record?","It preserves the context and reasoning behind a choice","It replaces tests","It speeds the CPU","It stores passwords","Later teams learn why."],"i":["Team reverses a decision and reintroduces a bug fixed two years ago","Nobody recorded why the original choice was made.","Keep decision records with context and consequences","Rely on the longest-serving engineer => They leave","Add a comment in one file => Hard to find","Recorded reasoning prevents repeated mistakes."],"a":["What should architecture documentation contain?","Context, goals and non-goals","Options and the decision with trade-offs","Diagrams and runbooks kept current"]},"end to end system design":{"e":["A reliable sequence: clarify requirements, estimate scale, define APIs, model data, draw the high-level architecture, then deep-dive into the hardest parts, and finally cover bottlenecks, failure handling, security, monitoring and trade-offs. Follow one request through the whole system to check it holds together."],"t":"Walking one design from requirements to a defended architecture.","p":"Spending the whole time on one component and never completing the picture.","k":"Requirements, estimates, API, data, architecture, deep dives, trade-offs.","q":["After drawing the high-level diagram, the best next step is:","Deep-dive into the riskiest components and bottlenecks","Redraw it neatly","Pick fonts","Stop","Depth on hard parts shows understanding."],"i":["Candidate ran out of time before discussing scaling or failures","Thirty minutes went on the database schema alone.","Time-box each stage and complete the end-to-end flow first","Talk faster => Still unbalanced","Skip requirements next time => Wrong design","Breadth first, then depth where it matters."],"a":["Walk me through your system design process.","Requirements and estimation","API, data model and architecture","Deep dives, failure modes and trade-offs"]},"url shortener tinyurl":{"e":["Write path: generate a unique 7-character base62 code (from a counter or ID generator, or a hash with collision check) and store code to URL in a key-value store. Read path: look up the code and return a 301 or 302 redirect. Reads outnumber writes about 100 to 1, so cache hot codes and put the redirect behind a CDN.","Seven base62 characters give about 3.5 trillion codes. Extras: custom aliases, expiry, click analytics through an async event stream, and abuse checks."],"t":"Map a short code to a long URL and redirect fast.","p":"Using a random code without handling collisions, or forgetting that 301 responses are cached by browsers and hide analytics.","k":"Unique base62 code, key-value lookup, cache the hot ones.","q":["Why might you choose a 302 over a 301 redirect?","So every click still reaches your servers for analytics","It is faster for users","It is more secure","It saves storage","Browsers cache 301s and skip your server."],"i":["Two different long URLs ended up with the same short code","Codes are the first 7 characters of a hash, with no uniqueness check.","Generate codes from a unique counter, or check and retry on collision","Use 6 characters => More collisions","Ignore it as rare => Users get wrong destinations","Short codes need guaranteed uniqueness."],"a":["How would you design a URL shortener?","Unique code generation (base62 of an ID)","Key-value store with cache for redirects","Read-heavy scaling, expiry and analytics"]},"pastebin":{"e":["Each paste gets a unique key. Content goes to object storage (pastes can be large); metadata such as key, owner, expiry, visibility and size goes to a database. Reads fetch metadata, then content through a CDN or cache. An expiry job deletes old pastes. Limits on size and rate prevent abuse."],"t":"Store text snippets and serve them by a short link.","p":"Storing large paste bodies inside the relational database rows.","k":"Metadata in a database, content in object storage, expiry by a sweeper.","q":["Where should paste content of up to 10 MB be stored?","Object storage","A relational row","The cache only","The URL","Blobs belong in blob storage."],"i":["Database is 2 TB and backups take all night","Every paste body is stored in a text column.","Move bodies to object storage and keep only metadata in the database","Buy a larger database => Grows again","Compress the column => Still bloated","Separate large content from queryable metadata."],"a":["How does Pastebin differ from a URL shortener?","Stores content, not just a mapping","Object storage plus metadata database","Expiry, size limits and caching"]},"rate limiter":{"e":["Identify the client by API key, user or IP. Keep a counter or token bucket per client in a fast shared store such as Redis, updated atomically. Token bucket allows bursts; sliding window counters smooth boundary spikes. Reject with 429 and Retry-After. Place it at the gateway. Decide whether to fail open or closed if the store is down."],"t":"Decide, per client and per window, whether to allow a request.","p":"A fixed window that allows double the limit across a window boundary, or non-atomic read-then-write counters.","k":"Atomic counters in a shared store, token bucket, 429 with Retry-After.","q":["With a fixed 1-minute window of 100 requests, a client can send how many in a short span across the boundary?","Up to 200","100","50","1","100 at the end of one window and 100 at the start of the next."],"i":["Clients exceed limits when requests arrive in parallel","The limiter reads the count, checks it, then writes, in three separate calls.","Do check-and-increment atomically, for example with a script","Lower the limit => Race still allows overshoot","Add a lock in each app server => Not shared","Rate limit counters must be updated atomically."],"a":["Design a distributed rate limiter.","Algorithm: token bucket or sliding window","Shared atomic counters in Redis","Placement, 429 responses and failure mode"]},"notification system":{"e":["Services publish notification requests to a queue. Workers per channel apply user preferences, templates, rate limits and deduplication, then call providers such as APNs, FCM, SMS gateways and email services. Failures retry with backoff and land in a dead letter queue. Track delivery status. Priority queues keep OTPs ahead of marketing."],"t":"Deliver push, SMS and email reliably at scale.","p":"Sending synchronously from the request path, or having no deduplication so retries spam users.","k":"Queue, per-channel workers, retries with dedup, respect preferences.","q":["Why separate queues for OTPs and marketing messages?","So a marketing blast cannot delay time-critical OTPs","To save money","To use more servers","It is not useful","Priority isolation."],"i":["Users received the same promotional push five times","A provider timeout caused retries and nothing deduplicates.","Deduplicate with a notification ID before sending","Disable retries => Messages lost","Slow the workers => Still duplicates","Retries need idempotency."],"a":["Design a notification service.","Queue-based, channel-specific workers","Preferences, templates, rate limits, dedup","Retries, DLQ, priorities and tracking"]},"news feed facebook instagram":{"e":["Posts are stored once. For most users, a new post is fanned out on write into followers' feed lists in a cache, so reading a feed is a quick lookup. For accounts with millions of followers, posts are pulled at read time and merged. A ranking step orders candidates. Media is served from a CDN; feeds are paginated by cursor."],"t":"Show each user a ranked list of posts from accounts they follow.","p":"Pure fan-out on write for celebrities, or building every feed with a heavy query at read time.","k":"Hybrid fan-out, precomputed feed cache, rank, paginate.","q":["Why not compute the feed with a database query on every open?","Joining and sorting posts from hundreds of followees per read is too slow at scale","It is too accurate","It uses no storage","Databases forbid it","Precomputation moves work off the read path."],"i":["Feed loads take 6 seconds for users following 2,000 accounts","Each open queries and sorts recent posts from all followees.","Precompute feeds on write into a cache","Add database replicas => Each read is still heavy","Limit follows to 100 => Product harm","Read-heavy feeds need precomputation."],"a":["Design a news feed.","Fan-out on write, read, or hybrid","Feed cache and ranking","Media via CDN; cursor pagination"]},"chat application whatsapp":{"e":["Clients hold a persistent connection (WebSocket) to a gateway server. A session registry records which server holds each user. Sending: the message is persisted with a per-conversation sequence number, then routed through a queue or pub/sub to the recipient's server and pushed. If the recipient is offline, it is stored and delivered on reconnect, with a push notification.","Acks drive sent, delivered and read receipts. Group messages fan out to members. End-to-end encryption keeps content opaque to servers."],"t":"Deliver messages in real time, in order, even to offline users.","p":"Forgetting offline delivery and per-conversation ordering.","k":"Persistent connections, session registry, store then forward, per-chat sequence.","q":["How is a message delivered to a user who is offline?","It is stored and delivered when they reconnect, with a push notification","It is dropped","The sender waits online","By email only","Store and forward."],"i":["Messages in a chat appear out of order","Ordering uses each sender's device clock.","Assign server-side sequence numbers per conversation","Sync device clocks => Still skewed","Sort alphabetically => Nonsense","Ordering needs a single authority per conversation."],"a":["Design WhatsApp.","WebSocket gateways and session registry","Persist, sequence, route, ack","Offline storage, receipts, group fan-out"]},"video streaming youtube netflix":{"e":["Uploads go straight to object storage. A pipeline of workers splits the video into segments and transcodes each into several resolutions and bitrates, producing a manifest (HLS or DASH). Segments are served by a CDN. The player uses adaptive bitrate streaming, switching quality by measured bandwidth. Metadata, search and recommendations are separate services."],"t":"Upload once, transcode to many qualities, stream from the edge.","p":"Serving whole video files from origin servers, with no segments or CDN.","k":"Segment, transcode into a bitrate ladder, serve from CDN, adapt in the player.","q":["What lets playback continue smoothly when bandwidth drops?","Adaptive bitrate streaming switches to lower-quality segments","A bigger origin server","Longer videos","Disabling the CDN","The player picks segments by network speed."],"i":["Viewers on mobile networks see constant buffering","Only one high-bitrate file exists per video.","Transcode into multiple bitrates with segmented adaptive streaming","Increase origin bandwidth => Users' links are the limit","Shorten videos => No help","Clients need a quality ladder to adapt."],"a":["Design a video streaming service.","Upload to object storage and async transcoding","Segments, manifest and CDN","Adaptive bitrate; metadata services"]},"ride hailing uber":{"e":["Drivers send location every few seconds. A geospatial index (geohash or similar cells) kept in memory answers \"nearest available drivers\". Matching offers the ride to a driver and must guarantee one driver per trip and one trip per driver. The trip is a state machine. Other parts: ETA and routing, surge pricing by supply and demand per area, payments and notifications."],"t":"Match riders with nearby drivers using live locations.","p":"Running a database query over all drivers for each request, or allowing two riders to be matched to one driver.","k":"Location stream, geo index, atomic match, trip state machine.","q":["Why index driver locations by geohash or grid cell?","To look up nearby drivers without scanning all of them","To encrypt locations","To store less data","For nicer maps","Spatial indexing narrows the search."],"i":["Two riders were assigned the same driver","Matching read the driver as available for both requests at once.","Make driver assignment an atomic conditional update","Tell drivers to pick one => Bad experience","Slow down matching => Race remains","Matching needs an atomic claim."],"a":["Design Uber.","Location ingestion and geo index","Matching with atomic assignment","Trip state, ETA, pricing and payments"]},"food delivery swiggy zomato":{"e":["Discovery needs a search index over restaurants and menus filtered by location and availability. Ordering runs cart, payment, restaurant acceptance, preparation, partner assignment, pickup and delivery as a state machine driven by events. Partner assignment uses live locations and batching. Live tracking streams location to the customer. ETA prediction and surge handling matter at peak."],"t":"Three parties, one order: customer, restaurant and delivery partner.","p":"Treating it as a simple e-commerce order and ignoring real-time assignment and tracking.","k":"Search, order state machine, geo assignment, live tracking.","q":["Which component answers \"restaurants near me serving biryani, open now\"?","A search index with geo filtering","The payment service","The CDN","A message queue","Text plus location plus filters is a search problem."],"i":["Orders at dinner peak wait 20 minutes without a delivery partner","Assignment considers only the single nearest partner and retries one at a time.","Batch and widen assignment, and offer to several candidates","Tell customers to wait => Cancellations","Hire partners => Does not fix the algorithm","Assignment strategy sets delivery time at peak."],"a":["Design a food delivery platform.","Restaurant and menu search","Order lifecycle across three parties","Partner assignment, tracking and ETA"]},"e commerce amazon":{"e":["Catalogue is read-heavy: document store plus search index, heavily cached. Cart is a per-user key-value record. Checkout is the critical path: reserve inventory atomically, take payment, create the order, then trigger fulfilment through events. Use a saga with compensation for failures. Flash sales need queues and rate limits to protect inventory and payment."],"t":"Browse, cart, checkout, and never oversell.","p":"Decrementing stock without atomicity, which oversells during sales.","k":"Cached catalogue, atomic inventory, saga checkout, events after.","q":["What prevents selling the last item twice?","An atomic conditional decrement of stock","A faster CDN","Larger product images","More search servers","Check and decrement must be one operation."],"i":["Flash sale sold 1,200 units of a 1,000-unit product","Stock was read, checked in the application, then written.","Use an atomic decrement with a stock-greater-than-zero condition","Email apologies => Reputation damage","Add app servers => More racing writers","Inventory updates must be atomic."],"a":["Design an e-commerce platform.","Catalogue and search with caching","Cart, inventory reservation and checkout saga","Events for fulfilment; flash sale protection"]},"payment system":{"e":["Every payment request carries an idempotency key. The system records intent, calls the payment provider, and updates state through a state machine (created, authorised, captured, failed, refunded). A double-entry ledger records each movement as balanced debit and credit rows, immutable. Webhooks and reconciliation jobs settle unknown outcomes. Strong consistency and audit trails are mandatory."],"t":"Move money exactly once and be able to prove it.","p":"Retrying a charge without an idempotency key, or updating balances without a ledger.","k":"Idempotency key, state machine, double-entry ledger, reconciliation.","q":["A charge call to the provider times out. Correct handling?","Query the provider or retry with the same idempotency key","Charge again with a new request","Assume success","Assume failure","The outcome is unknown; never create a second charge."],"i":["Finance cannot explain a mismatch between balances and bank statements","Balances are overwritten in place with no transaction history.","Adopt an immutable double-entry ledger and reconcile daily","Adjust balances by hand => Errors hidden","Add a notes column => Not auditable","Money needs an append-only ledger."],"a":["Design a payment system.","Idempotent payment API and state machine","Double-entry ledger","Provider integration, webhooks and reconciliation"]},"search engine":{"e":["Crawlers or pipelines feed documents to an indexer, which tokenises text and builds an inverted index: each term maps to the list of documents containing it. A query is tokenised, the posting lists are intersected, and results are ranked (BM25, link signals, freshness). The index is sharded and replicated; queries scatter to shards and gather results. Autocomplete uses a prefix structure."],"t":"Find and rank documents matching a query.","p":"Proposing SQL LIKE queries for full-text search.","k":"Inverted index, sharded; scatter, gather, rank.","q":["What is an inverted index?","A map from each term to the documents containing it","A reversed B-tree","A cache of queries","A list of users","It makes term lookup direct."],"i":["Product search takes 12 seconds","It runs LIKE '%term%' across 40 million rows.","Build an inverted index with a search engine","Add a B-tree index => Leading wildcard cannot use it","Add replicas => Each still scans","Text search needs an inverted index."],"a":["How does a search engine work?","Crawl or ingest and build an inverted index","Query parsing and posting list intersection","Ranking; sharding with scatter-gather"]},"file storage google drive dropbox":{"e":["Files are split into chunks, each hashed. Chunks go to object storage; a metadata database records files, versions, chunk lists, folders and permissions. Clients upload only changed chunks (delta sync), and identical chunks are deduplicated. A notification channel tells other devices to pull changes. Conflicting edits create separate versions."],"t":"Sync files across devices efficiently and safely.","p":"Re-uploading the whole file after a small change.","k":"Chunk, hash, upload only changed chunks; metadata in a database.","q":["Why split files into chunks?","To upload only the parts that changed and deduplicate identical parts","To make files larger","To avoid storage","To slow sync","Chunking enables delta sync and dedup."],"i":["Editing one slide of a 500 MB deck uploads 500 MB each time","The client syncs whole files.","Sync by content-hashed chunks so only changed chunks upload","Ask users to make smaller files => Not a fix","Increase upload bandwidth => Still wasteful","Chunk-level sync makes change cost proportional to change size."],"a":["Design Dropbox.","Chunking with content hashes","Metadata database and object storage","Delta sync, dedup, notifications, conflicts"]},"ticket booking bookmyshow":{"e":["Browsing shows and seat maps is read-heavy and cached. Selecting seats places a hold with a short expiry, done atomically so only one user wins. Payment confirms the booking; expiry releases the seats. Popular releases need a virtual waiting room and rate limiting to protect the booking path. Strong consistency applies to seat state."],"t":"Sell each seat exactly once under heavy contention.","p":"Using eventual consistency or cached state for seat availability at booking time.","k":"Atomic hold with expiry, confirm on payment, waiting room for spikes.","q":["Two users click the same seat at the same instant. What decides the winner?","An atomic conditional update of the seat's status","Whoever has the faster phone","The CDN","Both get it","Only one update succeeds."],"i":["Site crashes when booking opens for a big film","Two million users hit the booking service at once.","Put a virtual waiting room and rate limit in front of booking","Add servers at the last minute => Database still overwhelmed","Open booking at night => Same spike","Admission control protects the contended path."],"a":["Design a ticket booking system.","Cached browsing, consistent seat state","Atomic hold, payment, release","Queueing and rate limiting for spikes"]},"social media platform x":{"e":["Posting writes the post, then fans out to followers' timelines with a hybrid of push and pull. Reads fetch the precomputed timeline from cache and hydrate posts. The follow graph is stored for both directions. Search and trending topics come from a stream-processing pipeline over posts. Media goes through object storage and a CDN."],"t":"Short posts, a follow graph and timelines at huge read scale.","p":"Ignoring accounts with tens of millions of followers in the fan-out design.","k":"Hybrid fan-out timelines, graph store, streaming for trends.","q":["How are trending topics typically computed?","Stream processing counts terms over sliding time windows","A nightly SQL query","Manual curation only","From the CDN","Trends are windowed counts over a live stream."],"i":["Timeline service lags by 30 minutes after a celebrity posts","Fan-out workers push to 80 million follower timelines.","Pull celebrity posts at read time and merge them","Add workers => Still tens of millions of writes","Delay celebrity posts => Unacceptable","Hybrid fan-out caps write amplification."],"a":["Design X.","Post write and hybrid fan-out","Timeline cache and follow graph","Search, trends by stream processing, media via CDN"]},"recommendation system":{"e":["Two stages. Candidate generation narrows millions of items to hundreds using collaborative filtering (people like you liked this), content similarity or embedding nearest-neighbour search. Ranking scores those candidates with a model using user, item and context features. Features come from a feature store; heavy work is precomputed offline, with real-time signals added online."],"t":"Suggest items a user is likely to want.","p":"Trying to score every item for every request with a heavy model.","k":"Generate candidates cheaply, then rank a few hundred carefully.","q":["Why split into candidate generation and ranking?","A heavy model cannot score millions of items per request","To use two teams","To store more data","It is slower","Cheap narrowing makes precise ranking affordable."],"i":["New users see empty or random recommendations","The system relies only on past behaviour.","Fall back to popular and content-based suggestions for cold start","Wait until they have history => They leave first","Show nothing => Lost engagement","Cold start needs a non-behavioural fallback."],"a":["Design a recommendation system.","Candidate generation then ranking","Offline training and feature store","Cold start and real-time signals"]},"distributed cache redis":{"e":["Keys are partitioned across nodes with consistent hashing or hash slots. Each node keeps data in a hash table with an eviction policy (LRU or LFU) and TTLs. Replicas provide availability, with failover by a coordinator or gossip. Clients route by key. Optional persistence uses snapshots or an append-only log."],"t":"An in-memory key-value store spread across nodes.","p":"Using modulo hashing, or having no plan for hot keys and node failure.","k":"Partition with consistent hashing, evict by LRU, replicate for failover.","q":["What two data structures implement an LRU cache node?","A hash map and a doubly linked list","Two arrays","A stack and a queue","A tree only","Constant-time lookup and reordering."],"i":["One node failure caused a third of requests to hit the database","That partition had no replica.","Add replicas with automatic failover per partition","Enlarge the surviving nodes => Lost partition is still cold","Disable the cache => Full database load","Cache partitions need replicas to fail safely."],"a":["Design a distributed cache.","Partitioning with consistent hashing","Eviction and TTL per node","Replication, failover and client routing"]},"logging monitoring platform":{"e":["Agents on hosts ship logs and metrics to a buffer such as Kafka, which absorbs bursts. Processors parse and enrich. Logs go to a search index, metrics to a time-series database with downsampling, traces to a trace store. Hot data stays fast, older data moves to cheap storage. Dashboards and alerting sit on top."],"t":"Collect, store and query telemetry from every service.","p":"Writing straight from services into the search cluster, so a log burst takes it down.","k":"Agents, buffer, process, tiered storage, query and alert.","q":["Why put a durable queue between collectors and storage?","To absorb bursts and decouple ingestion from indexing","To slow logs down","To encrypt them","To delete them","Buffering protects storage from spikes."],"i":["Log platform collapses during a major outage, exactly when it is needed","Error logs increased 50 times and overwhelmed the indexers.","Buffer through a queue and apply sampling or rate limits","Add indexers only => Still overrun by spikes","Turn logging off during incidents => Blind","Telemetry pipelines must handle the worst day."],"a":["Design a logging and monitoring system.","Collection agents and buffering","Storage by type with tiering","Query, dashboards and alerting"]},"web crawler":{"e":["A URL frontier holds queued URLs with priority and per-host politeness delays. Fetchers resolve DNS, obey robots.txt and download pages. Parsers extract links, which are normalised and checked against a seen set (a Bloom filter helps) before being enqueued. Content hashes detect duplicates. The frontier is partitioned by host across workers."],"t":"Download the web politely, without loops or duplicates.","p":"Ignoring politeness and robots.txt, or having no deduplication so the crawler loops forever.","k":"Frontier, polite fetch, parse, dedupe URLs and content.","q":["What is a Bloom filter used for in a crawler?","A memory-efficient check of whether a URL was already seen","Ranking pages","Rendering JavaScript","Storing pages","It tests set membership compactly, with rare false positives."],"i":["Crawler got the company's IP banned by several sites","It sent hundreds of requests a second to single hosts.","Enforce per-host rate limits and obey robots.txt","Rotate IPs to evade bans => Abusive","Crawl faster before bans => Worse","Politeness is a core crawler requirement."],"a":["Design a web crawler.","URL frontier with priorities and politeness","Fetch, parse, extract links","Dedup with seen set and content hashes; distributed workers"]},"video conferencing system":{"e":["A signalling server sets up sessions; media flows over UDP using WebRTC. For groups, a Selective Forwarding Unit receives each participant's stream and forwards it to others without decoding, far cheaper than mixing. Senders publish several quality layers (simulcast) and the SFU picks one per receiver. STUN and TURN handle NAT traversal."],"t":"Real-time audio and video among many participants.","p":"Using a full mesh for large calls, or routing media through servers over TCP.","k":"Signalling to set up, UDP media through an SFU, simulcast for mixed networks.","q":["Why does a 20-person call use an SFU instead of peer-to-peer mesh?","Mesh needs each client to upload 19 streams","SFUs are free","Mesh is illegal","SFUs remove audio","Upload cost grows with participants in a mesh."],"i":["Calls with more than six people become unusable","Every participant sends video directly to every other participant.","Route media through a Selective Forwarding Unit","Ask users for better internet => Not scalable","Lower everyone's resolution => Still N-squared","Topology decides how group calls scale."],"a":["Design a video conferencing system.","Signalling plus WebRTC media over UDP","SFU forwarding with simulcast","NAT traversal with STUN and TURN"]},"programming languages":{"e":["For backend services, the common choices are Go (simple concurrency, small binaries), Java (mature ecosystem, strong tooling) and Python (fast development, data and ML). Design interviews rarely depend on language; what matters is knowing how your choice handles concurrency, memory and I/O."],"t":"Pick a language by workload, ecosystem and team.","p":"Arguing that one language is best for everything.","k":"The team and the workload pick the language.","q":["Which factor matters most when choosing a service's language?","The workload's needs and the team's expertise","Popularity on social media","Shortest keyword","Logo colour","Fit and maintainability decide."],"i":["A rewrite in a new language doubled the bug rate","Nobody on the team had production experience with it.","Choose languages the team can operate and debug well","Rewrite again in another language => More churn","Hire one expert => Single point of failure","Operational familiarity outweighs raw speed."],"a":["How do you choose a programming language for a service?","Workload: CPU, I/O, latency","Ecosystem and libraries","Team skill and operability"]},"go":{"e":["Goroutines are lightweight threads scheduled by the runtime, so a service can run hundreds of thousands. Channels pass data between them. Go compiles to a single static binary with fast startup and a low-pause garbage collector, which suits containers, proxies and infrastructure tools such as Docker and Kubernetes."],"t":"A compiled language built for networked, concurrent services.","p":"Starting goroutines that never finish, leaking memory.","k":"Cheap goroutines, simple deploys; make every goroutine able to stop.","q":["Why can a Go server handle so many concurrent connections?","Goroutines are far cheaper than OS threads","It has no garbage collector","It runs in the browser","It avoids the network","Small stacks and runtime scheduling."],"i":["Memory grows until the service is killed","Each request starts a goroutine that waits forever on a channel nobody writes to.","Use contexts with cancellation and timeouts so goroutines exit","Add memory => Leak continues","Restart every hour => Hides it","Every goroutine needs a way to end."],"a":["Why is Go popular for backend infrastructure?","Lightweight concurrency","Single static binary and fast startup","Simple language and good networking library"]},"java":{"e":["Java runs on the JVM, which compiles hot code at runtime and manages memory with tunable garbage collectors. It has strong typing, excellent tooling and frameworks such as Spring. Virtual threads now make high-concurrency code simple. Trade-offs are memory footprint, startup time and GC tuning. Much big-data software, including Kafka and Cassandra, runs on the JVM."],"t":"A mature, JIT-compiled language with a vast ecosystem.","p":"Ignoring heap sizing and GC behaviour when discussing latency.","k":"Powerful and mature; watch the heap and the garbage collector.","q":["A common cause of latency spikes in JVM services?","Garbage collection pauses","Too many comments","Static typing","Long class names","Collections can pause application threads."],"i":["Service p99 latency spikes every few minutes","The heap is undersized and full collections run frequently.","Size the heap properly and choose a low-pause collector","Add CPU only => Pauses remain","Disable GC logging => Hides the evidence","JVM latency depends on memory configuration."],"a":["What should you know about Java for backend systems?","JVM with JIT and garbage collection","Rich ecosystem and tooling","Tune heap and GC; startup and memory costs"]},"python":{"e":["Python's readability and libraries make it ideal for APIs, scripts, data pipelines and machine learning. The global interpreter lock has traditionally limited CPU-bound threads to one core, so scale with multiple processes, async I/O for waiting-heavy work, or native extensions. It suits I/O-bound services well."],"t":"Fast to write, slower to run; strong in data and automation.","p":"Expecting threads to speed up CPU-bound Python code.","k":"Great for I/O and data; use processes or native code for CPU work.","q":["A CPU-heavy Python task is not faster with 8 threads. Why?","The global interpreter lock lets one thread run Python bytecode at a time","Threads are disabled","Python has no threads","The CPU is broken","Use processes or native libraries instead."],"i":["Image processing API uses one core on a 16-core server","Work runs in threads inside one Python process.","Run multiple worker processes or move the work to a native library","Add more threads => Still one core","Buy 32 cores => Still one used","CPU-bound Python scales with processes."],"a":["Where does Python fit in backend systems?","Rapid development and rich libraries","Good for I/O-bound services and data work","CPU-bound work needs processes or native code"]},"mongodb":{"e":["Data is stored as BSON documents in collections, with secondary indexes and an aggregation pipeline. Replica sets provide failover; sharding distributes collections by a shard key. Multi-document transactions exist but single-document atomicity is the norm, so model data to be read and written together."],"t":"A document database with flexible schema and rich queries.","p":"Choosing a poor shard key, or treating it like a relational database with many joins.","k":"Documents shaped for your queries; pick the shard key carefully.","q":["What provides high availability in MongoDB?","Replica sets with automatic primary election","A single large node","Sharding alone","Caching","Secondaries take over when the primary fails."],"i":["Queries across a sharded collection are slow","Most queries do not include the shard key, so they hit every shard.","Choose a shard key that matches the dominant query pattern","Add shards => More shards to scatter to","Add RAM => Still scatter-gather","Queries without the shard key are broadcast."],"a":["What should you know about MongoDB?","Document model with indexes and aggregation","Replica sets and sharding","Model for access patterns; shard key matters"]},"cassandra":{"e":["Every node is equal; data is partitioned by consistent hashing and replicated to several nodes, often across datacentres. Writes go to a commit log and memtable, then to SSTables (LSM tree), so they are very fast. Consistency is tunable per query through quorum levels. Tables are designed per query; there are no joins."],"t":"A leaderless wide-column store built for writes and uptime.","p":"Modelling like SQL, or creating unbounded partitions.","k":"No leader, fast writes, tunable consistency, one table per query.","q":["What does \"tunable consistency\" mean in Cassandra?","Each query chooses how many replicas must respond","Admins tune CPU","Data is sometimes deleted","It has no replicas","Trade consistency against latency per operation."],"i":["Reads time out on certain partitions","A partition keyed only by device ID has grown to tens of gigabytes.","Add a time bucket to the partition key to bound partition size","Increase the read timeout => Still slow","Add nodes => Partition stays on the same replicas","Partitions must be bounded."],"a":["When would you pick Cassandra?","Write-heavy, large-scale, multi-region","Leaderless with tunable consistency","Query-first modelling with bounded partitions"]},"api testing":{"e":["Test happy paths, validation errors, authentication and authorization, edge cases, idempotency and performance. Layers: unit tests for handlers, integration tests against real dependencies, contract tests between services, and load tests. Automate them in CI so regressions are caught before release."],"t":"Verifying that endpoints behave as their contract says.","p":"Testing only the happy path through the UI.","k":"Test the contract: success, failure, auth, edge cases.","q":["Which test catches a provider changing a response field that a consumer depends on?","A contract test","A unit test of the consumer UI","A load test","A spelling check","It verifies the agreed interface between services."],"i":["A field rename in one service broke three others in production","There were no tests on the interfaces between services.","Add consumer-driven contract tests in CI","Test manually before each release => Slow and missed","Freeze all APIs => No progress","Contracts between services need automated checks."],"a":["How do you test an API?","Functional, negative and auth cases","Contract and integration tests","Load tests; automate in CI"]},"postman":{"e":["You build requests, organise them into collections, parameterise them with environments (dev, staging, production), and write assertions on responses. Collections run in CI through a command-line runner. It is useful for exploration, sharing examples and smoke tests."],"t":"A graphical tool for sending API requests and automating checks.","p":"Keeping real secrets inside shared collections.","k":"Collections plus environments plus assertions.","q":["What are Postman environments for?","Switching variables such as base URL and tokens between dev, staging and production","Storing videos","Compiling code","Managing servers","The same collection runs against different targets."],"i":["A production API key leaked through a shared workspace","The key was hard-coded in a collection shared with contractors.","Use environment variables kept out of shared collections, and rotate the key","Delete the collection only => Key already exposed","Make the key longer => Still shared","Secrets must not travel with shared artefacts."],"a":["How do you use Postman effectively?","Organise requests into collections","Environments for variables","Assertions and CI runs; keep secrets out"]},"curl":{"e":["curl sends a request and prints the response. Useful flags: -X for method, -H for headers, -d for body, -i or -v to show headers and the full exchange, -L to follow redirects, -w for timing. It is on nearly every server, which makes it the fastest way to check an endpoint from where the problem is."],"t":"The command-line tool for making HTTP requests.","p":"Testing only from your laptop when the failure is between two servers.","k":"curl -v from the machine that is failing.","q":["Which flag shows request and response headers and the TLS handshake?","-v","-d","-o","-s","Verbose mode shows the full exchange."],"i":["Service B cannot reach service A, but A works from a laptop","Nobody has tested from B's own network position.","Run curl -v from B's host to see DNS, connect and TLS steps","Restart both services => No information gained","Change random settings => Guesswork","Test from where the failure occurs."],"a":["How do you use curl to debug an API?","Send exact method, headers and body","Verbose output for DNS, TLS and headers","Run from the failing host"]},"excalidraw":{"e":["Excalidraw makes boxes, arrows and labels fast, with a sketchy look that signals \"draft, please challenge this\". It supports real-time collaboration and reusable libraries. It is well suited to interviews and early design discussions where speed matters more than polish."],"t":"A quick, hand-drawn-style whiteboard for diagrams.","p":"Spending interview time making the diagram pretty.","k":"Fast boxes and arrows; speed over polish.","q":["Why is a sketch-style tool useful early in design?","It is quick and invites feedback before details harden","It generates code","It deploys servers","It stores data","Low-fidelity encourages discussion."],"i":["Design review debates box alignment for ten minutes","The diagram is a polished artwork that took days.","Use quick sketches for early discussion and refine later","Polish it further => More wasted time","Skip diagrams => No shared picture","Fidelity should match the stage of the design."],"a":["What tool do you use to sketch a design quickly?","Whiteboard-style, fast shapes","Collaborative","Good for interviews and early drafts"]},"draw io":{"e":["Draw.io (diagrams.net) offers cloud provider icons, UML and network shapes, layers and precise layout. Diagrams save as XML files that can live in a repository or wiki and export to PNG, SVG or PDF. It suits formal architecture documentation that will be maintained."],"t":"A free diagram editor with rich shape libraries.","p":"Leaving the only copy of a diagram as an exported image nobody can edit.","k":"Keep the editable source next to the docs.","q":["Why store the Draw.io source file in the repository?","So the diagram can be updated and versioned with the system","To make the repo bigger","To hide it","It is required by Git","Editable sources stay current."],"i":["Architecture diagram on the wiki is three years out of date","Only a PNG exists and the original file is lost.","Keep editable diagram sources under version control","Redraw it from memory once => Drifts again","Delete it => No documentation","Diagrams need a maintainable source."],"a":["When would you use Draw.io?","Formal diagrams with standard icons","Editable, exportable files","Version alongside documentation"]},"mermaid":{"e":["Mermaid uses a simple syntax to describe flowcharts, sequence diagrams, state diagrams, entity-relationship diagrams and more. Because it is text, it lives in Markdown, diffs cleanly in code review and is rendered by many platforms. Layout is automatic, so fine control is limited."],"t":"Diagrams written as text and rendered automatically.","p":"Choosing it for a diagram that needs precise manual layout.","k":"Diagrams as code: reviewable, versioned, auto-laid-out.","q":["Main advantage of diagrams as text?","They can be versioned and reviewed like code","They look hand-drawn","They need no syntax","They are 3D","Diffs show what changed."],"i":["Sequence diagrams in docs never match the code","They are images updated separately, by hand.","Write them in Mermaid in the same repository and review them with code changes","Remove the diagrams => Less understanding","Assign one person to redraw => Bottleneck","Docs kept beside code change with it."],"a":["Why write diagrams as code?","Text source in the repository","Diffable and reviewable","Automatic rendering; limited layout control"]},"design small systems first":{"e":["Start with single-purpose systems: a URL shortener, a rate limiter, a key-value store, a paste service. Each teaches a few core ideas (hashing, caching, storage, limits) completely. Then combine them in larger designs. Practise the same routine every time and review against a reference solution."],"t":"Build skill on simple designs before complex ones.","p":"Starting with \"design YouTube\" and memorising an answer without understanding the parts.","k":"Master small building blocks; large systems are combinations.","q":["Best first practice problem?","A URL shortener","A global video platform","A stock exchange","A search engine","It covers core ideas at manageable scope."],"i":["Learner can recite a WhatsApp design but cannot explain why a queue is there","They memorised large designs without practising fundamentals.","Go back to small systems and justify every component","Memorise more designs => Same weakness","Watch more videos => Passive","Understanding grows from small, complete designs."],"a":["How should a beginner practise system design?","Start with small, focused systems","Repeat a consistent process","Compare with references and explain every choice"]},"design a real time analytics system":{"e":["Events flow from clients into a durable log such as Kafka. A stream processor aggregates them in windows by event time and writes results to an OLAP store (ClickHouse, Druid, Pinot) built for fast aggregations. Dashboards query that store. Late data, deduplication and pre-aggregation (rollups) are the main design concerns, plus a batch path for corrections."],"t":"Turn a stream of events into fresh dashboards.","p":"Running analytical queries on the transactional database.","k":"Log, stream aggregation, OLAP store, dashboard.","q":["Why not run dashboard aggregations on the main transactional database?","Heavy scans compete with and slow live transactions","It is too accurate","It has no data","Dashboards dislike SQL","Analytical and transactional loads need different stores."],"i":["Checkout slows every time someone opens the sales dashboard","The dashboard runs full-table aggregations on the orders database.","Stream events to an analytics store and query that","Add an index => Aggregations still scan","Hide the dashboard => Business blind","Separate analytical from transactional workloads."],"a":["Design a real-time analytics pipeline.","Event ingestion into a log","Windowed stream aggregation","OLAP store with rollups; handle late and duplicate events"]},"architectural thinking":{"e":["An architect starts from goals and constraints, identifies the few decisions that are costly to reverse, weighs options against quality attributes and makes the trade-offs explicit. They think about how the system fails, evolves and is operated, and about how team structure shapes it. Simplicity is a deliberate goal."],"t":"Seeing the system as a whole, driven by its qualities.","p":"Starting from technologies rather than from requirements and constraints.","k":"Start from goals, find the irreversible decisions, make trade-offs explicit.","q":["What distinguishes architectural thinking from implementation thinking?","Focus on system-wide qualities and hard-to-reverse decisions","Faster typing","Knowing more frameworks","Writing longer functions","Scope and consequence."],"i":["Project chose its database in week one and is now stuck with it","The decision was made before access patterns were known.","Defer irreversible decisions until requirements are understood","Switch databases every quarter => Churn","Never decide => No progress","Hard-to-reverse choices deserve the most analysis."],"a":["What does it mean to think like an architect?","Requirements and constraints first","Identify key, costly decisions","Trade-offs, failure modes and evolution"]},"breaking down complex problems":{"e":["Split by user journey (write path, read path), by component (ingest, store, serve) or by concern (data model, scaling, failure). Solve the simple version first, then add one complication at a time. Define the interfaces between parts so each can be designed alone."],"t":"Divide a large system into parts you can reason about.","p":"Trying to design everything at once and getting lost.","k":"Simple version first; add one complication at a time.","q":["A good first cut for most systems is to separate:","The write path from the read path","Fonts from colours","Monday from Friday","Managers from engineers","They have different loads and designs."],"i":["Whiteboard is a tangle after 15 minutes and the candidate is stuck","Every feature and scale concern was tackled simultaneously.","Reset: design the basic flow for one user, then scale it step by step","Add more detail => More tangle","Start a new unrelated design => Same pattern","Incremental decomposition keeps a design tractable."],"a":["How do you tackle a problem that feels too big?","Decompose by flow or component","Solve the simple case first","Add scale and failure handling incrementally"]},"choosing the right components":{"e":["For each need, name the property required and pick the component that provides it: relational database for transactions, key-value store for simple fast lookups, cache for repeated reads, queue for decoupling, search index for text, object storage for blobs, CDN for static delivery. Prefer boring, well-understood technology and as few pieces as possible."],"t":"Selecting each building block from the requirement it serves.","p":"Adding components because they are popular, without a requirement.","k":"Requirement first, property second, product last.","q":["You need full-text search over product descriptions. Right component?","A search index","A message queue","A cache","A load balancer","It provides inverted-index search."],"i":["System has 14 different datastores for a mid-sized product","Each team added its favourite.","Consolidate onto the few stores the requirements justify","Add a fifteenth for the new feature => More to operate","Hire more operators => Cost of sprawl","Every component is a permanent operational cost."],"a":["How do you pick components for a design?","Map each requirement to a needed property","Choose the simplest component that provides it","Minimise the number of technologies"]},"cost optimization":{"e":["Know where the money goes: compute, storage, data transfer and managed services. Levers: right-size and autoscale, turn off idle resources, use reserved and spot capacity, tier storage by age, cache and compress to cut compute and egress, and remove unused data. Measure cost per request or per user so it scales with the business."],"t":"Meeting requirements for the least money.","p":"Designing with unlimited budget in mind, or ignoring data transfer charges.","k":"Measure cost per unit; right-size, tier, cache, switch off.","q":["Which is often an overlooked major cloud cost?","Data transfer out and between zones","Keyboard wear","Font licences","DNS names","Egress adds up quickly for data-heavy systems."],"i":["Cloud spend grows faster than users","Nobody tracks cost per service; instances are sized for a peak that happens once a year.","Add cost visibility per service, right-size and autoscale","Cut every budget by 20% blindly => Breaks things at random","Ignore until funding runs out => Too late","Cost needs the same measurement as performance."],"a":["How do you keep a system's cost under control?","Visibility: cost per service and per unit","Right-size, autoscale, reserved and spot","Storage tiering, caching and egress reduction"]},"architecture reviews":{"e":["Reviewers check that requirements are stated, the design meets them, risks and failure modes are covered, and trade-offs are justified. Useful questions: what happens when each component fails, where is the bottleneck at ten times the load, how is it deployed, monitored and rolled back, what does it cost. Studying published architectures builds the same judgement."],"t":"Structured critique of a design before and after it is built.","p":"Reviews that only check the diagram looks tidy.","k":"Ask what fails, what limits, what it costs, how it rolls back.","q":["Most valuable question in an architecture review?","What happens when this component fails?","Which font is this?","Who drew it?","Is it colourful?","Failure analysis exposes hidden risk."],"i":["A launch failed on a dependency nobody had examined","The review approved the design after a 10-minute walkthrough of the happy path.","Use a checklist covering failure modes, scale, security and operations","Hold longer meetings without structure => Same gaps","Skip reviews => More surprises","Structured reviews find risk early."],"a":["What do you look for when reviewing an architecture?","Requirements and fit","Failure modes and bottlenecks","Operations, security and cost"]},"system design interviews":{"e":["Typical flow: clarify requirements (5 minutes), estimate scale (5), define APIs and data model (5 to 10), draw the high-level design (10), deep-dive into the hard parts (10 to 15), then cover bottlenecks and trade-offs. Think aloud, state assumptions, justify each choice and respond to hints. The interviewer assesses reasoning and communication, not a memorised answer."],"t":"A 45-minute conversation where you drive a design.","p":"Silently drawing a memorised architecture without requirements or trade-offs.","k":"Clarify, estimate, design, deep-dive, trade-offs; think aloud.","q":["What are interviewers mainly assessing?","Structured reasoning, trade-offs and communication","Memorised diagrams","Typing speed","Knowledge of brand names","They want to see how you think."],"i":["Candidate drew a perfect diagram but was rejected","They never asked a question or explained a single choice.","Lead with requirements and explain trade-offs aloud","Draw faster next time => Same feedback","Add more boxes => Still no reasoning","The conversation is the assessment."],"a":["How do you structure a system design interview?","Requirements and estimates first","High-level design, then deep dives","Explain trade-offs and handle follow-ups"]},"real world production experience":{"e":["Production shows you failure modes diagrams hide: slow dependencies, bad deploys, hot keys, full disks, expired certificates, traffic spikes. Being on call, writing postmortems, running migrations and watching dashboards build the instinct for what breaks. Side projects with real users and load tests offer some of the same lessons."],"t":"What only running real systems teaches.","p":"Believing a design is sound because it looks right on a whiteboard.","k":"Systems are understood by running them and fixing them.","q":["Which activity builds production judgement fastest?","Being on call and writing postmortems","Reading diagrams only","Memorising acronyms","Avoiding deployments","Incidents reveal real behaviour."],"i":["A well-reviewed design failed in its first week of traffic","It had never been load tested or run with failures injected.","Load test, add observability and practise failure before launch","Review the diagram again => Paper cannot reveal it","Blame the traffic => Recurs","Only running systems expose real limits."],"a":["How do you get practical system design experience?","Operate real services and be on call","Postmortems and migrations","Build, load test and break your own projects"]},"continuous learning":{"e":["Read engineering blogs and postmortems from large companies, study classic papers (Dynamo, Bigtable, MapReduce, Raft, Spanner), read \"Designing Data-Intensive Applications\", and rebuild small versions of systems you study. Principles change slowly while tools change quickly, so invest most in fundamentals."],"t":"Keeping skills current as systems and tools change.","p":"Chasing every new tool while fundamentals stay weak.","k":"Fundamentals compound; tools come and go.","q":["Which investment keeps its value longest?","Understanding fundamentals such as consistency, replication and queuing","Memorising one product's flags","Following every new framework","Collecting certificates","Principles transfer across tools."],"i":["Engineer knows five trendy databases but cannot explain replication lag","Learning has been tool-first.","Study the underlying concepts and map tools onto them","Learn a sixth database => Same gap","Stop learning => Falls behind","Concepts make new tools easy to learn."],"a":["How do you keep growing as a system designer?","Papers, books and engineering blogs","Postmortems and real architectures","Build small versions; focus on fundamentals"]}}</script>

  keys.forEach(k=>{const x=(a.pips||{})[k]||{},y=(b.pips||{})[k]||{};o.pips[k]={};['e','i','t'].forEach(p=>{const v=Math.max(x[p]||0,y[p]||0); if(v) o.pips[k][p]=v;});});
  const rk=new Set([...Object.keys(a.rev||{}),...Object.keys(b.rev||{})]);
  rk.forEach(k=>{const x=(a.rev||{})[k],y=(b.rev||{})[k]; o.rev[k]=!x?y:!y?x:(x.at>=y.at?x:y);});
  o.notes=Object.assign({},b.notes,a.notes);
  o.arcade=Object.assign({},b.arcade); for(const g in (a.arcade||{})) o.arcade[g]=Math.max(o.arcade[g]||0,a.arcade[g]);
  const newer=(a.updated||0)>=(b.updated||0)?a:b; o.last=newer.last||a.last||b.last;
  o.updated=Math.max(a.updated||0,b.updated||0);
  return o;
}

let DB=null, UID=null, writing=false, dirty=false, wTimer=null;
function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  dirty=true; clearTimeout(wTimer); wTimer=setTimeout(flush,1500);
}
async function flush(){
  if(!DB||!UID||writing||!dirty) return;
  writing=true; dirty=false;
  try{ await DB.doc('data/users/'+UID+'/progress').set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if(e&&e.code==='unavailable'){dirty=true;} else {DB=null;} }
  writing=false; if(dirty) wTimer=setTimeout(flush,1500);
}

const today=()=>new Date().toLocaleDateString('en-CA');
const DAY=86400000, INTERVALS=[1,3,7,16,35,80];
function pipsOf(k){return S.pips[k]||{};}
function pipCount(k){const p=pipsOf(k);return (p.e?1:0)+(p.i?1:0)+(p.t?1:0);}
function touchDay(){const d=today(); if(!S.days.includes(d)) S.days.push(d); S.daily[d]=(S.daily[d]||0)+1;}
function award(key,pip,xp,label){
  const p=S.pips[key]=S.pips[key]||{}; const fresh=!p[pip];
  if(fresh){p[pip]=Date.now(); if(!S.rev[key]) S.rev[key]={n:0,at:Date.now()};}
  const gain=fresh?xp:5; S.xp+=gain; touchDay(); save();
  toast('+'+gain+' XP · '+label);
}
function addXP(n,label){S.xp+=n; touchDay(); save(); toast('+'+n+' XP · '+label);}
function streak(){
  const set=new Set(S.days); let d=new Date(); let n=0;
  if(!set.has(d.toLocaleDateString('en-CA'))) d=new Date(Date.now()-DAY);
  while(set.has(d.toLocaleDateString('en-CA'))){n++; d=new Date(d.getTime()-DAY);}
  return n;
}
const RANKS=[[0,'Commuter'],[200,'Regular'],[600,'Line Inspector'],[1500,'Station Master'],[3500,'Network Planner'],[7000,'Chief Architect']];
function rank(){let i=0; RANKS.forEach((r,j)=>{if(S.xp>=r[0]) i=j;}); const nx=RANKS[i+1]; return {name:RANKS[i][1],next:nx?nx[1]:null,pct:nx?Math.round((S.xp-RANKS[i][0])/(nx[0]-RANKS[i][0])*100):100,need:nx?nx[0]-S.xp:0};}
function mastered(){return ALLKEYS.filter(k=>pipCount(k)===3).length;}
function touched(){return ALLKEYS.filter(k=>pipCount(k)>0).length;}
function secProgress(s){const ks=[...new Set(s.stops.map(t=>t.key))]; let got=0; ks.forEach(k=>got+=pipCount(k)); return ks.length?got/(ks.length*3):0;}

async function askJSON(prompt,opts){
  if(!SAMPLE) throw {code:'not_granted'};
  const full='Reply with ONLY one JSON object. No prose before or after, no code fences.\n\n'+prompt;
  const o=Object.assign({modelTier:'default'},opts||{});
  if(typeof SAMPLE.json==='function'){
    try{ const v=await SAMPLE.json(full,o); if(v&&typeof v==='object') return v; }
    catch(e){ if(e&&e.code&&e.code!=='parse_error') throw e; }
  }
  const r=await SAMPLE(full,o); const txt=(r&&r.text)||'';
  const a=txt.indexOf('{'), b=txt.lastIndexOf('}');
  if(a<0||b<a) throw {code:'bad_output',message:'Claude replied in an unexpected format.'};
  return JSON.parse(txt.slice(a,b+1));
}
function errText(e){
  const c=e&&e.code;
  if(c==='not_granted') return 'This mode needs your Anthropic API key. Add it in <a href="#profile" style="color:inherit">Profile</a>.';
  if(c==='bad_key') return 'Anthropic rejected the API key. Check it in <a href="#profile" style="color:inherit">Profile</a>.';
  if(c==='offline') return 'No internet connection. This mode needs to reach Claude; the Arcade and reviews work offline.';
  if(c==='rate_limited'||c==='resource_exhausted') return 'Claude is busy right now. Wait a minute, then try again.';
  return 'That run did not come through ('+esc((e&&e.message)||c||'unknown error')+'). Try again.';
}

async function rideFetch(t){

async function pagerStart(t){
  const st=UI.pager[t.key]; st.loading=true; st.err=null; panePager(t);
  const prompt=`Run a production incident simulation that teaches ${ctxOf(t)}. The learner is the on-call engineer.
Invent a fictional company (an Indian consumer app context is welcome) and a realistic incident where understanding "${t.name}" is the key to resolving it. Never name the concept in the alert or context.
JSON shape: {"company":"fictional name","service":"service name","alert":"pager text, max 20 words","context":"what is happening and what you can see, max 55 words","metrics":[{"name":"","value":"","state":"bad|warn|ok"}] (3 or 4),"choices":["","",""]}

  try{const d=await askJSON(prompt); st.company=d.company; st.service=d.service; st.rounds=[{alert:d.alert,context:d.context,metrics:d.metrics,choices:d.choices}];}
  catch(e){st.err=errText(e);}

async function pagerChoose(t,ci){
  const st=UI.pager[t.key]; const R=st.rounds; const r=R[R.length-1]; r.chosen=ci; st.loading=true; st.err=null; panePager(t);
  const n=R.length;
  const hist=R.map((x,i)=>({round:i+1,alert:x.alert,context:x.context,choices:x.choices,chosen:x.choices[x.chosen],result:x.res?x.res.outcome:undefined}));
  const prompt=`Incident simulation teaching ${ctxOf(t)}. Company: ${st.company}. This is round ${n} of at most 3.
History so far: ${JSON.stringify(hist)}
The learner just chose: "${r.choices[ci]}".
Judge that choice honestly, as a senior SRE would, then continue the story.
JSON shape: {"quality":"strong|partial|wrong","outcome":"what happens because of the choice, max 45 words","lesson":"the underlying principle, max 30 words",
 "next": ${n>=3?'null':'null if the incident is fully resolved, otherwise {"alert":"","context":"","metrics":[{"name":"","value":"","state":"bad|warn|ok"}],"choices":["","",""]} with the same rules as before (one strong, one tempting but wrong, one partial, random order)'},
 "debrief": null unless next is null; then {"survived":true or false,"summary":"how the night went, max 50 words","better_move":"the ideal sequence of moves, max 35 words"}}`;
  try{
    const d=await askJSON(prompt);
    r.res={quality:['strong','partial','wrong'].includes(d.quality)?d.quality:'partial',outcome:d.outcome,lesson:d.lesson};
    if(d.next&&n<3){R.push({alert:d.next.alert,context:d.next.context,metrics:d.next.metrics,choices:d.next.choices});}
    else{
      st.debrief=d.debrief||{survived:r.res.quality==='strong',summary:d.outcome,better_move:d.lesson};
      if(st.debrief.survived) award(t.key,'i',40,'Incident resolved'); else addXP(10,'Postmortem filed');
    }
  }catch(e){r.chosen=null; st.err=errText(e);}
  st.loading=false; if(currentStop(t)) panePager(t);
}

      <div class="cols"><div><b>You nailed</b><ul>${(g.nailed||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Nothing yet</li>'}</ul></div><div><b>Missing</b><ul>${(g.missing||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>Nothing major</li>'}</ul></div></div>
      <details><summary>A crisp model answer</summary><p>${esc(g.model_answer)}</p></details>

async function teachAsk(t){
  const st=UI.teach[t.key]; st.loading=true; st.err=null; paneTeach(t);

Ask ONE question that forces a real explanation: a "why", "what happens when" or "how would you choose" question, the kind an interviewer would ask. Casual, friendly tone.
JSON shape: {"question":"max 35 words"}`;
  try{const d=await askJSON(prompt,{modelTier:'quick'}); st.q=d.question;}catch(e){st.err=errText(e);}

async function teachGrade(t){
  const st=UI.teach[t.key]; const a=(st.draft||'').trim();

  st.a=a; st.loading=true; st.err=null; paneTeach(t);
  const prompt=`Grade a learner's explanation of ${ctxOf(t)}, as a fair but demanding system design interviewer would.
Question (asked by Ravi, a junior engineer): "${st.q}"
Learner's answer: """${a.slice(0,3000)}"""

JSON shape: {"score":0,"reaction":"Ravi's honest reply in his voice; if something is missing, he asks about it. max 30 words","nailed":["up to 3 short items"],"missing":["up to 3 short items"],"model_answer":"a crisp answer in 3 sentences"}`;
  try{const g=await askJSON(prompt); g.score=Math.max(0,Math.min(3,Math.round(+g.score||0))); st.g=g;
