<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Metro</title>
<style>
@font-face{font-family:"Chakra Petch";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/chakra-petch-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/chakra-petch-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/chakra-petch-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2")}

/* ---------- app additions: sign-in and profile ---------- */
nav.dock[hidden]{display:none}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--rule);padding:11px 10px;font:inherit;background:var(--deep);color:var(--ink);border-radius:0}
input::placeholder{color:var(--dim)}
input:focus{outline:2px solid var(--signal);outline-offset:0}
.authHero{margin:8px 0 18px}
.authHero h1{font-size:clamp(40px,12vw,64px)}
.authHero h1 span{color:var(--signal)}
.authHero p{color:var(--muted);margin:8px 0 0;max-width:46ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:6px 0 12px}
.kv span:nth-child(odd){font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);align-self:center}
.ok{color:var(--good)} .danger{border-color:var(--bad)!important;color:var(--bad)!important}
/* Layout idea: an engineering blueprint. Cobalt drafting sheet with a fine grid, white linework,
   pastel line colours, safety-yellow for "act here". Square corners, technical type. Single theme by choice. */
:root{
  --paper:#16337F;      /* drafting sheet */
  --card:#1D3F95;       /* raised panel */
  --deep:#0B1C4A;       /* dark blocks: ticket, signage, pager, dock */
  --ink:#F3F6FF;        /* primary linework / text */
  --muted:#A8BAE8;
  --dim:#8FA3D6;
  --rule:rgba(220,230,255,.24);
  --signal:#FFD23F;     /* safety yellow */
  --good:#5BE3A1; --warn:#FFC94D; --bad:#FF7F70;
  --display:"Chakra Petch", "Arial Narrow", sans-serif;
  --body:"Manrope", "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  background-image:
    linear-gradient(rgba(220,230,255,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,230,255,.09) 1px,transparent 1px),
    linear-gradient(rgba(220,230,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,230,255,.035) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- title block ---------- */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 14px;margin-bottom:16px;border-bottom:1px solid var(--ink);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-5px;border-bottom:1px dashed var(--rule)}
.mast h1{font-size:clamp(34px,9.5vw,60px);font-weight:700;letter-spacing:.01em}
.mast h1 span{color:var(--signal)}
.mast .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.02em}

/* ---------- ticket = drawing title block ---------- */
.ticket{display:grid;grid-template-columns:repeat(4,1fr);background:var(--deep);border:1px solid var(--ink);border-radius:2px}
.ticket > div{padding:10px 12px;border-right:1px solid var(--rule)}
.ticket > div:last-child{border-right:0}
.ticket b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;margin-top:4px}
.ticket small{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ticket .rank{grid-column:1/-1;border-right:0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-family:var(--mono)}
.bar{height:6px;background:rgba(220,230,255,.15);overflow:hidden;flex:1;margin:0 10px}
.bar i{display:block;height:100%;background:var(--signal)}
@media (max-width:420px){.ticket b{font-size:23px}.ticket > div{padding:9px 8px}}

.continue{margin:14px 0 4px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--signal);color:var(--deep);border-radius:2px;padding:12px 14px}
.continue .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.continue .nm{font-family:var(--display);font-size:23px;font-weight:700;text-transform:uppercase}
.continue .go{white-space:nowrap;margin-left:auto;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase}

/* ---------- map trunk ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:18px 0 6px;color:var(--muted);font-family:var(--mono)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:4px;display:inline-block}
.trunk{list-style:none;margin:8px 0 0;padding:0}
.stn{position:relative;display:grid;grid-template-columns:64px 1fr;min-height:76px}
.stn::before{content:"";position:absolute;left:29px;top:0;bottom:0;width:6px;background:var(--c)}
.stn:first-child::before{top:30px}
.stn.term::before{bottom:auto;height:30px}
.stn .dot{position:relative;z-index:1;margin:14px 0 0 16px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--c);display:grid;place-items:center}
.stn .dot i{width:20px;height:20px;border-radius:50%;background:var(--card);display:block}
.stn a{display:block;text-decoration:none;color:inherit;padding:10px 0 14px;border-bottom:1px dashed var(--rule)}
.stn a:hover .nm{color:var(--signal)}
.stn .num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.stn .nm{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.stn .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.stn .meta span{white-space:nowrap}
.mini{flex:0 1 90px;min-width:30px;width:90px;height:4px;background:rgba(220,230,255,.15);overflow:hidden}
.mini i{display:block;height:100%;background:var(--c)}
.here{display:inline-block;background:var(--signal);color:var(--deep);font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;margin-left:8px;vertical-align:middle}
.zone{text-transform:uppercase;letter-spacing:.08em;padding:0 6px;border:1px solid var(--c);color:var(--c)}
.terminus{background:var(--deep);border:1px solid var(--signal);padding:14px 16px;margin-top:4px}
.terminus h3{font-size:22px;color:var(--signal)}
.terminus ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}

/* ---------- line view ---------- */
.back{background:none;border:0;padding:6px 0;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);text-decoration:none}
.back:hover{color:var(--ink)}
.lineHead{background:var(--deep);border:1px solid var(--c);border-left:10px solid var(--c);padding:16px;margin:6px 0 14px}
.lineHead .code{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--c)}
.lineHead h2{font-size:clamp(30px,8vw,46px);margin-top:4px}
.lineHead p{margin:6px 0 0;max-width:55ch;color:var(--muted)}
.lineHead .prog{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;font-family:var(--mono)}
.lineHead .prog .bar{margin:0}
.lineHead .prog .bar i{background:var(--c)}
.stops{list-style:none;margin:0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:44px 1fr}
.stop::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:4px;background:var(--c)}
.stop:first-child::before{top:22px}
.stop:last-child::before{bottom:auto;height:22px}
.stop.d2{grid-template-columns:44px 26px 1fr}
.stop.d2::after{content:"";position:absolute;left:23px;top:22px;width:30px;height:0;border-top:2px dashed var(--c)}
.stop.d2 .sd{grid-column:2}
.stop.d2 a{grid-column:3}
.stop.d3{grid-template-columns:44px 52px 1fr}
.stop.d3 .sd{grid-column:2;justify-self:end}
.stop.d3 a{grid-column:3}
.sd{position:relative;z-index:1;margin-top:13px;margin-left:12px;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.stop.d2 .sd,.stop.d3 .sd{margin-left:6px;width:14px;height:14px;margin-top:15px}
.stop a{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 4px 10px 8px;text-decoration:none;color:inherit;border-bottom:1px dashed var(--rule);min-height:46px}
.stop a:hover{background:rgba(220,230,255,.06)}
.stop .sn{font-weight:700;line-height:1.3}
.stop.d2 .sn,.stop.d3 .sn{font-weight:500;color:var(--muted)}
.ix{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
.ix b{font-family:var(--mono);font-size:10px;font-weight:600;padding:0 5px;border:1px solid var(--signal);color:var(--signal)}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border:1.5px solid var(--dim);display:block;transform:rotate(45deg)}
.pips i.on.e{background:#8EC5FF;border-color:#8EC5FF}
.pips i.on.i{background:var(--signal);border-color:var(--signal)}
.pips i.on.t{background:var(--good);border-color:var(--good)}

/* ---------- stop / platform ---------- */
.sign{background:var(--deep);border:1px solid var(--ink);padding:14px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:6px 0 10px}
.roundel{width:52px;height:52px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.sign .ln{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sign h2{font-size:clamp(26px,7.5vw,40px);margin-top:3px}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.adj a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);padding:8px 10px;font-size:13px;min-width:0}
.adj a span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.adj a strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adj a.nx{text-align:right}
.adj a.off{visibility:hidden}
.ichg{font-size:13px;margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ichg a{text-decoration:none;color:var(--signal);border:1px solid var(--signal);padding:2px 10px;font-size:12px;font-family:var(--mono)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.mode{background:var(--card);border:1px solid var(--rule);padding:10px;text-align:left;position:relative}
.mode[aria-selected="true"]{border-color:var(--signal);background:var(--deep);box-shadow:inset 0 -3px 0 var(--signal)}
.mode .t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;text-transform:uppercase}
.mode .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.mode .ok{position:absolute;top:10px;right:10px;width:9px;height:9px;border:1.5px solid var(--dim);transform:rotate(45deg)}
.mode .ok.on{border-color:transparent}
.panel{background:var(--card);border:1px solid var(--rule);padding:16px;position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--ink);border-style:solid}
.panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.panel h3{font-size:20px;margin-bottom:6px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--rule);background:transparent;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--deep);border-color:var(--ink)}
.btn{background:var(--signal);color:var(--deep);border:0;border-radius:2px;padding:11px 18px;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sig{background:var(--signal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.note a{color:var(--ink)}
.err{background:rgba(255,127,112,.12);border:1px solid var(--bad);color:#FFD3CC;padding:10px 12px;font-size:14px;margin-top:10px}
.tagline{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.15;margin:4px 0 10px;color:var(--signal);text-transform:uppercase}
.prose p{margin:0 0 10px;max-width:65ch}
.amap{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:14px;margin:6px 0 14px;align-items:center;border:1px dashed var(--rule);padding:10px}
.amap .h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.amap .ar{color:var(--signal);font-family:var(--mono)}
.facts{display:grid;gap:8px;margin:12px 0}
.fact{border-left:3px solid var(--c);padding:4px 0 4px 10px;font-size:14px}
.fact b{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.pocket{background:var(--deep);border:1px dashed var(--signal);padding:12px 14px;margin:12px 0}
.pocket b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);display:block;font-weight:500}
.pocket p{margin:4px 0 0;font-size:17px}
.pocket.win{border:1px solid var(--good)} .pocket.win b{color:var(--good)}
.pocket.loss{border:1px solid var(--bad)} .pocket.loss b{color:var(--bad)}
.q{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--rule)}
.q .qq{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:rgba(11,28,74,.45);border:1px solid var(--rule);padding:10px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:rgba(91,227,161,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,127,112,.14)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:14px;margin-top:6px;color:var(--muted)}

/* loading: a train running down the line */
.loading{padding:18px 0 8px}
.track{position:relative;height:6px;background:rgba(220,230,255,.15);overflow:hidden}
.track i{position:absolute;top:0;left:-30%;width:30%;height:100%;background:var(--signal);animation:run 1.4s cubic-bezier(.6,0,.4,1) infinite}
@keyframes run{to{left:100%}}
.loading p{font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.track i{animation:none;left:0;width:100%;opacity:.4}}

/* pager */
.pager{background:#07122F;color:#E8EEFF;padding:14px;border:1px solid var(--bad);border-left:5px solid var(--bad);font-family:var(--mono);font-size:14px}
.pager .top{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;gap:8px}
.pager .al{font-size:16px;font-weight:600;margin:6px 0;color:#fff}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.metric{border:1px solid rgba(220,230,255,.2);padding:4px 8px;font-size:11px}
.metric b{display:block;font-size:15px}
.metric.bad b{color:var(--bad)}.metric.warn b{color:var(--warn)}.metric.ok b{color:var(--good)}
.ctx{margin:10px 0;font-size:15px}
.outcome{padding:10px 12px;margin:12px 0;border:1px solid}
.outcome.strong{border-color:var(--good);background:rgba(91,227,161,.1)}
.outcome.partial{border-color:var(--warn);background:rgba(255,201,77,.1)}
.outcome.wrong{border-color:var(--bad);background:rgba(255,127,112,.1)}
.outcome b{font-family:var(--mono);text-transform:uppercase;font-size:11px;letter-spacing:.1em}
.outcome.strong > b{color:var(--good)}.outcome.partial > b{color:var(--warn)}.outcome.wrong > b{color:var(--bad)}
.outcome .why{color:var(--ink)}
.rounds{display:flex;gap:4px;margin-bottom:10px}
.rounds i{flex:1;height:4px;background:rgba(220,230,255,.15)}
.rounds i.done{background:var(--signal)}

/* teach */
.bubble{background:var(--deep);border:1px solid var(--ink);border-radius:12px 12px 12px 0;padding:10px 14px;margin:10px 0;max-width:60ch}
.bubble .who{font-family:var(--mono);font-size:11px;color:var(--signal);text-transform:uppercase;letter-spacing:.08em}
textarea{width:100%;min-height:120px;border:1px solid var(--rule);padding:10px;font:inherit;background:var(--deep);color:var(--ink);resize:vertical}
textarea::placeholder{color:var(--dim)}
.score{display:flex;gap:6px;margin:10px 0}
.score i{width:40px;height:10px;background:rgba(220,230,255,.15)}
.score i.on{background:var(--good)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.cols ul{margin:4px 0 0;padding-left:18px}
@media (max-width:480px){.cols{grid-template-columns:1fr}.modes .d{display:none}}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700}

/* today / arcade */
.sect{margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--rule);padding-bottom:6px}
.sect h2{font-size:24px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--rule);padding:12px 14px;margin-bottom:8px}
.rev .k{font-weight:700}
.rev .n{font-size:14px;margin:6px 0 8px}
.sugg a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.sugg .rd{width:32px;height:32px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.quest .bar{margin:8px 0 0}
.quest .bar i{background:var(--good)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.games{grid-template-columns:1fr}}
.game{text-align:left;background:var(--card);border:1px solid var(--rule);padding:12px}
.game[aria-pressed="true"]{border-color:var(--signal);background:var(--deep);box-shadow:inset 0 -3px 0 var(--signal)}
.game .t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;text-transform:uppercase}
.game .d{font-size:13px;color:var(--muted);margin-top:4px}
.game .best{font-family:var(--mono);font-size:12px;margin-top:6px;color:var(--signal)}
.ladder{display:grid;gap:6px}

function norm(s){return s.toLowerCase().replace(/\s+pattern$/,'').replace(/[^a-z0-9]+/g,' ').trim();}
function parse(raw){
  const sections=[]; const goals=[]; let cur=null; let inGoal=false; const lastAt={};
  for(const ln of raw.split('\n')){
    if(/^FINAL GOAL/.test(ln)){inGoal=true;continue;}
    const m = ln.match(/^([│ ]*)(├── |└── )(.*)$/);
    if(!m) continue;
    const depth = Math.round(m[1].length/4);
    const name = m[3].trim();
    if(inGoal){ if(depth===0) goals.push(name); continue; }
    if(depth===0){
      const sm = name.match(/^(\d+)\.\s*(.*)$/);
      if(!sm) continue;
      cur={n:+sm[1],name:sm[2],stops:[]}; sections.push(cur);
      continue;
    }
    if(!cur) continue;
    const stop={name,depth,idx:cur.stops.length,sec:cur.n,key:norm(name),parent:depth>1?lastAt[depth-1]:null,kids:0};
    if(stop.parent) stop.parent.kids++;
    cur.stops.push(stop); lastAt[depth]=stop;
  }
  return {sections,goals};

async function hashPw(pw,salt){
  if(NATIVE&&NATIVE.hash){ const h=NATIVE.hash(pw,salt); if(h) return h; throw new Error('hash failed'); }
  const enc=new TextEncoder();
  const sb=new Uint8Array(salt.match(/../g).map(x=>parseInt(x,16)));
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:sb,iterations:120000},key,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function merge(a,b){
  const o=blank();
  o.xp=Math.max(a.xp||0,b.xp||0);
  o.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort();
  o.daily=Object.assign({},b.daily,a.daily); for(const d in b.daily) o.daily[d]=Math.max(o.daily[d]||0,b.daily[d]);
  const keys=new Set([...Object.keys(a.pips||{}),...Object.keys(b.pips||{})]);
  keys.forEach(k=>{const x=(a.pips||{})[k]||{},y=(b.pips||{})[k]||{};o.pips[k]={};['e','i','t'].forEach(p=>{const v=Math.max(x[p]||0,y[p]||0); if(v) o.pips[k][p]=v;});});
  const rk=new Set([...Object.keys(a.rev||{}),...Object.keys(b.rev||{})]);
  rk.forEach(k=>{const x=(a.rev||{})[k],y=(b.rev||{})[k]; o.rev[k]=!x?y:!y?x:(x.at>=y.at?x:y);});
  o.notes=Object.assign({},b.notes,a.notes);
  o.arcade=Object.assign({},b.arcade); for(const g in (a.arcade||{})) o.arcade[g]=Math.max(o.arcade[g]||0,a.arcade[g]);
  const newer=(a.updated||0)>=(b.updated||0)?a:b; o.last=newer.last||a.last||b.last;
  o.updated=Math.max(a.updated||0,b.updated||0);
  return o;
}

async function rideFetch(t){
  const st=UI.ride[t.key]; st.loading=true; st.err=null; paneRide(t);
  const lens=UI.lens, lensName=(LENSES.find(l=>l[0]===lens)||LENSES[0])[1];
  const prompt=`You are an outstanding system design teacher. Teach ${ctxOf(t)}.

 "map": [{"lens":"element of the analogy","real":"technical counterpart"}]  (3 items, or [] if no analogy),
 "rule_of_thumb": "one widely documented number, limit or heuristic engineers use for this; empty string if none is well established",
 "seen_in": "one well-known real system that uses it and how, max 25 words",

async function pagerStart(t){

  try{const d=await askJSON(prompt); st.company=d.company; st.service=d.service; st.rounds=[{alert:d.alert,context:d.context,metrics:d.metrics,choices:d.choices}];}

async function pagerChoose(t,ci){
  const st=UI.pager[t.key]; const R=st.rounds; const r=R[R.length-1]; r.chosen=ci; st.loading=true; st.err=null; panePager(t);
  const n=R.length;

  const prompt=`Incident simulation teaching ${ctxOf(t)}. Company: ${st.company}. This is round ${n} of at most 3.
History so far: ${JSON.stringify(hist)}
The learner just chose: "${r.choices[ci]}".
Judge that choice honestly, as a senior SRE would, then continue the story.
JSON shape: {"quality":"strong|partial|wrong","outcome":"what happens because of the choice, max 45 words","lesson":"the underlying principle, max 30 words",
 "next": ${n>=3?'null':'null if the incident is fully resolved, otherwise {"alert":"","context":"","metrics":[{"name":"","value":"","state":"bad|warn|ok"}],"choices":["","",""]} with the same rules as before (one strong, one tempting but wrong, one partial, random order)'},
 "debrief": null unless next is null; then {"survived":true or false,"summary":"how the night went, max 50 words","better_move":"the ideal sequence of moves, max 35 words"}}`;
  try{
    const d=await askJSON(prompt);

  P.innerHTML=`<h3>Latency Ladder · ${G.score}/5</h3><p class="note" style="margin-top:0">Correct order, bars on a log scale. Red means you placed it elsewhere.</p>
    ${sorted.map((i,j)=>{const it=G.items[i]; const w=Math.max(3,(Math.log10(it[1])+1.5)/mx*100); const miss=G.items[G.pick[j]][1]!==it[1];
      return `<div class="lbar ${miss?'miss':''}"><div class="row" style="justify-content:space-between;gap:6px"><span>${j+1}. ${esc(it[0])}</span><span class="v">${fmtNs(it[1])}</span></div><div class="bx" style="width:${w}%"></div></div>`;}).join('')}
    <p class="note">Classic figures from the widely shared "latency numbers every programmer should know" list (Jeff Dean, Peter Norvig). Modern hardware shifts some, but the orders of magnitude hold.</p>
    <button class="btn" id="again">Play again</button>`;
  $('#again').onclick=()=>{G=null; gLadder();};
}
function gQuiz(){
  const k=UI.game, bank=k==='napkin'?NAPKIN:PATTERNS, P=$('#gpanel');
  if(!G||G.k!==k){G={k,qs:shuffle(bank).slice(0,5).map(q=>{const order=shuffle(q.o.map((_,i)=>i)); return {q:q.q,o:order.map(i=>q.o[i]),a:order.indexOf(q.a),w:q.w};}),i:0,score:0,ans:null};}
  if(G.i>=5){
    P.innerHTML=`<h3>${GAMES[k][0]} · ${G.score}/5</h3><p>${G.score===5?'Flawless.':G.score>=3?'Solid. Run it again to see new questions.':'Run it again; the explanations are the lesson.'}</p><button class="btn" id="again">Play again</button>`;
    $('#again').onclick=()=>{G=null; gQuiz();}; return;
  }
  const q=G.qs[G.i];
  P.innerHTML=`<div class="row" style="justify-content:space-between"><h3>${GAMES[k][0]}</h3><span class="mono note">${G.i+1}/5 · ${G.score} right</span></div>
    <div class="qq" style="font-weight:700;margin:6px 0 10px">${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,oi)=>{let c=''; if(G.ans!=null){if(oi===q.a)c='right'; else if(oi===G.ans)c='wrong';} return `<button class="opt ${c}" data-o="${oi}" ${G.ans!=null?'disabled':''}>${esc(o)}</button>`;}).join('')}</div>
    ${G.ans!=null?`<div class="why">${esc(q.w)}</div><div style="margin-top:12px"><button class="btn" id="nx">${G.i===4?'See score':'Next'}</button></div>`:''}`;
  P.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{G.ans=+b.dataset.o; if(G.ans===q.a) G.score++; gQuiz();});
  const nx=$('#nx'); if(nx) nx.onclick=()=>{G.i++; G.ans=null; if(G.i>=5) finishGame(k,G.score); gQuiz();};
}

/* ================= Claude through the native bridge ================= */
const CB={}; let cbSeq=0;
window.__sdmCb=function(id,ok,text){
  const c=CB[id]; if(!c) return; delete CB[id];
  if(ok) c.res(text);
  else { let e={code:'unknown',message:String(text)}; try{e=JSON.parse(text);}catch(x){} c.rej(e); }
};
function refreshAI(){
  const key=lsGet(KK,'');
  if(NATIVE&&NATIVE.ask&&key){
    SAMPLE=function(input,o){
      return new Promise((res,rej)=>{
        const id='c'+(++cbSeq); CB[id]={res:t=>res({text:t}),rej};
        try{ NATIVE.ask(id,String(input),MODELS[(o&&o.modelTier)==='quick'?'quick':'default'],key); }
        catch(e){ delete CB[id]; rej({code:'unknown',message:'Could not reach the app bridge.'}); }
      });
    };
  } else SAMPLE=null;
  setAI(SAMPLE?'on':'off');
}

/* ================= AUTH ================= */
const AUTH={tab:Object.keys(ACC).length?'in':'up',err:'',name:'',email:'',busy:false};
function enter(email){
  ME=ACC[email]; lsSet(SK,email);
  LS='sdm.v1.'+ME.id; loadState();
  UI.mode={}; UI.ride={}; UI.pager={}; UI.teach={}; UI.game=null; G=null;
  refreshAI();
}
function signOut(){ ME=null; lsDel(SK); S=blank(); AUTH.tab='in'; AUTH.err=''; AUTH.email=''; setAI('off'); location.hash='#map'; route(); window.scrollTo(0,0); }
function renderAuth(){
  const up=AUTH.tab==='up', n=Object.keys(ACC).length;
  $('#view').innerHTML=`
    <div class="authHero"><div class="mono note">${SECS.length} LINES · ${TOTAL_STOPS} STOPS · 1 TERMINUS</div>
      <h1>System Design <span>Metro</span></h1>
      <p>Ride every concept on the roadmap, survive the 2:47 AM pager, and teach it back.</p></div>
    <section class="panel">
      <div class="chips" role="group" aria-label="Sign in or create account" style="margin-top:0">
        <button class="chip" type="button" aria-pressed="${!up}" data-tab="in">Sign in</button>
        <button class="chip" type="button" aria-pressed="${up}" data-tab="up">Create account</button>
      </div>
      <form id="authForm" novalidate>
        ${up?`<div class="field"><label for="au-name">Name</label><input type="text" id="au-name" autocomplete="name" value="${esc(AUTH.name)}"></div>`:''}
        <div class="field"><label for="au-email">Email</label><input type="email" id="au-email" autocomplete="email" inputmode="email" value="${esc(AUTH.email)}"></div>
        <div class="field"><label for="au-pass">Password</label><input type="password" id="au-pass" autocomplete="${up?'new-password':'current-password'}"></div>
        ${up?`<div class="field"><label for="au-pass2">Confirm password</label><input type="password" id="au-pass2" autocomplete="new-password"></div>`:''}
        ${AUTH.err?`<div class="err" style="margin:0 0 12px">${esc(AUTH.err)}</div>`:''}
        <button class="btn" type="submit" ${AUTH.busy?'disabled':''}>${up?'Create account':'Sign in'}</button>
      </form>
      <p class="note" style="margin:14px 0 0">Accounts and progress are stored on this phone only${n?` (${n} profile${n>1?'s':''} here)`:''}. Nothing is sent to a server, so a forgotten password cannot be recovered.</p>
    </section>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{keep(); AUTH.tab=b.dataset.tab; AUTH.err=''; renderAuth();});
  function keep(){const e=$('#au-email'), nm=$('#au-name'); if(e) AUTH.email=e.value; if(nm) AUTH.name=nm.value;}
  $('#authForm').onsubmit=async ev=>{
    ev.preventDefault(); if(AUTH.busy) return; keep();
    const email=AUTH.email.trim().toLowerCase(), pw=$('#au-pass').value, name=AUTH.name.trim();
    const fail=m=>{AUTH.err=m; AUTH.busy=false; renderAuth();};
    if(!/^\S+@\S+\.\S+$/.test(email)) return fail('Enter a valid email address.');
    if(up){
      if(!name) return fail('Enter your name.');
      if(pw.length<6) return fail('Use a password of at least 6 characters.');
      if(pw!==$('#au-pass2').value) return fail('The two passwords do not match.');
      if(ACC[email]) return fail('An account with this email already exists on this phone. Sign in instead.');
    } else {
      if(!ACC[email]) return fail('No account with this email on this phone. Create one first.');
    }
    AUTH.busy=true; AUTH.err='';
    try{
      if(up){
        const salt=randHex(16), hash=await hashPw(pw,salt);
        ACC[email]={id:randHex(6),name,email,salt,hash,created:Date.now()};
        if(!lsSet(AK,ACC)){ delete ACC[email]; return fail('This phone would not save the account. Free up some storage and try again.'); }
      } else {
        const h=await hashPw(pw,ACC[email].salt);
        if(h!==ACC[email].hash) return fail('Wrong password.');
      }
    }catch(e){ return fail('Could not check the password on this device. Try again.'); }
    AUTH.busy=false; AUTH.name=''; AUTH.email='';
    enter(email); location.hash='#map'; route(); window.scrollTo(0,0);
    toast('Welcome aboard, '+ME.name.split(' ')[0]);
  };
}

/* ================= PROFILE ================= */
let delArmed=false;
function renderProfile(){
  const key=lsGet(KK,''); const n=Object.keys(ACC).length;
  $('#view').innerHTML=`
    <header class="mast"><div><h1>Profile</h1><div class="sub">${esc(ME.email)}</div></div></header>
    ${ticketHTML()}
    <div class="sect"><h2>Account</h2></div>
    <div class="card">
      <div class="kv"><span>Name</span><span>${esc(ME.name)}</span><span>Email</span><span>${esc(ME.email)}</span><span>Joined</span><span>${new Date(ME.created).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</span><span>Storage</span><span>On this phone only · ${n} profile${n>1?'s':''}</span></div>
      <button class="btn alt" id="so">Sign out</button>
    </div>
    <div class="sect"><h2>Claude key</h2><span class="mono note ${key?'ok':''}">${key?'CONNECTED':'NOT SET'}</span></div>
    <div class="card">
      <p class="note" style="margin:0 0 4px">Ride, Pager and Teach write fresh content with Claude, which needs your own Anthropic API key. Usage is billed to your Anthropic account. The key stays on this phone and is sent only to api.anthropic.com.</p>
      <div class="field"><label for="apikey">Anthropic API key</label><input type="password" id="apikey" placeholder="${key?'Saved: ••••'+esc(key.slice(-4)):'sk-ant-…'}" autocomplete="off"></div>
      <div class="row"><button class="btn" id="ks">Save key</button>${key?'<button class="btn alt" id="kr">Remove key</button>':''}</div>
    </div>
    <div class="sect"><h2>Danger zone</h2></div>
    <div class="card"><p class="note" style="margin:0 0 10px">Deletes this account and all its progress from this phone. This cannot be undone.</p>
      <button class="btn alt danger" id="del">${delArmed?'Tap again to delete forever':'Delete this account'}</button></div>`;
  $('#so').onclick=signOut;
  $('#ks').onclick=()=>{const v=$('#apikey').value.trim(); if(v.length<20){toast('That does not look like an API key'); return;} lsSet(KK,v); refreshAI(); toast('Key saved'); renderProfile();};
  const kr=$('#kr'); if(kr) kr.onclick=()=>{lsDel(KK); refreshAI(); toast('Key removed'); renderProfile();};
  $('#del').onclick=()=>{
    if(!delArmed){delArmed=true; renderProfile(); setTimeout(()=>{if(delArmed){delArmed=false; if(location.hash==='#profile'&&ME) renderProfile();}},4000); return;}
    delArmed=false; lsDel('sdm.v1.'+ME.id); delete ACC[ME.email]; lsSet(AK,ACC); signOut(); toast('Account deleted');
  };
}

/* ================= boot ================= */
(function(){
  const em=lsGet(SK,null);
  if(em&&ACC[em]) enter(em); else setAI('off');
  route();
})();
})();
</script>
