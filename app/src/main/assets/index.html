<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Metro</title>
<style>
@font-face{font-family:"Chakra Petch";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/chakra-petch-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/chakra-petch-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Chakra Petch";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/chakra-petch-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Manrope";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/manrope-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2")}

/* ---------- app additions: sign-in and profile ---------- */
nav.dock[hidden]{display:none}
.field{display:grid;gap:4px;margin:12px 0}
.field label{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
input[type=text],input[type=email],input[type=password]{width:100%;border:1px solid var(--rule);padding:11px 10px;font:inherit;background:var(--deep);color:var(--ink);border-radius:0}
input::placeholder{color:var(--dim)}
input:focus{outline:2px solid var(--signal);outline-offset:0}
.authHero{margin:8px 0 18px}
.authHero h1{font-size:clamp(40px,12vw,64px)}
.authHero h1 span{color:var(--signal)}
.authHero p{color:var(--muted);margin:8px 0 0;max-width:46ch}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:6px 0 12px}
.kv span:nth-child(odd){font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);align-self:center}
.ok{color:var(--good)} .danger{border-color:var(--bad)!important;color:var(--bad)!important}
/* Layout idea: an engineering blueprint. Cobalt drafting sheet with a fine grid, white linework,
   pastel line colours, safety-yellow for "act here". Square corners, technical type. Single theme by choice. */
:root{
  --paper:#16337F;      /* drafting sheet */
  --card:#1D3F95;       /* raised panel */
  --deep:#0B1C4A;       /* dark blocks: ticket, signage, pager, dock */
  --ink:#F3F6FF;        /* primary linework / text */
  --muted:#A8BAE8;
  --dim:#8FA3D6;
  --rule:rgba(220,230,255,.24);
  --signal:#FFD23F;     /* safety yellow */
  --good:#5BE3A1; --warn:#FFC94D; --bad:#FF7F70;
  --display:"Chakra Petch", "Arial Narrow", sans-serif;
  --body:"Manrope", "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  background-image:
    linear-gradient(rgba(220,230,255,.09) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,230,255,.09) 1px,transparent 1px),
    linear-gradient(rgba(220,230,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(220,230,255,.035) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px;
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 110px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- title block ---------- */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 14px;margin-bottom:16px;border-bottom:1px solid var(--ink);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-5px;border-bottom:1px dashed var(--rule)}
.mast h1{font-size:clamp(34px,9.5vw,60px);font-weight:700;letter-spacing:.01em}
.mast h1 span{color:var(--signal)}
.mast .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.02em}

/* ---------- ticket = drawing title block ---------- */
.ticket{display:grid;grid-template-columns:repeat(4,1fr);background:var(--deep);border:1px solid var(--ink);border-radius:2px}
.ticket > div{padding:10px 12px;border-right:1px solid var(--rule)}
.ticket > div:last-child{border-right:0}
.ticket b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;margin-top:4px}
.ticket small{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ticket .rank{grid-column:1/-1;border-right:0;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;font-size:13px;font-family:var(--mono)}
.bar{height:6px;background:rgba(220,230,255,.15);overflow:hidden;flex:1;margin:0 10px}
.bar i{display:block;height:100%;background:var(--signal)}
@media (max-width:420px){.ticket b{font-size:23px}.ticket > div{padding:9px 8px}}

.continue{margin:14px 0 4px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--signal);color:var(--deep);border-radius:2px;padding:12px 14px}
.continue .lbl{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;opacity:.75}
.continue .nm{font-family:var(--display);font-size:23px;font-weight:700;text-transform:uppercase}
.continue .go{white-space:nowrap;margin-left:auto;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase}

/* ---------- map trunk ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:18px 0 6px;color:var(--muted);font-family:var(--mono)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:4px;display:inline-block}
.trunk{list-style:none;margin:8px 0 0;padding:0}
.stn{position:relative;display:grid;grid-template-columns:64px 1fr;min-height:76px}
.stn::before{content:"";position:absolute;left:29px;top:0;bottom:0;width:6px;background:var(--c)}
.stn:first-child::before{top:30px}
.stn.term::before{bottom:auto;height:30px}
.stn .dot{position:relative;z-index:1;margin:14px 0 0 16px;width:32px;height:32px;border-radius:50%;background:var(--paper);border:2px solid var(--c);display:grid;place-items:center}
.stn .dot i{width:20px;height:20px;border-radius:50%;background:var(--card);display:block}
.stn a{display:block;text-decoration:none;color:inherit;padding:10px 0 14px;border-bottom:1px dashed var(--rule)}
.stn a:hover .nm{color:var(--signal)}
.stn .num{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.stn .nm{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.stn .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin-top:5px;font-family:var(--mono)}
.stn .meta span{white-space:nowrap}
.mini{flex:0 1 90px;min-width:30px;width:90px;height:4px;background:rgba(220,230,255,.15);overflow:hidden}
.mini i{display:block;height:100%;background:var(--c)}
.here{display:inline-block;background:var(--signal);color:var(--deep);font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;margin-left:8px;vertical-align:middle}
.zone{text-transform:uppercase;letter-spacing:.08em;padding:0 6px;border:1px solid var(--c);color:var(--c)}
.terminus{background:var(--deep);border:1px solid var(--signal);padding:14px 16px;margin-top:4px}
.terminus h3{font-size:22px;color:var(--signal)}
.terminus ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}

/* ---------- line view ---------- */
.back{background:none;border:0;padding:6px 0;font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;font-family:var(--mono);text-decoration:none}
.back:hover{color:var(--ink)}
.lineHead{background:var(--deep);border:1px solid var(--c);border-left:10px solid var(--c);padding:16px;margin:6px 0 14px}
.lineHead .code{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--c)}
.lineHead h2{font-size:clamp(30px,8vw,46px);margin-top:4px}
.lineHead p{margin:6px 0 0;max-width:55ch;color:var(--muted)}
.lineHead .prog{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:12px;font-family:var(--mono)}
.lineHead .prog .bar{margin:0}
.lineHead .prog .bar i{background:var(--c)}
.stops{list-style:none;margin:0;padding:0}
.stop{position:relative;display:grid;grid-template-columns:44px 1fr}
.stop::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:4px;background:var(--c)}
.stop:first-child::before{top:22px}
.stop:last-child::before{bottom:auto;height:22px}
.stop.d2{grid-template-columns:44px 26px 1fr}
.stop.d2::after{content:"";position:absolute;left:23px;top:22px;width:30px;height:0;border-top:2px dashed var(--c)}
.stop.d2 .sd{grid-column:2}
.stop.d2 a{grid-column:3}
.stop.d3{grid-template-columns:44px 52px 1fr}
.stop.d3 .sd{grid-column:2;justify-self:end}
.stop.d3 a{grid-column:3}
.sd{position:relative;z-index:1;margin-top:13px;margin-left:12px;width:18px;height:18px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.stop.d2 .sd,.stop.d3 .sd{margin-left:6px;width:14px;height:14px;margin-top:15px}
.stop a{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 4px 10px 8px;text-decoration:none;color:inherit;border-bottom:1px dashed var(--rule);min-height:46px}
.stop a:hover{background:rgba(220,230,255,.06)}
.stop .sn{font-weight:700;line-height:1.3}
.stop.d2 .sn,.stop.d3 .sn{font-weight:500;color:var(--muted)}
.ix{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
.ix b{font-family:var(--mono);font-size:10px;font-weight:600;padding:0 5px;border:1px solid var(--signal);color:var(--signal)}
.pips{display:inline-flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border:1.5px solid var(--dim);display:block;transform:rotate(45deg)}
.pips i.on.e{background:#8EC5FF;border-color:#8EC5FF}
.pips i.on.i{background:var(--signal);border-color:var(--signal)}
.pips i.on.t{background:var(--good);border-color:var(--good)}

/* ---------- stop / platform ---------- */
.sign{background:var(--deep);border:1px solid var(--ink);padding:14px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin:6px 0 10px}
.roundel{width:52px;height:52px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:24px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.sign .ln{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sign h2{font-size:clamp(26px,7.5vw,40px);margin-top:3px}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.adj a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--rule);padding:8px 10px;font-size:13px;min-width:0}
.adj a span{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.adj a strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adj a.nx{text-align:right}
.adj a.off{visibility:hidden}
.ichg{font-size:13px;margin:-2px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ichg a{text-decoration:none;color:var(--signal);border:1px solid var(--signal);padding:2px 10px;font-size:12px;font-family:var(--mono)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.mode{background:var(--card);border:1px solid var(--rule);padding:10px;text-align:left;position:relative}
.mode[aria-selected="true"]{border-color:var(--signal);background:var(--deep);box-shadow:inset 0 -3px 0 var(--signal)}
.mode .t{font-family:var(--display);font-weight:700;font-size:20px;line-height:1;text-transform:uppercase}
.mode .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.3}
.mode .ok{position:absolute;top:10px;right:10px;width:9px;height:9px;border:1.5px solid var(--dim);transform:rotate(45deg)}
.mode .ok.on{border-color:transparent}
.panel{background:var(--card);border:1px solid var(--rule);padding:16px;position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--ink);border-style:solid}
.panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.panel h3{font-size:20px;margin-bottom:6px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--rule);background:transparent;padding:5px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--deep);border-color:var(--ink)}
.btn{background:var(--signal);color:var(--deep);border:0;border-radius:2px;padding:11px 18px;font-family:var(--display);font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sig{background:var(--signal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:13px;color:var(--muted)}
.note a{color:var(--ink)}
.err{background:rgba(255,127,112,.12);border:1px solid var(--bad);color:#FFD3CC;padding:10px 12px;font-size:14px;margin-top:10px}
.tagline{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.15;margin:4px 0 10px;color:var(--signal);text-transform:uppercase}
.prose p{margin:0 0 10px;max-width:65ch}
.amap{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:14px;margin:6px 0 14px;align-items:center;border:1px dashed var(--rule);padding:10px}
.amap .h{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.amap .ar{color:var(--signal);font-family:var(--mono)}
.facts{display:grid;gap:8px;margin:12px 0}
.fact{border-left:3px solid var(--c);padding:4px 0 4px 10px;font-size:14px}
.fact b{display:block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}
.pocket{background:var(--deep);border:1px dashed var(--signal);padding:12px 14px;margin:12px 0}
.pocket b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal);display:block;font-weight:500}
.pocket p{margin:4px 0 0;font-size:17px}
.pocket.win{border:1px solid var(--good)} .pocket.win b{color:var(--good)}
.pocket.loss{border:1px solid var(--bad)} .pocket.loss b{color:var(--bad)}
.q{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--rule)}
.q .qq{font-weight:700;margin-bottom:8px}
.opts{display:grid;gap:6px}
.opt{text-align:left;background:rgba(11,28,74,.45);border:1px solid var(--rule);padding:10px 12px;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:rgba(91,227,161,.14)}
.opt.wrong{border-color:var(--bad);background:rgba(255,127,112,.14)}
.opt:disabled{cursor:default;color:var(--ink)}
.why{font-size:14px;margin-top:6px;color:var(--muted)}

/* loading: a train running down the line */
.loading{padding:18px 0 8px}
.track{position:relative;height:6px;background:rgba(220,230,255,.15);overflow:hidden}
.track i{position:absolute;top:0;left:-30%;width:30%;height:100%;background:var(--signal);animation:run 1.4s cubic-bezier(.6,0,.4,1) infinite}
@keyframes run{to{left:100%}}
.loading p{font-family:var(--mono);font-size:12px;color:var(--muted);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.track i{animation:none;left:0;width:100%;opacity:.4}}

/* pager */
.pager{background:#07122F;color:#E8EEFF;padding:14px;border:1px solid var(--bad);border-left:5px solid var(--bad);font-family:var(--mono);font-size:14px}
.pager .top{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;gap:8px}
.pager .al{font-size:16px;font-weight:600;margin:6px 0;color:#fff}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.metric{border:1px solid rgba(220,230,255,.2);padding:4px 8px;font-size:11px}
.metric b{display:block;font-size:15px}
.metric.bad b{color:var(--bad)}.metric.warn b{color:var(--warn)}.metric.ok b{color:var(--good)}
.ctx{margin:10px 0;font-size:15px}
.outcome{padding:10px 12px;margin:12px 0;border:1px solid}
.outcome.strong{border-color:var(--good);background:rgba(91,227,161,.1)}
.outcome.partial{border-color:var(--warn);background:rgba(255,201,77,.1)}
.outcome.wrong{border-color:var(--bad);background:rgba(255,127,112,.1)}
.outcome b{font-family:var(--mono);text-transform:uppercase;font-size:11px;letter-spacing:.1em}
.outcome.strong > b{color:var(--good)}.outcome.partial > b{color:var(--warn)}.outcome.wrong > b{color:var(--bad)}
.outcome .why{color:var(--ink)}
.rounds{display:flex;gap:4px;margin-bottom:10px}
.rounds i{flex:1;height:4px;background:rgba(220,230,255,.15)}
.rounds i.done{background:var(--signal)}

/* teach */
.bubble{background:var(--deep);border:1px solid var(--ink);border-radius:12px 12px 12px 0;padding:10px 14px;margin:10px 0;max-width:60ch}
.bubble .who{font-family:var(--mono);font-size:11px;color:var(--signal);text-transform:uppercase;letter-spacing:.08em}
textarea{width:100%;min-height:120px;border:1px solid var(--rule);padding:10px;font:inherit;background:var(--deep);color:var(--ink);resize:vertical}
textarea::placeholder{color:var(--dim)}
.score{display:flex;gap:6px;margin:10px 0}
.score i{width:40px;height:10px;background:rgba(220,230,255,.15)}
.score i.on{background:var(--good)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px}
.cols ul{margin:4px 0 0;padding-left:18px}
@media (max-width:480px){.cols{grid-template-columns:1fr}.modes .d{display:none}}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700}

/* today / arcade */
.sect{margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px dashed var(--rule);padding-bottom:6px}
.sect h2{font-size:24px;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--rule);padding:12px 14px;margin-bottom:8px}
.rev .k{font-weight:700}
.rev .n{font-size:14px;margin:6px 0 8px}
.sugg a{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.sugg .rd{width:32px;height:32px;background:var(--c);color:var(--on);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.quest .bar{margin:8px 0 0}
.quest .bar i{background:var(--good)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.games{grid-template-columns:1fr}}
.game{text-align:left;background:var(--card);border:1px solid var(--rule);padding:12px}
.game[aria-pressed="true"]{border-color:var(--signal);background:var(--deep);box-shadow:inset 0 -3px 0 var(--signal)}
.game .t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1;text-transform:uppercase}
.game .d{font-size:13px;color:var(--muted);margin-top:4px}
.game .best{font-family:var(--mono);font-size:12px;margin-top:6px;color:var(--signal)}
.ladder{display:grid;gap:6px}
.lad{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:rgba(11,28,74,.45);border:1px solid var(--rule);padding:10px 12px}
.lad .ord{font-family:var(--mono);font-weight:600;width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--dim);font-size:12px;flex:none}
.lad.picked{border-color:var(--signal)}
.lad.picked .ord{background:var(--signal);color:var(--deep);border-color:var(--signal)}
.lbar{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;margin-bottom:10px;font-size:13px}
.lbar .bx{height:10px;background:#8EC5FF;min-width:4px}
.lbar .v{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lbar.miss .bx{background:var(--bad)}

/* dock */
nav.dock{position:fixed;left:0;right:0;bottom:0;background:var(--deep);border-top:1px solid var(--ink);display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav.dock a{flex:1;max-width:180px;text-align:center;text-decoration:none;color:var(--muted);font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;padding:8px 2px}
nav.dock a[aria-current="page"]{background:var(--signal);color:var(--deep)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--signal);color:var(--deep);font-family:var(--mono);font-weight:600;font-size:14px;padding:10px 16px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.aiStatus{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:14px;text-align:center}
.kp{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--rule);margin-top:6px;background:rgba(11,28,74,.45)}
.kp input{margin:3px 0 0;width:18px;height:18px;flex:none;accent-color:var(--signal)}
</style>
</head>
<body>
<div class="wrap"><main id="view" aria-live="polite"></main><p class="aiStatus" id="aiStatus"></p></div>
<nav class="dock" aria-label="Main">
  <a href="#map" data-nav="map">Map</a>
  <a href="#today" data-nav="today">Today</a>
  <a href="#arcade" data-nav="arcade">Arcade</a>
  <a href="#profile" data-nav="profile">Profile</a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="content">{"how the internet works":{"e":["Your device wraps data in packets stamped with source and destination IP addresses. Routers forward each packet hop by hop, choosing paths with BGP between networks. A page load is a chain: DNS lookup, TCP handshake, TLS handshake, HTTP request, response. Each step adds a round trip, which is why distance and connection reuse dominate latency."],"t":"A network of networks that moves packets between addresses.","p":"Saying \"the request goes to the server\" and skipping DNS, TCP and TLS. Interviewers want the hops.","k":"DNS finds it, TCP connects, TLS secures, HTTP talks.","q":["A first page load is slow but later clicks are fast. What most likely explains it?","DNS, TCP and TLS setup happened once and the connection is reused","The server caches the user's password","Routers learn the user's habits","Packets get smaller over time","Setup round trips are paid on the first request; keep-alive reuses the connection afterwards."],"i":["Users in Chennai report 8 second first loads","The API itself answers in 40 ms. Traces show most time is spent before the first byte is requested, and the server is hosted in Virginia.","Put a CDN or regional edge in front and reuse connections","Add more CPU to the Virginia servers => Server time was never the problem; nothing changes","Raise client timeouts => Requests stop failing but stay just as slow","Round trips times distance dominate first-load latency, so move the handshake closer to users."],"a":["What actually happens between typing a URL and seeing the page?","DNS resolves the name to an IP","TCP then TLS handshakes set up a secure connection","HTTP request and response flow as packets routed hop by hop"]},"client server architecture":{"e":["A client (browser, app) sends requests; a server holds data and logic and replies. Centralising state on servers makes consistency and security manageable, and lets many clients share one truth. The cost is that the server is a bottleneck and a single point of failure unless you replicate it behind a load balancer."],"t":"Clients ask, servers answer; the server owns the shared state.","p":"Treating the client as trusted. Anything running on the user's device can be modified, so validate on the server.","k":"Never trust the client; always scale the server.","q":["A mobile game validates scores only in the app, and fake high scores appear. What is the fix?","Validate and compute scores on the server","Obfuscate the app code more","Add a longer loading screen","Encrypt the score with a key stored in the app","The client is under the attacker's control, so authority must live on the server."],"i":["Leaderboard flooded with impossible scores","The app sends the final score in one API call and the server stores whatever arrives.","Recompute or sanity-check the score on the server from game events","Hide the API URL inside the app => It is found again within hours","Ban the offending accounts => New accounts appear and repeat it","Server-side validation is the only real boundary in a client-server system."],"a":["Why can't we just do validation in the app and keep the server simple?","The client can be tampered with","The server is the single source of truth for shared state","Server-side checks protect every client at once"]},"http https":{"e":["HTTP is a stateless text protocol: a method, a path, headers and an optional body, answered with a status code. HTTPS is the same HTTP inside a TLS tunnel, which gives encryption, integrity and server identity. HTTP/2 multiplexes many requests on one connection; HTTP/3 runs over QUIC on UDP to avoid head-of-line blocking."],"t":"The request-response protocol of the web, with TLS for privacy.","p":"Saying HTTPS \"encrypts the URL so nobody knows the site\". The hostname is still visible through DNS and SNI.","k":"HTTPS is HTTP plus TLS: private, untampered, and you know who you are talking to.","q":["Why is HTTP called stateless?","Each request carries everything needed; the server keeps no memory between requests by default","It cannot carry cookies","It works without a network","It never returns errors","State such as login lives in cookies or tokens sent with every request."],"i":["Customers report cart contents shown to the wrong user","A caching proxy was placed in front of the site last night and personalised pages are served over shared cache.","Mark personalised responses Cache-Control private or no-store and purge the cache","Restart the application servers => The proxy still serves the cached pages","Shorten the cache TTL to one minute => Leaks continue, just for shorter windows","HTTP caching headers decide who may reuse a response; get them wrong and you leak data."],"a":["If HTTP is stateless, how does a site remember I'm logged in?","Server issues a session cookie or token","Client sends it on every request","Server looks up or verifies it each time"]},"dns domain name system":{"e":["A resolver asks root servers, then the TLD servers, then the domain's authoritative servers, and caches the answer for its TTL. Records include A and AAAA (addresses), CNAME (alias), MX (mail) and NS (delegation). DNS is also a traffic tool: weighted, latency-based and geo records steer users to regions, limited by how long resolvers cache."],"t":"The phone book that turns names into IP addresses.","p":"Expecting a DNS change to take effect instantly. Old answers live until their TTL expires, sometimes longer.","k":"DNS changes move at the speed of the TTL.","q":["You plan a datacenter migration next week. What should you do to DNS beforehand?","Lower the record TTL well before the cutover","Raise the TTL to a week","Delete the records and recreate them","Switch to a CNAME at the last minute","A low TTL in advance means resolvers pick up the new address quickly at cutover."],"i":["Half of users still hit the decommissioned datacenter","You switched the A record an hour ago. The old TTL was 24 hours and the old servers were shut down.","Bring the old endpoint back as a proxy until caches expire","Flush your own laptop's DNS cache => Only your machine is fixed","Change the record again to a third address => Adds a third stale answer in caches","Cached DNS answers outlive your change; keep the old address serving until TTLs run out."],"a":["Why did my DNS change work for me but not for some users?","Resolvers cache answers for the TTL","Different resolvers refreshed at different times","Lower TTLs ahead of planned changes"]},"tcp udp":{"e":["TCP sets up a connection with a three-way handshake, numbers every byte, retransmits losses and slows down under congestion. That reliability costs latency and suffers head-of-line blocking. UDP sends independent datagrams with no setup, ordering or retries, so it suits real-time voice, video, gaming and DNS, where a late packet is worthless."],"t":"TCP guarantees ordered delivery; UDP just sends and hopes.","p":"Saying \"UDP is faster, so use it\". It is only better when you can tolerate loss or build your own reliability.","k":"TCP: every byte, in order. UDP: now or never.","q":["Which workload fits UDP best?","A live voice call","A bank transfer API","File download","Database replication","A late audio packet is useless, so skipping it beats waiting for a retransmit."],"i":["Video calls freeze for seconds on poor Wi-Fi","Media is tunnelled over TCP. One lost packet stalls everything behind it while it is retransmitted.","Send media over UDP with a jitter buffer and loss concealment","Increase the TCP buffer sizes => Stalls get longer, not shorter","Lower the video resolution => Fewer packets, but each loss still freezes the stream","Real-time media prefers dropping a packet to waiting for it; TCP's ordering becomes the problem."],"a":["When would you pick UDP even though it can lose packets?","When timeliness matters more than completeness","No handshake or head-of-line blocking","Application handles loss itself if needed"]},"ip addresses ports":{"e":["An IP address identifies a network interface; a port (0 to 65535) identifies a listening process. A connection is unique by source IP, source port, destination IP, destination port and protocol. Private ranges (10.x, 172.16-31.x, 192.168.x) are hidden behind NAT. Clients use short-lived ephemeral ports, which can run out under heavy outbound connection churn."],"t":"The IP finds the machine; the port finds the program on it.","p":"Forgetting ephemeral port exhaustion when one host opens huge numbers of outbound connections to the same destination.","k":"One connection equals one unique five-tuple.","q":["A proxy opening thousands of short connections to one backend starts failing with \"cannot assign requested address\". Why?","It ran out of ephemeral source ports","The backend's disk is full","DNS is down","The IP address expired","Each connection to the same destination needs a distinct source port, and the pool is finite."],"i":["Gateway returns 502s under load, CPU is fine","The gateway opens a new TCP connection per request to one upstream. Tens of thousands of sockets sit in TIME_WAIT.","Enable keep-alive connection pooling to the upstream","Add CPU cores to the gateway => Ports, not CPU, are exhausted","Lower the request timeout => Fails faster but still fails","Connection reuse avoids burning one ephemeral port per request."],"a":["Two services on the same server: how does traffic reach the right one?","Each listens on a different port","The OS matches packets by the five-tuple","Clients use temporary ephemeral ports"]},"osi model":{"e":["From bottom to top: physical, data link, network (IP), transport (TCP, UDP), session, presentation, application (HTTP). In practice engineers talk about Layer 3 (routing by IP), Layer 4 (ports and connections) and Layer 7 (HTTP content). The model matters because devices act at a layer: an L4 load balancer sees connections, an L7 one sees URLs and headers."],"t":"Seven layers that name where a networking problem lives.","p":"Reciting all seven layers but not being able to say what an L4 versus L7 load balancer can see.","k":"L3 routes addresses, L4 moves connections, L7 understands requests.","q":["You need to route /api to one service and /images to another. Which layer must the balancer work at?","Layer 7","Layer 4","Layer 3","Layer 2","Only an application-layer device can read the URL path."],"i":["Routing rule by URL path silently ignored","The team added a path rule to a network load balancer that forwards TCP only. All traffic lands on one pool.","Move path routing to an L7 load balancer or reverse proxy","Add more backends to the pool => Traffic is still not split by path","Use a different port per service => Works but pushes routing onto clients","A device can only act on what its layer can see."],"a":["Why does everyone keep saying L4 and L7 in design reviews?","They describe what a device can inspect","L4 sees IPs and ports, L7 sees HTTP","Capability and cost differ by layer"]},"network protocols":{"e":["A protocol defines message format, order and error handling. Common ones: HTTP for request-response, WebSocket for two-way streams, gRPC for typed service calls over HTTP/2, MQTT for tiny IoT devices, SMTP for mail, DNS for naming, TLS for security. Choosing one is a trade between overhead, direction of flow, browser support and tooling."],"t":"Agreed rules for how machines talk, each built for a job.","p":"Picking a protocol because it is trendy rather than from the communication pattern: who talks first, how often, how big.","k":"Pick the protocol from the conversation shape.","q":["Thousands of battery sensors send small readings over flaky mobile networks. Best fit?","MQTT","SMTP","FTP","HTTP/1.1 with large headers","MQTT is lightweight, publish-subscribe and built for unreliable links."],"i":["Internal service calls dominate CPU with JSON parsing","Fifty microservices call each other with verbose JSON over HTTP/1.1, opening new connections each time.","Move hot internal paths to gRPC with persistent HTTP/2 connections","Compress JSON with gzip => Smaller on the wire but more CPU","Add more instances => Cost grows, per-call overhead stays","Binary, multiplexed protocols suit chatty service-to-service traffic."],"a":["How do you choose between HTTP, WebSocket and gRPC?","Who initiates and how often","Browser versus internal service","Overhead, typing and tooling"]},"rest architecture":{"e":["REST models the system as resources (/orders/42) manipulated with GET, POST, PUT, PATCH and DELETE. It is stateless, uses status codes meaningfully and benefits from HTTP caching. GET is safe, PUT and DELETE are idempotent, POST is neither. Its weaknesses are over-fetching and many round trips for complex screens."],"t":"Resources with URLs, acted on with standard HTTP verbs.","p":"Designing verbs in URLs such as /getUser or /createOrder, and returning 200 with an error body.","k":"Nouns in the URL, verbs in the method, truth in the status code.","q":["Which request is safe to retry blindly after a timeout?","PUT /users/7 with the full new profile","POST /payments","POST /orders","POST /emails/send","PUT is idempotent: repeating it leaves the same final state."],"i":["Duplicate orders after mobile network drops","The app retries POST /orders on timeout. Some first attempts had actually succeeded.","Require an idempotency key on POST and return the original result for repeats","Disable retries in the app => Users see failures and tap again manually","Dedupe orders nightly => Customers are already double-charged","Non-idempotent calls need an idempotency key to be retry-safe."],"a":["What makes an API RESTful rather than just JSON over HTTP?","Resource-oriented URLs","Correct verbs and status codes","Stateless requests that can be cached"]},"websockets":{"e":["A WebSocket starts as an HTTP request with an Upgrade header, then becomes a persistent two-way channel with tiny frame overhead. It suits chat, live dashboards and multiplayer state. The costs are operational: every connection holds memory on one server, load balancers need long timeouts, and you need heartbeats, reconnect logic and a pub/sub backbone to reach users on other servers."],"t":"One long-lived connection where both sides can send at any time.","p":"Forgetting that connections are stateful: you cannot just add servers without a way to route messages across them.","k":"Sockets are sticky; put pub/sub behind them.","q":["User A is connected to server 1 and user B to server 2. How does A's chat message reach B?","Server 1 publishes to a shared pub/sub that server 2 subscribes to","Server 1 opens a socket to user B","The load balancer copies it","It cannot work","Servers fan messages out through a broker because each holds only its own connections."],"i":["Chat messages arrive for some users only","You scaled from one to four socket servers. Messages reach only users connected to the same server as the sender.","Add a pub/sub layer such as Redis so all servers receive each message","Enable sticky sessions => Users stay put but still miss cross-server messages","Scale back to one large server => Works until it falls over","Horizontal scaling of sockets needs a message backbone between servers."],"a":["Why not just poll every second instead of using WebSockets?","Server can push instantly","Far less overhead per message","Cost is stateful connections to manage"]},"operating system fundamentals":{"e":["The kernel schedules processes on CPUs, gives each a private virtual address space, mediates files and sockets through system calls, and enforces limits such as open file descriptors. Server behaviour under load is mostly OS behaviour: context switches, page cache, socket buffers and descriptor limits decide how many connections a box really handles."],"t":"The layer that shares CPU, memory, disk and network among programs.","p":"Ignoring OS limits. Many \"mysterious\" outages are file descriptor or connection table limits, not code bugs.","k":"Every socket is a file descriptor, and descriptors run out.","q":["A server refuses new connections with \"too many open files\" at only 20% CPU. First fix?","Raise the file descriptor limit and fix descriptor leaks","Add more CPU","Restart the database","Increase disk size","Each connection consumes a descriptor; the default per-process limit is often 1024."],"i":["New connections rejected at low CPU","Logs show EMFILE errors. The process limit is 1024 descriptors and it holds thousands of idle keep-alive sockets.","Raise ulimit, tune keep-alive timeouts and check for leaked sockets","Scale up to a bigger instance => Same per-process limit, same failure","Reboot the server => Works for an hour, then recurs","Resource limits in the OS cap capacity long before hardware does."],"a":["What does the OS actually do for my web server?","Schedules it on CPUs","Gives it memory and file or socket handles","Enforces limits that cap connections"]},"processes threads":{"e":["A process has its own address space, so a crash stays contained but communication is costly. Threads in a process share memory, so they are cheap to create and talk easily, but need locks and one bug can kill all. Servers use thread pools, multiple processes, or an event loop with non-blocking I/O to handle many connections with few threads."],"t":"Processes are isolated programs; threads share memory inside one.","p":"Assuming more threads always means more throughput. Past the core count you mostly add context switching and memory.","k":"Processes isolate, threads share, and sharing needs locks.","q":["Why does Chrome run each tab as a separate process?","A crash or exploit in one tab cannot take down the others","Processes use less memory than threads","Threads cannot use the network","Processes start faster","Isolation is the main benefit of separate address spaces."],"i":["Latency climbs after raising the thread pool to 2000","A blocking-I/O service on 8 cores was \"tuned\" from 200 to 2000 threads. CPU shows heavy context switching.","Size the pool to the workload and move slow I/O to async or a queue","Raise it to 5000 threads => More switching and memory, worse latency","Add RAM => Stacks fit, CPU thrash remains","Threads beyond what cores and I/O can use become pure overhead."],"a":["Should I use threads or separate processes for workers?","Isolation versus cheap sharing","Shared memory needs synchronisation","Cost of context switches and memory"]},"concurrency parallelism":{"e":["Concurrency structures a program so many tasks make progress by interleaving, even on one core, which is ideal for I/O-bound work that mostly waits. Parallelism executes on several cores simultaneously, which helps CPU-bound work. Shared mutable state creates race conditions and deadlocks; the cures are locks, immutability, message passing or single-threaded event loops."],"t":"Concurrency is juggling tasks; parallelism is doing them at once.","p":"Using the two words interchangeably. An event loop is highly concurrent with zero parallelism.","k":"Concurrency is about structure, parallelism is about cores.","q":["A service spends 95% of each request waiting on database calls. What helps most?","Async, non-blocking I/O to handle many waits concurrently","More CPU cores","Faster CPU clock","Rewriting loops in assembly","I/O-bound work benefits from concurrency; cores sit idle while it waits."],"i":["Inventory count goes negative during a sale","Two requests read stock = 1 at the same moment, both pass the check and both decrement.","Make the check-and-decrement atomic with a conditional update or lock","Add a retry on failure => The race still lets both through","Run the job on one server => Still races between threads","Read-modify-write on shared state must be atomic."],"a":["What's a race condition and how do you prevent one?","Outcome depends on timing of interleaved operations","Shared mutable state is the cause","Fix with atomic operations, locks or no sharing"]},"memory management":{"e":["Each process sees virtual memory mapped to physical pages. The stack holds call frames; the heap holds objects that live longer. Languages either free memory manually or use garbage collection, which can pause the program. When RAM runs out the OS swaps to disk, which is thousands of times slower, or the OOM killer terminates a process."],"t":"How programs get, use and give back RAM.","p":"Ignoring GC pauses and swap when explaining tail latency. p99 spikes are often memory, not code.","k":"If it swaps, it is down.","q":["A Java service has good average latency but periodic 2 second freezes. Likely cause?","Stop-the-world garbage collection pauses","DNS lookups","A slow disk on the client","TCP handshakes","Large heaps with long-lived garbage cause GC pauses that stall all threads."],"i":["Service killed every few hours, restarts cleanly","Memory grows steadily until the container hits its limit and is OOM-killed. An in-process map caches results with no eviction.","Bound the cache with a size limit and eviction policy","Double the container memory => It dies every eight hours instead of four","Restart on a timer => Hides the leak and drops requests","Unbounded in-memory structures are leaks with a delay."],"a":["Why would a service with free CPU still have latency spikes?","GC pauses stop the world","Swapping to disk is very slow","Memory pressure triggers the OOM killer"]},"cpu i o basics":{"e":["CPU-bound work (encoding, hashing, parsing) is limited by cores. I/O-bound work (disk, network, database) mostly waits, so one core can serve thousands of requests with non-blocking I/O. Memory access takes nanoseconds, SSD reads tens to hundreds of microseconds, a cross-region round trip tens to hundreds of milliseconds. Sequential I/O beats random I/O by a wide margin."],"t":"Work either burns CPU or waits on I/O; they scale differently.","p":"Scaling by adding cores when the bottleneck is I/O wait.","k":"Find out whether you are burning or waiting before you scale.","q":["CPU is at 15% but requests are slow and \"iowait\" is high. Where is the bottleneck?","Disk or network I/O","Too few cores","The CPU cache","The compiler","High iowait means threads are blocked waiting for I/O."],"i":["Thumbnail service times out at peak","Image resizing runs on the web request threads. All cores sit at 100% and health checks fail.","Move resizing to a worker queue and scale workers by cores","Make web requests async => Async does not create CPU; it still starves","Increase request timeout => Queue grows and the box falls over","CPU-bound work must be isolated and scaled by cores, not hidden behind async."],"a":["How do you tell if a service is CPU-bound or I/O-bound, and why care?","CPU usage versus wait time","CPU-bound scales with cores","I/O-bound scales with concurrency"]},"linux fundamentals":{"e":["Everything is a file: sockets, devices, process info under /proc. Know processes and signals, permissions, systemd services, and the triage tools: top or htop for CPU and memory, df and du for disk, free for RAM, ss or netstat for sockets, iostat for disk I/O, journalctl and log files, curl and dig for network checks. Containers are Linux namespaces plus cgroups."],"t":"The OS under almost every server, and the tools to see inside it.","p":"Jumping to code changes during an incident before checking disk, memory, CPU and sockets on the box.","k":"Check disk, memory, CPU and sockets before blaming code.","q":["A healthy service suddenly cannot write logs or accept uploads. Fastest first check?","df -h to see if the disk is full","Reinstall the app","Rotate the TLS certificate","Upgrade the kernel","A full disk is among the most common causes of sudden write failures."],"i":["Database refuses writes at 3 AM","Errors say \"no space left on device\". Old debug logs have grown to fill the volume.","Free space by removing or compressing old logs, then add log rotation","Restart the database => It still has no space","Add CPU => Unrelated to the failure","Disks fill silently; rotation and disk alerts prevent it."],"a":["A server feels slow. What do you check first, and with what?","CPU and memory with top","Disk space and I/O with df and iostat","Connections with ss and logs with journalctl"]},"what is system design":{"e":["System design turns requirements into components (clients, services, databases, caches, queues), their interfaces and the data flow between them, sized for expected load and failure. There is no single right answer; the skill is stating assumptions, estimating scale, picking components for reasons, and naming what each choice costs."],"t":"Deciding the parts of a system and how they work together at scale.","p":"Jumping straight to boxes and technology names before clarifying requirements and scale.","k":"Requirements, numbers, design, trade-offs: in that order.","q":["An interviewer says \"Design Twitter\". Best first move?","Ask which features and what scale matter","Draw a load balancer","Choose Cassandra","Start writing the schema","Scope and scale decide every later choice."],"i":["Design review stalls after an hour of arguing databases","Nobody has written down expected users, read/write ratio or which features are in scope.","Pause and agree functional scope and rough numbers first","Vote on the database => A choice with no criteria gets reopened next week","Let the most senior person decide => Decision is unexplained and fragile","Design choices only make sense against stated requirements and scale."],"a":["What are you actually producing when you \"design a system\"?","Components and their responsibilities","Data flow and interfaces","Justified trade-offs against requirements"]},"what is software architecture":{"e":["Architecture is the set of choices about how a system is divided, how the pieces communicate, where data lives and which qualities (scalability, availability, maintainability) are favoured. Good architecture makes likely changes cheap and keeps failures contained. It is recorded so later teams know why, not just what."],"t":"The big structural decisions that are expensive to change later.","p":"Equating architecture with a diagram. The diagram is the output; the reasoning and constraints are the architecture.","k":"Architecture is the decisions you would regret changing.","q":["Which is most clearly an architectural decision?","Splitting a monolith into services with separate databases","Renaming a variable","Choosing a button colour","Fixing a typo in a log line","It changes structure, data ownership and is costly to reverse."],"i":["Every feature touches eight teams","Business logic is spread across services with no clear ownership, so small changes need coordinated releases.","Redraw boundaries around business capabilities with clear data ownership","Add a release manager => Coordination is formalised, coupling remains","Freeze features for a rewrite => Business stalls with no guarantee","Structure decides how independently teams can change things."],"a":["How is architecture different from just writing good code?","Structural, cross-cutting decisions","Driven by quality attributes","Hard to reverse, so reasons are recorded"]},"monolithic architecture":{"e":["All features run in one process and ship together. It is simple to build, test, debug and deploy, and in-process calls are fast and transactional. As it grows, builds slow down, one bug can take down everything, and you must scale the whole thing even if one part is hot. A modular monolith keeps clear internal boundaries to delay those pains."],"t":"One codebase, one deployable, usually one database.","p":"Calling monoliths bad. For a small team or a new product they are usually the right choice.","k":"Start with a well-structured monolith; split when pain is real.","q":["A five-person startup is building its first product. Sensible default?","A modular monolith","Thirty microservices","One service per database table","A service mesh first","Small teams gain little from distribution and pay heavily for it."],"i":["One memory leak in reports takes down checkout","Everything runs in one process; the report module exhausts the heap and the whole app restarts.","Isolate the risky module as its own process or service","Add RAM to all instances => The leak fills it again","Split everything into microservices this sprint => Huge risk for one faulty module","A monolith shares fate; isolate the parts that fail differently."],"a":["When is a monolith the right answer?","Small team and unclear domain","Simple deploys and transactions","Split only when scaling or team pain appears"]},"microservices architecture":{"e":["Each service covers one business capability, has its own database and is released on its own schedule. Teams move independently and hot paths scale separately. In return you get network calls that fail, no cross-service transactions, harder debugging and heavy operational needs: service discovery, tracing, CI/CD and on-call per service."],"t":"Small services, each owning its data and deploying independently.","p":"Splitting into services that still share one database. That is a distributed monolith with all the costs and none of the benefits.","k":"Independent deploys need independent data.","q":["Strongest reason to move to microservices?","Many teams blocked by one shared release train","It is the modern approach","To use more languages","To reduce the number of servers","The main benefit is organisational: independent teams and deploys."],"i":["A schema change in Orders breaks four other services","All services read the same tables directly. A renamed column took down billing and shipping.","Give each service its own data and expose it through APIs or events","Add a shared schema review board => Slows everyone, coupling remains","Freeze schema changes => Product work halts","Shared databases couple services tighter than any API."],"a":["What do you give up when you go from a monolith to microservices?","Simple transactions and debugging","Reliable in-process calls","Operational simplicity"]},"service oriented architecture soa":{"e":["SOA exposes business functions as reusable services that communicate through an enterprise service bus, often with shared schemas and a shared database. It predates microservices and favours reuse and central governance. Microservices keep the service idea but prefer dumb pipes, independent data and decentralised ownership."],"t":"Enterprise services sharing a central bus and common contracts.","p":"Saying SOA and microservices are the same. The key differences are the smart central bus and shared data.","k":"SOA: smart bus, shared data. Microservices: dumb pipes, own data.","q":["What most distinguishes classic SOA from microservices?","A central bus holding routing and transformation logic","Use of HTTP","Use of JSON","Having more than one service","Microservices push logic to the endpoints and keep the transport simple."],"i":["Every team waits weeks for the integration team","All routing and data transformation lives in a central bus owned by one team.","Move logic into the services and keep the transport simple","Hire more people for the bus team => Bottleneck grows with the organisation","Add a second bus => Two bottlenecks to coordinate","Centralised integration logic becomes an organisational bottleneck."],"a":["How is SOA different from microservices?","Central ESB versus simple messaging","Shared versus per-service data","Central governance versus team autonomy"]},"three tier architecture":{"e":["The web or mobile front end talks to an application tier holding business logic, which talks to a database tier. Each tier scales and is secured separately: the stateless app tier scales out behind a load balancer, while the database sits in a private network. It is the default shape of most web systems."],"t":"Presentation, application logic and data, each on its own tier.","p":"Letting the presentation tier talk to the database directly, bypassing logic and security.","k":"UI asks, logic decides, data stores.","q":["In a three-tier web app, which tier is easiest to scale horizontally?","The stateless application tier","The primary database","The user's browser","The DNS records","Stateless servers can be added freely behind a load balancer."],"i":["Database credentials found in the mobile app","The app connects straight to the database to \"save a hop\".","Put an application tier in between and keep the database private","Rotate the password => The new one ships in the next build","Obfuscate the credentials => Extracted again in a day","Tiers are also security boundaries."],"a":["Why not let the app talk to the database directly?","Business rules belong in one place","Database stays off the public network","Tiers scale independently"]},"layered architecture":{"e":["A typical stack is presentation, application or service, domain, and data access. Each layer depends only on the one below, so you can change the database or UI without rewriting business rules. The risk is \"sinkhole\" layers that just pass calls through, and changes that cut across every layer."],"t":"Code organised in layers that only call downward.","p":"Confusing layers (logical code organisation) with tiers (physical deployment).","k":"Layers are in the code; tiers are on the network.","q":["Main benefit of keeping SQL out of controllers?","Business logic can be tested and changed without touching storage details","Queries run faster","Fewer files","Smaller binaries","Separation of concerns keeps changes local."],"i":["Swapping the database is quoted at six months","SQL strings are scattered across UI handlers and business code.","Introduce a data access layer and move queries behind it gradually","Rewrite everything for the new database at once => Long freeze with high risk","Keep both databases forever => Double the maintenance","Layer boundaries decide how local a change stays."],"a":["What's the point of layers if they just call each other?","Separation of concerns","Swap or test a layer in isolation","Dependencies point one way"]},"event driven architecture":{"e":["Producers publish events such as OrderPlaced to a broker; consumers subscribe and act. Producers do not know who listens, so adding a consumer needs no change upstream, and bursts are buffered. The costs are eventual consistency, harder tracing, duplicate and out-of-order delivery, and the need for idempotent consumers."],"t":"Services announce what happened; others react on their own.","p":"Assuming events arrive once and in order. Design consumers to tolerate duplicates and reordering.","k":"Publish facts, not commands; consumers must be idempotent.","q":["Marketing wants an email on every signup. In an event-driven system you would:","Add a consumer of the UserSignedUp event","Modify the signup service to call the email API","Add a column to the users table","Poll the database every minute","New behaviour attaches as a new subscriber without changing the producer."],"i":["Customers received the same refund twice","The broker redelivered RefundRequested after a consumer timeout and the handler ran again.","Make the handler idempotent using the event ID","Turn off redelivery => Lost events instead of duplicates","Increase consumer timeout => Fewer duplicates, never zero","At-least-once delivery means every handler must tolerate repeats."],"a":["Why use events instead of direct calls?","Loose coupling between services","Buffering and independent scaling","Cost is eventual consistency and duplicates"]},"serverless architecture":{"e":["You deploy functions triggered by HTTP, queues or schedules and pay per invocation. Scaling to zero and to thousands is automatic. Limits are cold starts, execution time caps, statelessness, and connection storms against databases. It suits spiky, event-driven or low-traffic workloads more than steady high-throughput ones."],"t":"Functions run on demand; the provider manages servers and scaling.","p":"Claiming serverless is always cheaper. At steady high volume, always-on instances usually cost less.","k":"Great for spiky and idle, pricey for steady and heavy.","q":["Best fit for serverless functions?","Resizing images when files are uploaded","A low-latency trading engine","A long-running video encode of two hours","A stateful game server","Event-triggered, short, bursty work matches the model."],"i":["Database refuses connections during a traffic spike","Thousands of function instances each opened their own database connection.","Put a connection pooler or data API between functions and the database","Raise max connections to 20,000 => Database runs out of memory","Add function retries => More instances, more connections","Serverless scales faster than a database's connection limit."],"a":["What are the catches with serverless?","Cold starts and time limits","Stateless, so state lives elsewhere","Cost and connection limits at high volume"]},"distributed systems basics":{"e":["Work is spread across nodes for scale and fault tolerance. The price: networks drop and delay messages, nodes crash independently, clocks disagree, and you often cannot tell a slow node from a dead one. Designs therefore rely on timeouts, retries with idempotency, replication and explicit consistency choices."],"t":"Many machines cooperating over an unreliable network.","p":"Assuming the network is reliable and calls either succeed or fail. The third outcome is \"unknown\".","k":"A timeout means you do not know what happened.","q":["A payment call times out. What do you know?","Nothing certain: it may or may not have been applied","It definitely failed","It definitely succeeded","The server is down","The request or the reply may have been lost."],"i":["Customer charged twice after a timeout","The client retried a charge call that had actually succeeded; only the reply was lost.","Use idempotency keys so retries return the original result","Never retry payments => Genuine failures now lose sales","Double the timeout => Rarer, still happens","Retries are only safe when the operation is idempotent."],"a":["What makes distributed systems harder than one big machine?","Partial failure","Unreliable network and no shared clock","Cannot distinguish slow from dead"]},"stateful vs stateless systems":{"e":["A stateless service keeps session and data in external stores, so any instance can serve any request and you scale by adding instances. Stateful components (databases, caches, socket servers) hold data in memory or on disk, so they need replication, careful failover and routing to the right node."],"t":"Stateless servers remember nothing between requests; stateful ones do.","p":"Storing sessions in server memory and then being surprised that scaling out logs users out.","k":"Push state out of the app tier and scaling becomes easy.","q":["Users get logged out randomly after adding a second app server. Why?","Sessions live in each server's memory","The database is slow","The load balancer is too fast","Cookies expired","Requests landing on the other server find no session."],"i":["Users logged out on every deploy","Sessions are stored in process memory and each rolling restart wipes them.","Move sessions to a shared store such as Redis or use signed tokens","Enable sticky sessions => Restart still wipes that server's users","Deploy only at night => Fewer complaints, same bug","Externalised state lets servers be disposable."],"a":["Why do people insist app servers be stateless?","Any instance can serve any request","Easy horizontal scaling and failover","State moves to a shared store"]},"synchronous vs asynchronous communication":{"e":["Synchronous calls (HTTP, gRPC) block the caller until a reply, which is simple and gives immediate results, but couples availability and adds latency per hop. Asynchronous messaging through queues lets the caller continue; work is buffered and retried, which smooths spikes and isolates failures, at the cost of eventual consistency and harder tracing."],"t":"Wait for the answer now, or hand off and continue.","p":"Chaining many synchronous calls. Availability multiplies: five services at 99.9% give about 99.5%.","k":"Sync for answers you need now; async for everything else.","q":["Checkout must send a confirmation email. Best approach?","Publish an event and send the email asynchronously","Call the email service and wait","Send it from the browser","Skip the email if busy","The user should not wait on, or fail because of, the email provider."],"i":["Checkout fails whenever the email provider is slow","Order placement calls email, loyalty and analytics synchronously before responding.","Keep only payment in the request path and queue the rest","Raise all timeouts to 30 seconds => Checkout hangs instead of failing","Add retries to each call => Latency and load triple","Only what the user must know now belongs in the synchronous path."],"a":["How do you decide whether a call should be sync or async?","Does the user need the result now","Coupling of availability and latency","Async needs queues and idempotency"]},"architectural trade offs":{"e":["Common tensions: consistency versus availability, latency versus durability, simplicity versus flexibility, cost versus redundancy, read speed versus write speed. A good design states the requirement that decides each choice and what was given up. There is no best architecture, only one that fits these constraints."],"t":"Every design choice buys one quality by spending another.","p":"Presenting a choice as free. If you cannot name what it costs, you have not understood it.","k":"Name the cost of every choice out loud.","q":["You add a cache in front of the database. What did you trade?","Freshness and simplicity for speed","Nothing","Security for speed","Speed for durability","Cached data can be stale and invalidation adds complexity."],"i":["Team split over SQL versus NoSQL for a week","Arguments are about preferences. Nobody has listed access patterns, consistency needs or scale.","Write the requirements down and score each option against them","Pick the newest technology => Unknown failure modes in production","Use both everywhere => Double the operational load","Trade-offs are settled by requirements, not opinions."],"a":["How do you justify picking one design over another?","Tie it to a requirement","State what is sacrificed","Explain when you would choose differently"]},"functional requirements":{"e":["Functional requirements list the features: post a tweet, follow a user, view a timeline. In a design discussion you pick the three to five core ones, state what is out of scope, and derive APIs and data models from them. They define correctness: the system either does these things or it does not."],"t":"What the system must do, as user-visible behaviour.","p":"Trying to cover every feature. A focused core design beats a shallow tour of twenty features.","k":"Three to five core features, written down, the rest out of scope.","q":["Which is a functional requirement?","Users can upload a profile photo","The API responds within 200 ms","The service is available 99.99%","Data is encrypted at rest","It describes behaviour, not a quality of the system."],"i":["Launch slips because scope keeps growing","Each review adds features; nobody recorded what version one must do.","Agree a short must-have list and park the rest","Add engineers => More people building unclear scope","Build everything at lower quality => Nothing works well","Explicit scope is what makes a design finishable."],"a":["How do you pick what to design when the prompt is huge?","Clarify core use cases","State what is out of scope","Derive APIs and data from them"]},"non functional requirements":{"e":["These are the quality targets: latency (p99 under 200 ms), availability (99.9%), scale (10M daily users), consistency, durability, security and cost. They drive the architecture far more than features do. The same feature list leads to very different designs at 1,000 users and at 100 million."],"t":"How well the system must do it: speed, uptime, scale, safety.","p":"Leaving them vague (\"fast\", \"scalable\"). Without numbers you cannot choose or reject a design.","k":"Features tell you what to build; numbers tell you how.","q":["Which requirement most changes the architecture of a chat app?","100M concurrent users with sub-second delivery","Supporting emoji","Having a dark theme","Allowing profile names","Scale and latency targets force sharding, sockets and fan-out design."],"i":["System passes all feature tests, collapses on launch day","Nobody specified expected traffic or latency, so it was never load tested.","Define target load and latency, then test against them","Add servers until it stops crashing => Costly guesswork","Blame the cloud provider => Problem recurs","Unstated quality targets are untested quality targets."],"a":["Why do interviewers care so much about non-functional requirements?","They decide the architecture","Must be quantified","They conflict and need trade-offs"]},"scalability":{"e":["A scalable system grows throughput roughly in proportion to added machines. That needs stateless services, partitioned data and no shared bottleneck. Scale has three axes: more requests, more data and more complexity. Find the bottleneck first; scaling the wrong tier adds cost and nothing else."],"t":"Handling more load by adding resources, without a redesign.","p":"Saying \"we'll add more servers\" when the bottleneck is a single database.","k":"You can only scale past the bottleneck you have found.","q":["App servers doubled, throughput unchanged. Most likely reason?","A shared dependency such as the database is the bottleneck","Servers are too new","The load balancer prefers old servers","Users noticed","Adding capacity outside the bottleneck changes nothing."],"i":["Doubling app servers did not help the sale-day crash","App CPU is at 20%; the single primary database is at 100% with lock waits.","Relieve the database with caching, read replicas or query fixes","Double the app servers again => More connections make the database worse","Add a bigger load balancer => It was never the limit","Scale the constrained resource, not the visible one."],"a":["What does it mean for a system to be scalable?","Capacity grows with resources","No single shared bottleneck","Stateless compute and partitioned data"]},"availability":{"e":["Availability is measured in nines: 99.9% allows about 8.8 hours of downtime a year, 99.99% about 53 minutes. It comes from redundancy with automatic failover, health checks, multiple zones and safe deploys. Components in series multiply their availabilities; redundant components in parallel multiply their failure rates."],"t":"The fraction of time the system answers correctly.","p":"Promising five nines without counting dependencies in series, each of which lowers the total.","k":"Three nines is about 9 hours a year; four nines about 53 minutes.","q":["A request passes through three services, each 99.9% available. Overall availability is about:","99.7%","99.9%","99.99%","100%","Serial dependencies multiply: 0.999 cubed is roughly 0.997."],"i":["Whole region outage took the product down for 3 hours","Everything runs in one availability zone; the zone lost power.","Run redundant instances across zones with automatic failover","Write a faster runbook => Still manual, still hours","Buy bigger servers in the same zone => Same single point of failure","Availability needs redundancy that does not share the same failure."],"a":["How do you design for 99.99% availability?","Remove single points of failure","Automatic failover across zones","Account for serial dependencies"]},"reliability":{"e":["Reliability is about correctness over time: no lost data, no wrong answers, predictable behaviour under faults. A system can be available yet unreliable if it responds with errors or stale results. It is built with redundancy, retries, idempotency, testing, monitoring and practised recovery, and measured by MTBF and MTTR."],"t":"Doing the right thing consistently, even when parts fail.","p":"Using reliability and availability as synonyms. Up but wrong is available, not reliable.","k":"Available means it answers; reliable means the answer is right.","q":["A service responds to every request but 2% return corrupted data. It is:","Available but not reliable","Reliable but not available","Both","Neither","It is up, yet not producing correct results."],"i":["Reports show totals that do not match orders","A consumer silently drops messages it fails to parse; the pipeline shows green.","Send failures to a dead letter queue and alert on it","Restart the consumer nightly => Dropped data stays dropped","Add a second consumer => Two consumers dropping messages","Silent failure is the enemy of reliability; make errors visible."],"a":["What's the difference between reliable and available?","Correctness versus responsiveness","Faults should not become failures","Measured by MTBF and MTTR"]},"maintainability":{"e":["Most cost comes after launch: fixing bugs, adding features, onboarding engineers, operating at 3 AM. Maintainable systems are simple, modular, observable and well documented, with automated tests and deploys. Every extra technology, service or clever trick is a permanent tax on the team."],"t":"How easily people can change, operate and understand the system.","p":"Over-engineering for imaginary scale. Complexity you do not need is the main threat to maintainability.","k":"The simplest design that meets the requirements wins.","q":["Which choice most improves maintainability?","Fewer moving parts with clear ownership and good logs","Adding a new database per feature","Clever undocumented optimisations","One giant shared utility service","Simplicity and observability lower the cost of every later change."],"i":["Only one engineer can deploy, and she is on leave","Releases need forty manual steps kept in her notes.","Automate the pipeline and document it in the repository","Ask her to deploy from holiday => Works once, risk remains","Delay all releases => Fixes pile up","Operability is part of maintainability; automate what one person knows."],"a":["How do you keep a system maintainable as it grows?","Keep it simple and modular","Automate tests, deploys and monitoring","Document decisions and ownership"]},"fault tolerance":{"e":["Faults are inevitable: disks die, nodes crash, networks split. A fault-tolerant system detects the fault and continues, perhaps degraded, using redundancy, replication, failover, timeouts, retries and isolation. The goal is to stop one fault becoming a full failure. You only know it works if you test by injecting faults."],"t":"Keep working when a component fails.","p":"Adding a standby that has never been failed over to. Untested redundancy often fails when needed.","k":"A failover you have not tested is a hope, not a plan.","q":["Best evidence that a system tolerates a database node failure?","You regularly kill a node in production-like conditions and it recovers","The vendor says so","There are two nodes","It has never failed yet","Only exercised failover is trustworthy."],"i":["Primary database died; standby promotion failed","The standby had been 6 hours behind for weeks and nobody had rehearsed a failover.","Monitor replication lag and run failover drills","Buy a third standby => Three untested replicas","Extend the maintenance window => Does nothing for unplanned failure","Redundancy must be monitored and exercised."],"a":["How do you make a system survive a server dying?","Redundancy and replication","Detection plus automatic failover","Isolation so faults do not spread"]},"performance":{"e":["Measure with percentiles, not averages: p50 shows the typical case, p99 the bad experience. Performance work means finding the bottleneck (CPU, memory, disk, network, locks, a slow query) and removing it through indexes, caching, batching, parallelism or better algorithms. Always measure before and after."],"t":"How fast and how much: latency and throughput under load.","p":"Quoting average latency. One slow request in a hundred still hits most users who make many requests.","k":"Measure p99, find the bottleneck, then optimise.","q":["Average latency is 50 ms but users complain. What should you look at?","p99 latency","The mean again","CPU model","Lines of code","Tail latency reveals the slow requests that averages hide."],"i":["Dashboard says 60 ms average; support says the app is slow","p99 is 4 seconds. One endpoint runs an unindexed query for large accounts.","Find the slow endpoint from percentiles and add the missing index","Add app servers => The query is still slow","Cache everything for an hour => Stale data and the miss is still slow","Tail latency points to the real bottleneck."],"a":["Why not just report average response time?","Averages hide the tail","Users feel p95 and p99","Optimise the measured bottleneck"]},"latency throughput":{"e":["They are linked through queuing: as load approaches capacity, latency rises sharply, not linearly. Batching raises throughput but adds latency; parallelism lowers latency until resources saturate. Track latency as percentiles and throughput as QPS, and keep utilisation headroom so bursts do not explode queue times."],"t":"Latency is time per request; throughput is requests per second.","p":"Running servers at 95% utilisation to \"be efficient\". Near saturation, small bursts cause huge latency.","k":"Latency explodes long before you reach 100% utilisation.","q":["Why does latency spike when a server goes from 70% to 95% utilisation?","Requests queue, and queue time grows steeply near capacity","The CPU overheats","Packets get bigger","Users type slower","Queueing delay rises non-linearly as utilisation approaches one."],"i":["p99 jumps from 80 ms to 3 s at evening peak","Throughput rose only 15% but servers moved from 75% to 93% CPU.","Add capacity to restore headroom, then set autoscaling at about 60%","Increase request timeouts => Queues get longer","Enable more aggressive retries => Extra load pushes it over","Headroom is what keeps latency flat under bursts."],"a":["Can you have high throughput and low latency at the same time?","They trade through batching and queuing","Latency climbs near saturation","Keep headroom and measure percentiles"]},"consistency":{"e":["Strong consistency means a read after a write always returns that write, which needs coordination and costs latency or availability. Eventual consistency lets replicas lag briefly in exchange for speed and uptime. Pick per use case: balances and inventory need strong; likes, feeds and view counts tolerate eventual."],"t":"Whether every reader sees the same, latest data.","p":"Demanding strong consistency everywhere. It is the most expensive property, so spend it only where wrong data hurts.","k":"Strong where money moves, eventual where it does not.","q":["Which feature can safely be eventually consistent?","The like count on a post","A bank balance during withdrawal","Seat allocation at checkout","A password change","A slightly stale counter harms nobody."],"i":["User updates profile, refreshes, sees the old name","Writes go to the primary; the read came from a replica 2 seconds behind.","Read your own writes from the primary for a short window","Remove all replicas => Primary overloads","Tell users to wait => Bug reports keep coming","Replica lag needs read-your-writes handling for the writer."],"a":["Why not make everything strongly consistent?","Needs coordination, so slower","Reduces availability during partitions","Many features tolerate stale data"]},"durability":{"e":["Durability comes from writing to stable storage before acknowledging (write-ahead log, fsync) and copying data to other machines and regions. More copies and synchronous replication raise durability and write latency. Backups protect against what replication cannot: bugs and bad deletes, wh
