ts fired only on error rate; a service that reports nothing has no errors.","Alert on absent metrics and failed scrapes as well","Lower the error threshold => Still nothing to measure","Add more dashboards => Nobody watching at 3 AM","Silence is a signal; alert on missing data."],"a":["How does Prometheus work?","Pull-based scraping with service discovery","Time series plus PromQL","Alertmanager; add long-term storage separately"]},"grafana":{"e":["Grafana queries sources such as Prometheus, Loki, Elasticsearch and SQL databases and renders panels. Good dashboards start from user-facing symptoms (latency, errors, throughput) and drill down into causes, with consistent layouts across services. It stores no telemetry itself."],"t":"Dashboards and alerts on top of your data sources.","p":"Building walls of graphs nobody can read during an incident.","k":"Symptoms at the top, causes below.","q":["What should the top row of a service dashboard show?","User-facing signals such as error rate and latency","Kernel version","Every host's CPU individually","Raw logs","Start with what users experience."],"i":["During an outage nobody can find the right graph among 60 dashboards","Dashboards grew ad hoc, each with different names and layouts.","Standardise a per-service overview with golden signals first","Add a 61st dashboard => More noise","Print them out => Not helpful","Consistent, symptom-first dashboards speed diagnosis."],"a":["How do you design a useful dashboard?","Golden signals first","Drill down from symptom to cause","Consistent, minimal, linked to alerts"]},"elk stack":{"e":["Agents ship logs to Logstash or Beats for parsing, Elasticsearch indexes them for full-text search and aggregation, and Kibana provides search and dashboards. It is powerful and resource-hungry: index size, shard counts, mappings and retention need management, often with hot, warm and cold tiers."],"t":"Elasticsearch, Logstash and Kibana for searchable logs.","p":"Keeping every debug log forever. Storage and cluster health suffer.","k":"Ship, index, search; manage retention.","q":["What does Elasticsearch contribute in ELK?","Indexing and fast search over logs","Collecting logs from hosts","Drawing charts","Paging engineers","It is the search and storage engine."],"i":["Log cluster turns red and stops ingesting","Disks filled because indices are never deleted.","Apply retention policies with index lifecycle management","Add nodes forever => Cost without end","Stop logging => Blind","Log storage needs explicit retention and tiering."],"a":["What is the ELK stack used for?","Central log search and analysis","Logstash or Beats ingest, Elasticsearch indexes, Kibana views","Needs retention and sizing management"]},"alerting":{"e":["Good alerts fire on user-facing symptoms (error rate, latency, SLO burn), are urgent and actionable, and link to a runbook. Causes and warnings go to tickets or dashboards. Too many noisy alerts cause fatigue and real ones are missed. Route by severity and review every page afterwards."],"t":"Paging a human only when action is needed.","p":"Alerting on every cause, such as CPU above 80%, instead of user impact.","k":"Page on symptoms; every page must be actionable.","q":["Which alert deserves a page at 3 AM?","Checkout error rate above 5% for 5 minutes","One host at 85% CPU","A single failed health check","Disk at 60%","It reflects real user impact needing action."],"i":["On-call engineer ignored the real outage alert","It arrived among 300 low-value alerts that night.","Remove non-actionable alerts and page only on SLO-based symptoms","Add a louder ringtone => Fatigue remains","Add more on-call staff => More people ignoring noise","Alert fatigue hides real incidents."],"a":["What makes a good alert?","Symptom-based and tied to user impact","Actionable with a runbook","Low noise, severity-routed"]},"sli slo sla":{"e":["A Service Level Indicator is a measured ratio, such as the share of requests under 300 ms. A Service Level Objective is the internal target for it, such as 99.9% over 30 days. A Service Level Agreement is an external promise with penalties, set looser than the SLO. SLOs focus effort on what users feel."],"t":"The measurement, the target, and the contract.","p":"Confusing them, or setting an SLO of 100%.","k":"SLI measures, SLO targets, SLA promises.","q":["\"99.9% of requests succeed over 30 days\" is an example of:","An SLO","An SLI","An SLA penalty","A runbook","It is a target for an indicator."],"i":["Team is paged constantly yet customers still complain","Alerts track CPU and memory; nothing measures the user's experience.","Define SLIs for user journeys and set SLOs to drive alerts","Add more infrastructure alerts => More noise","Promise 100% uptime => Impossible","Measure what users experience."],"a":["Explain SLI, SLO and SLA.","SLI: measured indicator","SLO: internal target","SLA: external contract with consequences"]},"error budgets":{"e":["An SLO of 99.9% leaves a 0.1% budget, about 43 minutes a month. While budget remains, teams ship features and take risks. When it is exhausted, releases slow and work shifts to reliability. It turns \"how reliable is enough?\" into a number both product and engineering accept."],"t":"The amount of failure your SLO allows, to spend deliberately.","p":"Treating reliability as \"as high as possible\" with no trade-off against delivery.","k":"100% minus the SLO is yours to spend.","q":["A team has burned its monthly error budget in week two. The policy says:","Slow feature releases and prioritise reliability work","Ship faster","Raise the SLO","Ignore it","The budget governs risk."],"i":["Product and engineering argue weekly about release pace","There is no agreed measure of acceptable unreliability.","Adopt SLOs with an error budget policy","Let whoever shouts loudest win => Recurring conflict","Freeze releases permanently => Product stalls","An error budget makes the trade-off explicit."],"a":["What is an error budget and how is it used?","Allowed unreliability from the SLO","Spend on releases and experiments","Exhausted budget shifts focus to stability"]},"root cause analysis":{"e":["After mitigation, reconstruct the timeline and ask why repeatedly until you reach systemic causes: a missing test, an unsafe default, a gap in monitoring. Most incidents have several contributing factors. Write a blameless postmortem with concrete, owned action items."],"t":"Finding why an incident happened, beyond the trigger.","p":"Stopping at \"human error\". Ask why the system allowed that error to cause an outage.","k":"Ask why until you reach the system, not the person.","q":["A postmortem concludes \"engineer ran the wrong command\". Better conclusion?","The tooling allowed a destructive command on production without safeguards","Fire the engineer","It will not recur","Bad luck","Fix the conditions, not the individual."],"i":["The same outage happens a third time","Earlier postmortems each ended with \"be more careful\".","Identify systemic causes and add guardrails with owned actions","Send a stern email => No change to the system","Add a checklist item nobody reads => Same result","Blameless, systemic fixes prevent recurrence."],"a":["How do you run a root cause analysis?","Timeline and contributing factors","Ask why to reach systemic causes","Blameless postmortem with owned actions"]},"incident management":{"e":["Detect, declare, assign roles (incident commander, communications, operations), mitigate first, communicate regularly, then resolve and review. Restore service before investigating causes: roll back, fail over or disable the feature. Severity levels set the response. Afterwards, hold a blameless review."],"t":"The organised response when production breaks.","p":"Debugging the root cause while users are still down, instead of rolling back.","k":"Mitigate first, diagnose later, communicate throughout.","q":["A deploy 10 minutes ago coincides with a spike in errors. First action?","Roll back the deploy","Start a deep code investigation","Wait and see","Add logging","Restore service, then investigate."],"i":["Outage lasted 2 hours; six engineers debugged in parallel with no coordination","Nobody was in charge and customers heard nothing.","Appoint an incident commander and roll back first","Add more engineers to the call => More confusion","Investigate until the cause is certain => Users stay down","Clear roles and mitigation-first shorten outages."],"a":["How do you handle a production incident?","Declare and assign roles","Mitigate before root cause","Communicate; blameless review after"]},"cloud computing fundamentals":{"e":["Clouds offer IaaS (virtual machines, networks), PaaS (managed runtimes and databases) and SaaS (finished applications). Benefits are elasticity, global reach and no upfront hardware. Under the shared responsibility model the provider secures the infrastructure and you secure your configuration, data and access."],"t":"Renting computing as an on-demand, metered service.","p":"Assuming the provider handles all security and backups.","k":"Rent elastic capacity; your configuration is still your responsibility.","q":["A storage bucket is left publicly readable. Under shared responsibility, whose fault is it?","The customer's","The cloud provider's","Nobody's","The internet's","Configuration belongs to the customer."],"i":["Monthly bill tripled with no growth in users","Test environments and oversized instances run around the clock.","Right-size, schedule shutdowns and tag resources for cost tracking","Negotiate a discount only => Waste continues","Move clouds => Same habits, same waste","Elastic resources must be turned off to save money."],"a":["What are the benefits and responsibilities of cloud?","Elastic, pay-per-use, managed services","IaaS, PaaS, SaaS models","Shared responsibility for security and cost"]},"aws gcp azure":{"e":["Each offers compute (EC2, Compute Engine, Virtual Machines), object storage (S3, Cloud Storage, Blob Storage), managed databases, load balancers, queues, functions and Kubernetes. In design discussions the concepts matter more than the brand. Choose by team skills, existing contracts, specific services and regions; multi-cloud adds heavy complexity."],"t":"The three big clouds, with equivalent building blocks.","p":"Answering design questions with product names instead of the underlying component and why.","k":"Name the building block first, the product second.","q":["Which statement is most useful in a design interview?","\"An object store such as S3 for the images\"","\"We use AWS\"","\"Azure is best\"","\"Google is faster\"","The component type and its role matter."],"i":["Multi-cloud project doubles the platform team's workload","Every service is deployed to two clouds \"to avoid lock-in\" with no business need.","Standardise on one cloud unless a requirement demands more","Add a third cloud => Triple the work","Build an abstraction over everything => Lowest common denominator","Multi-cloud has a real, ongoing cost."],"a":["Does it matter which cloud you pick?","Core primitives are equivalent","Choose by skills, services, regions, cost","Multi-cloud only with a strong reason"]},"compute services":{"e":["Virtual machines give full control and suit long-running or legacy workloads. Containers on an orchestrator pack services densely and deploy uniformly. Serverless functions scale to zero for event-driven bursts. Spot instances are cheap but can be reclaimed; reserved capacity is cheaper for steady load."],"t":"Where code runs: virtual machines, containers or functions.","p":"Running everything on VMs out of habit, or everything on functions out of fashion.","k":"Match compute to workload shape: steady, bursty or event-driven.","q":["Best compute for a fault-tolerant batch job where cost matters most?","Spot or preemptible instances","Reserved large VMs","A single laptop","Dedicated hosts","Interruptions are acceptable and price is lowest."],"i":["Nightly batch job costs more than the whole web tier","It runs on always-on, on-demand instances that sit idle 22 hours a day.","Run it on spot instances that start for the job and stop after","Buy bigger instances => Higher idle cost","Run it less often => Stale data","Compute should exist only while there is work."],"a":["How do you choose between VMs, containers and functions?","Control versus convenience","Workload duration and burstiness","Cost model: reserved, on-demand, spot"]},"storage services":{"e":["Block volumes attach to one server and back databases with low latency. File storage offers a shared file system over the network for many servers. Object storage holds unlimited blobs behind an HTTP API, cheap and durable. Storage classes (hot, infrequent, archive) trade access speed for price."],"t":"Block, file and object storage, each for a different job.","p":"Storing user uploads on a server's local disk.","k":"Block for databases, file for shared folders, object for blobs.","q":["Where should user-uploaded photos go?","Object storage","A block volume on one web server","The relational database","Memory","It is scalable, durable and cheap."],"i":["Storage costs keep rising though most files are never read","Five years of logs sit in the hot tier.","Apply lifecycle rules to move old data to cheaper tiers or delete it","Compress nothing and wait => Cost keeps growing","Delete everything older than a week => May break compliance","Storage classes should follow access patterns."],"a":["What cloud storage types exist and when do you use each?","Block: low-latency volumes","File: shared file system","Object: scalable blobs with lifecycle tiers"]},"managed databases":{"e":["Managed services handle provisioning, patching, backups, replication and failover. You still own schema design, queries, indexing and capacity choices. They cost more per unit and limit some configuration, but save a lot of operational effort and risk."],"t":"The provider runs the database; you use it.","p":"Assuming \"managed\" means performance and schema are someone else's problem.","k":"They run the server; you still own the queries.","q":["What remains your job with a managed database?","Schema, indexes and query performance","Patching the operating system","Replacing failed disks","Running backups","Operations are handled, design is not."],"i":["Managed database slow despite paying for the largest instance","The top query does a full scan of a 300M-row table.","Add the right index and fix the query","Open a ticket asking the provider to fix it => Not their responsibility","Upgrade again => No larger size exists","Managed services do not write your indexes."],"a":["Why use a managed database, and what's still on you?","Automated backups, patching, failover","Less operations work","You own schema, queries and sizing"]},"virtual private cloud vpc":{"e":["A VPC has an address range divided into subnets across availability zones. Public subnets route to the internet through an internet gateway; private subnets do not, and reach out through a NAT gateway. Security groups and network ACLs filter traffic. Databases and internal services belong in private subnets."],"t":"Your own isolated network inside the cloud.","p":"Placing databases in public subnets with open security groups.","k":"Public subnet for the front door only; everything else private.","q":["Where should the database tier sit?","A private subnet reachable only from the application tier","A public subnet","The CDN","A user's device","It should not be reachable from the internet."],"i":["Database found being probed from the internet","It has a public IP and its security group allows all sources.","Move it to a private subnet and allow only the app tier","Change the port number => Scanners find it","Use a stronger password only => Still exposed to exploits","Network isolation is the first layer of defence."],"a":["How would you lay out a VPC?","Public and private subnets across zones","Internet and NAT gateways","Security groups with least access"]},"dns networking in cloud":{"e":["Managed DNS offers routing policies: weighted, latency-based, geolocation and health-checked failover. Private DNS zones name internal services. Networks connect through peering, transit gateways and VPN or dedicated links to on-premises sites. Data transfer between zones and regions and out to the internet costs money."],"t":"Naming, routing and connecting cloud resources.","p":"Ignoring cross-zone and egress transfer charges in the design.","k":"DNS steers traffic; data crossing boundaries costs money.","q":["You want users routed to the region with the lowest latency. Use:","Latency-based DNS routing","A larger instance","A longer TTL","A bigger subnet","DNS can answer by measured latency."],"i":["Data transfer is the largest line on the bill","Chatty services in different zones exchange terabytes daily.","Co-locate chatty services in the same zone or reduce chatter","Negotiate rates only => Waste remains","Add a third zone => More crossings","Network topology has a price."],"a":["What networking features matter in cloud designs?","DNS routing policies and health checks","Private connectivity: peering, VPN","Transfer costs across zones and regions"]},"containers":{"e":["A container bundles code, runtime and libraries into an image that runs identically anywhere. Containers share the host kernel and are isolated by namespaces and cgroups, so they start in seconds and pack densely, unlike virtual machines that each carry an operating system. Treat them as immutable and stateless."],"t":"Lightweight, isolated packages of an app and its dependencies.","p":"Writing important data inside the container's file system; it vanishes when the container is replaced.","k":"Same image everywhere; nothing important stored inside.","q":["Why do containers start faster than virtual machines?","They share the host kernel instead of booting an operating system","They skip the CPU","They have no files","They run in the browser","No guest OS boot."],"i":["Uploaded files disappear after each deploy","They are written to the container's local file system.","Write to a mounted volume or object storage","Never redeploy => Not workable","Make the image bigger => Files still not persisted","Containers are disposable; state belongs outside."],"a":["Containers versus virtual machines?","Shared kernel, isolated processes","Fast, dense, portable","Weaker isolation; keep them stateless"]},"docker":{"e":["A Dockerfile lists steps to build an image; each step is a cached layer. Images are pushed to a registry and run as containers. Good practice: small base images, multi-stage builds, order layers so dependencies cache, pin versions, run as a non-root user and keep secrets out of images."],"t":"The common tool for building and running containers.","p":"Using the \"latest\" tag in production, so nobody knows what version is running.","k":"Small, pinned, non-root images built in layers.","q":["Why copy the dependency manifest and install before copying the source code?","So the dependency layer stays cached when only code changes","To make images larger","To hide the code","It is required by law","Layer caching speeds builds."],"i":["Production broke with no code change","Images are deployed by the \"latest\" tag; a new upstream base image slipped in.","Pin image versions and deploy immutable, tagged builds","Rebuild until it works => Unrepeatable","Stop updating => Security patches missed","Reproducible deploys need explicit versions."],"a":["What are Docker best practices?","Layered Dockerfile with caching","Small base, multi-stage, non-root","Pinned tags, no secrets in images"]},"kubernetes":{"e":["You declare desired state: a Deployment with N replicas of an image, a Service for stable networking, an Ingress for HTTP routing, ConfigMaps and Secrets for configuration. Controllers continuously reconcile reality to that state: rescheduling failed pods, rolling out updates and autoscaling. Requests and limits govern resources."],"t":"An orchestrator that keeps containers running the way you declared.","p":"Omitting resource requests and limits and probes, then being surprised by evictions and bad rollouts.","k":"Declare the desired state; controllers make it so.","q":["A pod crashes. What does Kubernetes do?","Starts a replacement to match the declared replica count","Sends an email only","Deletes the deployment","Nothing","The controller reconciles to desired state."],"i":["Pods randomly killed under load","No memory limits or requests are set; nodes run out of memory and evict pods.","Set resource requests and limits from measured usage","Add nodes without limits => Same overcommit","Restart the cluster => Recurs","The scheduler needs requests and limits to place pods safely."],"a":["What does Kubernetes do for you?","Scheduling and self-healing","Rolling updates, scaling, service discovery","Declarative desired state"]},"infrastructure as code":{"e":["Instead of clicking in consoles, you write declarative definitions, review them like code and apply them with a tool. Environments become reproducible, changes are audited and can be rolled back, and a region can be rebuilt from the repository. Manual changes outside the code cause drift."],"t":"Defining servers, networks and services in versioned files.","p":"Making \"quick fixes\" in the console that the code does not know about.","k":"If it is not in the repository, it does not exist.","q":["Main benefit of infrastructure as code?","Reproducible, reviewable, versioned environments","Faster CPUs","No need for networks","Free hosting","Infrastructure changes go through the same discipline as code."],"i":["Staging and production behave differently and nobody knows why","Both were built by hand over two years.","Define both environments from the same code with parameters","Compare consoles by eye => Slow and incomplete","Rebuild staging by hand again => Drifts again","Code-defined environments stay consistent."],"a":["Why manage infrastructure as code?","Repeatable and consistent","Reviewed, versioned, auditable","Enables recovery and avoids drift"]},"terraform":{"e":["You declare resources in HCL. Terraform compares them with its state file, shows a plan of what will change, then applies it through provider APIs. The state must be stored remotely with locking so teammates do not corrupt it. Modules package reusable pieces."],"t":"A multi-cloud tool that plans and applies infrastructure changes.","p":"Keeping the state file on a laptop, or applying without reading the plan.","k":"Plan, read the plan, then apply; state is remote and locked.","q":["What is the Terraform state file for?","Mapping declared resources to real ones so it knows what to change","Storing application data","Holding source code","Caching web pages","It is Terraform's record of reality."],"i":["Two engineers applied at once and resources were duplicated","State is a local file each person copies around.","Move state to a remote backend with locking","Take turns by chat message => Fails eventually","Delete the state and start over => Loses track of everything","Shared state needs locking."],"a":["How does Terraform work?","Declarative config plus state","Plan shows the diff, apply executes","Remote locked state and modules"]},"cloudformation":{"e":["You describe AWS resources in JSON or YAML templates and deploy them as stacks. AWS manages the state, orders operations by dependency and rolls back automatically if creation fails. Change sets preview modifications and drift detection finds manual edits. It works only with AWS."],"t":"AWS's native infrastructure-as-code service.","p":"Skipping change sets and being surprised by a resource replacement that deletes data.","k":"AWS-only stacks with managed state and automatic rollback.","q":["An advantage of CloudFormation over Terraform within AWS?","State is managed by the service, with automatic rollback","It supports every cloud","It needs no templates","It is a database","No state file to host yourself."],"i":["A stack update replaced the database and lost data","A property change required replacement; nobody previewed the update.","Review change sets and set deletion protection and retain policies","Update faster next time => Same risk","Stop using templates => Back to manual drift","Preview infrastructure changes before applying them."],"a":["CloudFormation versus Terraform?","CloudFormation: AWS-native, managed state, rollback","Terraform: multi-cloud, own state","Both declarative with previews"]},"ci cd pipelines":{"e":["Continuous integration builds and tests every change so problems surface in minutes. Continuous delivery packages an artifact once and promotes the same artifact through environments, with automated checks, to a production release that is routine and reversible. Fast feedback and one-click rollback are the goals."],"t":"Automation from commit to production.","p":"Rebuilding the artifact per environment, so what was tested is not what ships.","k":"Build once, test automatically, promote the same artifact.","q":["Why build the artifact once and promote it?","The exact tested binary is what reaches production","To save disk","To avoid tests","To slow releases","Rebuilds can differ."],"i":["Releases happen monthly and each one causes an outage","Deploys are manual with dozens of steps and large batches of change.","Automate the pipeline and ship small changes frequently","Release every six months => Bigger, riskier batches","Add a sign-off meeting => Slower, same risk","Small automated releases are safer."],"a":["What does a good CI/CD pipeline do?","Build and test on every commit","One artifact promoted through stages","Automated deploy with fast rollback"]},"blue green deployment":{"e":["Blue serves live traffic while green receives the new version and is tested. A router or load balancer switch then moves traffic to green. If something is wrong, switch back instantly. The costs are double capacity during the release and the need for database changes to work with both versions."],"t":"Two identical environments; switch all traffic at once.","p":"Forgetting the shared database: a migration incompatible with blue removes the rollback option.","k":"Two environments, one switch, instant rollback.","q":["Main benefit of blue-green?","Near-instant rollback by switching traffic back","Half the cost","No testing needed","No load balancer","The old environment is still intact."],"i":["Rollback failed because the old version cannot read the new schema","The release dropped a column blue still used.","Use backward-compatible, expand-then-contract schema changes","Skip rollback planning => Stuck with a broken release","Roll back the database from backup => Data loss","Both versions must work with the shared database."],"a":["How does blue-green deployment work?","Two full environments","Switch traffic atomically","Fast rollback; schema must suit both versions"]},"canary deployment":{"e":["The new version receives a few percent of requests while the rest stay on the old one. Automated analysis compares error rate and latency; if healthy, the share grows step by step, otherwise it rolls back. A bad release hurts few users. It needs good metrics and traffic-splitting capability."],"t":"Release to a small slice of traffic first.","p":"Running a canary with no automated comparison, so nobody notices it is failing.","k":"Small slice, watch metrics, expand or roll back.","q":["What is essential for a canary to be useful?","Metrics comparing canary and baseline, with automatic rollback","A second database","A bigger team","A weekend","Otherwise problems go unseen."],"i":["Canary ran for an hour with 30% errors and was then promoted","Nobody looked at the canary's metrics; promotion was on a timer.","Gate promotion on automated canary analysis","Shorten the canary to 5 minutes => Even less chance to notice","Send it 50% of traffic => More users harmed","A canary is only as good as its checks."],"a":["What is a canary release?","Small traffic share to the new version","Compare metrics against baseline","Gradual rollout with automatic rollback"]},"rolling deployment":{"e":["The orchestrator takes a batch of instances out, updates and health-checks them, and repeats until all run the new version. No extra environment is needed. During the rollout old and new versions serve together, so they must be compatible. Rollback means rolling again."],"t":"Replace instances a few at a time.","p":"Incompatible versions running side by side mid-rollout.","k":"Gradual replacement; old and new must coexist.","q":["During a rolling deployment, what must be true?","Old and new versions can serve traffic at the same time","The site is offline","Only one instance exists","The database is empty","Both run together for a while."],"i":["Errors spike during every rollout, then stop","The new version writes a message format the old instances cannot parse.","Make changes backward compatible across one version step","Roll out faster => Shorter, same errors","Take downtime instead => Avoidable outage","Mixed-version windows require compatibility."],"a":["How does a rolling deployment work?","Batches replaced with health checks","No duplicate environment needed","Versions coexist; slower rollback"]},"block storage":{"e":["Block storage exposes fixed-size blocks to one machine, which formats them with a file system. It offers low latency and high IOPS, suiting databases and boot volumes. Volumes are sized and paid for up front, typically attach to one instance, and are backed up with snapshots."],"t":"Raw volumes that behave like a disk attached to a server.","p":"Trying to share one block volume between many servers as a common file store.","k":"A fast disk for one machine at a time.","q":["Which workload suits block storage?","A database's data files","Sharing documents among 50 servers","Serving static images to the world","Archiving old logs cheaply","Databases need low-latency random I/O."],"i":["Database stalls under load, CPU idle","The volume's provisioned IOPS limit is reached.","Raise the provisioned IOPS or volume class, then reduce I/O with indexes","Add CPU => Not the limit","Add RAM only => Helps reads, writes still throttled","Storage has throughput limits you must size."],"a":["What is block storage for?","Low-latency volume attached to a server","Databases and boot disks","Sized by capacity and IOPS; snapshots for backup"]},"file storage":{"e":["Network file systems (NFS, SMB, managed equivalents) present directories and files with normal semantics and locking, accessible from many machines at once. They suit shared content, legacy applications and home directories. They cost more and scale less than object storage."],"t":"A shared file system many servers can mount.","p":"Using a shared file system for internet-scale static assets.","k":"Shared folders with real file semantics.","q":["When is file storage the right choice?","Several servers need to read and write the same directory tree","Storing billions of photos cheaply","A single database volume","Long-term archive","Shared, hierarchical access."],"i":["Shared file system is the bottleneck for image serving","Twenty web servers read user photos from one NFS mount.","Move photos to object storage behind a CDN","Add more web servers => More load on NFS","Mount it twice => No extra capacity","Object storage scales better for static content."],"a":["How does file storage differ from block and object?","Shared hierarchical file system","Multi-server access with locking","Costlier and less scalable than object storage"]},"object storage":{"e":["Objects (data plus metadata) live in buckets under a key and are read or written whole. It is cheap, effectively unlimited and extremely durable through replication or erasure coding. It suits media, backups, logs and data lakes. Objects are replaced, not edited in place, and latency is higher than block storage."],"t":"Unlimited key-addressed blobs behind an HTTP API.","p":"Using it like a file system or database with frequent small in-place updates.","k":"Cheap, durable, endless; whole objects by key.","q":["Which workload does not suit object storage?","A database needing frequent small in-place updates","Storing video files","Backups","Static website assets","Objects cannot be partially modified efficiently."],"i":["Customer documents exposed on the internet","The bucket was made public for a quick test and never reverted.","Block public access and serve files through signed URLs","Use unguessable file names => Listings and leaks reveal them","Delete the files => Service breaks","Private by default, with temporary signed access."],"a":["What is object storage good for?","Large unstructured data: media, backups, logs","Durable, cheap, scalable","Whole-object access via HTTP; signed URLs for access"]},"distributed file systems":{"e":["Systems such as HDFS, GFS and Ceph split files into large chunks stored on many data nodes, with several replicas each, while a metadata service tracks where chunks live. They handle huge files and whole-machine failures and feed batch analytics. They are poor at many small files."],"t":"One file system spread over many machines.","p":"Storing millions of tiny files, which overwhelms the metadata service.","k":"Big files in replicated chunks, tracked by a metadata service.","q":["Why are files split into large replicated chunks?","To spread storage and survive machine failures","To make files smaller","To encrypt them","To speed typing","Any chunk has copies elsewhere."],"i":["Metadata node runs out of memory","The system stores 800 million files of a few kilobytes each.","Combine small files into larger containers","Add data nodes => Metadata is the limit","Increase replication => More metadata","Metadata scales with file count, not size."],"a":["How does a distributed file system work?","Files chunked across data nodes","Replication for fault tolerance","Central metadata service; favours large files"]},"file upload architecture":{"e":["The client asks your API for a pre-signed URL and uploads directly to object storage, so file bytes never pass through application servers. Storage then emits an event that triggers validation, virus scanning and processing (thumbnails, transcoding) asynchronously. Metadata is recorded in a database."],"t":"Getting large files from clients into storage without choking the app.","p":"Streaming uploads through the application servers, tying up their memory and connections.","k":"Client uploads straight to storage with a signed URL.","q":["Why use pre-signed URLs for uploads?","File data bypasses your application servers","They compress files","They remove authentication","They are permanent","Servers only authorise; storage receives the bytes."],"i":["App servers run out of memory during a video upload peak","Each upload is proxied and buffered by the API.","Issue pre-signed URLs so clients upload directly to object storage","Add app servers => Costly buffering","Lower the file size limit => Hurts users","Large payloads should skip the application tier."],"a":["How would you design file uploads?","Pre-signed direct upload to object storage","Async processing triggered by events","Metadata in a database; validate and scan"]},"multipart upload":{"e":["The client starts an upload, sends parts independently (each with a checksum), and then completes it so storage assembles the object. Parallel parts raise speed, and a failed part is retried alone. Incomplete uploads consume storage until aborted, so clean them up with a lifecycle rule."],"t":"Split a big file into parts and upload them in parallel.","p":"Leaving abandoned multipart uploads forever, quietly paying for them.","k":"Parts in parallel, retry only the failed one.","q":["Key advantage of multipart upload for a 5 GB file?","A failed part can be retried without restarting the whole upload","It encrypts the file","It shrinks the file","It needs no network","Failure affects only one part."],"i":["Storage bill includes terabytes nobody can see in the bucket","Thousands of multipart uploads were started and never completed.","Add a lifecycle rule to abort incomplete uploads","Ignore it => Cost grows","Delete visible objects => Wrong data removed","Incomplete parts are invisible but billed."],"a":["How does multipart upload work?","Initiate, upload parts, complete","Parallelism and per-part retry","Clean up incomplete uploads"]},"resumable uploads":{"e":["The server gives each upload a session and tracks received bytes or parts. After a disconnect the client asks what was received and sends only the rest. It is essential on mobile networks and for large files. Sessions expire, and chunks are verified by checksum."],"t":"Continue an interrupted upload from where it stopped.","p":"Restarting from zero after every dropped connection.","k":"Ask what arrived, send the rest.","q":["What must the server keep for resumable uploads?","Which bytes or parts of the session it has already received","The user's password","The CDN cache","Nothing","The client resumes from the recorded offset."],"i":["Mobile users abandon uploads of long videos","Any network drop restarts the upload from the beginning.","Implement chunked, resumable uploads","Tell users to use Wi-Fi => Not always possible","Raise the timeout => A drop still restarts","Unreliable networks need resumability."],"a":["How do resumable uploads work?","Upload session with tracked progress","Client queries offset and resumes","Chunks verified; sessions expire"]},"data deduplication":{"e":["The system hashes each file or chunk; if that hash already exists, it stores a reference instead of the bytes. File-level dedup catches identical files; chunk-level dedup also catches shared portions. It saves large amounts of storage for backups and shared files, at the cost of hashing and an index, and needs reference counting for deletes."],"t":"Store identical data once and reference it many times.","p":"Deleting a deduplicated block that other files still reference.","k":"Hash it; if seen before, store a pointer.","q":["A thousand users upload the same 1 GB video. With deduplication, storage used is about:","1 GB plus references","1,000 GB","500 GB","0","Identical content is stored once."],"i":["Deleting one user's file broke other users' copies","The shared block was removed without checking references.","Track reference counts and delete blocks only at zero","Disable deletion => Storage and privacy problems","Copy the block for every user => Loses the saving","Shared blocks need reference counting."],"a":["How does deduplication save storage?","Content hashing of files or chunks","References to existing data","Reference counting; index overhead"]},"data retention":{"e":["Retention policies balance legal and business needs with cost and privacy. Lifecycle rules move data to colder, cheaper tiers as it ages and delete it at the end. Privacy laws may require deletion on request, including from backups and derived stores. Legal holds suspend deletion."],"t":"Rules for how long data is kept and when it is deleted.","p":"Keeping everything forever, which raises cost and legal exposure.","k":"Keep what you must, for as long as you must, then delete.","q":["Why is \"keep everything forever\" a poor policy?","Rising cost and privacy or legal liability","It is too fast","It improves security","It reduces storage","Data you do not hold cannot leak or be subpoenaed."],"i":["Regulator asks why data of deleted users still exists","User records were removed from the main database but remain in logs, analytics and backups.","Map all copies and apply deletion and retention across them","Delete from the main database again => Other copies remain","Deny the copies exist => Legal risk","Retention must cover every place data lives."],"a":["How do you design data retention?","Policy per data type by legal and business need","Lifecycle tiering and expiry","Deletion across all copies"]},"metadata management":{"e":["For file systems the bytes go to object storage and the metadata (owner, name, size, checksum, permissions, version, storage key) goes to a database, which powers listing, search, sharing and access checks. The two must stay consistent; orphaned blobs or dangling records need reconciliation."],"t":"Keeping the data about your data: names, owners, locations.","p":"Deriving listings by scanning the blob store instead of querying a metadata database.","k":"Blobs in object storage, facts about them in a database.","q":["Where should a file-sharing service keep folder structure and permissions?","A metadata database","Inside the file bytes","In the CDN","Nowhere","Metadata needs queries and transactions."],"i":["\"List my files\" takes 30 seconds","The service lists the storage bucket by prefix for every request.","Keep file metadata in an indexed database","Cache the bucket listing => Stale and still slow to build","Limit users to 100 files => Product restriction","Listing and search are metadata queries."],"a":["How do you separate metadata from file content?","Content in object storage","Metadata in a queryable database","Keep them consistent; reconcile orphans"]},"presence systems":{"e":["Clients keep a connection open and send heartbeats; the server marks a user online with a short TTL in a fast store such as Redis and offline when heartbeats stop. Status changes are published to interested friends or channels. At scale, presence fan-out is costly, so it is throttled, batched or fetched lazily."],"t":"Knowing who is online right now.","p":"Marking a user offline the instant a connection drops; brief network blips make status flicker.","k":"Heartbeat with a TTL, and a grace period before \"offline\".","q":["How does the server detect that a user who lost signal is offline?","Their heartbeat stops and the presence key's TTL expires","The user sends a goodbye message","The database polls the phone","It cannot","Absence of heartbeats is the signal."],"i":["Friends' status flickers online and offline constantly","Every momentary reconnect broadcasts an offline then online event.","Add a grace period before marking offline and debounce updates","Send heartbeats every 100 ms => Battery and load explode","Remove presence => Feature lost","Presence needs smoothing against flaky connections."],"a":["How would you build an online indicator?","Heartbeats refreshing a TTL key","Publish status changes to subscribers","Grace period and throttled fan-out"]},"heartbeats":{"e":["A node or client sends a small message at a fixed interval. If several are missed, the peer is considered dead and action follows: failover, removal from the pool, marking offline. Interval and threshold trade detection speed against false alarms and overhead."],"t":"Periodic \"I'm alive\" signals between components.","p":"Declaring failure on a single missed heartbeat.","k":"Short interval, several misses before declaring death.","q":["Risk of a very short heartbeat timeout?","Healthy but briefly slow nodes are declared dead","Failures go unnoticed","Too little traffic","Nothing","False positives trigger needless failovers."],"i":["Cluster removes healthy nodes during garbage-collection pauses","The timeout is 1 second and pauses last 2 seconds.","Raise the threshold to tolerate normal pauses","Lower it further => More false removals","Disable heartbeats => No failure detection","Timeouts must exceed normal jitter."],"a":["How do heartbeats detect failure?","Regular liveness messages","Missed-count threshold","Balance speed against false positives"]},"real time collaboration":{"e":["Each client applies edits locally for instant feedback and sends operations to the server, which orders them and broadcasts to others. Concurrent edits are merged with Operational Transformation (transform operations against each other, used by Google Docs) or CRDTs (data types that merge automatically). Cursors and presence travel on the same channel."],"t":"Many people editing the same document at once.","p":"Using last-write-wins on the whole document, which silently discards other people's edits.","k":"Send operations, not documents; merge with OT or CRDTs.","q":["Why not simply save the whole document on each keystroke?","Concurrent editors would overwrite each other's changes","It uses no network","It is too secure","Documents are too small","Whole-document writes lose concurrent edits."],"i":["Two users typing in the same paragraph lose each other's words","The editor saves the full document and the last save wins.","Send fine-grained operations and merge with OT or a CRDT","Lock the document for one editor => No real-time collaboration","Save more often => Still overwriting","Concurrent editing needs operation-level merging."],"a":["How do collaborative editors handle simultaneous edits?","Local apply, then sync operations","OT or CRDT merge","Server ordering and broadcast over a persistent connection"]},"fan out strategies":{"e":["Fan-out on write pushes each new post into every follower's precomputed feed, so reads are fast but a celebrity post triggers millions of writes. Fan-out on read builds the feed when requested by pulling from followed accounts, so writes are cheap and reads are heavy. Real systems mix them: push for normal users, pull for celebrities."],"t":"Delivering one post to many followers: at write time or read time.","p":"Choosing pure push and ignoring accounts with millions of followers.","k":"Push for most, pull for celebrities.","q":["A user with 50 million followers posts. Pure fan-out on write means:","50 million feed insertions for one post","One write","No work","Faster reads for nobody","Write amplification is enormous."],"i":["Feed write queue backs up for hours after a celebrity posts","Every post is pushed to all followers' feeds.","Handle very large accounts by pulling at read time","Add more queue workers => Still tens of millions of writes","Limit follower counts => Product harm","Hybrid fan-out bounds write amplification."],"a":["Fan-out on write versus on read?","Write: fast reads, heavy writes","Read: cheap writes, heavy reads","Hybrid by follower count"]},"online gaming architecture":{"e":["The server simulates the game in ticks and is the authority on state, which prevents cheating. Clients send inputs, usually over UDP, and predict their own movement locally; the server corrects them and clients interpolate other players. Matchmaking, regional servers and state snapshots with deltas complete the picture."],"t":"Authoritative servers keeping many players in sync with low latency.","p":"Trusting the client's reported position or score.","k":"Server is authoritative; clients predict and get corrected.","q":["Why do fast-paced games prefer UDP?","A late packet is useless, so retransmission delay hurts more than loss","UDP is encrypted","UDP guarantees order","TCP is banned","Fresh state replaces lost state."],"i":["Players teleport through walls and report impossible scores","The server accepts positions and scores sent by clients.","Make the server authoritative and validate inputs","Add client-side checks => Cheats bypass them","Ban reported players => Cheating continues","Authority must live on the server."],"a":["How do multiplayer games stay in sync?","Authoritative server tick loop","Client prediction and server reconciliation","UDP, regional servers, delta snapshots"]},"distributed hash tables":{"e":["Each node owns a range of the key space on a ring. A key is hashed and routed toward the responsible node; each node knows a few others, so lookups take a logarithmic number of hops. Nodes join and leave with only local changes. DHTs underlie peer-to-peer networks and inspired Dynamo-style stores."],"t":"A key-value lookup spread across many nodes with no central index.","p":"Describing a central directory. The point is that no node knows everything.","k":"Hash the key, route around the ring in log N hops.","q":["What makes a DHT scale to millions of nodes?","Each node keeps only a small routing table and lookups take O(log N) hops","A central index server","Broadcasting every lookup","One huge machine","Routing state stays small."],"i":["Tracker server failure stops the whole file-sharing network","Peer lookup depends on one central directory.","Use a DHT so peers locate each other without a central server","Add a backup tracker => Still centralised","Cache the tracker => Stale peers","Decentralised lookup removes the single point of failure."],"a":["How does a DHT find which node holds a key?","Consistent hashing over a ring","Per-node routing table","O(log N) hops; churn handled locally"]},"gossip protocol":{"e":["Periodically each node picks random peers and exchanges state: membership, health, metadata. Like a rumour, information reaches the whole cluster in a logarithmic number of rounds, with no central coordinator and high tolerance for failures. It is eventually consistent and used for cluster membership and failure detection."],"t":"Nodes spread information by telling a few random peers.","p":"Expecting immediate, consistent knowledge everywhere. Gossip converges; it is not instant.","k":"Tell a few random peers; soon everyone knows.","q":["Why is gossip robust to node failures?","There is no central coordinator and information takes many random paths","It uses one master","It never sends messages","It needs all nodes up","Redundant paths spread state."],"i":["Cluster membership service is a single point of failure","Every node asks one server who is alive.","Use gossip-based membership and failure detection","Run the server on a bigger machine => Still single","Hard-code the node list => Cannot adapt","Decentralised membership survives any node's failure."],"a":["How does a gossip protocol work?","Periodic exchange with random peers","Spreads in O(log N) rounds","Decentralised and eventually consistent"]},"merkle trees":{"e":["Leaves are hashes of data blocks; each parent is a hash of its children, up to a single root. If two roots match, the datasets are identical. If not, compare children and descend only into differing branches, finding the mismatched blocks with little data exchanged. Used in replica repair, Git and blockchains."],"t":"A hash tree that pinpoints differences between two datasets.","p":"Saying replicas compare all their data to find differences.","k":"Compare roots; descend only where they differ.","q":["Two replicas hold a billion keys and differ in ten. A Merkle tree lets them:","Find the ten by comparing a small number of hashes","Copy all billion keys","Guess","Delete everything","Only differing branches are explored."],"i":["Replica repair saturates the network for hours","Nodes stream entire datasets to each other to check consistency.","Compare Merkle trees and transfer only differing ranges","Repair less often => Divergence grows","Buy more bandwidth => Still wasteful","Hash trees make synchronisation proportional to the difference."],"a":["What is a Merkle tree used for?","Hash tree over data blocks","Root comparison detects any difference","Efficient sync and integrity checks"]},"vector clocks":{"e":["Each version carries a vector of counters, one per node. A node increments its own entry on a write. If every entry of A is at least that of B, A descends from B. If each has a higher entry somewhere, they are concurrent, a true conflict the application or a merge rule must resolve."],"t":"Per-node counters that reveal whether two versions conflict.","p":"Using timestamps to detect conflicts. Timestamps cannot tell concurrent from sequential.","k":"Compare vectors: one dominates, or they conflict.","q":["Version A is {n1:2, n2:1}; version B is {n1:1, n2:2}. They are:","Concurrent, so a conflict","A newer than B","B newer than A","Identical","Neither dominates the other."],"i":["Shopping cart loses an item added on another device","Conflicts are resolved by latest timestamp, dropping one side's change.","Detect concurrency with version vectors and merge the carts","Synchronise clocks better => Still picks one","Disallow multiple devices => Poor product","Concurrent writes must be detected, then merged."],"a":["What do vector clocks tell you that timestamps can't?","Causality between versions","Detect concurrent updates","Enable correct conflict resolution"]},"lamport clocks":{"e":["Each node keeps a counter, increments it on every event, attaches it to messages, and on receiving sets its counter to the maximum of its own and the message's, plus one. If A caused B, A's number is smaller. The reverse does not hold: a smaller number does not prove causation, and concurrency is not detectable."],"t":"A single counter that orders events consistently with causality.","p":"Claiming Lamport clocks detect concurrent events. That needs vector clocks.","k":"If A caused B then L(A) < L(B), but not the other way round.","q":["What can Lamport timestamps not tell you?","Whether two events were concurrent","A consistent total order with a tiebreak","That a cause precedes its effect","Anything","They order, but do not reveal concurrency."],"i":["Logs from different servers interleave in impossible orders","Events are sorted by each server's wall clock.","Attach logical timestamps so effects sort after causes","Buy more precise clocks => Skew remains","Sort by server name => Meaningless","Logical clocks give a causally consistent order."],"a":["How does a Lamport clock work?","Counter incremented per event","On receive: max(local, received) + 1","Orders causally related events; no concurrency detection"]},"crdts":{"e":["Conflict-free replicated data types are designed so concurrent updates on different replicas always converge to the same value, whatever the order of merging. Examples: grow-only and PN counters, sets with add and remove semantics, sequence types for text. They enable offline-first and multi-leader systems without coordination, at the cost of metadata overhead."],"t":"Data types that merge automatically with no conflicts.","p":"Presenting them as free. They carry extra metadata and only fit certain data shapes.","k":"Merge in any order, always end up the same.","q":["Why can CRDT replicas accept writes while offline?","Their merge is mathematically guaranteed to converge without coordination","They never sync","They use a global lock","They reject concurrent writes","No central arbiter is required."],"i":["Offline edits on two phones overwrite each other when they sync","The notes app keeps whichever device synced last.","Model notes with a CRDT so edits merge","Force users online to edit => Not offline-first","Ask users to pick a version every time => Tedious","Convergent data types make offline merges safe."],"a":["What is a CRDT?","Replicated type with conflict-free merge","Commutative, associative, idempotent operations","Good for offline and multi-leader; metadata overhead"]},"distributed snapshots":{"e":["The Chandy-Lamport algorithm sends marker messages along channels. On its first marker a node records its own state and starts recording incoming messages on other channels until their markers arrive. The combined result is a state the system could validly have been in. Stream processors use this for checkpoints."],"t":"Capturing a consistent global state without stopping the system.","p":"Thinking you can just read every node's state at \"the same time\". There is no shared instant.","k":"Markers flow through the system; each node records as they pass.","q":["Why can't you snapshot by asking each node for its state at 12:00:00?","Clocks differ and in-flight messages would be missed or double-counted","It is too fast","Nodes have no state","It works fine","A consistent cut needs coordination."],"i":["After recovery, some events were counted twice","Operators were checkpointed at different moments with no coordination.","Use coordinated barrier-based snapshots","Checkpoint more frequently => Still inconsistent","Disable recovery => Lose fault tolerance","Consistent recovery needs a consistent global snapshot."],"a":["How do you take a consistent snapshot of a distributed system?","Marker or barrier messages","Record local state and in-flight messages","Consistent cut without pausing"]},"leader election":{"e":["Many systems need a single leader to order writes or assign work. Nodes elect one through consensus (Raft) or a lease in a coordination service such as ZooKeeper or etcd; the leader renews the lease with heartbeats and another takes over if it stops. Fencing tokens prevent a deposed leader from still acting."],"t":"Choosing exactly one node to coordinate.","p":"Home-made election using timestamps or \"lowest IP\", with no quorum or fencing.","k":"One leader, held by a renewable lease, guarded by fencing.","q":["A leader pauses for 30 seconds, its lease expires, and it wakes still believing it leads. What protects the system?","Fencing tokens rejected by downstream resources","A louder alarm","Faster CPUs","Nothing can","Stale leaders are refused."],"i":["Two schedulers ran the same nightly job","Both instances believed they were the leader after a network blip.","Use a lease from a coordination service with fencing","Let both run and deduplicate later => Double side effects","Run only one instance => No failover","Leadership must be granted by a quorum-backed lease."],"a":["How do you elect a leader safely?","Consensus or lease in a coordination service","Heartbeat renewal and timeout","Fencing against stale leaders"]},"log replication":{"e":["The leader appends each command to its log and sends it to followers, which append in the same order. Once a majority has stored an entry it is committed and applied to the state machine. Because all replicas apply the same commands in the same order, they reach the same state. Followers that fall behind are caught up from the log."],"t":"Copy an ordered log of changes to every replica.","p":"Applying an entry before a majority has stored it.","k":"Same log, same order, same state.","q":["Why do replicas end up identical under log replication?","They apply the same deterministic commands in the same order","They share memory","They copy screenshots","They vote on state","Replicated state machines."],"i":["After failover, the new leader lacks a write clients were told had succeeded","The old leader acknowledged before replicating to a majority.","Acknowledge only after majority replication","Acknowledge faster => More loss","Add more followers => Still not waited for","Commit means stored on a majority."],"a":["How does a replicated log keep nodes consistent?","Leader appends and replicates in order","Commit on majority","Deterministic apply; followers catch up"]},"stream processing":{"e":["Unbounded streams from a log such as Kafka are processed record by record or in small batches for alerts, metrics, enrichment and joins. Key ideas: event time versus processing time, windows (tumbling, sliding, session), watermarks to handle late data, and checkpointed state for fault tolerance and exactly-once results."],"t":"Computing on events continuously as they arrive.","p":"Windowing by processing time, so delayed events land in the wrong window.","k":"Window by event time; watermarks handle the latecomers.","q":["A mobile event created at 10:01 arrives at 10:07. Windowing by event time puts it in:","The 10:00 to 10:05 window","The 10:05 to 10:10 window","No window","Every window","Event time is when it happened."],"i":["Hourly revenue is wrong whenever mobile networks are slow","Windows use arrival time, so late purchases are counted in the next hour.","Use event-time windows with watermarks and allowed lateness","Shorten the windows => Same misplacement","Drop late events => Under-counting","Correct streaming results need event-time semantics."],"a":["What concepts matter in stream processing?","Event time versus processing time","Windows and watermarks","Stateful operators with checkpoints"]},"apache flink":{"e":["Flink processes events one at a time with low latency, keeps large keyed state in a state backend, and takes consistent checkpoints using barriers, so it can restore state exactly after failure. It has strong event-time and watermark support. Batch jobs are treated as bounded streams."],"t":"A stateful stream processor with event-time and exactly-once state.","p":"Ignoring state size and checkpoint duration. Huge state makes checkpoints slow and recovery long.","k":"True streaming, big state, consistent checkpoints.","q":["What gives Flink exactly-once state consistency?","Consistent distributed checkpoints","Running on one node","Disabling retries","Hourly batches","State is restored to a consistent cut."],"i":["Job falls behind and restarts repeatedly","State has grown without limit because keys are never expired; checkpoints time out.","Set state TTLs and use incremental checkpoints","Raise the checkpoint timeout only => State keeps growing","Add parallelism only => More unbounded state","Stream state must be bounded."],"a":["When would you use Flink?","Low-latency stateful stream processing","Event-time windows and joins","Exactly-once state via checkpoints"]},"apache spark":{"e":["Spark splits data into partitions processed in parallel in memory across a cluster. Transformations are lazy and optimised into a plan; actions trigger execution. It serves ETL, SQL analytics and machine learning; Structured Streaming handles streams as small batches. Shuffles (repartitioning across the network) are the main cost."],"t":"A distributed engine for large-scale batch and micro-batch analytics.","p":"Ignoring shuffles and skew. One oversized partition can stall a whole job.","k":"Parallel partitions in memory; shuffles and skew are the enemies.","q":["Why are wide operations such as joins and groupBy expensive in Spark?","They require shuffling data across the network","They run on one core","They use no memory","They skip the optimiser","Shuffles move data between partitions."],"i":["One task runs for 3 hours while the other 199 finish in minutes","A join key is heavily skewed; one partition holds most rows.","Salt the skewed key or broadcast the small table","Add executors => The hot partition is still one task","Increase the timeout => Still slow","Skewed keys defeat parallelism."],"a":["What is Spark good at?","Large batch ETL and analytics","In-memory parallel processing with lazy plans","Watch shuffles, skew and memory"]},"data locality":{"e":["Moving large data across a network is slow and costly, so schedulers place tasks on or near the nodes holding the data, and architects place services in the same zone or region as their databases. The same principle drives edge caching and choosing where to process data by residency rules."],"t":"Run the computation where the data already is.","p":"Putting the application in one region and its database in another.","k":"Move code to data, not data to code.","q":["An app server in Europe queries a database in the US 30 times per request. Main problem?","Each query pays a transatlantic round trip","The database is too large","CPU shortage","Disk speed","Latency multiplies with chatty remote calls."],"i":["Analytics job spends 90% of its time on network transfer","Compute runs in a different region from the data lake.","Run the job in the region where the data lives","Buy more compute => Transfer still dominates","Compress and copy the lake daily => Slow and costly","Colocate processing with data."],"a":["What is data locality and why does it matter?","Process data where it is stored","Network transfer is the cost","Applies to zones, regions and the edge"]},"multi region architecture":{"e":["Reasons: survive a regional outage, serve users with low latency, and meet data residency laws. Stateless services are easy to replicate; data is the hard part. Options: one write region with read replicas elsewhere, multi-leader with conflict handling, or a globally consistent database. Traffic is steered by DNS or anycast."],"t":"Running the system in several geographic regions.","p":"Deploying app servers to many regions while the only database stays in one.","k":"Stateless is easy; where writes go is the real question.","q":["Hardest part of going multi-region?","Replicating and reconciling data across regions","Launching servers","Buying domain names","Translating the UI","Consistency versus latency for writes."],"i":["Users in Asia see no speed-up after servers were added there","Every request still calls the single database in the US.","Add regional read replicas or caches and route reads locally","Add more app servers in Asia => Same remote database","Increase timeouts => Still slow","Latency follows the data, not the servers."],"a":["How do you design for multiple regions?","Purpose: resilience, latency, residency","Data strategy: single-writer, multi-leader or global database","Global traffic routing and failover"]},"geo replication":{"e":["Asynchronous geo-replication keeps writes fast but the remote copy lags, so a regional failure can lose recent writes. Synchronous replication loses nothing but adds cross-region latency to every write. Conflict handling is needed when several regions accept writes. Residency laws may forbid some data from leaving a region."],"t":"Copying data across regions.","p":"Assuming zero data loss with asynchronous cross-region replication.","k":"Async: fast with possible loss. Sync: safe and slow.","q":["A region fails with asynchronous geo-replication. The other region:","May be missing the most recent writes","Has everything","Has nothing","Is corrupted","Lag at the moment of failure equals data loss."],"i":["Compliance audit finds EU personal data stored in a US region","Replication copies every table to all regions.","Partition data by residency and restrict replication for regulated data","Encrypt it and keep replicating => May still breach residency rules","Stop all replication => Lose resilience","Replication topology must respect legal boundaries."],"a":["What are the trade-offs in geo-replication?","Sync versus async: latency versus loss","Conflict resolution for multi-writer","Data residency constraints"]},"global traffic management":{"e":["GeoDNS and latency-based DNS return different addresses by user location; anycast advertises one IP from many sites so the network routes to the nearest. Health checks remove failed regions. Weighted routing shifts traffic gradually for migrations and tests. DNS-based steering is limited by resolver caching."],"t":"Steering each user to the best region.","p":"Depending on DNS alone for fast failover while TTLs are long.","k":"Route by location and health; anycast fails over faster than DNS.","q":["Why can anycast fail over faster than DNS-based routing?","Routing changes do not wait for cached DNS answers to expire","It uses bigger servers","It is encrypted","It needs no network","The same IP is simply routed elsewhere."],"i":["Region failed; 30% of users kept hitting it for an hour","DNS failover relied on records with a one-hour TTL.","Use short TTLs with health checks, or anycast","Wait for caches to expire => An hour of errors","Restart the dead region faster => Not always possible","Failover speed is bounded by how routing is cached."],"a":["How do you route users globally?","GeoDNS or latency routing","Anycast for a single global IP","Health checks and weighted shifts"]},"object oriented design":{"e":["Identify the nouns (entities), their responsibilities and how they collaborate. The four pillars: encapsulation (hide state behind methods), abstraction (expose what, not how), inheritance (share by is-a) and polymorphism (one interface, many implementations). Aim for small classes with one clear job and low coupling."],"t":"Modelling a problem as objects with data and behaviour.","p":"Building one \"manager\" class that does everything.","k":"Small objects, clear responsibilities, hidden state.","q":["Which is encapsulation?","Making fields private and exposing behaviour through methods","Copying code between classes","Using global variables","One class for the whole app","State is protected behind an interface."],"i":["A change to order pricing breaks inventory and email","One 4,000-line OrderManager class holds all three concerns.","Split it into classes with single responsibilities","Add more comments => Still tangled","Add a second manager class => Two tangles","Cohesive classes limit the reach of a change."],"a":["How do you approach an object-oriented design problem?","Identify entities and responsibilities","Define relationships and interfaces","Apply encapsulation and polymorphism"]},"solid principles":{"e":["Single responsibility: one reason to change. Open-closed: extend without modifying. Liskov substitution: subclasses must work wherever the parent does. Interface segregation: small, focused interfaces. Dependency inversion: depend on abstractions, not concrete classes."],"t":"Five rules for classes that are easy to change.","p":"Reciting the acronym without an example of a violation.","k":"One job, extend not edit, substitutable, small interfaces, depend on abstractions.","q":["A Square subclass of Rectangle breaks code that sets width and height separately. Which principle is violated?","Liskov substitution","Single responsibility","Interface segregation","Dependency inversion","The subclass cannot stand in for its parent."],"i":["Adding a report format means editing a class used by ten other features","All formats are handled in one switch statement.","Introduce a format interface so new formats are new classes","Copy the class per format => Duplication","Add another case carefully => Risk every time","Open-closed: extend by adding, not editing."],"a":["Explain SOLID with examples.","SRP and OCP","LSP and ISP","DIP: depend on abstractions"]},"dry kiss yagni":{"e":["DRY: each piece of knowledge has one authoritative place, so a rule changes once. KISS: prefer the simplest solution that works. YAGNI: do not add features or flexibility for imagined future needs. They pull against each other at times: premature DRY creates bad abstractions."],"t":"Don't repeat yourself; keep it simple; don't build what you don't need.","p":"Merging code that merely looks similar. Wrong abstractions cost more than duplication.","k":"One source of truth, simplest thing, nothing speculative.","q":["A developer builds a plugin system for a feature with one known use. Which principle is ignored?","YAGNI","DRY","Encapsulation","Polymorphism","It is speculative generality."],"i":["A tax rule change required edits in seven places and one was missed","The same calculation was copied across services.","Extract the rule into one shared, tested implementation","Write a checklist of the seven places => Eighth copy appears","Leave the mismatch => Wrong invoices","Duplicated knowledge drifts."],"a":["What do DRY, KISS and YAGNI mean in practice?","Single source for each rule","Simplest working design","No speculative features; beware premature abstraction"]},"uml class diagrams":{"e":["Each class box shows name, attributes and methods with visibility. Lines show association (uses), aggregation (has, weak ownership), composition (owns, lifetimes tied), inheritance (is-a) and interface implementation, with multiplicities such as 1 to many. Use them to communicate structure, not to document every field."],"t":"Boxes for classes, lines for their relationships.","p":"Drawing every attribute and getter. Show the structure that matters.","k":"Classes, relationships and multiplicities, nothing more.","q":["In UML, a filled diamond between Order and LineItem means:","Composition: line items cannot exist without the order","Inheritance","A loose association","An interface","Lifetime is owned by the whole."],"i":["Nobody can explain how the booking module's classes relate","The only documentation is the code itself.","Sketch a small class diagram of the key entities and relationships","Generate a 300-class diagram => Unreadable","Add inline comments only => No overview","A focused diagram communicates structure quickly."],"a":["What do you show in a class diagram?","Key classes with main attributes and methods","Relationship types","Multiplicities"]},"sequence diagrams":{"e":["Participants are drawn as columns with vertical lifelines; arrows between them are messages, read top to bottom. Solid arrows are calls, dashed arrows returns; asynchronous messages are marked. They are ideal for showing a single flow such as checkout, including failure paths and retries."],"t":"Who calls whom, in what order, over time.","p":"Using a class diagram to explain a runtime flow.","k":"Columns are participants, arrows are messages, time runs down.","q":["Which diagram best shows the steps of a payment across client, API, payment service and bank?","Sequence diagram","Class diagram","Deployment diagram","Pie chart","It shows ordered interactions."],"i":["Team disagrees about what happens when payment times out","Only a component diagram exists; the order of calls is in people's heads.","Draw a sequence diagram including the timeout path","Add more boxes to the component diagram => Still no ordering","Argue it out in chat => No shared picture","Interaction order needs its own diagram."],"a":["When do you use a sequence diagram?","To show order of calls in one scenario","Sync versus async messages","Include failure and retry paths"]},"state diagrams":{"e":["A state machine lists states (Created, Paid, Shipped, Delivered, Cancelled), the events that trigger transitions and any guards. It makes illegal transitions explicit and is the right tool for orders, bookings, lifts and connection handling. In code, enforce it in one place."],"t":"The states an object can be in and what moves it between them.","p":"Representing state with several booleans, which allows impossible combinations.","k":"Explicit states, explicit transitions, everything else illegal.","q":["An order has isPaid, isShipped and isCancelled flags. The problem is:","Impossible combinations such as shipped and cancelled can occur","Too few fields","It is too fast","Nothing","Independent flags do not constrain each other."],"i":["Orders found both \"cancelled\" and \"shipped\"","Status is spread over boolean columns updated by different services.","Model status as a single state machine with allowed transitions","Add a nightly script to fix them => Symptoms only","Add another flag => More combinations","A state machine rejects invalid transitions."],"a":["Why model something as a state machine?","Finite, named states","Allowed transitions with triggers","Prevents invalid states"]},"class relationships":{"e":["Dependency: temporarily uses. Association: holds a reference. Aggregation: has parts that can live on their own (a team and its players). Composition: owns parts whose lifetime it controls (a house and its rooms). Inheritance: is a specialised kind. Realisation: implements an interface. Prefer the weakest relationship that works."],"t":"The ways classes connect: uses, has, owns, is.","p":"Using inheritance where \"has-a\" is the true relationship.","k":"Is-a means inheritance; has-a means composition.","q":["A Car and its Engine, where the engine is created and destroyed with the car, is:","Composition","Inheritance","Dependency only","Realisation","The whole owns the part's lifetime."],"i":["A change in the base class breaks 14 subclasses","Stack extends ArrayList and inherits methods that violate stack rules.","Hold a list inside Stack rather than extending it","Override every unwanted method => Fragile","Document \"do not call these\" => Ignored","Inheritance exposes more than composition does."],"a":["What relationships can classes have?","Association, aggregation, composition","Inheritance and interface realisation","Choose the weakest coupling that works"]},"composition vs inheritance":{"e":["Inheritance reuses code through an is-a hierarchy; it is rigid, exposes parent internals and breaks when the base changes. Composition gives an object other objects that do the work, so behaviours can be mixed and swapped at runtime. The usual guidance is to favour composition and use inheritance for true subtypes."],"t":"Build behaviour by combining objects, or by extending a parent.","p":"Deep inheritance hierarchies built for code reuse.","k":"Favour composition; inherit only for true is-a.","q":["A game has flying, swimming and walking creatures in every combination. Best approach?","Compose creatures from movement behaviour objects","A class for every combination","One giant class with flags","Multiple inheritance of everything","Behaviours combine freely."],"i":["Adding \"robot duck\" requires a new branch of a five-level hierarchy","Behaviours are locked into the inheritance tree.","Refactor shared behaviours into composable components","Add a sixth level => Deeper rigidity","Duplicate code in the new class => Drift","Composition handles combinations that hierarchies cannot."],"a":["Why \"favour composition over inheritance\"?","Inheritance couples tightly to the parent","Composition swaps behaviour at runtime","Avoids fragile deep hierarchies"]},"interfaces abstractions":{"e":["An interface declares operations without implementation; many classes can implement it. Code written against the interface works with any of them, which enables substitution, testing with fakes and independent change. A good abstraction hides detail and is hard to misuse; a leaky one exposes internals."],"t":"Depend on what something does, not how it does it.","p":"Interfaces that mirror one implementation's quirks.","k":"Program to the interface; hide the how.","q":["Benefit of a NotificationSender interface with Email and SMS implementations?","Callers work with any sender without changes","It sends messages faster","It removes the need for tests","It stores data","Implementations are interchangeable."],"i":["Switching the cache library needs changes across the codebase","Code calls the library's specific classes directly everywhere.","Introduce a cache interface and depend on it","Find-and-replace the names => Behaviour differs subtly","Keep the old library forever => Stuck","Abstractions contain the blast radius of a change."],"a":["What makes a good abstraction?","Small, intention-revealing interface","Hides implementation detail","Allows substitution and testing"]},"design patterns":{"e":["Creational patterns (factory, builder, singleton) control object creation. Structural patterns (adapter, decorator, facade) compose objects. Behavioural patterns (strategy, observer, state, command) organise interaction. They give a shared vocabulary. Apply one when its problem actually appears, not to decorate the design."],"t":"Named, reusable solutions to recurring design problems.","p":"Forcing patterns in to look sophisticated.","k":"Know the problem each pattern solves; use it only then.","q":["Which group does the strategy pattern belong to?","Behavioural","Creational","Structural","Architectural","It governs how behaviour is selected."],"i":["A simple CRUD module has 40 classes including factories of factories","Patterns were applied everywhere \"for flexibility\".","Remove indirection that solves no current problem","Add a facade over it => More layers","Document the layers => Still complex","Patterns are tools for specific problems."],"a":["How should you use design patterns?","Recognise the recurring problem","Creational, structural, behavioural families","Avoid pattern-driven over-engineering"]},"thread safety":{"e":["Problems arise when threads share mutable state: check-then-act and read-modify-write races corrupt data. Options: avoid sharing, make objects immutable, guard state with locks, or use atomic variables and concurrent collections. Keep critical sections small and always acquire multiple locks in one order."],"t":"Correct behaviour when several thr
