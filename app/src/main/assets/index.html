ich replicate faithfully."],"t":"Once acknowledged, data survives crashes.","p":"Thinking replication is a backup. A DELETE replicates to every copy instantly.","k":"Replicas guard against hardware; backups guard against humans.","q":["A developer runs DELETE without a WHERE on production. What saves you?","A point-in-time backup","Synchronous replicas","A bigger disk","RAID","Replicas copy the delete; only backups hold the earlier state."],"i":["Cache node restart lost 20 minutes of user carts","Carts were stored only in an in-memory cache with no persistence.","Store carts in a durable database, with the cache in front","Add more RAM => Still gone on restart","Restart less often => Crashes do not ask","Acknowledged data must be on durable, replicated storage."],"a":["How do you make sure acknowledged data is never lost?","Persist before acknowledging","Replicate across machines or zones","Backups for logical errors"]},"security":{"e":["Cover the basics in every design: authenticate callers, authorise each action, encrypt in transit and at rest, validate input, limit rates, keep secrets out of code, log access, and give each component least privilege. Think about what an attacker gains at each boundary, and assume internal networks can be breached."],"t":"Protecting data and systems from misuse, by design.","p":"Treating security as a final step. Retrofitting auth and encryption is far costlier than designing them in.","k":"Authenticate, authorise, encrypt, validate, log.","q":["A service can read every table but needs only one. Which principle is violated?","Least privilege","Defence in depth","Encryption at rest","Rate limiting","Access should be limited to what the job requires."],"i":["Internal admin API found exposed on the internet","It had no authentication because \"only internal tools call it\".","Require authentication and restrict network access immediately","Change the URL to something obscure => Scanners find it again","Add a warning banner => No protection","Network location is not authentication."],"a":["What security points should every design mention?","Authn and authz","Encryption in transit and at rest","Least privilege, validation and audit logs"]},"capacity estimation":{"e":["Start from users and behaviour: daily active users times actions per day gives requests; divide by about 100,000 seconds for average QPS and multiply by 2 to 5 for peak. Storage is items per day times size times retention times replication. These numbers tell you whether you need one server or a sharded fleet."],"t":"Rough numbers for load, storage and bandwidth to size the design.","p":"Spending ten minutes on precise arithmetic. Round hard; you need the order of magnitude.","k":"A day is about 100,000 seconds. Round everything.","q":["50M daily users, 20 requests each. Average QPS is about:","12,000","1,200","120,000","1.2 million","One billion requests over about 86,400 seconds is roughly 11,600 per second."],"i":["New cluster ran out of disk in three weeks","Sizing used today's data and forgot growth, replication factor and indexes.","Re-estimate with growth, replication and index overhead, then add headroom","Delete old data weekly => Breaks retention promises","Buy the same amount again => Full again in three weeks","Estimates must include growth and replication multipliers."],"a":["How do you estimate capacity in an interview?","Users to QPS with a peak factor","Storage from size, retention and replication","Use round numbers and state assumptions"]},"back of the envelope calculations":{"e":["Memorise anchors: 1 million per day is about 12 per second; a day is roughly 10^5 seconds; 1 KB times 1 billion is 1 TB; a char is a byte, a UUID 16 bytes. Use powers of ten, state assumptions aloud and sanity-check the result against a single machine's capacity."],"t":"Quick arithmetic with round numbers to test if a design is sane.","p":"Hiding assumptions. The interviewer grades the reasoning, so say each assumption before using it.","k":"1M per day is about 12 per second.","q":["1 billion records of 1 KB each need roughly:","1 TB","1 GB","1 PB","100 MB","10^9 times 10^3 bytes is 10^12 bytes, a terabyte."],"i":["Proposal asks for 200 servers for a small internal tool","The estimate multiplied peak QPS by 100 \"to be safe\" with no stated basis.","Redo the estimate with explicit assumptions and a realistic peak factor","Approve it to be safe => Huge spend for idle machines","Halve it arbitrarily => Still a guess","Stated assumptions make an estimate reviewable."],"a":["Why do rough calculations at all if they're imprecise?","Order of magnitude drives design","Reveals bottlenecks early","Shows structured reasoning"]},"traffic estimation":{"e":["Daily active users times actions per user gives daily requests; divide by 86,400 for average QPS. Peak is usually 2 to 5 times average, more for events. Split reads from writes because they scale differently: a 100:1 read-heavy system calls for caching and replicas, a write-heavy one for partitioning and queues."],"t":"Turning user counts into requests per second, average and peak.","p":"Designing for average load. Systems fail at peak.","k":"Design for peak, and know your read to write ratio.","q":["A service averages 2,000 QPS. What should it be sized for?","Its peak, perhaps 6,000 to 10,000 QPS","Exactly 2,000 QPS","200 QPS","The yearly total","Capacity must cover peaks, not the mean."],"i":["Site fell over at 9 PM during a cricket final","Capacity was planned for average daily traffic; the match drove 8 times that.","Size and autoscale for known peaks and pre-warm before events","Add 10% capacity => Nowhere near an 8x spike","Rate limit all users to one request per minute => Product unusable","Peak-to-average ratio is the number that matters."],"a":["How do you go from \"10 million users\" to QPS?","DAU times actions per day","Divide by seconds in a day","Apply peak factor and read/write split"]},"storage estimation":{"e":["Multiply new items per day by average size, by days of retention, then by replication factor, and add overhead for indexes and metadata (often 20 to 30%). Separate small structured records from large blobs: metadata goes to a database, media to object storage, and they are sized and priced differently."],"t":"How many bytes you will hold, now and after years of growth.","p":"Forgetting replication and indexes, which commonly triple the raw figure.","k":"Size times count times retention times replicas, plus index overhead.","q":["10M photos per day at 2 MB with 3 copies. Daily storage is about:","60 TB","20 GB","6 TB","600 TB","10M times 2 MB is 20 TB, times three replicas is 60 TB."],"i":["Storage bill is three times the forecast","The forecast counted raw data only, not three replicas, thumbnails and indexes.","Re-forecast with replication, derived copies and tiering to cold storage","Delete user uploads => Unacceptable data loss","Drop to one replica => Durability gone","Real storage is raw data times its multipliers."],"a":["What goes into a storage estimate?","Item size and daily volume","Retention period","Replication and index overhead"]},"bandwidth estimation":{"e":["Bandwidth is requests per second times payload size, calculated separately for ingress (uploads) and egress (downloads). Media-heavy systems are dominated by egress, which cloud providers bill for, so CDNs, compression and smaller formats matter. Convert bytes to bits (times 8) when comparing with network link speeds."],"t":"Bytes per second moving in and out of the system.","p":"Mixing megabytes and megabits. Network capacity is quoted in bits per second.","k":"QPS times payload, times 8 for bits; egress is what you pay for.","q":["5,000 QPS with 200 KB responses needs about:","8 Gbps of egress","80 Mbps","800 Mbps","80 Gbps","5,000 times 200 KB is 1 GB per second, or 8 Gbps."],"i":["Cloud bill doubles after a video feature launch","Videos are served straight from origin servers in one region at full resolution.","Serve through a CDN with adaptive bitrates and compression","Add origin servers => More egress from the same costly place","Cap video length => Hurts the product, small saving","Egress is the dominant cost for media; push it to the edge."],"a":["Why estimate bandwidth separately from QPS?","Payload size varies hugely","Egress drives cost","Informs CDN and compression choices"]},"http methods":{"e":["GET reads, POST creates or triggers, PUT replaces, PATCH partially updates, DELETE removes. GET, HEAD and OPTIONS are safe (no side effects). GET, PUT and DELETE are idempotent: repeating them gives the same state. POST and usually PATCH are not, so retries can duplicate work."],"t":"Verbs that say what you want done to a resource.","p":"Using GET for actions that change state. Crawlers, caches and prefetchers will trigger them.","k":"GET never changes anything; POST is not safe to repeat.","q":["Which method is idempotent?","DELETE","POST","PATCH with an increment","None of them","Deleting the same resource twice leaves it deleted."],"i":["A link preview bot deleted customer records","The delete action was implemented as GET /records/123/delete and a crawler followed the links.","Use DELETE or POST for state changes and require authentication","Add the URLs to robots.txt => Not all bots obey","Hide the links with CSS => Still fetchable","Safe methods must stay safe; intermediaries assume it."],"a":["Why does it matter whether I use PUT or POST?","Idempotency and safe retries","Caches and clients rely on semantics","Clear, predictable API"]},"http status codes":{"e":["2xx success (200 OK, 201 Created, 204 No Content). 3xx redirect (301 permanent, 302 temporary, 304 not modified). 4xx client error (400 bad input, 401 not authenticated, 403 not allowed, 404 not found, 409 conflict, 429 too many requests). 5xx server error (500, 502 bad gateway, 503 unavailable, 504 gateway timeout)."],"t":"A three-digit summary of what happened to the request.","p":"Returning 200 with an error in the body. Clients, retries and monitoring all rely on the code.","k":"4xx is your fault, 5xx is mine, 429 means slow down.","q":["A logged-in user requests a page they lack permission for. Correct code?","403 Forbidden","401 Unauthorized","404 Not Found","500 Internal Server Error","They are authenticated but not authorised."],"i":["Error dashboard is green while customers see failures","The API returns 200 with {\"error\": ...}; alerts watch only 5xx rates.","Return proper 4xx and 5xx codes so clients and monitors can react","Parse response bodies in the alerting tool => Fragile and slow","Add a second dashboard => Still blind in clients and proxies","Status codes are the contract that infrastructure understands."],"a":["What's the difference between 401, 403 and 404?","401 not authenticated","403 authenticated but not allowed","404 resource does not exist"]},"http headers":{"e":["Key request headers: Authorization, Accept, Content-Type, Cookie, If-None-Match. Key response headers: Cache-Control, ETag, Set-Cookie, Content-Encoding, Location, Retry-After. CORS headers control which sites may call your API from a browser. Much of web performance and security is configured through headers alone."],"t":"Metadata that controls caching, auth, content and connections.","p":"Forgetting Cache-Control. Without it, caches guess, and personal data can be stored where it should not be.","k":"Cache-Control and ETag decide what gets re-downloaded.","q":["A client sends If-None-Match with the ETag it has. If the resource is unchanged the server returns:","304 Not Modified with no body","200 with the full body","404","500","The client reuses its cached copy, saving bandwidth."],"i":["Browser calls to the new API fail, curl works","The web app is on app.example.com and the API on api.example.com. The API sends no CORS headers.","Return the correct Access-Control-Allow-Origin for the web app's origin","Tell users to disable browser security => Dangerous and unrealistic","Allow every origin with credentials => Opens the API to any site","Browsers enforce cross-origin rules that servers declare through headers."],"a":["Which headers matter most for performance?","Cache-Control and ETag","Content-Encoding for compression","Connection reuse and conditional requests"]},"cookies sessions":{"e":["After login the server creates a session and sends its ID in a cookie, which the browser returns on every request. Session data lives server-side in a shared store such as Redis. Mark cookies HttpOnly (no JavaScript access), Secure (HTTPS only) and SameSite (limits cross-site sending). The alternative is a signed token such as a JWT holding the claims itself."],"t":"A cookie carries an ID; the session behind it holds the state.","p":"Putting sensitive data in the cookie itself, or omitting HttpOnly and Secure.","k":"HttpOnly, Secure, SameSite: every session cookie, every time.","q":["Which cookie flag stops JavaScript from reading the session ID?","HttpOnly","Secure","SameSite","Path","HttpOnly hides the cookie from scripts, limiting XSS theft."],"i":["Accounts hijacked after a comment-box XSS bug","Session cookies were readable by JavaScript and were sent to an attacker's server.","Set HttpOnly and Secure on session cookies and fix the XSS","Shorten session lifetime to an hour => Theft still works within the hour","Ask users to change passwords => The session theft continues","Cookie flags limit the damage of the bugs you have not found yet."],"a":["How does a server-side session work across many servers?","Cookie holds only a session ID","Session data in a shared store","Any server can look it up"]},"tls ssl":{"e":["In the TLS handshake the server presents a certificate signed by a trusted authority, the two sides agree keys, and traffic is then encrypted with fast symmetric ciphers. TLS 1.3 needs one round trip, or zero when resuming. It is usually terminated at the load balancer; sensitive systems re-encrypt to the backends or use mutual TLS between services."],"t":"Encryption, integrity and identity for data in transit.","p":"Letting certificates expire. It is one of the most common causes of total outages.","k":"Automate certificate renewal and alert well before expiry.","q":["What does the server's certificate prove?","That the server controls the domain, as vouched by a trusted authority","That the server is fast","That the user is logged in","That the data is compressed","It binds a public key to a domain identity."],"i":["Every client suddenly fails with certificate errors","The production certificate expired at midnight; renewal was a manual calendar reminder.","Renew now, then automate renewal and add expiry alerts","Tell clients to ignore certificate errors => Trains users to accept attacks","Switch the site to HTTP => Exposes all traffic","Certificates expire on schedule; automation is the only reliable fix."],"a":["What does TLS give you beyond \"encryption\"?","Confidentiality","Integrity against tampering","Authentication of the server"]},"graphql":{"e":["A typed schema describes the data; clients send queries naming the fields and nested relations they want, and one endpoint resolves them. It removes over-fetching and multiple round trips, which helps mobile and varied front ends. The costs are harder caching, the N+1 resolver problem, and expensive queries that need depth and complexity limits."],"t":"Clients ask for exactly the fields they need in one request.","p":"Ignoring N+1: a list of 100 items each triggering its own database query. Batch with a data loader.","k":"One request, exact fields; batch the resolvers.","q":["Main advantage of GraphQL over REST for a mobile home screen?","One round trip returning only the needed fields","It is always faster on the server","It needs no schema","It caches better at CDNs","It cuts over-fetching and chatty calls."],"i":["One query takes the database down","A client requested friends of friends of friends with all posts; there is no depth or cost limit.","Enforce query depth and complexity limits and batch resolvers","Add a bigger database => The next query goes one level deeper","Block that client's IP => Another client does the same","Flexible queries need server-side cost controls."],"a":["When would you choose GraphQL over REST?","Varied clients needing different shapes","Fewer round trips and no over-fetching","Costs: caching, N+1 and query limits"]},"grpc":{"e":["You define services and messages in Protocol Buffers and generate client and server code. Calls travel as compact binary over multiplexed HTTP/2 connections, with support for streaming in both directions, deadlines and cancellation. It is ideal between internal services; browsers need a proxy, and binary payloads are harder to inspect by hand."],"t":"Fast, typed service-to-service calls over HTTP/2.","p":"Proposing gRPC for a public browser-facing API without mentioning the gRPC-Web proxy or REST gateway.","k":"Protobuf contracts, HTTP/2 streams, deadlines everywhere.","q":["Why is gRPC popular between microservices?","Compact binary messages, strict contracts and multiplexed connections","Browsers support it natively","It needs no schema","It works over email","Efficiency and generated, typed clients suit internal calls."],"i":["Slow dependency causes requests to hang for minutes","Internal gRPC calls were made with no deadline; stuck calls pile up and exhaust threads.","Set deadlines on every call and propagate them downstream","Add more threads => More stuck calls","Restart the slow service hourly => Symptoms return","Every remote call needs a time limit."],"a":["Why use gRPC instead of REST internally?","Binary and efficient on HTTP/2","Strongly typed generated contracts","Streaming and deadlines built in"]},"server sent events sse":{"e":["The client opens a normal HTTP request and the server keeps it open, writing text events as they occur. Browsers reconnect automatically and can resume from the last event ID. It is simpler than WebSockets and passes through most proxies, but it is server-to-client only."],"t":"A one-way stream of updates from server to browser over HTTP.","p":"Reaching for WebSockets when the client never needs to send over the same channel.","k":"Server-to-client only? SSE is the simpler tool.","q":["Best transport for a live stock ticker shown on a web page?","Server-Sent Events","Polling every 30 seconds","SMTP","FTP","Updates flow one way, and SSE handles reconnects for free."],"i":["Live scores stop after 60 seconds for many users","A proxy closes idle connections after 60 seconds; the stream sends nothing between goals.","Send periodic heartbeat comments and rely on auto-reconnect with last event ID","Switch every user to polling each second => Heavy load for little data","Raise the proxy timeout to infinity => Dead connections pile up","Long-lived streams need heartbeats to survive intermediaries."],"a":["When is SSE a better choice than WebSockets?","Data flows only server to client","Plain HTTP with auto-reconnect","Simpler to operate"]},"long polling":{"e":["The client sends a request and the server delays the response until an event occurs or a timeout passes; the client then immediately asks again. It works everywhere HTTP works and gives near-real-time delivery, but each message costs a full request, and every waiting client ties up a connection."],"t":"The client asks; the server holds the request until there is news.","p":"Confusing it with regular polling. Long polling waits on the server; short polling repeatedly asks and usually gets nothing.","k":"Ask, wait, answer, ask again.","q":["Why choose long polling over WebSockets?","A network or client that only supports plain HTTP requests","It uses less server memory","It is bidirectional","It needs no reconnection","It is the fallback when persistent sockets are blocked."],"i":["Servers run out of threads with only 5,000 users online","Each long-poll request blocks one thread while it waits.","Hold the waiting requests with async, non-blocking handlers","Poll every 100 ms instead => Far more requests and load","Add 10 times the servers => Costly cure for a threading model","Waiting connections must not each hold a thread."],"a":["How is long polling different from normal polling?","Server holds the request open","Responds only when data exists","Client immediately re-requests"]},"api versioning":{"e":["Add fields and endpoints freely; removing or changing them is a breaking change that needs a new version. Common styles: in the path (/v2/orders), in a header, or by date. Run old and new versions side by side, announce deprecation with a timeline, and measure who still calls the old one before removing it."],"t":"Changing an API without breaking existing clients.","p":"Making a breaking change in place because \"all our clients will update\". Mobile apps stay on old versions for years.","k":"Additive changes are free; breaking changes need a new version.","q":["Which change is backward compatible?","Adding an optional field to a response","Renaming a field","Removing an endpoint","Changing a field from string to number","Old clients ignore fields they do not know."],"i":["Old app versions crash after a backend release","A response field was renamed; apps installed months ago still expect the old name.","Restore the old field and introduce the change under a new version","Force every user to update today => Many cannot or will not","Wait for users to upgrade => Crashes continue for months","Deployed clients are a contract you cannot change unilaterally."],"a":["How do you evolve an API that mobile apps depend on?","Only additive changes within a version","New version for breaking changes","Deprecate with a timeline and usage data"]},"api rate limiting":{"e":["Limits protect the service from abuse and overload and keep usage fair. Common algorithms: token bucket (allows bursts up to a bucket size), leaky bucket (smooth output), fixed window and sliding window counters. Counters usually live in Redis so all servers share them. Over the limit, return 429 with a Retry-After header."],"t":"Capping how many requests a client can make in a time window.","p":"Keeping counters in each server's memory. With ten servers the real limit becomes ten times the intended one.","k":"Token bucket in a shared store; 429 with Retry-After.","q":["Which algorithm allows short bursts while enforcing an average rate?","Token bucket","Fixed window with no burst","Round robin","Consistent hashing","Tokens accumulate while idle and can be spent in a burst."],"i":["One customer's script slows the API for everyone","A buggy integration sends 5,000 requests a second; there are no per-client limits.","Apply per-client rate limits at the gateway and return 429","Block the customer's country => Collateral damage","Scale up to absorb it => You pay for their bug","Rate limits isolate one client's behaviour from everyone else."],"a":["How would you implement rate limiting across many servers?","Token or sliding window algorithm","Shared counter store such as Redis","Return 429 with retry guidance"]},"connection pooling":{"e":["Opening a database connection costs a TCP and TLS handshake, authentication and server memory. A pool keeps a bounded set open and lends them to requests. This cuts latency and protects the database from connection floods. Size matters: too small and requests queue, too large and the database thrashes."],"t":"Reusing a fixed set of open connections instead of making new ones.","p":"Setting the pool size huge \"for safety\". Databases perform worse with thousands of active connections.","k":"A small, well-sized pool beats a huge one.","q":["Why not open a new database connection per request?","Setup cost is high and the database has a connection limit","Connections are free","Pools are slower","Databases prefer more connections","Reuse avoids handshakes and bounds load."],"i":["Database hits max connections after scaling the app to 50 pods","Each pod has a pool of 100; the database allows 2,000 connections.","Shrink per-pod pools or add a pooler such as PgBouncer in front","Raise max connections to 10,000 => Memory exhaustion and slower queries","Scale pods further => More connections demanded","Total connections equal pods times pool size; plan for it."],"a":["What does a connection pool actually solve?","Avoids repeated connection setup","Caps load on the database","Needs sizing against total instances"]},"keep alive connections":{"e":["Without keep-alive every HTTP request pays a new TCP and TLS handshake. Persistent connections reuse one socket for many requests, and HTTP/2 multiplexes them concurrently. Idle timeouts must be coordinated: if the server or load balancer closes first while the client still thinks the connection is alive, requests fail intermittently."],"t":"Keeping a TCP connection open for many requests.","p":"Mismatched idle timeouts between load balancer and backend, causing sporadic 502 errors.","k":"Reuse connections, and make the backend's idle timeout longer than the proxy's.","q":["Intermittent 502s appear on a low-traffic service behind a load balancer. Likely cause?","The backend closes idle keep-alive connections before the load balancer does","The database is full","DNS is caching","Too many users","The balancer reuses a connection the backend already closed."],"i":["Random 502s, roughly one in a thousand requests","The load balancer idle timeout is 60 s; the app server closes idle connections at 5 s.","Set the backend keep-alive timeout above the load balancer's","Disable keep-alive entirely => Every request pays a handshake","Add retries on the client => Masks the cause and doubles some writes","The upstream side should always outlive the proxy's idle timer."],"a":["Why do we bother keeping connections alive?","Avoid repeated handshakes","Lower latency and CPU","Timeouts must be aligned across hops"]},"relational databases":{"e":["Data lives in rows and columns with enforced types and constraints. Relationships are expressed through foreign keys and combined with joins. Transactions give ACID guarantees, and the query planner picks how to execute SQL. They are the default choice when data is structured, related and needs correctness; scaling writes beyond one node takes sharding."],"t":"Tables with a fixed schema, joined by keys and queried with SQL.","p":"Dismissing SQL as \"not scalable\". A well-indexed relational database with replicas handles most products.","k":"Default to relational; leave it only for a stated reason.","q":["Orders, customers and payments must stay consistent together. Best starting store?","A relational database","A key-value cache","A search index","A message queue","Related data with transactional needs is the relational sweet spot."],"i":["Customer was charged but no order exists","Payment and order rows are written by two separate calls; the second one failed.","Write both in one database transaction","Add a nightly reconciliation script => Customers wait a day for a fix","Retry the second write forever => Can duplicate orders","Transactions make multi-row changes all-or-nothing."],"a":["Why is a relational database still the default choice?","ACID transactions","Joins over related data","Mature tooling and flexible queries"]},"postgresql":{"e":["Postgres offers strong ACID compliance, MVCC, rich types (JSONB, arrays, geospatial through PostGIS), many index kinds (B-tree, GIN, GiST, BRIN), full-text search and extensions. Each connection is a process, so use a pooler such as PgBouncer. Dead row versions must be cleaned by vacuum. It scales reads with replicas and writes with partitioning or sharding layers."],"t":"A feature-rich open-source relational database.","p":"Opening thousands of direct connections. Postgres needs a connection pooler at scale.","k":"Postgres plus a pooler plus the right index goes a very long way.","q":["You need relational data plus flexible JSON attributes with indexes. Good fit?","PostgreSQL with JSONB","Memcached","A message queue","A CDN","JSONB columns are indexable and live beside relational tables."],"i":["Queries slow down week by week on a busy table","Autovacuum is not keeping up; the table is bloated with dead row versions.","Tune autovacuum for that table and reclaim the bloat","Add a read replica => Replica inherits the bloat","Restart Postgres nightly => Bloat stays on disk","MVCC leaves dead tuples; vacuum must keep pace with updates."],"a":["What makes Postgres a strong default?","ACID with MVCC","Rich types and index kinds","Extensible; needs pooling and vacuum care"]},"mysql":{"e":["MySQL with the InnoDB engine provides ACID transactions, row-level locking and a clustered primary key index, so rows are stored in primary key order. Replication is easy to set up and it powers many large read-heavy web systems, often sharded with tools such as Vitess. Random primary keys fragment the clustered index."],"t":"A widely used relational database known for simple, fast reads.","p":"Using random UUIDs as the InnoDB primary key, which scatters inserts across the clustered index.","k":"In InnoDB the primary key is the table's physical order.","q":["In InnoDB, why is a sequential primary key preferred over a random UUID?","Inserts append to the clustered index instead of splitting pages everywhere","UUIDs are not unique","Integers are encrypted","It avoids joins","Random keys cause page splits and poor cache locality."],"i":["Insert rate drops as the table passes 500M rows","The primary key is a random UUID; every insert touches a random page of the clustered index.","Switch to a time-ordered key such as an auto-increment or ordered UUID","Add more secondary indexes => More work per insert","Increase replica count => Replicas do not speed writes","Clustered storage rewards keys that arrive in order."],"a":["How does MySQL differ from Postgres in ways that matter?","Clustered primary key in InnoDB","Simple replication and read scaling","Fewer advanced types and index kinds"]},"tables relationships":{"e":["One-to-one links share or reference a key. One-to-many puts a foreign key on the \"many\" side (orders.customer_id). Many-to-many needs a junction table (student_courses). Modelling relationships correctly prevents duplicated data and makes queries natural; getting them wrong forces awkward updates everywhere."],"t":"Entities become tables; links between them become keys.","p":"Storing a comma-separated list of IDs in one column instead of a junction table.","k":"Many-to-many always means a third table.","q":["Students take many courses and courses have many students. How do you model it?","A junction table with student_id and course_id","A courses column listing student names","One table per student","A JSON blob on the school","A junction table holds one row per pairing."],"i":["Finding all users with a given tag takes 30 seconds","Tags are stored as a comma-separated string in the users table and searched with LIKE.","Move tags to a junction table with an index","Add more RAM => Still a full scan with string matching","Cache the result forever => Stale and misses still crawl","Relationships belong in rows, where indexes can find them."],"a":["How do you model a many-to-many relationship?","Junction table with two foreign keys","One row per pair","Index both columns for lookups each way"]},"primary foreign keys":{"e":["The primary key is unique and not null, and is the row's identity. A foreign key references another table's primary key, and the database rejects rows that point to nothing, which is referential integrity. Choose stable, meaningless keys (surrogate IDs) rather than data that can change, such as email."],"t":"A primary key names a row; a foreign key points to one.","p":"Using a business value like email or phone as the primary key. It changes, and every reference breaks.","k":"Keys should be meaningless and never change.","q":["Why avoid email as a primary key?","Users change emails, forcing updates in every referencing table","Emails are too short","Emails cannot be indexed","Emails are always duplicated","Identity should be stable; attributes change."],"i":["Reports show orders belonging to customers that do not exist","Customers were deleted while orders still referenced them; there is no foreign key constraint.","Add foreign key constraints and decide the delete rule","Filter orphans in every report => Every query carries the workaround","Never delete customers => Privacy law may require deletion","Constraints stop invalid references at write time."],"a":["What do foreign keys buy you?","Referential integrity","Database rejects orphan rows","Clear, enforced relationships"]},"indexing":{"e":["An index maps column values to row locations, usually as a B+ tree, so lookups take logarithmic time. Composite indexes follow the leftmost-prefix rule: an index on (a, b) helps filters on a, or a and b, but not b alone. Indexes cost storage and slow writes, since each must be updated. A covering index answers a query without touching the table."],"t":"A sorted lookup structure that lets queries skip the full scan.","p":"Indexing every column. Each index slows every insert and update.","k":"Index what you filter and sort on, in that order.","q":["An index exists on (country, city). Which query cannot use it efficiently?","WHERE city = 'Pune'","WHERE country = 'IN'","WHERE country = 'IN' AND city = 'Pune'","WHERE country = 'IN' ORDER BY city","The leading column must be constrained."],"i":["Login endpoint takes 4 seconds as users pass 20M","The lookup is WHERE email = ? and there is no index on email.","Add an index on email","Scale up the database server => A faster full scan is still a full scan","Add app servers => They all wait on the same scan","The right index turns a table scan into a few page reads."],"a":["How does an index speed up a query, and what does it cost?","Sorted structure for logarithmic lookup","Slower writes and more storage","Column order matters in composite indexes"]},"b tree b tree":{"e":["Each node is a disk page holding many keys, so a tree of a few levels indexes billions of rows and a lookup needs only three or four page reads. In a B+ tree all values sit in the leaves, which are linked, making range scans fast. This is the default index in relational databases."],"t":"Shallow, wide sorted trees built for disk pages.","p":"Saying databases use binary trees. Binary trees are too deep for disk; the high fan-out is the point.","k":"Wide nodes, few levels, linked leaves for ranges.","q":["Why do B+ trees suit range queries such as dates between X and Y?","Leaves are sorted and linked, so the scan walks sideways","They use hashing","They store data unsorted","They avoid disk","After finding the start, the scan follows leaf pointers."],"i":["Range query on a hash-indexed column scans the whole table","Someone created a hash index on created_at; \"last 7 days\" cannot use it.","Replace it with a B-tree index","Add a second hash index => Still no ordering","Increase memory => Scan stays linear","Hash indexes answer equality only; B-trees answer ranges."],"a":["Why B+ trees and not binary search trees or hash tables?","High fan-out means few disk reads","Sorted, so ranges work","Linked leaves for sequential scans"]},"query optimization":{"e":["Read the plan with EXPLAIN: look for full scans, bad join orders and sorts on disk. Fixes include adding or reshaping indexes, selecting only needed columns, avoiding functions on indexed columns, paginating by key instead of OFFSET, and eliminating N+1 patterns by joining or batching."],"t":"Making the database do less work for the same answer.","p":"Tuning by guesswork. Always read the query plan first.","k":"EXPLAIN before you change anything.","q":["Why is WHERE YEAR(created_at) = 2024 slow despite an index on created_at?","The function on the column prevents index use","Years are too large","Indexes ignore dates","The table is locked","Rewrite it as a range on the raw column."],"i":["Page load issues 501 queries","The code loads 500 orders, then queries each order's customer one by one.","Fetch the customers in one joined or batched query","Add a cache in front of each query => 501 cache calls instead","Increase the pool size => More parallel waste","N+1 patterns multiply round trips; batch them."],"a":["A query is slow. How do you approach it?","Read the execution plan","Fix scans with indexes or rewrites","Remove N+1 and deep OFFSET patterns"]},"joins":{"e":["INNER JOIN returns matching pairs; LEFT JOIN keeps all left rows even without a match. The engine picks an algorithm: nested loop (good with an index on the inner table), hash join (large unsorted sets) or merge join (pre-sorted inputs). Joins need indexes on the join keys, and they cannot cross shards cheaply."],"t":"Combining rows from tables on a matching key.","p":"Forgetting that joins across shards or services are not available; you must denormalise or join in the application.","k":"Index the join keys; joins stop at the shard boundary.","q":["You want all customers, including those with no orders. Which join?","LEFT JOIN from customers to orders","INNER JOIN","CROSS JOIN","No join can do this","LEFT JOIN preserves unmatched left rows."],"i":["Report query runs for minutes","It joins two 10M-row tables on a column with no index, falling back to nested loops over full scans.","Index the join column on the inner table","Add a LIMIT => The join work still happens","Run it more often to warm the cache => Still minutes each time","Join performance depends on being able to find matches quickly."],"a":["What happens to joins once you shard the database?","Cross-shard joins are impractical","Denormalise or join in the application","Co-locate related data on the same shard"]},"transactions":{"e":["BEGIN, do the work, then COMMIT to make it permanent or ROLLBACK to undo it. Transactions keep invariants across multiple rows, such as debiting one account and crediting another. Keep them short: long transactions hold locks, block others and bloat MVCC storage. Never make a network call inside one."],"t":"A group of operations that succeed or fail together.","p":"Holding a transaction open while calling an external API. Locks stay held for the duration of that call.","k":"Short transactions, no network calls inside.","q":["Why avoid calling a payment gateway inside a database transaction?","Locks are held while waiting on the network, blocking other work","The gateway forbids it","Transactions cannot contain reads","It makes the query cheaper","External latency becomes lock time."],"i":["Whole checkout table locks up for 30 seconds at a time","A transaction updates inventory, then waits on a slow shipping API before committing.","Move the API call outside the transaction","Raise the lock timeout => Longer pile-ups","Add a retry on lock errors => More contention","Transaction duration is lock duration."],"a":["What is a transaction and when do you need one?","All-or-nothing group of changes","Preserves multi-row invariants","Keep short to limit locking"]},"acid properties":{"e":["Atomicity: all of a transaction applies or none. Consistency: constraints hold before and after. Isolation: concurrent transactions do not interfere, to the degree the isolation level promises. Durability: committed data survives crashes, through a write-ahead log. Together they let application code ignore partial failure."],"t":"Atomicity, Consistency, Isolation, Durability.","p":"Mixing up the C in ACID (constraints hold) with the C in CAP (replicas agree).","k":"All or nothing, valid, separate, permanent.","q":["A crash occurs midway through a transfer. Which property ensures no money vanishes?","Atomicity","Durability","Isolation","Availability","The partial transaction is rolled back entirely."],"i":["After a power loss, the last 5 minutes of orders are gone","The database was configured to skip syncing its log to disk for speed.","Re-enable durable log flushing on commit","Buy a faster CPU => Unrelated to lost writes","Take daily backups => Still loses a day's tail","Durability means the commit reached stable storage before it was acknowledged."],"a":["Walk me through ACID with a bank transfer.","Atomic: debit and credit together","Isolated: others never see half","Durable: survives a crash once committed"]},"normalization denormalization":{"e":["Normalisation splits data into tables so each fact lives in one place, which keeps writes simple and prevents inconsistencies but needs joins to read. Denormalisation duplicates data (a username stored on each post) so reads avoid joins, at the cost of updating every copy and risking drift. Normalise first; denormalise measured hot paths."],"t":"Store each fact once, or copy it to make reads faster.","p":"Denormalising before measuring. You pay the consistency cost forever for a problem you may not have.","k":"Normalise for writes, denormalise for reads you have measured.","q":["A feed must show author names with no join at very high read volume. Reasonable choice?","Denormalise the author name onto each post","Normalise further","Remove the author","Store names in the URL","Reads vastly outnumber the rare name change."],"i":["Old posts show the user's previous name","Names are copied onto posts for speed, but a rename only updates the users table.","Propagate the rename to copies asynchronously","Remove names from posts => Feed needs joins again","Forbid renaming => Product limitation for a data bug","Every denormalised copy needs an update path."],"a":["When would you denormalise?","Read-heavy path where joins hurt","Accept duplicate data and update cost","Keep a source of truth and propagate changes"]},"nosql databases":{"e":["The families are key-value, document, wide-column and graph. Most scale horizontally by partitioning on a key and replicate for availability, often with tunable or eventual consistency. You model data around your queries, since joins and ad hoc queries are limited. They fit huge write volumes, flexible shapes and simple access patterns."],"t":"Non-relational stores that trade joins and schemas for scale and flexibility.","p":"Choosing NoSQL \"for scale\" without known access patterns. You must design the queries first.","k":"In NoSQL you design the queries first, then the data.","q":["What do you typically give up by moving to a NoSQL store?","Joins and multi-row transactions","The ability to store data","Replication","Indexes of any kind","Most trade relational features for partitioned scale."],"i":["New report needs a query the store cannot do","Data in a key-value store is keyed by user ID; the business now wants \"all orders by city\".","Maintain a second table or index keyed for that query","Scan every partition each time => Slow and expensive","Migrate everything overnight => High risk","NoSQL serves the access patterns you modelled, and little else."],"a":["When does NoSQL make sense over SQL?","Massive scale or write volume","Flexible or simple key-based access","Accept limited joins and weaker consistency"]},"document databases":{"e":["Each document holds an entity with nested fields and arrays, so data that is read together is stored together and needs no join. Schemas can vary per document, which suits evolving products and catalogues. They struggle with many-to-many relationships and updates that span documents."],"t":"JSON-like documents grouped in collections, no fixed schema.","p":"Embedding unbounded arrays (all comments inside a post). Documents hit size limits and rewrites become costly.","k":"Embed what you read together and what stays bounded.","q":["Which data fits a document model best?","A product catalogue with different attributes per category","A double-entry ledger","A social graph of friendships","Time-ordered sensor readings at huge scale","Varied, self-contained records suit documents."],"i":["Updates to popular posts fail with \"document too large\"","Every comment is appended into the post document; some have 200,000.","Move comments to their own collection referencing the post","Raise the size limit => Rewrites get even slower","Truncate old comments => Data loss","Embed bounded data; reference unbounded data."],"a":["When do you embed versus reference in a document store?","Embed bounded data read together","Reference large or shared data","Avoid unbounded growth in one document"]},"key value stores":{"e":["The simplest model: opaque values addressed by a unique key, giving constant-time reads and writes and easy partitioning by hashing the key. Examples include Redis, DynamoDB and Memcached. There are no queries by value, so every access must know the key. Ideal for sessions, carts, caches, counters and feature flags."],"t":"A giant dictionary: put a value by key, get it back by key.","p":"Trying to query by value or range. If you need that, you need a secondary index or another store.","k":"If you always know the key, nothing is faster.","q":["Best store for user sessions looked up by session ID?","A key-value store","A graph database","A data warehouse","A search engine","Single-key lookup at high speed is exactly its job."],"i":["\"Find all sessions for user 42\" takes minutes","Sessions are keyed by session ID only; the feature scans every key.","Maintain a second key mapping user ID to their session IDs","Run the scan on a bigger node => Still a full scan","Use key pattern matching in production => Blocks the store","Key-value stores need an explicit key for every access path."],"a":["What are key-value stores good and bad at?","Fast lookup by exact key","Easy to partition and scale","No queries by value without extra indexes"]},"wide column stores":{"e":["Stores such as Cassandra and HBase hash a partition key to a node and keep rows within a partition sorted by clustering columns. Writes append to a log-structured tree, so they are very fast. You design one table per query. They suit time series, messaging and event data at huge scale, with tunable consistency."],"t":"Rows grouped by partition key, sorted by clustering key, built for writes.","p":"Choosing a partition key that creates huge or hot partitions, such as one partition per country.","k":"Partition key spreads the data; clustering key sorts it.","q":["Messages are read per chat in time order. Good primary key?","Partition by chat ID, cluster by timestamp","Partition by timestamp","Partition by message text","A single global partition","One partition per chat, already sorted by time."],"i":["One node at 100% while others idle","The partition key is the celebrity's user ID; one partition holds billions of rows.","Add a bucket such as month to the partition key to split it","Add more nodes => The hot partition still lives on one node","Raise the replication factor => More copies of the same hot spot","Partition keys must spread load and bound partition size."],"a":["How do you model data in Cassandra?","Start from the queries","Partition key for distribution","Clustering key for sort order within a partition"]},"graph databases":{"e":["Entities are nodes and connections are first-class edges with properties. Following an edge is a pointer hop, so multi-hop questions such as friends of friends, shortest path or fraud rings stay fast where SQL would need many self-joins. They are harder to shard and weaker for bulk aggregation."],"t":"Nodes and relationships stored so traversals are cheap.","p":"Using a graph database for simple one-hop lookups a relational table handles fine.","k":"Reach for graphs when the question is about the connections.","q":["Which query most favours a graph database?","People you may know through mutual friends","Total sales per month","Lookup of a user by ID","Storing images","Multi-hop relationship traversal is the core strength."],"i":["Fraud check query times out","Detecting rings of accounts sharing devices and cards needs six self-joins in SQL.","Model accounts, devices and cards as a graph and traverse it","Add indexes to all six joins => Still explodes combinatorially","Limit the check to two hops => Misses the rings","Deep relationship queries are traversals, not joins."],"a":["When is a graph database worth it?","Queries traverse many relationship hops","Relationships carry meaning and properties","Trade-off: harder to shard and aggregate"]},"mongodb cassandra dynamodb":{"e":["MongoDB is a document store with rich queries and secondary indexes, good for flexible application data. Cassandra is a wide-column store with no single leader, tuned for huge write volumes and multi-region availability. DynamoDB is a managed key-value and document service with predictable latency, where you design around partition and sort keys."],"t":"Three popular NoSQL choices with different sweet spots.","p":"Treating them as interchangeable. Their data models and consistency behaviours differ a lot.","k":"Mongo for flexible queries, Cassandra for writes, DynamoDB for managed key access.","q":["A write-heavy, multi-region time-series workload with no need for joins fits best in:","Cassandra","A single MongoDB node","SQLite","A graph database","Leaderless replication and log-structured writes suit it."],"i":["DynamoDB requests throttled though total capacity is unused","A single partition key (one tenant) receives most traffic and exceeds its partition's share.","Redesign the key to spread that tenant across partitions","Double total provisioned capacity => The hot partition is still capped","Retry harder => More throttling","Capacity is per partition; hot keys throttle first."],"a":["How would you choose between MongoDB, Cassandra and DynamoDB?","Query flexibility versus write scale","Operational model: self-run or managed","Key design and consistency needs"]},"storage engines":{"e":["Two families dominate. B-tree engines (InnoDB, Postgres) update pages in place, giving fast reads and predictable performance. LSM-tree engines (RocksDB, Cassandra) append writes to memory and sorted files, then compact in the background, giving very fast writes at the cost of read and compaction overhead."],"t":"The layer that decides how bytes are laid out on disk.","p":"Not knowing why a write-heavy store uses LSM trees. Sequential appends beat random page updates.","k":"B-trees favour reads; LSM trees favour writes.","q":["Why are LSM-tree engines good for write-heavy workloads?","Writes are sequential appends rather than random in-place updates","They never use disk","They keep no indexes","They skip durability","Sequential I/O is far cheaper than random I/O."],"i":["Read latency spikes periodically on a write-heavy store","Compaction is falling behind; reads must check many sorted files.","Tune compaction and give it I/O budget","Disable compaction => Reads degrade without limit","Add indexes => More write and compaction work","LSM engines trade background compaction for write speed."],"a":["B-tree or LSM-tree: what's the difference in practice?","In-place pages versus append and compact","Read-optimised versus write-optimised","LSM pays with compaction and read amplification"]},"write ahead logging wal":{"e":["Before modifying data pages, the database appends the change to a sequential log and flushes it. If it crashes, it replays the log to recover committed work. Sequential log writes are fast, so durability costs little. The same log feeds replication and change data capture."],"t":"Write the change to a log first, then to the data files.","p":"Thinking WAL makes writes slower. It replaces many random writes with one sequential write.","k":"Log first, apply later, replay after a crash.","q":["What does the WAL enable besides crash recovery?","Replication and change data capture","Faster joins","Smaller indexes","Schema migration","Replicas and CDC tools read the same ordered log."],"i":["Replica stops; primary disk fills up","A replica went offline; the primary keeps WAL for it and nobody alerted on retention.","Remove or repair the stalled replica slot and alert on WAL size","Add a larger disk => Fills again while the slot is stuck","Delete WAL files by hand => Risks corrupt recovery","Retained log grows without bound for a consumer that never catches up."],"a":["How does a database survive a crash mid-write?","Change logged before data pages","Replay log on restart","Same log drives replication"]},"mvcc":{"e":["Multi-version concurrency control keeps several versions of a row. Each transaction reads the version that was committed when it started, so reads need no locks and are consistent. Writers create new versions. Old versions must be cleaned up (vacuum in Postgres), and long-running transactions prevent that cleanup."],"t":"Readers see a snapshot, so they never block writers.","p":"Leaving a transaction open for hours. It pins old versions and bloats the database.","k":"Readers do not block writers; old versions need cleaning.","q":["Under MVCC, a long report runs while rows are updated. The report sees:","A consistent snapshot from when it started","Half-updated rows","Nothing until writers finish","Random versions","Each transaction reads its own snapshot."],"i":["Table doubles in size with no new data","An idle transaction has been open for two days; vacuum cannot remove versions it might still need.","Terminate the idle transaction and set idle-in-transaction timeouts","Add disk => Bloat keeps growing","Rebuild the table weekly => Downtime for a preventable cause","Long transactions block version cleanup."],"a":["How do reads and writes avoid blocking each other in Postgres?","Multiple row versions","Snapshot per transaction","Cleanup needed; long transactions hurt"]},"locking":{"e":["Shared locks let many readers in; exclusive locks let one writer. Pessimistic locking takes the lock first (SELECT FOR UPDATE), which is safe under high contention. Optimistic locking reads a version number and updates only if it is unchanged, retrying on conflict, which is cheaper when conflicts are rare. Deadlocks occur when transactions wait on each other in a cycle."],"t":"Controlling concurrent access so changes do not collide.","p":"Acquiring locks in different orders in different code paths, which creates deadlocks.","k":"Always lock in the same order; optimistic when conflicts are rare.","q":["Two users edit the same wiki page and conflicts are rare. Best approach?","Optimistic locking with a version check","Lock the page for the whole editing session","No concurrency control","A global lock","Version checks avoid holding locks during long edits."],"i":["Database reports deadlocks every few minutes","One job locks account A then B; another locks B then A.","Acquire locks in a consistent order, such as by ID","Raise the deadlock timeout => Longer waits before the same failure","Retry endlessly => Thrashing under load","Consistent lock ordering removes the cycle."],"a":["Optimistic versus pessimistic locking: when do you use each?","Pessimistic under high contention","Optimistic with version checks when conflicts are rare","Consistent ordering avoids deadlocks"]},"isolation levels":{"e":["Read uncommitted allows dirty reads. Read committed (a common default) sees only committed data but can see different values on re-read. Repeatable read gives a stable snapshot but may allow phantoms or write skew. Serializable behaves as if transactions ran one at a time, at the highest cost. Higher isolation means fewer anomalies and more aborts or blocking."],"t":"How much one transaction can see of others in progress.","p":"Assuming the default level prevents all race conditions. Read committed still allows lost updates.","k":"Stronger isolation: fewer surprises, more waiting.","q":["Two transactions each read a balance of 100 and both write balance minus 30, ending at 70. This anomaly is:","A lost update","A dirty read","A phantom read","A deadlock","One update overwrote the other."],"i":["Two doctors both go off call, leaving nobody on duty","Each transaction checked \"at least one other on call\" from its own snapshot, then updated itself.","Use serializable isolation or lock the rows being checked","Add an application-level sleep => Race window stays","Run the check twice => Both still pass","Write skew needs serializable isolation or explicit locks."],"a":["Why not always use the strongest isolation level?","It costs throughput through blocking or aborts","Weaker levels allow specific anomalies","Choose per transaction based on the invariant"]},"sql vs nosql":{"e":["Choose SQL when data is relational, queries are varied and correctness matters: you get joins, ACID and ad hoc queries. Choose NoSQL when access patterns are simple and known, scale or write volume is extreme, or the shape varies. Many systems use both: a relational core plus specialised stores for cache, search and events."],"t":"Structured and transactional versus flexible and horizontally scaled.","p":"Answering with a brand name. State the access patterns and consistency needs, then the choice.","k":"Decide from access patterns and consistency, not fashion.","q":["Which requirement points most strongly to SQL?","Complex ad hoc reporting across related entities with transactions","Storing session blobs by ID","Appending billions of sensor events","Caching rendered pages","Joins and transactions are relational strengths."],"i":["Ledger balances drift after moving to an eventually consistent store","Transfers update two documents with no transaction; partial failures leave them out of step.","Keep the ledger in a transactional relational store","Add a nightly fix-up job => Wrong balances all day","Increase the replication factor => Does not add atomicity","Money needs atomic multi-row updates."],"a":["How do you decide between SQL and NoSQL?","Shape and relationships of the data","Query patterns and consistency needs","Scale and write volume"]},"schema design":{"e":["List the entities, their relationships and the main queries. Pick keys, types and constraints; add indexes for the frequent filters and sorts. Plan for change: additive, backward-compatible migrations applied in steps (add column, backfill, switch, remove). In NoSQL, the partition key choice is the schema's most important decision."],"t":"Shaping tables or documents around entities and how they are queried.","p":"Designing only from the entities and ignoring the queries that will run against them.","k":"Model the entities, then check every main query against them.","q":["What is the safest way to rename a column in a live system?","Add the new column, write to both, backfill, switch reads, then drop the old","Rename it in place during peak","Drop and recreate the table","Ask clients to guess","Stepwise migration keeps old and new code working."],"i":["Deploy fails halfway; old pods crash on a missing column","The migration dropped a column that the still-running old version reads.","Use expand-then-contract migrations compatible with both versions","Deploy faster => The window still exists","Take downtime for every change => Avoidable outages","Schema changes must work with the previous code version."],"a":["How do you approach designing a schema?","Entities and relationships","Driven by query patterns and keys","Evolve with backward-compatible migrations"]},"read heavy vs write heavy workloads":{"e":["Read-heavy systems (feeds, catalogues) benefit from caches, read replicas, CDNs and denormalised read models. Write-heavy systems (logging, telemetry, chat) need append-friendly storage such as LSM trees, partitioning, batching and queues to absorb bursts. Know the ratio before choosing anything."],"t":"The read to write ratio decides which tools help.","p":"Adding read replicas to fix a write bottleneck. Replicas do nothing for writes.","k":"Reads: cache and replicate. Writes: partition and batch.","q":["A system ingests 500,000 events per second and is rarely read. Which helps most?","Partitioned, append-optimised storage with batching","More read replicas","A CDN","Larger browser cache","The bottleneck is writes, so spread and batch them."],"i":["Primary database saturated despite five read replicas","90% of load is inserts from telemetry; replicas sit idle.","Partition the writes and buffer them through a queue with batching","Add five more replicas => Idle capacity grows","Cache the inserts => Writes cannot be cached away","Match the remedy to the side of the workload that is hot."],"a":["How does the read/write ratio change your design?","Read-heavy: caches and replicas","Write-heavy: partitioning, LSM and queues","Measure the ratio first"]},"what is caching":{"e":["A cache stores the result of a slow operation (a query, a computation, a remote call) in fast storage, usually memory, so repeats are served quickly. It trades freshness and memory for speed and lower backend load. It works because access is skewed: a small share of items gets most requests."],"t":"Keeping a copy of expensive results somewhere faster.","p":"Adding a cache to hide a slow query instead of fixing the query. The cache miss is still slow.","k":"A cache trades freshness for speed.","q":["Caching helps most when:","The same data is read far more often than it changes","Every request is unique","Data changes on every read","The backend is already instant","Repeated reads of stable data give high hit rates."],"i":["Adding a cache made no difference to database load","Hit rate is 3%: each request uses a unique key including a timestamp.","Fix the cache key so identical requests share an entry","Double the cache memory => Still no repeated keys","Lengthen the TTL => Nothing to reuse","A cache only helps when keys repeat."],"a":["Why does caching work, and what does it cost?","Skewed access gives high hit rates","Faster reads and lower backend load","Cost: staleness, memory and invalidation"]},"cache hierarchy":{"e":["A request may be answered by the browser cache, a CDN edge, a reverse proxy, an application cache such as Redis, or the database's own buffer cache. The closer to the user a layer answers, the cheaper the request. Each layer needs its own TTL and invalidation story."],"t":"Layers of cache from the user's device down to the database.","p":"Forgetting upstream layers when invalidating. You clear Redis, but the CDN and browsers still serve the old copy.","k":"Answer as close to the user as you safely can.","q":["A price update shows in the database and Redis but users still see the old price. Where to look?","CDN and browser caches","The database index","The load balancer algorithm","DNS","Outer layers may still hold the old response."],"i":["Fixed typo still visible to users an hour later","The page is cached at the CDN for 24 hours; only the app cache was cleared.","Purge the CDN and use versioned URLs or shorter TTLs for changing content","Clear the app cache again => Already clean","Ask users to hard refresh => Does not scale","Invalidation must reach every layer holding a copy."],"a":["What caching layers exist between a user and the database?","Browser and CDN","Proxy and application cache","Database buffer cache; each needs invalidation"]},"client side caching":{"e":["Browsers and apps cache according to headers: Cache-Control max-age for how long, ETag and Last-Modified for cheap revalidation (304 Not Modified). Static assets get long lifetimes with a content hash in the filename, so a new version is a new URL. Apps also cache API data locally for offline use."],"t":"Storing responses on the user's device to skip the network.","p":"Giving index.html a long max-age. Users then never fetch the new asset URLs.","k":"Hash the filename, cache forever; never cache the entry page for long.","q":["How do you cache JavaScript bundles for a year and still ship updates instantly?","Put a content hash in the filename so each version has a new URL","Ask users to clear their cache","Use a one-second max-age","Disable caching","A changed file gets a different URL, bypassing the old cache."],"i":["Users stuck on a broken release for days","index.html was served with max-age of one week and points at the buggy bundle.","Serve the HTML entry point with no-cache and hashed assets with long max-age","Rename the bundle again => The cached HTML still points to the old one","Wait a week => Users suffer","Cache the immutable, revalidate the mutable."],"a":["How do you cache static assets aggressively but still deploy?","Long max-age on hashed filenames","Short or no cache on the HTML","ETag revalidation for the rest"]},"cdn caching":{"e":["A CDN's points of presence cache responses from your origin and serve them locally, cutting latency and origin load and absorbing spikes and attacks. Control it with Cache-Control (s-maxage), cache keys and purges. Static assets and media are obvious fits; cacheable API responses can be too."],"t":"Copies of content served from edge servers near users.","p":"Caching personalised responses at the CDN without varying the cache key, leaking one user's data to another.","k":"Cache public content at the edge; never share private responses.","q":["A user in Singapore loads images from a US origin slowly. Best fix?","Serve them through a CDN","Buy the user a faster phone","Compress the database","Add app servers in the US","Edge caches remove the long round trip."],"i":["Users see someone else's account page","The CDN cached /account without the session in the cache key.","Mark it private or no-store and purge the cache","Reduce the TTL to 10 seconds => Leak persists in 10-second windows","Add a login reminder => Does not fix the leak","Shared caches must never store per-user responses under a shared key."],"a":["What should and shouldn't go on a CDN?","Static and public content: yes","Per-user responses: no, or vary the key","Control with TTLs, keys and purges"]},"application level caching":{"e":["The application decides what to cache, under which key and for how long. In-process caches are fastest but private to each instance and lost on restart. A shared cache such as Redis is consistent across instances and survives deploys. Common targets are query results, rendered fragments, permissions and remote API responses."],"t":"The service itself stores computed results in memory or Redis.","p":"In-process caches on many instances returning different answers until each expires.","k":"Local cache is fastest; shared cache is consistent.","q":["Ten app instances each cache a config value in memory for 10 minutes. After a change:","Instances disagree until each one's entry expires","All update instantly","The database updates them","The load balancer syncs them","Local caches are independent."],"i":["Feature flag appears on and off as users refresh","Each instance caches flags locally for 5 minutes; a change reached only some.","Use a shared cache or push invalidation to all instances","Lengthen the local TTL => Inconsistent for longer","Restart servers on every change => Heavy-handed and slow","Per-instance caches need a way to agree."],"a":["Local in-memory cache or Redis?","Local: no network hop, per instance","Shared: consistent and survives restarts","Often both, with short local TTLs"]},"database caching":{"e":["The database keeps hot pages in its buffer pool, so enough RAM for the working set matters more than anything. Other options are materialised views (precomputed query results refreshed on a schedule) and an external query-result cache. When the working set outgrows memory, every query starts hitting disk."],"t":"Caching inside or just in front of the database.","p":"Ignoring the buffer pool. If the working set no longer fits in RAM, latency falls off a cliff.","k":"Keep the working set in memory.","q":["Queries got suddenly slower as data grew, with no code change. Likely reason?","The working set no longer fits in the buffer cache","Indexes disappeared","SQL changed meaning","The network shrank","Disk reads replaced memory hits."],"i":["Dashboard query takes 40 seconds and runs every page view","It aggregates a year of orders each time.","Precompute it in a materialised view or summary table refreshed periodically","Add an index on every column => Aggregation still scans the range","Run it on the primary at peak => Starves transactional work","Precomputation turns repeated heavy reads into cheap lookups."],"a":["How does the database itself cache, and how do you help it?","Buffer pool holds hot pages","Size RAM for the working set","Materialised views for heavy aggregates"]},"redis":{"e":["Redis keeps data in RAM and executes commands on a single thread, giving sub-millisecond operations. Beyond strings it offers hashes, lists, sets, sorted sets, streams and pub/sub, with TTLs on keys. Persistence (RDB snapshots, AOF log), replication and clustering are optional. Typical uses: caching, sessions, rate limits, leaderboards, locks and queues."],"t":"An in-memory data-structure store used as cache, counter and more.","p":"Running slow commands such as KEYS * in production. One slow command blocks every client.","k":"Single-threaded and in memory: keep every command small.","q":["Best Redis structure for a real-time leaderboard?","Sorted set","String","List","Plain hash","Sorted sets keep members ordered by score with fast rank queries."],"i":["Every request stalls for seconds at random","A script runs KEYS * on a 50M-key instance, blocking the single thread.","Replace it with incremental SCAN and remove it from the hot path","Add replicas => The primary still blocks","Increase client timeouts => Stalls just last longer","One O(n) command stops the world in a single-threaded server."],"a":["Why is Redis more than just a cache?","Rich data structures","Sub-millisecond, single-threaded operations","TTLs, pub/sub, optional persistence"]},"memcached":{"e":["Memcached stores strings by key with a TTL and LRU eviction, and nothing else: no persistence, no replication, no data structures. Clients spread keys across nodes with consistent hashing. Its simplicity and multi-threading make it very efficient for plain object caching."],"t":"A simple, multi-threaded in-memory key-value cache.","p":"Storing data you cannot afford to lose. A restart empties it.","k":"Plain cache, nothing more, and that is the point.","q":["When might Memcached be preferred over Redis?","Simple large-scale object caching needing only get and set","When you need sorted sets","When you need persistence","When you need pub/sub","It is lean and multi-threaded for the simple case."],"i":["After a cache node reboot, the database melts","The node came back empty and all its keys missed at once.","Warm the cache gradually and limit concurrent rebuilds","Reboot the other nodes too => Even colder cache","Disable the cache => Full load hits the database","An empty cache is a traffic spike on the backend."],"a":["Redis or Memcached?","Memcached: simple, multi-threaded, volatile","Redis: structures, persistence, replication","Choose by features needed"]},"cache aside":{"e":["On a read: look in the cache; on a miss, read the database and write the result to the cache with a TTL. On a write: update the database, then delete the cache key. Only requested data is cached and a cache outage degrades gracefully. The cost is a slow first read and a brief stale window."],"t":"The app checks the cache, falls back to the database, then fills the cache.","p":"Updating the cache on write instead of deleting it. Concurrent writers can leave the older value cached.","k":"Read: cache, then DB, then fill. Write: DB, then delete the key.","q":["In cache-aside, what should a write do to the cached entry?","Delete it after updating the database","Leave it alone","Update the cache first, database later","Extend its TTL","Deleting avoids racing writers storing stale values."],"i":["Profile shows old data until TTL expires after every edit","The update path writes to the database but never touches the cache.","Delete the cache key after the database write","Shorten every TTL to 1 second => Cache barely helps","Double-write the cache before the database => Stale on failed DB write","Writes must invalidate what reads have cached."],"a":["Walk me through cache-aside.","Read through cache, fill on miss","Write to DB then delete key","TTL as a safety net against missed invalidation"]},"read through cache":{"e":["The application only talks to the cache. On a miss, the cache library or service calls a loader, stores the result and returns it. This keeps caching logic in one place and applies the same policy everywhere, but the cache must know how to load each kind of data."],"t":"The cache itself loads missing data from the database.","p":"Confusing it with cache-aside. The difference is who loads on a miss: the cache, not the application.","k":"The app asks the cache; the cache asks the database.","q":["What distinguishes read-through from cache-aside?","The cache layer, not the application, fetches from the database on a miss","It never misses","It writes before reading","It needs no TTL","Loading responsibility moves into the cache."],"i":["Three services cache the same entity with three different TTLs and keys","Each team hand-rolled cache-aside code.","Centralise loading in a read-through layer with one policy","Document the three approaches => Drift continues","Remove caching => Load returns to the database","One loader means one consistent caching policy."],"a":["Read-through versus cache-aside?","Who loads on a miss","Read-through centralises logic","Cache needs a loader per data type"]},"write through cache":{"e":["On a write, the cache layer updates its entry and synchronously writes the database before acknowledging. Reads are then always fresh from the cache. The price is slower writes and caching data that may never be read. It pairs well with read-through."],"t":"Every write goes to the cache and the database together.","p":"Assuming it removes all staleness. A change made directly in the database bypasses the cache.","k":"Write both, synchronously: fresh reads, slower writes.","q":["Main downside of write-through caching?","Added write latency, and caching items never read","Stale reads","Data loss on crash","No consistency","Each write pays for two stores."],"i":["Cache shows values the database does not have","A batch job updates the database directly, skipping the write-through layer.","Route all writes through the same layer or invalidate after batch jobs","Trust the cache as the truth => It is not the system of record","Rebuild the cache hourly => Wrong for up to an hour","Write-through only holds if every writer uses it."],"a":["When would you use write-through?","Reads must be fresh right after writes","Accept higher write latency","All writers must go through it"]},"write back cache":{"e":["Also called write-behind. Writes are acknowledged once in the cache and persisted asynchronously in batches. This gives very fast writes and absorbs bursts, and repeated updates to one key collapse into one database write. The risk is losing acknowledged writes if the cache fails before flushing."],"t":"Write to the cache now, flush to the database later.","p":"Using it for data you cannot lose, such as payments.","k":"Fastest writes, with a window where data can vanish.","q":["Good use of write-back caching?","View counters updated thousands of times a second","Bank transfers","Password changes","Order placement","Losing a few counts is acceptable; the write rate is extreme."],"i":["Last 10 minutes of game scores lost after a cache crash","Scores were acknowledged from memory and flushed to the database every 10 minutes.","Shorten the flush interval and persist the cache's write log","Increase the flush interval for efficiency => Larger loss window","Tell players it happens => Loses their trust","Write-behind trades durability for speed; size that window deliberately."],"a":["What's the risk with write-behind caching?","Async flush means possible data loss","Great for high-rate, loss-tolerant writes","Batching reduces database load"]},"cache invalidation":{"e":["Options: expire by TTL (simple, bounded staleness), delete on write (fresher, needs every write path to cooperate), version the key (new data, new key, old one ages out), or publish change events that consumers use to purge. Most systems combine explicit invalidation with a TTL as a safety net."],"t":"Getting rid of cached data once it is wrong.","p":"Relying on explicit invalidation alone. One missed path leaves stale data forever without a TTL.","k":"Invalidate on write, and keep a TTL as the safety net.","q":["Why keep a TTL even when you invalidate on every write?","It bounds staleness if an invalidation is missed or fails","TTLs speed up reads","It is required by Redis","It prevents all misses","Belt and braces against missed deletes."],"i":["One product shows the wrong price for days","A bulk import path forgot to invalidate; the entry had no TTL.","Add a TTL everywhere and invalidate from the import path","Flush the entire cache now and move on => It will recur","Tell support to refresh manually => Not a fix","Invalidation has many paths; TTL catches the one you missed."],"a":["Why is cache invalidation considered hard?","Many write paths must cooperate","Races between readers and writers","Combine explicit deletes with TTLs"]},"ttl time to live":{"e":["The TTL bounds how stale data can be. Short TTLs mean fresher data and more misses; long TTLs mean more hits and more staleness. Set it from how often data changes and how much staleness users tolerate. Add random jitter so many keys do not expire together."],"t":"An expiry time after which a cached entry is discarded.","p":"Giving every key the same TTL at the same moment, so they all expire at once.","k":"TTL is how stale you agree to be; add jitter.","q":["Thousands of keys were cached at startup with a 1 hour TTL. What happens an hour later?","They expire together and flood the database","Nothing","They refresh themselves","The cache grows","Synchronised expiry causes a miss storm."],"i":["Database load spikes exactly every 30 minutes","A warm-up job caches everything with the same 30 minute TTL.","Add random jitter to TTLs","Double the TTL to 60 minutes => Spikes hourly instead","Double the database size => Paying for a self-inflicted spike","Staggered expiry spreads refresh load."],"a":["How do you pick a TTL?","Rate of change of the data","Staleness users will tolerate","Jitter to avoid synchronised expiry"]},"cache eviction policies":{"e":["LRU evicts the least recently used item and suits most workloads. LFU evicts the least frequently used, which protects steadily popular items. FIFO evicts the oldest inserted. Random and TTL-based policies also exist. The right policy keeps the hit rate high for your access pattern."],"t":"Rules for what to throw out when the cache is full.","p":"Leaving a cache with no eviction policy and no memory limit, so it either rejects writes or runs out of memory.","k":"Full caches must forget something; choose what.","q":["A cache is full and a new item arrives under LRU. What is removed?","The item that has gone longest without being accessed","The largest item","The newest item","A random item","Recency predicts future use."],"i":["Redis starts rejecting writes with out-of-memory errors","Maxmemory is reached and the policy is noeviction; keys have no TTL.","Set an eviction policy such as allkeys-lru and add TTLs","Add RAM indefinitely => Fills again","Flush everything hourly => Hit rate collapses","A cache needs a memory limit and an eviction rule."],"a":["How does a cache decide what to evict?","LRU by recency","LFU by frequency","Choose by access pattern and set a memory limit"]},"lru":{"e":["Least Recently Used assumes recently accessed items will be accessed again. It is implemented with a hash map plus a doubly linked list: every access moves the item to the front, and eviction removes from the back, both in constant time. It adapts quickly but a one-off scan of cold data can push out hot items."],"t":"Ev
