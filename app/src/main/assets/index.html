he origin servers.","Put static assets behind a CDN with long TTLs","Add origin servers => Pays for bytes a CDN would serve cheaper","Shrink images only => Helps a little, still all origin","Offload cacheable traffic to the edge."],"a":["What does a CDN do for a system design?","Lower latency through edge caches","Offloads origin and absorbs spikes","Edge functions for simple logic"]},"data compression":{"e":["Lossless algorithms (gzip, Brotli, Zstandard, Snappy, LZ4) reduce text-like data several times over; choose by the speed to ratio trade-off. Lossy codecs shrink images, audio and video far more. Compress responses, logs, backups and columnar data. Already compressed data such as JPEG will not shrink further."],"t":"Shrinking data to save bandwidth and storage, paid for in CPU.","p":"Compressing already compressed media, burning CPU for nothing.","k":"Trade CPU for bytes; never compress twice.","q":["Which payload benefits most from gzip or Brotli?","A large JSON response","A JPEG photo","An MP4 video","A ZIP archive","Text has redundancy; the others are already compressed."],"i":["Mobile users on slow networks wait 6 seconds for the feed","The API returns 900 KB of uncompressed JSON.","Enable response compression and trim unused fields","Add servers => Payload is unchanged","Raise timeouts => Still slow","Smaller payloads are the cheapest latency win on slow links."],"a":["When do you compress, and what does it cost?","Text responses, logs, backups","CPU time for compress and decompress","Pick algorithm by speed versus ratio"]},"pagination":{"e":["Offset pagination (LIMIT 20 OFFSET 1000) is simple but the database still walks the skipped rows, and pages shift when data changes. Cursor or keyset pagination (WHERE id < last_seen LIMIT 20) uses an index to jump straight to the next page and stays stable under inserts."],"t":"Returning large result sets one page at a time.","p":"Using OFFSET for deep pages or infinite scroll.","k":"Cursor, not offset, for anything deep or live.","q":["Why is OFFSET 1,000,000 slow?","The database reads and discards a million rows first","Offsets are encrypted","It locks the table","It needs a join","Skipped rows are still scanned."],"i":["Feed gets slower the further users scroll","Page 500 runs LIMIT 20 OFFSET 10000 on a 50M-row table.","Switch to keyset pagination on an indexed sort key","Cache every page => Pages shift as posts arrive","Limit scrolling to 10 pages => Product restriction","Keyset pagination costs the same at any depth."],"a":["Offset versus cursor pagination?","Offset scans skipped rows and shifts","Cursor seeks via index","Cursor is stable and fast at depth"]},"batching":{"e":["Each request carries fixed overhead: a network round trip, a transaction, a disk sync. Sending 1,000 rows in one insert or 100 messages in one call spreads that cost and raises throughput. The trade-off is added latency while a batch fills and larger failure units. Bound batches by size and time."],"t":"Grouping many small operations into one bigger one.","p":"Unbounded batches: huge requests that time out or fail as a whole.","k":"Batch by size or time, whichever comes first.","q":["What does batching trade away?","A little latency for much higher throughput","Durability","Security","Correctness","Items wait briefly for the batch."],"i":["Import of 1M rows takes 5 hours","Each row is inserted in its own transaction with its own round trip.","Insert in batches of a few thousand per transaction","Use a faster CPU => Round trips dominate","Run two importers => Twice the lock contention","Per-operation overhead dominates small writes."],"a":["Why does batching improve throughput?","Amortises fixed per-request cost","Fewer round trips and syncs","Bound by size and time; adds latency"]},"load shedding":{"e":["When demand exceeds capacity, trying to serve everything makes all requests slow and then fail. Shedding drops excess early, cheaply, with a 429 or 503, prioritising critical traffic such as checkout over recommendations. The system stays responsive for what it accepts."],"t":"Deliberately rejecting some requests to protect the rest.","p":"Accepting everything during overload and timing out on all of it.","k":"Serving some well beats serving all badly.","q":["During overload, which request should be shed first?","Background recommendation refresh","Payment confirmation","Login","Health check from the balancer","Shed the least critical work."],"i":["At 3x normal load, every request times out","The service queues everything; by the time work starts, clients have given up.","Reject excess requests early with 503 and prioritise critical endpoints","Increase queue length => Even staler work","Raise client timeouts => Longer hangs","Work nobody is waiting for is pure waste."],"a":["What is load shedding?","Reject excess to stay healthy","Prioritise critical requests","Fail fast with 429 or 503"]},"backpressure":{"e":["Without it, a slow consumer accumulates unbounded queues and runs out of memory. Mechanisms: bounded queues that block or reject, pull-based consumption, credits or windows as in TCP flow control, and 429 responses. Pressure propagates back to the source, which slows, buffers or sheds."],"t":"Telling upstream to slow down when downstream cannot keep up.","p":"Unbounded in-memory queues. They turn overload into an out-of-memory crash.","k":"Bounded queues push the problem back to where it can be handled.","q":["A producer sends faster than the consumer processes, into an unbounded buffer. Eventually:","Memory is exhausted","The consumer speeds up","Messages shrink","Nothing happens","The buffer grows until the process dies."],"i":["Ingest service OOM-killed during a traffic burst","It buffers incoming events in an unbounded in-memory list while the database is slow.","Use a bounded queue and signal producers to slow down or reject","Add memory => Dies a bit later","Drop the oldest silently => Hidden data loss","Bounded buffers make overload explicit."],"a":["How does backpressure differ from load shedding?","Backpressure slows the sender","Shedding drops the excess","Both need bounded queues"]},"hotspot mitigation":{"e":["Hot spots come from celebrity users, viral items or sequential keys. Remedies: cache the hot item, split the hot key by adding a suffix or bucket, replicate hot data across nodes, isolate very large tenants, and treat extreme cases differently, such as pull instead of push for celebrity feeds."],"t":"Stopping one key or shard from taking a disproportionate load.","p":"Assuming hash partitioning removes hot keys. One very popular key still maps to one node.","k":"Find the hot key; cache it, split it, or special-case it.","q":["A single viral post overloads one cache node. Good mitigation?","Replicate that key across several nodes or cache it locally","Rehash all keys","Delete the post","Add nodes at random","Spread reads for the one hot key."],"i":["One shard times out during a celebrity's live event","All writes for that account's followers fan out through one partition.","Handle the celebrity with a pull model and split the key into buckets","Add shards => The hot key still lands on one","Rate limit all users => Everyone suffers","Extreme keys need special handling."],"a":["How do you deal with a celebrity or hot key?","Detect skew","Cache or replicate hot data","Split the key or use a different path"]},"performance bottleneck analysis":{"e":["Measure before changing anything: latency percentiles, saturation of CPU, memory, disk and network, queue lengths, lock waits and slow queries. Trace a slow request end to end to see where time goes. Fix the largest contributor, measure again, and repeat; fixing a bottleneck exposes the next."],"t":"Finding the one resource that limits the whole system.","p":"Optimising what is easy or interesting rather than what the measurements point to.","k":"Measure, find the biggest slice, fix it, repeat.","q":["A request takes 2 s: 1.8 s in one database query, 0.1 s in code, 0.1 s on the network. Where do you start?","The database query","The application code","The network","The UI","It dominates total time."],"i":["Team spent two weeks optimising JSON serialisation with no visible gain","Tracing shows 85% of request time is waiting for a lock in the database.","Follow the trace and fix the lock contention","Rewrite the serialiser again => Still 5% of the time","Add servers => More contenders for the lock","Optimising outside the bottleneck changes nothing."],"a":["How do you find a bottleneck?","Measure with metrics and traces","Look for saturation and queues","Fix the largest contributor and re-measure"]},"redundancy":{"e":["Run at least two of every critical component: servers, load balancers, database replicas, network paths, power feeds and zones. N+1 means one spare beyond what load needs. Redundant units must not share a failure cause (same rack, same zone, same deploy), and switching to them must be automatic."],"t":"Extra copies of anything whose failure would stop the system.","p":"Redundant instances that share one failure domain.","k":"Two is one, one is none; and not in the same rack.","q":["Two replicas run on the same physical host. The redundancy is:","Largely illusory, since one host failure kills both","Perfect","Improved by more RAM","Unnecessary","They share a failure domain."],"i":["Both database nodes went down together","Primary and standby were placed on the same rack, which lost power.","Spread replicas across racks and zones","Add a third node on that rack => Same shared failure","Buy a better power supply => One domain still","Redundancy only counts across independent failure domains."],"a":["What makes redundancy actually effective?","No single point of failure","Independent failure domains","Automatic switchover"]},"failover strategies":{"e":["Failover needs detection (heartbeats, health checks), a decision (often by quorum), promotion of the standby and redirection of clients (DNS, virtual IP, proxy). Automatic failover is fast but can misfire on a false alarm; manual is slow but deliberate. Fence the old primary and rehearse the whole thing."],"t":"Moving traffic to a healthy standby when the primary fails.","p":"Never testing it. The first real failover is then also the first rehearsal.","k":"Detect, decide, promote, redirect, fence.","q":["Risk of overly aggressive automatic failover?","Flapping and split brain on brief network blips","Too much uptime","Lower cost","Fewer alerts","False positives trigger unnecessary, risky switches."],"i":["Database flaps between nodes every few minutes","Failover triggers after a single missed heartbeat on a noisy network.","Require several missed heartbeats and a quorum decision","Disable failover => Long outage on real failure","Fail over faster => More flapping","Detection thresholds must separate blips from failures."],"a":["What are the steps of a failover?","Detect failure reliably","Promote standby and redirect clients","Fence old primary and test regularly"]},"active active architecture":{"e":["Every region handles requests, so a failure only reduces capacity and users are served nearby. Capacity must be planned so the remaining sites absorb a lost one. The hard part is data: concurrent writes in multiple regions need conflict resolution, per-record home regions or a globally consistent database."],"t":"Several sites all serve traffic at the same time.","p":"Running each site near full capacity, so losing one overloads the others.","k":"All sites live; size them to survive losing one.","q":["Two active regions each run at 80% capacity. One fails. The survivor:","Is overloaded at 160% of capacity","Is fine","Runs at 40%","Shuts down gracefully","Remaining capacity must cover the lost region."],"i":["Region failure took the second region down with it","Both ran at 75%; failover doubled load on the survivor.","Keep headroom so remaining regions can absorb a failure, and shed load","Fail back and forth => Both regions unstable","Turn off autoscaling => Less capacity","Active-active only works with spare capacity."],"a":["What are the challenges of active-active?","Multi-region write conflicts","Capacity headroom for failure","Traffic routing and data replication"]},"active passive architecture":{"e":["The passive site is kept in sync by replication and takes traffic only on failover. Hot standby is running and ready; warm needs scaling up; cold must be started from backups. It is simpler than active-active because there is one writer, but the standby costs money while idle and failover takes time."],"t":"One site serves; a standby waits to take over.","p":"Assuming the passive side works. Config drift and stale data are common if it is never exercised.","k":"One writer, one waiting; exercise the waiting one.","q":["Main advantage of active-passive over active-active?","No multi-writer conflicts","Zero cost","Instant failover","Better use of hardware","Only one site accepts writes."],"i":["Failover site came up with last year's configuration","The passive environment was never deployed to after its initial build.","Deploy to both sites in every release and run failover drills","Document the differences => Drift continues","Keep it switched off to save cost => Slower and riskier failover","A standby must be kept identical and tested."],"a":["Active-passive versus active-active?","Passive standby with replication","Simpler data model, slower failover","Idle cost; hot, warm or cold standby"]},"circuit breaker":{"e":["The breaker counts failures. Closed: calls pass. After a threshold it opens: calls fail immediately or use a fallback, sparing the caller's threads and giving the dependency room to recover. After a wait it goes half-open and lets a few trial calls through; success closes it, failure reopens it."],"t":"Stop calling a failing dependency and fail fast for a while.","p":"Confusing it with retries. Retries add load to a struggling service; the breaker removes it.","k":"Closed, open, half-open: stop hammering what is already down.","q":["What does a circuit breaker do in the open state?","Fails calls immediately without contacting the dependency","Retries faster","Queues calls forever","Doubles the timeout","Fast failure protects caller and callee."],"i":["Slow recommendation service drags down the whole site","Every page waits 10 s on it, exhausting web threads.","Wrap the call in a circuit breaker with a short timeout and a fallback","Add retries => Triples load on the sick service","Add web threads => More threads stuck","Cut off failing dependencies so the failure stays local."],"a":["Explain the circuit breaker states.","Closed: normal, counting failures","Open: fail fast or fallback","Half-open: trial calls decide"]},"retry":{"e":["Many failures are transient: a dropped connection, a brief overload. Retrying often succeeds. Rules: retry only idempotent operations, only on retryable errors (timeouts, 503, not 400), limit attempts, back off exponentially with jitter, and cap retries across layers so they do not multiply."],"t":"Try a failed call again, carefully.","p":"Retrying at every layer. Three layers with three retries each produce 27 calls.","k":"Retry the retryable, a few times, with backoff and jitter.","q":["Which response should not be retried?","400 Bad Request","503 Service Unavailable","A connection timeout","429 after waiting","The request itself is wrong; repeating cannot help."],"i":["A brief blip turned into a 30 minute outage","Clients, gateway and service each retry three times immediately, multiplying load 27 times.","Retry at one layer only, with backoff, jitter and a retry budget","Increase retries to 5 => Makes the storm worse","Remove timeouts => Everything hangs","Uncoordinated retries amplify failure."],"a":["What are the rules for safe retries?","Idempotent and retryable errors only","Limited attempts with backoff and jitter","Avoid stacking retries across layers"]},"exponential backoff":{"e":["Delays grow as 1 s, 2 s, 4 s, 8 s up to a cap, giving a struggling service time to recover. Jitter (a random part of the delay) stops clients that failed together from retrying together. Without it, synchronised retries arrive as repeated waves, a thundering herd."],"t":"Wait longer after each failed attempt, with randomness.","p":"Backoff without jitter. Everyone still retries at the same instants.","k":"Double the wait, cap it, and randomise it.","q":["Why add jitter to exponential backoff?","To stop many clients retrying at the same moment","To make retries faster","To encrypt retries","To reduce logging","Randomness spreads the load."],"i":["Service recovers, then falls over again every 2 seconds","Thousands of clients retry in lockstep with fixed delays.","Use exponential backoff with full jitter","Shorten the retry delay => Tighter waves","Restart the service repeatedly => Same waves return","Synchronised retries create a self-inflicted attack."],"a":["How does exponential backoff with jitter work?","Delay doubles per attempt up to a cap","Random jitter desynchronises clients","Prevents thundering herds"]},"timeout management":{"e":["Every network call needs a timeout, or one slow dependency ties up threads until the caller dies too. Set it from the dependency's normal p99, not a round guess. Callers should have longer budgets than callees; pass a deadline down the chain so work stops when the user has already given up."],"t":"Never wait forever for anything remote.","p":"Leaving defaults, which are often infinite or minutes long.","k":"Every remote call gets a deadline; pass it downstream.","q":["Service A (timeout 2 s) calls B, which calls C with a 10 s timeout. Problem?","B keeps working for C long after A gave up","Nothing","C is too fast","A is too slow","Inner timeouts should fit within the outer budget."],"i":["All worker threads stuck, service unresponsive","A third-party API is hanging and the HTTP client has no timeout.","Set connect and read timeouts based on its normal latency","Add threads => More get stuck","Restart hourly => Outage between restarts","Unbounded waits spread one dependency's failure to you."],"a":["How do you choose and structure timeouts?","Always set one","Base on observed p99","Propagate deadlines; outer longer than inner"]},"bulkhead":{"e":["Like watertight compartments in a ship, give each dependency or workload its own thread pool, connection pool or instance group. If one dependency hangs, only its pool fills; the rest of the system keeps working. The same idea applies to isolating tenants or critical endpoints."],"t":"Separate resource pools so one failure cannot sink everything.","p":"One shared pool for all outbound calls.","k":"Separate pools, contained damage.","q":["Reporting calls exhaust the shared thread pool and checkout stops. Which pattern prevents this?","Bulkhead","Singleton","Observer","Decorator","Separate pools isolate the failure."],"i":["A slow search backend takes checkout down","All outbound calls share one pool of 200 threads; search calls occupy all of them.","Give search its own bounded pool","Raise the pool to 2,000 => All 2,000 eventually stick","Speed up checkout => It never gets a thread","Isolation limits a failure to its own compartment."],"a":["What is the bulkhead pattern?","Partitioned resources per dependency or tenant","Failure contained to one pool","Pairs with timeouts and circuit breakers"]},"graceful degradation":{"e":["Design fallbacks for each non-critical dependency: show cached or default recommendations, hide a widget, queue a write for later, switch to read-only mode. Decide in advance which features are core and which can be dropped under failure or overload, and use feature flags to switch them off."],"t":"When a part fails, offer less instead of nothing.","p":"Letting an optional feature's failure return an error for the whole page.","k":"Core features survive; extras fade out.","q":["The reviews service is down. A product page should:","Render without reviews","Return 500","Wait until reviews recover","Redirect to the homepage","Reviews are not essential to buying."],"i":["Homepage returns errors because the weather widget's API is down","The page fails if any component call fails.","Render the page without the widget and use a fallback","Retry the widget call 10 times => Slower failure","Remove the homepage cache => Unrelated","Optional dependencies need fallbacks."],"a":["How do you design for graceful degradation?","Classify core versus optional features","Fallbacks and cached defaults","Feature flags and read-only modes"]},"disaster recovery":{"e":["DR covers regional outages, data corruption, ransomware and big mistakes. Strategies, from cheapest and slowest to costliest and fastest: backup and restore, pilot light (core data replicated, servers off), warm standby (scaled-down copy running), and multi-site active-active. Pick by RPO and RTO, and test with real drills."],"t":"The plan for restoring service after a site-wide loss.","p":"A DR plan that exists only as a document.","k":"A DR plan is real only after a drill.","q":["Which DR strategy has the lowest cost and the longest recovery time?","Backup and restore","Multi-site active-active","Warm standby","Pilot light","Everything must be rebuilt from backups."],"i":["Region lost; restore took 3 days instead of the promised 4 hours","Backups existed, but restore had never been tried and scripts were outdated.","Run regular restore drills and automate recovery","Take backups more often => Restore is still untested","Blame the provider => The gap was yours","Recovery time is whatever your last drill measured."],"a":["How do you plan disaster recovery?","Set RPO and RTO per system","Choose strategy: backup, pilot light, warm, active-active","Test with drills"]},"backup restore":{"e":["Full backups capture everything; incrementals capture changes since the last; continuous log archiving enables point-in-time recovery. Follow 3-2-1: three copies, two media, one off-site. Encrypt them, keep them out of reach of production credentials, and above all test restores."],"t":"Periodic copies of data you can return to.","p":"Having backups nobody has ever restored.","k":"An untested backup is not a backup.","q":["What does point-in-time recovery require beyond a full backup?","The continuous transaction log since that backup","A second region","More CPU","A read replica","Logs are replayed up to the chosen moment."],"i":["Ransomware encrypted the database and the backups","Backups were stored on a volume writable with production credentials.","Keep immutable, off-site backups with separate access","Take more backups to the same place => Encrypted too","Rely on replicas => Corruption replicates","Backups must be isolated from what they protect."],"a":["What makes a backup strategy sound?","Full plus incremental or log-based","Off-site, isolated copies (3-2-1)","Regular restore tests"]},"rpo rto":{"e":["Recovery Point Objective is the maximum acceptable data loss measured in time: an RPO of 5 minutes means backups or replication at least that fresh. Recovery Time Objective is the maximum acceptable downtime. Lower values cost more. They are set per system by business impact and drive the DR design."],"t":"How much data you can lose, and how long you can be down.","p":"Mixing them up, or quoting them without the cost they imply.","k":"RPO is data lost; RTO is time down.","q":["Nightly backups only. Your worst-case RPO is about:","24 hours","0","5 minutes","1 week","Everything since last night's backup can be lost."],"i":["Business expected minutes of data loss; lost 18 hours","RPO was assumed, never agreed; the system had daily backups.","Agree RPO and RTO with the business and build replication to match","Promise zero loss => Not affordable or true","Back up twice a day => Still 12 hours","Recovery objectives must be explicit and funded."],"a":["What are RPO and RTO?","RPO: tolerable data loss window","RTO: tolerable downtime","They determine backup and DR design and cost"]},"chaos engineering":{"e":["State a hypothesis about steady state (\"checkout success stays above 99% if one zone fails\"), inject a real fault (kill instances, add latency, drop a dependency) with a limited blast radius, observe, and fix what you learn. It verifies that redundancy, timeouts and fallbacks really work before a real incident does it for you."],"t":"Breaking things on purpose to prove the system survives.","p":"Injecting faults with no hypothesis, monitoring or stop button.","k":"Hypothesis, small blast radius, observe, fix.","q":["First step of a chaos experiment?","Define the steady state and a hypothesis","Shut down production","Delete the database","Disable monitoring","You need a measurable expectation."],"i":["Zone outage revealed the failover had been misconfigured for months","Nobody had ever tested losing a zone.","Introduce regular controlled failure drills","Trust the configuration next time => Same surprise","Avoid touching it => Drift continues","Only exercised resilience can be trusted."],"a":["What is chaos engineering and how do you do it safely?","Hypothesis about steady state","Inject faults with limited blast radius","Observe, learn and fix"]},"service decomposition":{"e":["Split along business capabilities such as orders, payments and catalogue, so each service owns its data and can change independently. Aim for high cohesion inside and loose coupling between. Signs of a bad cut: services that must deploy together, chatty calls, or shared tables."],"t":"Deciding where to cut a system into services.","p":"Splitting by technical layer (a \"database service\", a \"UI service\") or too finely, creating a distributed monolith.","k":"Cut along business capabilities, not technical layers.","q":["Two services must always be deployed together and call each other 20 times per request. This suggests:","They should be one service","They need more instances","They need a queue","They need a new language","Tight coupling means the boundary is wrong."],"i":["One user action triggers 40 network calls","The system was split into tiny services by database table.","Merge chatty services around a business capability","Add caching to every call => Complexity grows, coupling remains","Use a faster network => Still 40 failure points","Boundaries should minimise cross-service chatter."],"a":["How do you decide service boundaries?","Business capability and data ownership","High cohesion, loose coupling","Independent deployability"]},"domain driven design ddd":{"e":["DDD builds a ubiquitous language shared by developers and domain experts and structures code around it. Strategic design splits the domain into bounded contexts with explicit relationships. Tactical design uses entities, value objects, aggregates (consistency boundaries) and domain events."],"t":"Model software around the business domain and its language.","p":"Reciting tactical patterns and missing the point: shared language and clear boundaries.","k":"Speak the business's language and draw boundaries around it.","q":["In DDD, an aggregate is:","A cluster of objects changed together as one consistency unit","A database index","A reporting query","A UI component","It defines a transactional boundary."],"i":["Engineers and the business mean different things by \"account\"","Code uses one Account class for login, billing and banking concepts.","Define separate models per context with agreed terms","Add more fields to Account => The confusion deepens","Rename it AccountV2 => Same ambiguity","A shared, precise language prevents modelling errors."],"a":["What is DDD and why use it?","Ubiquitous language with domain experts","Bounded contexts for boundaries","Aggregates as consistency units"]},"bounded contexts":{"e":["\"Customer\" means one thing in sales and another in support. Each bounded context has its own model, language and usually its own team and data. Contexts talk through explicit contracts and translate between models at the edge. They are the natural starting point for microservice boundaries."],"t":"A boundary inside which a term has exactly one meaning.","p":"Forcing one universal model of a concept across the entire company.","k":"One model per context; translate at the borders.","q":["\"Product\" means a catalogue entry to sales and a stock unit to the warehouse. The DDD answer is:","Two bounded contexts with separate models","One giant Product table","Rename one of them randomly","Remove the warehouse","Each context keeps the model it needs."],"i":["Product table has 180 columns and every team fears changing it","One shared model serves catalogue, pricing, warehouse and marketing.","Split into context-specific models owned by each team","Add a column-ownership spreadsheet => Coupling stays","Freeze the schema => Work stops","A model that serves everyone serves no one well."],"a":["What is a bounded context?","Explicit boundary for a model and its language","Same word, different meaning across contexts","Integrate through contracts and translation"]},"service discovery":{"e":["Instances come and go, so addresses cannot be hard-coded. Services register with a registry (Consul, etcd, Kubernetes DNS) and are removed when health checks fail. With client-side discovery the caller queries the registry and balances itself; with server-side discovery it calls a stable name and a proxy routes."],"t":"How services find each other's current addresses.","p":"Hard-coding IP addresses or relying on long-cached DNS in a dynamic environment.","k":"Ask the registry; never hard-code an address.","q":["In Kubernetes, how does service A usually find service B?","By B's stable service DNS name","By B's pod IP in a config file","By broadcasting","By asking the user","The platform resolves the name to healthy pods."],"i":["Calls fail after every deploy of the pricing service","Callers keep a static list of its IP addresses, which change on redeploy.","Use the service registry or platform DNS name","Update the list by hand after each deploy => Always late","Pin the IPs => Blocks scaling and healing","Dynamic infrastructure needs dynamic lookup."],"a":["How does service discovery work?","Registry of healthy instances","Client-side versus server-side lookup","Health checks keep it current"]},"api gateway":{"e":["The gateway routes requests to the right service and handles shared concerns once: authentication, rate limiting, TLS, logging, request shaping and sometimes response aggregation. Clients see one stable API while services change behind it. It must be highly available and stay free of business logic."],"t":"One front door for all clients into many services.","p":"Putting business logic in the gateway, which turns it into a new monolith and bottleneck.","k":"Routing and cross-cutting concerns only; no business logic.","q":["Which belongs in an API gateway?","Verifying the auth token and applying rate limits","Calculating order discounts","Storing user profiles","Running payroll","Cross-cutting concerns fit the gateway."],"i":["Every feature change requires a gateway release","Pricing rules and data joins were implemented inside the gateway.","Move business logic into services and keep the gateway thin","Add more gateway developers => Bottleneck with more people","Run two gateways => Logic duplicated","A fat gateway couples every team."],"a":["What does an API gateway do?","Single entry point and routing","Auth, rate limiting, TLS, logging","Keep it thin and highly available"]},"backend for frontend bff":{"e":["Web, mobile and partner clients need different data shapes and call patterns. Instead of one general API, each client type gets its own thin backend, owned by that client's team, which aggregates and formats calls to the underlying services. Shared logic belongs in the services, not copied between BFFs."],"t":"A dedicated backend tailored to each kind of client.","p":"Duplicating business rules in every BFF.","k":"One thin backend per client type, owned by that client's team.","q":["Why give mobile its own BFF?","It can return compact, screen-shaped responses in one call","Mobile cannot use HTTP","To store mobile data separately","To avoid authentication","Tailored payloads save round trips and bytes."],"i":["Mobile home screen makes 14 API calls on a slow network","The app calls generic service APIs directly and stitches the results.","Add a mobile BFF that aggregates them into one response","Ask the mobile team to cache more => Still 14 calls cold","Make the generic API return everything => Bloated for all clients","Client-specific aggregation belongs server-side."],"a":["What problem does a BFF solve?","Different clients need different shapes","Aggregation close to the client's needs","Keep logic in services, BFF thin"]},"database per service":{"e":["A service's database is private and reachable only through its API or events. This lets teams change schemas and pick the right store independently. The price: no joins or transactions across services, so you use API composition, replicated read models, sagas and eventual consistency."],"t":"Each microservice owns its data; nobody else touches it.","p":"Letting another service read the tables directly \"just for a report\".","k":"Private data, public API.","q":["How should the reporting service get order data?","Through the order service's API or published events","By querying the orders database directly","By copying its password","By reading its disk","Direct access couples it to the schema."],"i":["A column rename in Orders broke three other teams","They were querying the orders database directly.","Expose data via API or events and revoke direct access","Announce schema changes by email => Still breaks","Never change the schema => Frozen design","Hidden consumers of a schema make it unchangeable."],"a":["Why should each service own its database?","Independent schema and technology changes","Loose coupling through APIs and events","Cost: cross-service queries and transactions"]},"saga":{"e":["A business process spanning services runs as steps, each a local commit followed by an event or command. If a step fails, earlier steps are reversed by compensating actions such as refunding a payment. Choreography has services react to each other's events; orchestration uses a central coordinator. The process is eventually consistent."],"t":"A sequence of local transactions with undo steps.","p":"Forgetting compensations, or assuming they cannot fail. They must be idempotent and retried.","k":"Each step commits locally; failures trigger compensations.","q":["In a booking saga, payment succeeds but seat reservation fails. What happens?","A compensating refund is issued","Nothing","The database rolls back the payment automatically","The user is charged twice","Sagas undo completed steps explicitly."],"i":["Customers charged for trips that were never booked","The booking step fails, but nothing reverses the earlier charge.","Add a compensating refund triggered by booking failure","Retry booking forever => Customer stays charged meanwhile","Run a monthly audit => Too late","Every saga step needs a defined compensation."],"a":["How does a saga keep services consistent?","Local transactions chained by events or an orchestrator","Compensating actions on failure","Eventually consistent; choreography or orchestration"]},"cqrs":{"e":["Commands change state through a write model built to enforce rules. Queries read from one or more separate models shaped for display, often denormalised and stored elsewhere, updated from the write side's events. Each side scales and evolves independently. The read side lags slightly behind."],"t":"Separate the model that writes from the models that read.","p":"Applying it to simple CRUD, where it only adds moving parts.","k":"Write model for rules, read models for screens.","q":["What consistency should users expect from a CQRS read model?","Eventual: it trails the write side slightly","Always instant","Never updated","Stronger than the write side","Projections are updated asynchronously."],"i":["Complex dashboard queries slow down order writes","Reads and writes share one normalised schema and one database.","Build a separate read model updated from write events","Add indexes for every dashboard => Writes get slower","Run reports at night only => Business wants live data","Separating reads from writes lets each be optimised."],"a":["What is CQRS and when is it worth it?","Separate command and query models","Independent scaling and optimisation","Eventual consistency; overkill for simple CRUD"]},"distributed tracing":{"e":["Each request gets a trace ID at the edge, passed along in headers. Every service records spans (an operation with start time and duration) tagged with that ID. Assembled, they show the full path and where time went. Traces are sampled to control cost. OpenTelemetry is the standard instrumentation."],"t":"Following one request across every service it touches.","p":"Not propagating the trace context through queues and async calls, which breaks the trace.","k":"One trace ID, carried everywhere.","q":["What does a trace show that logs and metrics alone do not?","Which service in the call chain consumed the time","Total CPU usage","Disk free space","The number of users","It links work across services for one request."],"i":["Checkout is slow; six teams each say their service is fine","Each has its own metrics, with no way to follow a single request.","Add distributed tracing with propagated trace IDs","Hold a longer meeting => No new data","Add logs everywhere without IDs => Cannot be joined","Tracing shows where one request spends its time."],"a":["How does distributed tracing work?","Trace ID propagated across calls","Spans record each operation","Sampling; shows latency per hop"]},"service mesh":{"e":["Each service instance gets a proxy (such as Envoy) that intercepts its traffic. A control plane configures all proxies to provide mutual TLS, retries, timeouts, circuit breaking, traffic splitting and uniform telemetry, without code changes. It adds latency, resource cost and operational complexity."],"t":"A network layer of sidecar proxies that handles service-to-service traffic.","p":"Adopting a mesh for five services. Its overhead pays off only at larger scale.","k":"Networking features moved out of code into sidecars.","q":["What does a service mesh let you do without changing application code?","Enforce mutual TLS and retries between services","Rewrite business logic","Change the database schema","Design the UI","Proxies handle communication concerns."],"i":["Each team implements retries and TLS differently, in five languages","Behaviour is inconsistent and some services have no encryption.","Introduce a mesh, or a shared proxy layer, to apply policies uniformly","Write a library per language => Five versions to maintain","Ask teams to follow a wiki => Drift","Uniform traffic policy belongs in infrastructure."],"a":["What is a service mesh and when do you need one?","Sidecar data plane plus control plane","mTLS, retries, traffic control, telemetry","Worth it at scale; adds overhead"]},"sidecar":{"e":["The sidecar shares the application's lifecycle and network but is a separate process, providing capabilities such as proxying, log shipping, config reloading or secret fetching. The application stays focused and language-agnostic helpers can be reused everywhere. Costs are extra resources per instance and another thing to operate."],"t":"A helper container that runs beside the main one.","p":"Putting business logic in a sidecar.","k":"Infrastructure helpers ride alongside, not inside.","q":["Good use of a sidecar?","Shipping the app's logs to a central system","Calculating taxes","Rendering the UI","Storing orders","Cross-cutting infrastructure concerns suit it."],"i":["Log shipping code duplicated in eight languages, each buggy","Every service embeds its own log forwarder.","Run one log-shipping sidecar beside each service","Standardise on one language => Unrealistic rewrite","Stop shipping logs => Blind in incidents","Sidecars give language-independent reuse."],"a":["What is the sidecar pattern?","Helper process beside the app","Shares lifecycle and network","Used for proxies, logging, config"]},"microservices deployment strategies":{"e":["Rolling replaces instances gradually. Blue-green runs the new version beside the old and switches traffic at once, with instant rollback. Canary sends a small share of traffic to the new version and expands if metrics stay healthy. Feature flags separate deploy from release. All need backward-compatible APIs and schemas."],"t":"Ways to release a new version without downtime.","p":"Deploying a breaking schema or API change that the old version, still running, cannot handle.","k":"Roll, switch, or canary; always backward compatible.","q":["Which strategy exposes a new version to 1% of users first?","Canary","Blue-green","Recreate","Big bang","Limited exposure limits damage."],"i":["Bad release hit 100% of users before anyone noticed","Deploys replace all instances at once with no health gates.","Use canary releases with automated rollback on error metrics","Deploy at 3 AM => Fewer users, same blast radius","Test longer in staging => Production differs","Gradual exposure turns outages into small incidents."],"a":["How do you deploy microservices safely?","Rolling, blue-green or canary","Metrics-based gates and rollback","Backward-compatible changes"]},"singleton":{"e":["A singleton restricts instantiation to one object, accessed through a static method, typically for a config holder or connection pool. Creation must be thread-safe. It introduces global state, hidden dependencies and harder testing, so prefer creating one instance and passing it in through dependency injection."],"t":"Exactly one instance of a class, shared globally.","p":"Overusing it as a global variable, and forgetting thread safety.","k":"One instance; prefer injecting it over reaching for it.","q":["Main drawback of singletons?","Hidden global state that makes testing and reasoning harder","They use too much memory","They cannot hold data","They are slow","Dependencies become implicit."],"i":["Tests pass alone but fail when run together","A singleton cache keeps state between tests.","Inject the dependency so each test gets a fresh instance","Run tests one at a time forever => Slow and fragile","Add sleeps between tests => Does not reset state","Global state couples things that should be independent."],"a":["When is a singleton appropriate and what's the risk?","One shared resource such as a pool","Thread-safe creation","Global state hurts testing; prefer injection"]},"factory":{"e":["A factory method or class decides which concrete type to create and returns it behind an interface. Callers ask for \"a notification sender\" and get email, SMS or push without knowing which. Adding a type means changing the factory, not every caller."],"t":"Delegate object creation so callers do not depend on concrete classes.","p":"Scattering \"new ConcreteClass\" and type switches throughout the code.","k":"Ask for an interface; let the factory pick the class.","q":["Benefit of creating payment processors through a factory?","New processors can be added without changing calling code","Objects are created faster","No interfaces needed","It removes all bugs","Callers depend only on the abstraction."],"i":["Adding a new payment method required edits in 30 files","Each place constructs processors with its own if-else chain.","Centralise creation in a factory behind an interface","Copy the if-else to a shared snippet => Still 30 call sites","Avoid new payment methods => Business blocked","Centralised creation localises change."],"a":["What does the factory pattern give you?","Encapsulated creation logic","Callers depend on interfaces","Easy to add new types"]},"observer":{"e":["A subject keeps a list of observers and calls each when its state changes. The subject does not know what observers do, so new reactions can be added without modifying it. It underlies UI event listeners and is the in-process form of publish-subscribe."],"t":"Subscribers are notified automatically when something changes.","p":"Forgetting to unsubscribe, which leaks memory, or doing slow work inside the notification.","k":"Subject announces; observers react.","q":["Which is an example of the observer pattern?","UI components updating when a data model changes","A database index","A for loop","A hash function","Listeners react to change notifications."],"i":["Saving a profile takes 5 seconds","The save notifies 12 observers synchronously, one of which calls a slow external API.","Dispatch slow observers asynchronously","Remove all observers => Lose needed reactions","Increase the save timeout => Still slow","Observers should not block the subject."],"a":["How does the observer pattern decouple code?","Subject maintains subscribers","Notifies without knowing their logic","Add reactions without changing the subject"]},"strategy":{"e":["Define a family of interchangeable behaviours (pricing rules, compression algorithms, routing policies), each in its own class implementing a shared interface. The context holds a strategy and delegates to it. Adding a behaviour means adding a class instead of extending a conditional."],"t":"Swap algorithms behind one interface at runtime.","p":"Growing a long if-else or switch on type that changes with every new variant.","k":"Replace the growing switch with pluggable strategies.","q":["A shipping cost calculation varies by carrier and grows constantly. Suitable pattern?","Strategy","Singleton","Adapter","Observer","Each carrier becomes an interchangeable algorithm."],"i":["Every new discount type causes bugs in existing ones","One 600-line function holds all discount rules in nested conditionals.","Extract each rule into its own strategy class","Add comments to the function => Still fragile","Add another condition carefully => Same risk next time","Isolated strategies change independently."],"a":["What is the strategy pattern?","Family of algorithms behind one interface","Selected at runtime","New behaviour added without modifying existing code"]},"adapter":{"e":["An adapter wraps a class and translates calls and data so it matches the interface the rest of your code uses. It is how you integrate third-party libraries, legacy systems and vendors without letting their shapes leak into your code, and it makes replacing them easier later."],"t":"Make an incompatible interface fit the one you expect.","p":"Letting a vendor's SDK types spread across the whole codebase.","k":"Wrap the foreign interface; keep your own.","q":["You switch SMS providers. Which design keeps the change small?","Calling providers through your own interface with an adapter per provider","Calling the SDK directly everywhere","Copying the SDK","Avoiding SMS","Only the adapter changes."],"i":["Switching payment vendors is estimated at four months","The old vendor's request and response types are used directly in 200 places.","Introduce your own payment interface with adapters and migrate callers","Fork the vendor SDK => Still coupled","Stay with the vendor forever => Lock-in","An adapter boundary contains vendor-specific detail."],"a":["What is an adapter for?","Translates one interface into another","Isolates third-party or legacy APIs","Makes providers swappable"]},"decorator":{"e":["A decorator implements the same interface as the object it wraps, adds something before or after delegating (logging, caching, retries, compression), and can be stacked. It extends behaviour by composition rather than inheritance. Middleware chains are the same idea."],"t":"Wrap an object to add behaviour without changing it.","p":"Creating a subclass for every combination of features.","k":"Same interface, extra behaviour, stackable.","q":["You want to add caching to a data client without editing it. Use:","A decorator wrapping the client","A singleton","A factory","A global variable","The wrapper adds behaviour transparently."],"i":["Twelve subclasses exist: LoggedClient, CachedClient, LoggedCachedClient, and so on","Each feature combination got its own class.","Replace them with composable decorators","Add the thirteenth subclass => Combinations keep multiplying","Merge everything into one class with flags => Tangled logic","Composition avoids subclass explosion."],"a":["How is a decorator different from inheritance?","Wraps an object with the same interface","Adds behaviour at runtime, stackable","Avoids subclass combinations"]},"repository":{"e":["Business code asks a repository to find or save domain objects and does not know whether SQL, a document store or an in-memory map sits behind it. Persistence details stay in one place, and tests can use a fake repository. Keep it from becoming a thin wrapper that leaks query details."],"t":"A collection-like interface that hides how data is stored.","p":"SQL and ORM calls spread through business logic.","k":"Business logic talks to a repository, not to the database.","q":["Main testing benefit of repositories?","Business logic can be tested with an in-memory fake","Tests run on production","No tests needed","Queries become faster","Storage is swappable behind the interface."],"i":["Unit tests need a real database and take 25 minutes","Business logic calls the ORM directly everywhere.","Introduce repository interfaces and use fakes in unit tests","Buy a faster test database => Still slow and flaky","Delete the tests => No safety net","Abstraction over storage makes logic testable."],"a":["What does the repository pattern do?","Abstracts data access behind an interface","Keeps persistence out of domain logic","Enables fakes for testing"]},"dependency injection":{"e":["A class receives what it needs, such as a database client or a clock, through its constructor, typically as interfaces. Something outside wires the real objects together. This makes dependencies explicit, lets tests pass in fakes, and makes implementations swappable."],"t":"Give a component its dependencies instead of letting it create them.","p":"Constructing dependencies inside the class, which hard-wires it to concrete implementations.","k":"Ask for what you need; do not build it yourself.","q":["Why does dependency injection help testing?","You can pass a fake or mock in place of a real dependency","Tests run in parallel","It removes the need for assertions","It encrypts code","Dependencies are supplied from outside."],"i":["A service cannot be tested without calling the real payment gateway","It creates the gateway client inside its own methods.","Accept the client as a constructor parameter","Test only in production => Real money at risk","Skip payment tests => Critical path untested","Injected dependencies can be replaced in tests."],"a":["What is dependency injection?","Dependencies passed in, not created","Depend on interfaces","Improves testability and flexibility"]},"strangler fig":{"e":["Put a routing layer in front of the old system. Build one capability in the new system, route its traffic there, and repeat. The legacy system shrinks until it can be switched off. Risk stays small at each step and value is delivered continuously, unlike a big-bang rewrite."],"t":"Replace a legacy system piece by piece behind a facade.","p":"Planning a multi-year full rewrite with a single cutover.","k":"Route, replace, repeat, retire.","q":["Main advantage over a big-bang rewrite?","Risk and delivery are incremental","It needs no testing","It is always faster","It needs no routing","Each slice can be verified and rolled back."],"i":["Two-year rewrite cancelled with nothing shipped","The plan was to replace everything and switch on one weekend.","Migrate one feature at a time behind a routing facade","Extend the rewrite by a year => More cost before any value","Freeze the legacy system => Business cannot wait","Incremental migration delivers and de-risks."],"a":["How do you migrate off a legacy system safely?","Facade in front of old system","Move one capability at a time","Retire the old gradually"]},"ambassador":{"e":["The ambassador runs next to the application, usually as a sidecar, and represents a remote service locally. The app calls localhost; the ambassador adds retries, timeouts, circuit breaking, TLS, discovery and metrics. It is a sidecar specialised for outbound traffic."],"t":"A local proxy that handles outbound calls for the application.","p":"Confusing it with an API gateway, which sits at the edge for inbound traffic from clients.","k":"An outbound helper proxy sitting next to the app.","q":["What does an ambassador typically handle?","Retries, timeouts and TLS for outbound calls","Rendering HTML","Storing user data","Compiling code","Client-side connectivity concerns."],"i":["A legacy app cannot be modified but needs TLS and retries when calling a new API","Its source is frozen.","Run an ambassador proxy beside it and point the app at localhost","Rewrite the legacy app => Costly and risky","Call the API without TLS => Insecure","Connectivity features can be added from outside the process."],"a":["How does an ambassador differ from a sidecar or gateway?","Sidecar specialised for outbound calls","App talks to localhost","Gateway is inbound at the edge"]},"outbox":{"e":["A service needs to update its database and publish a message, but cannot do both atomically. Instead it inserts the event into an outbox table within the same transaction as the business change. A relay (a poller or change data capture) reads the outbox and publishes to the broker, at least once."],"t":"Write the event to your own database in the same transaction, publish later.","p":"Dual writes: saving to the database and then publishing, hoping both succeed.","k":"One transaction writes data and event; a relay publishes it.","q":["What failure does the outbox pattern prevent?","Data saved but the event never published, or the reverse","Slow queries","Disk full","Cache misses","Both are committed atomically."],"i":["Orders exist but shipping never hears about some of them","The service commits the order and then publishes; crashes in between lose the event.","Write the event to an outbox table in the same transaction and relay it","Publish first, then save => Events for orders that do not exist","Add a retry around publish => Lost if the process dies","Atomicity comes from one local transaction."],"a":["How do you reliably update a database and publish an event?","Outbox table in the same transaction","Relay or CDC publishes","At-least-once, so consumers must be idempotent"]},"authentication authorization":{"e":["Authentication verifies identity through passwords, MFA, tokens or certificates. Authorization checks, on every request, whether that identity may perform this action on this resource. Do authn once at the edge and authz in the service that owns the data, at the object level."],"t":"Authentication proves who you are; authorization decides what you may do.","p":"Checking that the user is logged in but not that the resource belongs to them.","k":"Who are you? Then: may you do this, to this?","q":["A logged-in user changes /orders/101 to /orders/102 and sees someone else's order. What is missing?","An authorization check on the resource owner","Authentication","TLS","Rate limiting","Identity was verified, but not access to that object."],"i":["Users can download other customers' invoices by editing the URL","The endpoint verifies the token and then returns any invoice ID asked for.","Check that the invoice belongs to the caller on every request","Use longer random IDs only => Guessable or leaked IDs still work","Hide the URL in the app => Trivially discovered","Every object access needs an ownership check."],"a":["What's the difference between authentication and authorization?","Authn verifies identity","Authz verifies permission per action and resource","Both enforced server-side"]},"oauth 2 0":{"e":["The user approves at the authorization server, which issues the client a short-lived access token with limited scopes, plus an optional refresh token. The client presents the access token to the API. Authorization Code with PKCE is the standard flow for web and mobile; Client Credentials is for service-to-service."],"t":"Delegated access: let an app act for you without your password.","p":"Calling OAuth an authentication protocol. It grants access; OpenID Connect adds identity.","k":"OAuth answers \"what may this app do?\", not \"who is this?\".","q":["Which OAuth flow should a mobile app use?","Authorization Code with PKCE","Implicit","Password grant","None","PKCE protects the code exchange on public clients."],"i":["A leaked access token still works three weeks later","Tokens were issued with a 90 day lifetime and no revocation.","Use short-lived access tokens with refresh tokens and rotation","Ask users to log out => Token remains valid","Make tokens longer => Just harder to guess","Short lifetimes limit the damage of a leak."],"a":["How does OAuth 2.0 work at a high level?","User consents at authorization server","Client gets scoped access token","Short-lived tokens plus refresh; PKCE for public clients"]},"openid connect":{"e":["OIDC adds an ID token, a signed JWT describing the authenticated user (subject, issuer, audience, expiry), alongside OAuth's access token. The client verifies its signature and claims to establish a login. It powers single sign-on across applications with one identity provider."],"t":"An identity layer on OAuth 2.0: \"log in with...\".","p":"Using the access token as proof of identity, or not validating the ID token's audience and issuer.","k":"OAuth gives access; OIDC tells you who logged in.","q":["What does OIDC add to OAuth 2.0?","An ID token that identifies the user","Faster APIs","Database encryption","Rate limiting","It standardises authentication."],"i":["Attacker logs into your app with a token issued for a different app","The backend accepts any validly signed ID token without checking audience.","Validate issuer, audience, expiry and signature on every ID token","Check only the signature => Tokens for other apps still pass","Trust the client to check => Client can be bypassed","A token is only valid for the audience it was issued to."],"a":["How does \"Sign in with Google\" work?","OIDC on top of OAuth","ID token (JWT) with user claims","Verify signature, issuer, audience and expiry"]},"jwt":{"e":["A JSON Web Token has a header, a payload of claims and a signature. Any service holding the key can verify it without a database lookup, which suits stateless, distributed systems. It is encoded, not encrypted, so anyone can read it, and it cannot easily be revoked before expiry."],"t":"A signed token that carries its own claims.","p":"Putting secrets in the payload, or issuing long-lived JWTs that cannot be revoked.","k":"Signed, readable, hard to revoke: keep them short-lived.","q":["Why are JWTs usually given short expiry times?","They are hard to revoke once issued","They are too large","They slow the database","They are encrypted","Expiry is the main control."],"i":["A fired employee's token keeps working for a week","JWTs last 7 days and services verify them without any revocation check.","Shorten the lifetime and add refresh tokens or a revocation list","Change their password => Existing token still verifies","Rotate the signing key casually => Logs everyone out","Stateless tokens trade revocability for speed."],"a":["What are the pros and cons of JWTs?","Self-contained and verifiable without lookup","Not encrypted; do not store secrets","Revocation is hard; use short expiry"]},"session based authentication":{"e":["After login the server stores session data and sends an opaque session ID in a cookie. Each request looks the session up. Revocation is immediate (delete the session), and the cookie carries nothing sensitive. It needs a shared session store to work across servers and protection against CSRF."],"t":"The server remembers you; the browser holds only an ID.","p":"Keeping sessions in one server's memory in a multi-server deployment.","k":"Server holds the state, so revocation is instant.","q":["Advantage of server-side sessions over JWTs?","A session can be revoked immediately","They need no storage","They work without cookies","They are stateless","Deleting the record ends access."],"i":["Users are randomly logged out behind the load balancer","Sessions are stored in each server's local memory.","Move sessions to a shared store such as Redis","Enable sticky sessions only => Lost on server restart","Extend the cookie lifetime => Session data is still missing","Shared session storage makes servers interchangeable."],"a":["Sessions versus tokens?","Sessions: server state, easy revocation","Tokens: stateless, hard revocation","Sessions need a shared store and CSRF protection"]},"role based access control rbac":{"e":["Define roles such as viewer, editor and admin, each with a set of permissions, and assign users to roles. It is simple to reason about and audit. It struggles with fine-grained or contextual rules (\"only your own region's records\"), leading to an explosion of roles."],"t":"Permissions attach to roles; users get roles.","p":"Creating a new role for every exception until there are hundreds.","k":"Users get roles, roles get permissions.","q":["Where does RBAC struggle?","Rules that depend on attributes such as ownership or time","Assigning an admin","Auditing who can do what","Small teams","Context is not part of a role."],"i":["The system now has 400 roles","Each special case (region, department, project) became its own role.","Add attribute-based rules for contextual conditions","Create a role-management team => Manages the mess","Give everyone admin => No access control","Role explosion signals a need for attributes."],"a":["How does RBAC work and what are its limits?","Roles group permissions","Simple and auditable","Weak for contextual, fine-grained rules"]},"attribute based access control abac":{"e":["A policy evaluates attributes: \"allow if user.department equals document.department and the time is within working hours\". This expresses fine-grained, contextual rules without multiplying roles. It is more flexible than RBAC and harder to audit and debug, so policies are usually centralised in a policy engine."],"t":"Decisions from attributes of user, resource, action and context.","p":"Scattering attribute checks across code instead of central policies.","k":"Policies over attributes: flexible, harder to audit.","q":["Which rule needs ABAC rather than plain RBAC?","Doctors may view records only of patients assigned to them","Admins may delete users","Viewers may read","Editors may edit","It depends on a relationship between user and resource."],"i":["Nobody can say who has access to a given record","Rules are spread across 50 code locations with ad hoc conditions.","Centralise policies in a policy engine and log decisions","Add comments to each condition => Still scattered","Remove the conditions => Over-exposure","Fine-grained policy needs central definition and audit."],"a":["When do you choose ABAC over RBAC?","Rules depend on attributes and context","Avoids role explosion","Needs central policies and good tooling"]},"encryption at rest":{"e":["Data on disks, in databases, backups and object storage is encrypted so stolen media or snapshots are useless. Keys live in a key management service; envelope encryption uses a data key to encrypt data and a master key to encrypt the data key. Rotate keys and restrict who can use them."],"t":"Stored data is unreadable without the key.","p":"Storing the encryption key next to the data it protects.","k":"Encrypt the data; guard the key somewhere else.","q":["What does encryption at rest protect against?","Theft of disks, snapshots or backups","SQL injection","A logged-in attacker using the app","DDoS","The storage medium alone is useless."],"i":["A public backup bucket exposed customer data","Backups were unencrypted dumps.","Encrypt backups with managed keys and lock down the bucket","Rename the bucket => Still public and readable","Delete old backups only => New ones equally exposed","Encryption at rest limits damage when storage leaks."],"a":["How does encryption at rest work in practice?","Encrypt disks, databases and backups","Keys in a KMS with envelope encryption","Rotate keys and restrict access"]},"password hashing":{"e":["Use a deliberately slow algorithm such as Argon2, bcrypt or scrypt with a unique random salt per user. Slowness makes brute force expensive; the salt defeats precomputed tables and hides identical passwords. Fast hashes such as MD5 and SHA-256 are unsuitable because attackers can try billions per second."],"t":"Store a slow, salted, one-way hash, never the password.","p":"Using a fast hash, or encrypting passwords so they can be decrypted.","k":"Slow hash plus unique salt, never reversible.","q":["Why is SHA-256 a poor choice for passwords?","It is fast, so attackers can test billions of guesses per second","It is too long","It is not a hash","It needs a database","Password hashes must be slow."],"i":["Database dump leaked; most passwords cracked in a day","Passwords were stored as unsalted MD5.","Migrate to Argon2 or bcrypt with per-user salts and force resets","Hash the MD5 twice => Still fast to brute force","Encrypt the column with a key in the same database => Key leaks too","Password storage must be slow and salted."],"a":["How should passwords be stored?","Slow adaptive hash: Argon2, bcrypt","Unique salt per user","Never plaintext, encryption or fast hashes"]},"api security":{"e":["Require authentication, authorise every object access, validate and bound all input, use TLS, rate limit, return minimal data and error detail, version carefully, and log access. The most common real-world flaw is broken object-level authorization: changing an ID to reach someone else's data."],"t":"Protecting endpoints from misuse.","p":"Relying on the front end to hide or validate things.","k":"Authenticate, authorise each object, validate, limit, log.","q":["Most common serious API vulnerability?","Missing per-object authorization checks","Slow responses","Large payloads","JSON formatting","Attackers simply change identifiers."],"i":["An attacker scraped every user's email in an hour","An endpoint returns full user objects for sequential IDs with no ownership check or limit.","Enforce ownership checks, trim response fields and rate limit","Add a CAPTCHA to the web page => The API is still open","Hide it from the docs => Still reachable","APIs must enforce access and limits themselves."],"a":["How do you secure a public API?","Authn plus object-level authz","Input validation and rate limiting","TLS, minimal responses, audit logs"]},"rate limiting ddos protection":{"e":["Application rate limits per user, key or IP stop abuse and brute force. Volumetric DDoS attacks exceed what your servers or links can take, so they are absorbed upstream: CDN or scrubbing service, anycast, web application firewall, SYN cookies and autoscaling. Design layers: edge filtering, then gateway limits, then per-service protection."],"t":"Limiting request rates, and absorbing floods before they reach you.","p":"Thinking application-level rate limiting stops a volumetric attack. The traffic still saturates your link.","k":"Limits at the app; floods absorbed at the edge.","q":["A 50 Gbps flood targets your origin. What actually helps?","An upstream CDN or scrubbing service","A rate limiter in the app","A bigger database","More logging","The traffic must be dropped before your network."],"i":["Login endpoint hit with 2 million password guesses","There is no per-account or per-IP limit on login attempts.","Add rate limits and lockouts on login, plus bot filtering at the edge","Add app servers => More guesses per second","Lengthen passwords only => Does not stop the attempts","Sensitive endpoints need strict limits."],"a":["How do you defend against abusive traffic?","Per-client rate limits","Edge protection: CDN, WAF, scrubbing","Layered defence and autoscaling"]},"sql injection":{"e":["If a query is built by concatenating input, an attacker can supply text that changes the query: reading other tables, bypassing login or deleting data. The fix is parameterised queries (prepared statements), which send data separately from the SQL text. Add least-privilege database accounts as a second layer."],"t":"User input that becomes part of a SQL command.","p":"Trying to fix it by escaping or blacklisting characters instead of parameterising.","k":"Parameterise every query; never build SQL from strings.","q":["The reliable defence against SQL injection is:","Parameterised queries","Hiding error messages","Longer passwords","Client-side validation","Input is never interpreted as SQL."],"i":["Attacker logged in as admin with no password","The login query concatenates the username into SQL; input closed the string and commented out the rest.","Rewrite queries with bound parameters","Block the single-quote character => Other payloads work","Hide the login page URL => Still exploitable","Separate code from data in every query."],"a":["What is SQL injection and how do you prevent it?","Input interpreted as SQL","Parameterised queries or safe ORM use","Least-privilege database accounts"]},"cross site scripting xss":{"e":["If a page includes user-supplied content without encoding, injected script runs with the page's privileges: stealing sessions, acting as the user. Stored XSS lives in your database; reflected XSS arrives in a link. Defences: encode output for its context, sanitise rich HTML, set a Content Security Policy, and mark cookies HttpOnly."],"t":"An attacker's script runs in your users' browsers.","p":"Validating input only. The reliable fix is encoding at output.","k":"Encode on output; add CSP and HttpOnly as backup.","q":["Primary defence against XSS?","Context-aware output encoding","A longer session timeout","HTTPS","Database indexes","Injected text is rendered as text, not code."],"i":["A comment containing script tags steals admin sessions","Comments are inserted into pages as raw HTML.","Encode output and add a Content Security Policy","Strip the word \"script\" => Many other vectors exist","Ask users not to post code => Not a control","Untrusted content must never be rendered as markup."],"a":["How does XSS work and how do you stop it?","Untrusted input rendered as script","Output encoding and sanitisation","CSP and HttpOnly cookies"]},"csrf":{"e":["Browsers attach cookies automatically, so a malicious page can submit a form to your site and it arrives authenticated. Defences: anti-CSRF tokens tied to the session and required on state-changing requests, SameSite cookies, and never changing state on GET. APIs using an Authorization header rather than cookies are not affected."],"t":"Another site makes the user's browser send a request to yours.","p":"Thinking HTTPS or authentication prevents it. The request is genuine and authenticated.","k":"Cookies ride along automatically; demand a token the attacker cannot know.","q":["Why does CSRF work?","The browser automatically sends the user's cookies with the forged request","TLS is broken","Passwords are weak","The server is slow","The server cannot tell who initiated it."],"i":["Users' email addresses changed after they visited a forum","A hidden form on the forum posted to your change-email endpoint, with cookies attached.","Require CSRF tokens and set SameSite on cookies","Require HTTPS => Already used; irrelevant","Shorten sessions => Attack works within any session","State changes need proof the request came from your own page."],"a":["What is CSRF and how do you prevent it?","Forged cross-site request using ambient cookies","Anti-CSRF tokens","SameSite cookies; no state change on GET"]},"secrets management":{"e":["Store secrets in a dedicated manager (Vault, a cloud secrets service) that encrypts them, controls access by identity, audits reads and supports rotation. Inject them at runtime. Prefer short-lived, automatically issued credentials. A secret committed to a repository must be considered leaked and rotated."],"t":"Keeping passwords, keys and tokens out of code and under control.","p":"Committing secrets to Git or baking them into images.","k":"Secrets live in a vault, never in the repository.","q":["An API key was pushed to a repository and then deleted in a later commit. Correct response?","Rotate the key; history still contains it","Nothing, it is gone","Rename the repository","Make the repository private only","Anyone with the history has the key."],"i":["Cloud bill shows crypto-mining instances","An access key was committed to a public repository last month.","Revoke and rotate the key, then move secrets to a manager with scanning","Delete the commit => Bots copied it long ago","Make the repo private => Key already harvested","Leaked credentials must be rotated, not hidden."],"a":["How do you manage secrets in a system?","Central secrets manager","Runtime injection and least privilege","Rotation and audit; never in code"]},"zero trust architecture":{"e":["The classic model trusts anything inside the perimeter, so one breach exposes everything. Zero trust authenticates and authorises every call, human or service, using strong identity (mutual TLS, short-lived credentials), device posture and least privilege, with segmentation limiting lateral movement and continuous monitoring."],"t":"Never trust by network location; verify every request.","p":"Assuming internal traffic is safe because it is behind the firewall.","k":"Inside the network is not the same as trusted.","q":["Core principle of zero trust?","Authenticate and authorise every request regardless of origin","Trust the internal network","Use one big firewall","Disable logging","Location grants nothing."],"i":["Attacker moved from one compromised server to every database","Internal services accept any connection from inside the network.","Require service identity and authorization for every internal call","Strengthen the outer firewall only => Attacker is already inside","Rename the servers => No effect","Internal calls need the same checks as external ones."],"a":["What is zero trust?","No implicit trust from network location","Strong identity and least privilege per request","Segmentation and continuous verification"]},"audit logging":{"e":["Audit logs capture security-relevant events: logins, permission changes, data access, admin actions. Each entry records actor, action, target, time and outcome. They must be append-only, stored separately from the system they describe, retained per policy and free of secrets. They support investigations and compliance."],"t":"A tamper-resistant record of who did what, when.","p":"Keeping audit logs where an administrator of the system can edit or delete them.","k":"Append-only, separate, and complete.","q":["Why store audit logs separately from the application database?","So someone who compromises the application cannot alter the trail","To save disk","To speed queries","To avoid backups","Independence preserves integrity."],"i":["After a breach, nobody can tell what the attacker accessed","Access was never logged, and admin actions overwrite a single \"last modified\" field.","Add append-only audit logs shipped to separate storage","Ask staff what they remember => Unreliable","Restore a backup => Does not reveal access","You can only investigate what you recorded."],"a":["What makes a good audit log?","Who, what, when, on which resource, result","Immutable and stored separately","Retained and monitored; no secrets"]},"logging":{"e":["Logs explain individual events. Emit structured logs (JSON with fields) so they can be searched and aggregated, use levels (debug, info, warn, error), include a request or trace ID to correlate across services, and ship them to a central store. Control volume and never log secrets or personal data."],"t":"Timestamped records of what the system did.","p":"Unstructured text logs with no correlation ID, on each server's local disk.","k":"Structured, centralised, correlated by request ID.","q":["What makes logs across many services usable for debugging one request?","A shared correlation or trace ID on every line","Larger fonts","More debug lines","Local files","The ID joins lines from different services."],"i":["Engineers SSH into 40 servers to grep logs during an outage","Logs are plain text files on each machine.","Ship structured logs to a central searchable store","Write a script to SSH faster => Still fragile and slow","Log less => Less evidence","Central, structured logs make incidents searchable."],"a":["What are good logging practices?","Structured with levels","Correlation IDs","Centralised; no secrets or PII"]},"metrics":{"e":["Metrics are cheap aggregates: counters (requests), gauges (queue depth), histograms (latency distribution). Watch the four golden signals: latency, traffic, errors and saturation. Use RED for services (rate, errors, duration) and USE for resources (utilisation, saturation, errors). Avoid unbounded label values."],"t":"Numbers over time that show how the system is doing.","p":"Putting user IDs or request IDs in metric labels, creating millions of time series.","k":"Latency, traffic, errors, saturation.","q":["Which is not one of the four golden signals?","Lines of code","Latency","Errors","Saturation","The fourth is traffic."],"i":["Metrics server runs out of memory","A metric was labelled with user ID, producing millions of series.","Remove high-cardinality labels; use logs or traces for per-user detail","Add memory => Series keep growing","Lower the scrape interval => Same cardinality","Metric labels must have bounded values."],"a":["What metrics would you monitor for a service?","Golden signals","RED for requests, USE for resources","Percentiles, with bounded label cardinality"]},"opentelemetry":{"e":["OpenTelemetry provides APIs, SDKs and a wire protocol (OTLP) to instrument code once and send telemetry to any backend. A collector receives, processes and exports the data. It standardises context propagation, so traces connect across services and languages."],"t":"A vendor-neutral standard for traces, metrics and logs.","p":"Thinking it stores or visualises data. It only collects and ships; you still need a backend.","k":"Instrument once, export anywhere.","q":["What does the OpenTelemetry Collector do?","Receives, processes and exports telemetry to backends","Stores data for years","Draws dashboards","Pages engineers","It is a pipeline, not a database."],"i":["Switching observability vendors means re-instrumenting 80 services","Each service uses the old vendor's proprietary agent and API.","Instrument with OpenTelemetry and switch exporters instead","Stay locked in => Costs keep rising","Run both agents forever => Double overhead","Neutral instrumentation avoids vendor lock-in."],"a":["What is OpenTelemetry?","Standard APIs and SDKs for telemetry","Collector and OTLP pipeline","Vendor-neutral; needs a storage backend"]},"prometheus":{"e":["Prometheus scrapes HTTP endpoints exposed by targets on an interval and stores time series locally. PromQL queries and aggregates them, and Alertmanager routes alerts. Service discovery finds targets. It is built for reliability and recent data; long retention and global views need add-ons such as Thanos or Mimir."],"t":"A pull-based metrics database with a query language.","p":"Using it for high-cardinality or per-event data. It is for aggregated numeric series.","k":"It pulls numbers, queries with PromQL, and alerts.","q":["How does Prometheus collect metrics?","It scrapes targets' HTTP metrics endpoints","Applications push logs to it","It reads the database","Via email","It is pull-based."],"i":["A dead service raised no alert","Aler
